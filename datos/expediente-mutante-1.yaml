          descripcion:
          - <em>Savage Wolverine</em> es una serie de arcos sueltos de autor, empezando por Lobezno en la Tierra Salvaje; ninguno se cruza con el resto.
          - 'Ojo a los <strong>números con sufijo</strong> de Marvel NOW!, que se leen en su sitio numérico: <em>Wolverine and the X-Men</em> 27AU (tie-in de <em>Age of Ultron</em>), <em>All-New X-Men</em> 22.NOW, <em>Uncanny X-Men</em> vol. 3 15.INH y 19.NOW, <em>X-Men</em> vol. 4 10.NOW y <em>Savage Wolverine</em> 14.NOW.'
