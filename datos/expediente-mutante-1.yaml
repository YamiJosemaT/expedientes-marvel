          linea_marvel: true
          etiqueta: Evento de toda la línea Marvel · Abril – junio 2019
          titulo: War of the Realms
          creditos: Jason Aaron · Russell Dauterman (serie principal) · tie-in mutante de Matthew Rosenberg y Pere Pérez
          descripcion:
          - 'Malekith y los ejércitos de los Diez Reinos invaden la Tierra, y Dani Moonstar, valquiria, lleva a los mutantes a la batalla con el equipo de Rosenberg. <strong>El tie-in va partido</strong>: su #1 va antes que los otros dos.'
