            texto: '<strong>War of the Realms #1</strong> → <strong>#2</strong> → <span class="cap">War of the Realms: Uncanny X-Men #1</span> → <strong>War of the Realms #3</strong> → <strong>#4</strong> → <span class="cap">War of the Realms: Uncanny X-Men #2–3</span> → <strong>War of the Realms #5</strong> → <strong>#6</strong> → War of the Realms Omega #1'
          - apartado: Versión mínima
            texto: '<em>War of the Realms: Uncanny X-Men</em> #1–3 colocados como arriba, leyendo al menos los números del evento que los rodean.'
  - evento:
      id: m1-b8-house-of-x-powers-of-x
      etiqueta: Meta · Julio – octubre 2019
      titulo: House of X / Powers of X
      creditos: Jonathan Hickman · Pepe Larraz &amp; R.B. Silva
      descripcion:
      - Doce números que refundan la especie mutante como nación en la isla viva de Krakoa. Aquí termina este listado y empieza la era que querías alcanzar. <strong>Van intercalados, no seguidos:</strong> leerlos por separado destroza la estructura, que está montada para que cada número de <em>Powers</em> reencuadre el anterior de <em>House</em>.
      apartados:
      - apartado: Orden completo
        texto: 'HoX #1 → PoX #1 → HoX #2 → PoX #2 → HoX #3 → PoX #3 → HoX #4 → PoX #4 → HoX #5 → PoX #5 → HoX #6 → PoX #6'
apendice:
  titulo: Cómo recorrerlo
  notas:
  - titulo: Los eventos de toda la línea
    html: '<p>Los recuadros con borde discontinuo son los grandes eventos de Marvel en los que participan los X-Men. Cada uno indica qué leer antes, el orden exacto con los números mutantes intercalados en la serie principal, y una versión mínima si solo quieres la parte mutante. Salvo <em>Fear Itself</em> y <em>Secret Empire</em>, que se llevan números de series mutantes, son <strong>contexto opcional</strong>: explican la relación de los mutantes con el resto de héroes y con el mundo, pero la historia X se entiende sin ellos.</p>'
  - titulo: Dentro de un tramo, alterna
    html: '<p>Las series de un mismo tramo transcurren a la vez. No hace falta un orden exacto entre ellas: ve alternando números y llegarás al evento con todas al día, que es justo lo que el crossover da por supuesto.</p>'
  - titulo: Los números en rojo ya los tienes
    html: '<p>En el orden de cada evento, un capítulo <span class="cap">en rojo</span> es un número de una serie que ya venías leyendo. No lo busques aparte: es el número siguiente al punto donde esa cabecera se cortó en el tramo anterior.</p>'
  - titulo: Series que nunca se parten
    html: '<p>Cuatro se mantuvieron deliberadamente al margen de todo: <em>Astonishing X-Men</em> de Whedon, <em>Uncanny X-Force</em> de Remender, <em>X-Men: Legacy</em> vol. 2 de Spurrier y <em>All-New Wolverine</em> de Taylor. Puedes leerlas enteras del tirón cuando te apetezca.</p>'
  - titulo: Renumeraciones que despistan
    html: '<p><em>X-Men</em> vol. 2 pasa a llamarse <em>New X-Men</em> en el #114, vuelve a <em>X-Men</em> en el #157 y se convierte en <em>X-Men: Legacy</em> en el #208, sin reiniciar nunca. <em>Uncanny</em> mantiene su numeración clásica hasta el #544, reinicia dos veces, recupera el #600 en 2015 y vuelve a reiniciar en 2016 y 2018.</p>'
  - titulo: Dónde recortar sin perderte
    html: '<p>Puedes saltarte enteros los tramos alternos (Ultimate, Exiles, Age of X-Man, los tie-ins de Secret Wars) y casi todos los solitarios. Lo que no se puede saltar son los quince eventos en recuadro: son los nudos donde se ata todo lo demás.</p>'
  - titulo: Volumen real
    html: <p>La lista completa ronda los 1.500 números; la ruta corta se queda en unos 350. Un punto intermedio razonable —todo lo esencial más lo recomendado— son unos 700, que es lo que la mayoría de lectores considera «estar al día» de estos dieciocho años.</p>
