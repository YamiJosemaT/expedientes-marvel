# Expediente Mutante 2001-2019
# Datos del expediente. Los textos admiten HTML en linea (<em>, <strong>, <span class="nums">...).
# Las claves "id" de cada entrada NO se deben cambiar: son las que guardan las marcas de lectura.

clave: m1
titulo_pagina: Expediente Mutante 2001-2019
descripcion_pagina: Guía de lectura de toda la línea mutante de Marvel entre 2001 y House of X.
cabecera:
  antetitulo: Guía de lectura · Línea mutante Marvel
  titulo: Expediente<br/>Mutante<span class="thin">2001 — 2019</span>
  entradilla: 'De la reinvención de Grant Morrison al amanecer de Krakoa, en orden de lectura real: ocho bloques divididos en tramos de continuidad, con cada serie larga partida justo donde un crossover se lleva sus números.'
  cifras:
  - valor: '18'
    texto: Años de continuidad
  - valor: '25'
    texto: Tramos de lectura
  - valor: '27'
    texto: Eventos y crossovers
  - valor: ~1.500
    texto: Números en total
leyenda: |-
  <p>Cada bloque se divide en <strong>tramos</strong>: fragmentos de continuidad que se leen en paralelo, alternando las cabeceras que hay dentro. Entre tramo y tramo se intercala el <strong>evento</strong> que los separa, con su orden capítulo a capítulo.</p>
  <p>Cuando un crossover se lleva números de una serie en marcha, esa serie aparece <strong>partida</strong>: verás dónde se corta y en qué tramo se retoma. Dentro del orden de un evento, los capítulos <span class="cap">en rojo</span> son los que salen de cabeceras que ya venías leyendo.</p>
  <div class="legend-row">
  <span class="key"><span class="fwd">▸</span> Continúa después del evento</span>
  <span class="key"><span class="back">◂</span> Viene de un tramo anterior</span>
  </div>
  <div class="legend-row">
  <span class="key"><span class="swatch"></span> Serie de la línea mutante</span>
  <span class="key"><span class="swatch dashed"></span> Recuadro con borde discontinuo: evento de toda la línea Marvel en el que participan los X-Men</span>
  </div>
  <div class="legend-row">
  <span class="tag t1">Esencial</span>
  <span class="tag t2">Recomendado</span>
  <span class="tag">Opcional</span>
  <span class="tag t4">Realidad alterna</span>
  </div>
cajas:
- ruta:
    titulo: La ruta corta
    texto: 'Si 1.500 números te parecen demasiados, esta es la columna vertebral: quince paradas que, leídas en orden, cuentan la historia mutante completa de estos dieciocho años sin agujeros importantes.'
    pasos:
    - <span>New X-Men <em>#114–154</em></span>
    - <span>Astonishing X-Men <em>#1–24</em></span>
    - <span>House of M <em>#1–8</em></span>
    - '<span>X-Men: Deadly Genesis <em>#1–6</em></span>'
    - <span>X-Factor vol. 3 <em>#1–50</em></span>
    - <span>Rise &amp; Fall of the Shi'ar Empire <em>#475–486</em></span>
    - <span>Messiah Complex <em>crossover</em></span>
    - <span>X-Force vol. 3 <em>#1–28</em></span>
    - <span>Uncanny X-Men <em>#500–534</em></span>
    - <span>Second Coming <em>crossover</em></span>
    - <span>Uncanny X-Force <em>#1–35</em></span>
    - <span>Schism + Wolverine and the X-Men <em>#1–42</em></span>
    - <span>Avengers vs. X-Men <em>#1–12</em></span>
    - <span>All-New X-Men <em>#1–41</em></span>
    - <span>Death of X → IvX → Extermination</span>
bloques:
- id: b1
  fechas: 2001 — 2004
  titulo: La revolución Morrison
  intro: 'El bloque más fácil de recorrer: no hay ni un solo crossover que corte una serie. Morrison, Claremont y Casey escriben en paralelo sin cruzarse, así que puedes leer cada cabecera entera de un tirón y en el orden que prefieras. Es la única vez en dieciocho años que esto se puede hacer.'
  navegacion:
    anio: 2001–2004
    texto: Revolución Morrison
  contenido:
  - tramo:
      numero: '1.1'
      titulo: La puerta de entrada
      cuando: Verano de 2001
      nota: Seis números de transición que despiden la etapa anterior y colocan a cada equipo en su sitio. Puedes saltártelos y empezar directamente en el tramo 1.2.
      entradas:
      - serie:
          id: m1-b1-eve-of-destruction-uncanny-x-men-391-393-x-men-vol-2-111-113
          titulo: '«Eve of Destruction» <span class="nums">Uncanny X-Men #391–393 · X-Men vol. 2 #111–113</span>'
          creditos: Scott Lobdell · 2001
          descripcion:
          - Magneto arrasa Genosha y Xavier monta un equipo de emergencia. Es el número anterior a la llegada de Morrison.
          etiqueta:
            clase: opcional
            texto: Opcional
  - tramo:
      numero: '1.2'
      titulo: Líneas en paralelo
      cuando: 2001 – 2004
      nota: Ninguna de estas series se cruza con las demás en ningún punto. Lee cada una entera cuando quieras; solo <em>New X-Men</em> es obligatoria.
      entradas:
      - serie:
          id: m1-b1-new-x-men-114-154
          prioridad: p1
          titulo: New X-Men <span class="nums">#114–154</span>
          creditos: Grant Morrison · Frank Quitely, Chris Bachalo, Igor Kordey, Phil Jimenez, Marc Silvestri
          descripcion:
          - El eje absoluto del bloque. «E de Extinción», Imperial, «Nuevo Mundo Mutante», «Planeta X» y «Aquí llega el mañana». Es la cabecera <em>X-Men</em> vol. 2 renumerada, y se lee de principio a fin sin una sola interrupción.
          etiqueta:
            clase: t1
            texto: Esencial
      - serie:
          id: m1-b1-x-force-116-129-x-statix-1-26
          prioridad: p2
          titulo: X-Force <span class="nums">#116–129</span> → X-Statix <span class="nums">#1–26</span>
          creditos: 'Peter Milligan · Michael Allred · 2001–2004 (+ <em>X-Statix Presents: Dead Girl</em> #1–5, 2006)'
          descripcion:
          - Sátira brutal sobre mutantes convertidos en reality show. Autoconclusiva y de lo más original que ha publicado la línea.
          etiqueta:
            clase: t2
            texto: Recomendado
      - serie:
          id: m1-b1-district-x-1-14
          prioridad: p2
          titulo: District X <span class="nums">#1–14</span>
          creditos: David Hine · David Yardin · 2004–2005
          descripcion:
          - Policiaco urbano en Mutant Town. Explica el estado social de los mutantes mejor que ninguna cabecera de equipo.
          etiqueta:
            clase: t2
            texto: Recomendado
      - serie:
          id: m1-b1-wolverine-vol-3-1-32
          prioridad: p2
          titulo: Wolverine vol. 3 <span class="nums">#1–32</span>
          creditos: 'Greg Rucka; Mark Millar &amp; John Romita Jr. («Enemy of the State», #20–31) · 2003–2005'
          continuidad:
          - sigue: '▸ Los números #33–35 son capítulos de <em>House of M</em> (tramo 2.1)'
          descripcion:
          - «Enemy of the State» es el arco que hay que leer sí o sí de esta etapa de Lobezno.
          etiqueta:
            clase: t2
            texto: Recomendado
      - serie:
          id: m1-b1-uncanny-x-men-394-409
          titulo: Uncanny X-Men <span class="nums">#394–409</span>
          creditos: Joe Casey · «Poptopia», «Hope» · 2001–2002
          descripcion:
          - El equipo «de calle» en paralelo a Morrison. Irregular pero coherente con el tono del momento.
          etiqueta:
            clase: opcional
            texto: Opcional
      - serie:
          id: m1-b1-uncanny-x-men-410-443
          titulo: Uncanny X-Men <span class="nums">#410–443</span>
          creditos: Chuck Austen · 2002–2004
          continuidad:
          - sigue: '▸ Continúa en el tramo 2.1 con Claremont desde el #444'
          descripcion:
          - Mala fama justificada. Sáltatela salvo que quieras contexto de Ave de Trueno del Norte, Juggernaut o la boda de Havok.
          etiqueta:
            clase: opcional
            texto: Opcional
      - serie:
          id: m1-b1-x-treme-x-men-1-46
          titulo: X-Treme X-Men <span class="nums">#1–46</span>
          creditos: Chris Claremont · Salvador Larroca · 2001–2004 (+ anuales y <em>Savage Land</em>)
          descripcion:
          - Tormenta lidera un equipo itinerante tras los diarios de Destino. Totalmente aislada del resto.
          etiqueta:
            clase: opcional
            texto: Opcional
      - serie:
          id: m1-b1-cable-97-107-soldier-x-1-12-weapon-x-vol-2-1-28
          titulo: Cable <span class="nums">#97–107</span> → Soldier X <span class="nums">#1–12</span> · Weapon X vol. 2 <span class="nums">#1–28</span>
          creditos: Igor Kordey, Darko Macan / Frank Tieri · 2001–2004
          descripcion:
          - Cable en modo mesiánico y el Arma X como agencia gubernamental. Marginales, pero <em>Weapon X</em> da contexto a Neverland y los campos mutantes.
          etiqueta:
            clase: opcional
            texto: Opcional
      - serie:
          id: m1-b1-solitarios-de-la-etapa
          titulo: Solitarios de la etapa
          creditos: 'Emma Frost #1–18 · Mystique #1–24 · Nightcrawler #1–12 · Rogue #1–12 · Gambit #1–12 · Chamber #1–4'
          descripcion:
          - Todos prescindibles para la trama general. <em>Mystique</em> (Vaughan) y <em>Emma Frost</em> son los más sólidos si te interesa el personaje.
          etiqueta:
            clase: opcional
            texto: Opcional
      - serie:
          id: m1-b1-exiles-1-100-ultimate-x-men-1-100
          prioridad: p4
          titulo: Exiles <span class="nums">#1–100</span> · Ultimate X-Men <span class="nums">#1–100</span>
          creditos: Judd Winick, Tony Bedard / Mark Millar, Brian Bendis, Robert Kirkman · 2001–2009
          descripcion:
          - 'Realidades ajenas. No tocan la continuidad principal en ningún punto de esta guía: se leen aparte o no se leen.'
          etiqueta:
            clase: t4
            texto: Alterna
  - tramo:
      numero: '1.3'
      titulo: El relevo
      cuando: 2004 – 2006
      nota: Morrison se va y la cabecera vuelve a llamarse <em>X-Men</em>. En paralelo arrancan las dos series que enlazan con el bloque siguiente.
      entradas:
      - serie:
          id: m1-b1-astonishing-x-men-vol-3-1-24-giant-size-1
          prioridad: p1
          titulo: 'Astonishing X-Men vol. 3 <span class="nums">#1–24 + Giant-Size #1</span>'
          creditos: Joss Whedon · John Cassaday · 2004–2008
          descripcion:
          - 'Recoge el testigo de Morrison: la cura mutante, el regreso de Coloso, Breakworld. <strong>Marvel la mantuvo deliberadamente fuera de todos los crossovers</strong>, así que no la corta nada. Su calendario interno es vago: léela entera en cualquier hueco entre este tramo y el bloque 3.'
          etiqueta:
            clase: t1
            texto: Esencial
      - serie:
          id: m1-b1-madrox-1-5
          prioridad: p1
          titulo: Madrox <span class="nums">#1–5</span>
          creditos: Peter David · Pablo Raimondi · 2004
          continuidad:
          - sigue: ▸ Enlaza con X-Factor vol. 3, que arranca en el tramo 2.3
          descripcion:
          - Miniserie noir de Jamie Madrox como detective. Prólogo directo e imprescindible de <em>X-Factor</em> vol. 3.
          etiqueta:
            clase: t1
            texto: Esencial
      - serie:
          id: m1-b1-new-mutants-vol-2-1-13-new-x-men-academy-x-1-15
          prioridad: p2
          titulo: 'New Mutants vol. 2 <span class="nums">#1–13</span> → New X-Men: Academy X <span class="nums">#1–15</span>'
          creditos: Nunzio DeFilippis &amp; Christina Weir · 2003–2005
          continuidad:
          - sigue: '▸ Los números #16–19 son capítulos de <em>House of M</em>'
          descripcion:
          - Los alumnos del Instituto. Tono ligero, con la serie renombrada a mitad de camino sin reiniciar numeración.
          etiqueta:
            clase: t2
            texto: Recomendado
      - serie:
          id: m1-b1-new-x-men-155-156-x-men-vol-2-157-187
          titulo: New X-Men <span class="nums">#155–156</span> → X-Men vol. 2 <span class="nums">#157–187</span>
          creditos: Chuck Austen, luego Peter Milligan · 2004–2006
          continuidad:
          - sigue: '▸ Continúa en el tramo 2.3 con Carey desde el #188'
          descripcion:
          - 'El tramo de transición de la cabecera principal antes de que Mike Carey la coja en el #188. Prescindible.'
          etiqueta:
            clase: opcional
            texto: Opcional
      - serie:
          id: m1-b1-excalibur-vol-3-1-14
          titulo: Excalibur vol. 3 <span class="nums">#1–14</span>
          creditos: Chris Claremont · Aaron Lopresti · 2004–2005
          descripcion:
          - Xavier y Magneto reconstruyendo Genosha tras el ataque. La serie cierra justo en el umbral de <em>House of M</em>, cuya trama arranca precisamente ahí.
          etiqueta:
            clase: opcional
            texto: Opcional
      - evento:
          id: m1-b1-avengers-disassembled
          linea_marvel: true
          etiqueta: Evento de toda la línea Marvel · Prólogo de House of M · 2004
          titulo: Avengers Disassembled
          creditos: Brian Michael Bendis · David Finch y otros
          descripcion:
          - 'La Bruja Escarlata pierde el control de sus poderes y desmantela a los Vengadores. Es el prólogo directo de <em>House of M</em>: sin él no se entiende por qué X-Men y Vengadores se reúnen para decidir qué hacer con Wanda.'
          apartados:
          - apartado: Antes de empezar
            texto: 'Nada: es un punto de partida.'
          - apartado: Orden de lectura
            texto: '<strong>Avengers #500</strong> → <strong>#501</strong> → <strong>#502</strong> → <strong>#503</strong> → <strong>Avengers Finale #1</strong>, seguidos.'
          - apartado: Prescindible
            texto: 'Los números de otras series que las guías colocan alrededor del evento: no hacen falta para <em>House of M</em>.'
          - apartado: Después
            texto: <em>House of M</em>, al principio del bloque 2.
- id: b2
  fechas: 2005 — 2007
  titulo: Dinastía de M y la Decimación
  intro: Tres palabras —«No more mutants»— reducen la población mutante de millones a 198. Todo lo que viene después, hasta 2019, es consecuencia de este bloque. Aquí aparece el primer crossover que parte cabeceras en marcha, así que el orden empieza a importar.
  navegacion:
    anio: 2005–2007
    texto: Dinastía de M
  contenido:
  - tramo:
      numero: '2.1'
      titulo: Antes del cataclismo
      cuando: '2005'
      entradas:
      - serie:
          id: m1-b2-uncanny-x-men-444-461
          titulo: Uncanny X-Men <span class="nums">#444–461</span>
          creditos: Chris Claremont · Alan Davis · 2004–2005
          continuidad:
          - viene: ◂ Viene del tramo 1.2
          - sigue: '▸ Los números #462–465 son capítulos de <em>House of M</em>'
          descripcion:
          - Último tramo largo de Claremont en la casa. Denso y desconectado; solo si eres claremontista.
          etiqueta:
            clase: opcional
            texto: Opcional
      - serie:
          id: m1-b2-x-men-age-of-apocalypse-one-shot-1-x-men-age-of-apocalypse-1-6
          prioridad: p4
          titulo: 'X-Men: Age of Apocalypse One-Shot <span class="nums">#1</span> + X-Men: Age of Apocalypse <span class="nums">#1–6</span>'
          creditos: Scott Lobdell y otros (one-shot) · Akira Yoshida · Chris Bachalo y otros · 2005
          continuidad:
          - sigue: ▸ Esa realidad reaparece en <em>Uncanny X-Force</em> (tramo 4.5)
          descripcion:
          - 'La secuela del décimo aniversario de la Era de Apocalipsis de 1995: qué pasó en esa realidad después del evento original. Transcurre íntegra allí y no toca el universo principal. Es el trasfondo del mundo que visita <em>Uncanny X-Force</em> en la Dark Angel Saga (tramo 4.5).'
          etiqueta:
            clase: t4
            texto: Alterna
  - evento:
      id: m1-b2-house-of-m
      etiqueta: Evento · Julio – diciembre 2005
      titulo: House of M
      creditos: Brian Michael Bendis · Olivier Coipel
      descripcion:
      - Wanda Maximoff reescribe la realidad y luego la borra. Punto de no retorno de toda la era. La serie principal se entiende sola; los capítulos de apoyo solo añaden el punto de vista de cada equipo dentro de la realidad falsa.
      apartados:
      - apartado: Columna principal
        texto: 'House of M #1–8 → <em>Decimation: House of M — The Day After</em> #1'
      - apartado: Capítulos que salen de tus series en marcha
        texto: '<span class="cap">Uncanny X-Men #462–465</span> · <span class="cap">New X-Men: Academy X #16–19</span> · <span class="cap">Wolverine vol. 3 #33–35</span>'
      - apartado: Tie-ins ajenos a la línea mutante (opcionales)
        texto: 'House of M: Avengers · Iron Man · Fantastic Four · Spider-Man · Mutopia X #1–5'
  - tramo:
      numero: '2.2'
      titulo: La Decimación
      cuando: '2006'
      nota: 'El día después: 198 supervivientes bajo custodia militar y una generación entera sin poderes. Las miniseries se leen enteras y en cualquier orden entre sí.'
      entradas:
      - serie:
          id: m1-b2-x-men-deadly-genesis-1-6
          prioridad: p1
          titulo: 'X-Men: Deadly Genesis <span class="nums">#1–6</span>'
          creditos: Ed Brubaker · Trevor Hairsine · 2006
          descripcion:
          - 'Retcon mayúsculo sobre Giant-Size X-Men #1 y presentación de Vulcan, el tercer hermano Summers. Prepara el gran arco espacial del tramo 2.4.'
          etiqueta:
            clase: t1
            texto: Esencial
      - serie:
          id: m1-b2-las-miniseries-de-la-decimacion
          prioridad: p2
          titulo: Las miniseries de la Decimación
          creditos: 'Generation M #1–5 · X-Men: The 198 #1–5 · Sentinel Squad O*N*E #1–5 · 2006'
          descripcion:
          - <em>Generation M</em> (los que perdieron sus poderes) es claramente la mejor de las tres.
          etiqueta:
            clase: t2
            texto: Recomendado
      - serie:
          id: m1-b2-new-x-men-academy-x-20-32
          prioridad: p2
          titulo: 'New X-Men: Academy X <span class="nums">#20–32</span>'
          creditos: Craig Kyle &amp; Christopher Yost · Mark Brooks · 2006
          continuidad:
          - viene: ◂ Viene de <em>House of M</em>
          - sigue: ▸ Continúa en el tramo 2.4
          descripcion:
          - 'Cambio de tono radical: «Childhood''s End». Los alumnos supervivientes, con muertes reales. Prepara a los personajes de <em>X-Force</em>.'
          etiqueta:
            clase: t2
            texto: Recomendado
      - serie:
          id: m1-b2-uncanny-x-men-466-474
          titulo: Uncanny X-Men <span class="nums">#466–474</span>
          creditos: Chris Claremont, Tony Bedard · 2006
          continuidad:
          - viene: ◂ Viene de <em>House of M</em>
          - sigue: ▸ Continúa en el tramo 2.4
          descripcion:
          - Cierre apresurado de las tramas de Claremont antes del relevo de Brubaker.
          etiqueta:
            clase: opcional
            texto: Opcional
      - evento:
          id: m1-b2-civil-war
          linea_marvel: true
          etiqueta: Evento de toda la línea Marvel · Junio 2006 – enero 2007
          titulo: Civil War
          creditos: Mark Millar · Steve McNiven (serie principal) · tie-in mutante de David Hine y Yanick Paquette
          descripcion:
          - 'La Ley de Registro de superhumanos parte en dos a los héroes. Los X-Men se declaran neutrales, y el tie-in cuenta qué supone eso para los 198 supervivientes de la Decimación, vigilados por el gobierno. <strong>El tie-in va partido</strong>: su primer número va antes que los otros tres.'
          apartados:
          - apartado: Antes de empezar
            texto: 'Nada imprescindible: el evento arranca en <em>Civil War</em> #1.'
          - apartado: Orden de lectura
            texto: '<strong>Civil War #1</strong> → <strong>#2</strong> → <span class="cap">Civil War: X-Men #1</span> → <strong>Civil War #3</strong> → <strong>#4</strong> → <span class="cap">Civil War: X-Men #2–4</span> → <strong>Civil War #5</strong> → <strong>#6</strong> → <strong>#7</strong>'
          - apartado: Versión mínima
            texto: '<em>Civil War: X-Men</em> #1–4 seguidos: se entiende sin el evento, aunque pierdes el contexto de la guerra entre héroes.'
          - apartado: Prescindible
            texto: El resto de tie-ins, más de un centenar de números de otras series.
  - tramo:
      numero: '2.3'
      titulo: Arrancan las dos series clave
      cuando: '2006'
      nota: Dos cabeceras que van a sostener los tres bloques siguientes. Ninguna se cruza con nada hasta <em>Messiah Complex</em>.
      entradas:
      - serie:
          id: m1-b2-x-factor-vol-3-1-24
          prioridad: p1
          titulo: X-Factor vol. 3 <span class="nums">#1–24</span>
          creditos: Peter David · Ryan Sook, Pablo Raimondi · 2006–2007
          continuidad:
          - viene: '◂ Viene de <em>Madrox</em> #1–5 (tramo 1.3)'
          - sigue: '▸ Los números #25–27 son capítulos de <em>Messiah Complex</em>'
          descripcion:
          - La mejor serie mutante del periodo. Detectives en Mutant Town tras la Decimación, con la mejor prosa de personajes de la franquicia.
          etiqueta:
            clase: t1
            texto: Esencial
      - serie:
          id: m1-b2-x-men-vol-2-188-199
          prioridad: p2
          titulo: X-Men vol. 2 <span class="nums">#188–199</span>
          creditos: Mike Carey · Chris Bachalo, Humberto Ramos · «Supernovas» · 2006–2007
          continuidad:
          - viene: ◂ Viene del tramo 1.3
          - sigue: ▸ Continúa en el tramo 2.4
          descripcion:
          - Equipo de Rondador Nocturno con Rogue. Es la cabecera que arrastra las tramas hasta el gran crossover.
          etiqueta:
            clase: t2
            texto: Recomendado
  - tramo:
      numero: '2.4'
      titulo: Vulcan y el Imperio Shi'ar
      cuando: 2006 – 2007
      nota: 'La cabecera principal se marcha al espacio doce números seguidos mientras el resto de la línea sigue en la Tierra. Lee la space opera entera y luego ponte al día con lo terrestre, o alterna: no se tocan.'
      entradas:
      - serie:
          id: m1-b2-uncanny-x-men-475-486
          prioridad: p1
          titulo: Uncanny X-Men <span class="nums">#475–486</span>
          creditos: Ed Brubaker · Billy Tan, Clayton Henry · «The Rise and Fall of the Shi'ar Empire» · 2006–2007
          continuidad:
          - viene: ◂ Viene del tramo 2.2
          descripcion:
          - Space opera de doce números que resuelve <em>Deadly Genesis</em>, arrasa el Imperio Shi'ar y define a Vulcan y a Rachel Summers. De lo mejor de la década.
          etiqueta:
            clase: t1
            texto: Esencial
      - serie:
          id: m1-b2-x-men-endangered-species
          prioridad: p2
          titulo: 'X-Men: Endangered Species'
          creditos: Mike Carey · one-shot + historias de complemento · 2007
          descripcion:
          - Bestia recorre el mundo buscando revertir la Decimación. Los complementos salieron repartidos por Uncanny, X-Men, X-Factor y New X-Men; hay recopilatorio único que los reúne en orden.
          etiqueta:
            clase: t2
            texto: Recomendado
      - serie:
          id: m1-b2-mientras-tanto-en-la-tierra-x-men-vol-2-200-204-new-x-men-33-43
          prioridad: p2
          titulo: 'Mientras tanto, en la Tierra <span class="nums">X-Men vol. 2 #200–204 · New X-Men #33–43</span>'
          creditos: Mike Carey / Kyle &amp; Yost · «Blinded by the Light», «Quest for Magik» · 2007
          continuidad:
          - viene: ◂ Vienen de los tramos 2.2 y 2.3
          - sigue: ▸ Ambas entregan sus tres siguientes números a <em>Messiah Complex</em>
          descripcion:
          - Las dos cabeceras terrestres quedan justo en la puerta del crossover.
          etiqueta:
            clase: t2
            texto: Recomendado
      - serie:
          id: m1-b2-uncanny-x-men-487-491
          titulo: Uncanny X-Men <span class="nums">#487–491</span>
          creditos: Ed Brubaker · 2007
          continuidad:
          - sigue: '▸ Los números #492–494 son capítulos de <em>Messiah Complex</em>'
          descripcion:
          - Vuelta a la Tierra y antesala directa del crossover.
          etiqueta:
            clase: opcional
            texto: Opcional
      - evento:
          id: m1-b2-world-war-hulk
          linea_marvel: true
          etiqueta: Evento de toda la línea Marvel · Junio 2007 – enero 2008
          titulo: World War Hulk
          creditos: Greg Pak · John Romita Jr. (serie principal) · tie-in mutante de Christos Gage
          descripcion:
          - Hulk vuelve del exilio espacial al que lo mandaron los Illuminati y va a por ellos uno a uno. Pasa por la mansión a pedirle cuentas a Xavier, que formaba parte de ese grupo.
          apartados:
          - apartado: Antes de empezar
            texto: 'Contexto recomendado: <em>Planet Hulk</em> (<em>Incredible Hulk</em> #92–105), el exilio de Hulk en Sakaar. Justo antes del evento: <em>Incredible Hulk</em> #106 y el one-shot <em>World War Hulk Prologue: World Breaker</em> #1.'
          - apartado: Orden de lectura
            texto: 'Incredible Hulk #106 → World War Hulk Prologue: World Breaker #1 → <strong>World War Hulk #1</strong> → <span class="cap">World War Hulk: X-Men #1–3</span> → <strong>World War Hulk #2</strong> → <strong>#3</strong> → <strong>#4</strong> → <strong>#5</strong>'
          - apartado: Versión mínima
            texto: '<em>World War Hulk</em> #1 y después <em>World War Hulk: X-Men</em> #1–3.'
      - serie:
          id: m1-b2-satelites-del-bloque
          titulo: Satélites del bloque
          creditos: 'New Excalibur #1–24 (cierra en <em>X-Men: Die by the Sword</em> #1–5) · Wolverine: Origins #1–50 · Cable &amp; Deadpool #1–50'
