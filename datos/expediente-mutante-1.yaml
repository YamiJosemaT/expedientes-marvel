            texto: 'Chaos War: Chaos King #1 → <strong>Chaos War #1</strong> → <strong>#2</strong> → <strong>#3</strong> → <strong>#4</strong> → <span class="cap">Chaos War: X-Men #1</span> → <span class="cap">Chaos War: X-Men #2</span> → <strong>Chaos War #5</strong>'
          - apartado: Versión mínima
            texto: '<em>Chaos War</em> #1–4 y después <em>Chaos War: X-Men</em> #1–2. El tie-in se puede leer suelto, pero sin el evento no sabes quién es el Rey del Caos.'
          - apartado: Prescindible
            texto: 'Los one-shots de otros frentes (<em>Ares</em>, <em>God Squad</em>, <em>Alpha Flight</em>, <em>Thor</em>, <em>Dead Avengers</em>) e <em>Incredible Hulks</em> #618–620.'
          - apartado: Dónde va en tu lectura
            texto: 'Entre los arcos «Quarantine» y «Breaking Point» de <em>Uncanny X-Men</em> (ficha anterior): léelo al terminar «Quarantine».'
      - serie:
          id: m1-b4-x-men-legacy-238-244-new-mutants-vol-3-15-21
          prioridad: p2
          titulo: 'X-Men: Legacy <span class="nums">#238–244</span> · New Mutants vol. 3 <span class="nums">#15–21</span>'
          creditos: Mike Carey / Zeb Wells, Dan Abnett &amp; Andy Lanning · 2010–2011
          continuidad:
          - viene: ◂ Ambas vienen de <em>Second Coming</em>
          - sigue: '▸ Legacy #245–247 y New Mutants #22–24 son capítulos de <em>Age of X</em>'
          etiqueta:
            clase: t2
            texto: Recomendado
      - serie:
          id: m1-b4-generation-hope-1-9-x-men-vol-3-1-15-wolverine-vol-4-1-16-astonishing
          titulo: Generation Hope <span class="nums">#1–9</span> · Wolverine vol. 4 <span class="nums">#1–16</span> · Astonishing X-Men <span class="nums">#36–47</span>
          creditos: Kieron Gillen / Jason Aaron / varios · 2010–2011
          continuidad:
          - sigue: '▸ Generation Hope #10–11 son tie-in de <em>Schism</em>'
          - sigue: ▸ Wolverine continúa en el tramo 4.6
          descripcion:
          - <em>Generation Hope</em> sigue a las Cinco Luces; <em>Wolverine</em> abre con «Wolverine Goes to Hell» (#1–5), el arco del que arranca <em>X-23</em>.
          - 'Si lo lees por <em>X-23</em> y <em>Collision</em>, basta con <em>Wolverine</em> #1–5 (y, si quieres, el one-shot <em>Wolverine: Road to Hell</em> #1). El resto, #5.1–16, puede ir en cualquier momento antes del tramo 4.6.'
          etiqueta:
            clase: opcional
            texto: Opcional
      - serie:
          id: m1-b4-x-23-vol-3-1-16
          prioridad: p2
          titulo: X-23 vol. 3 <span class="nums">#1–7</span>
          creditos: Marjorie Liu · Will Conrad, Sana Takeda · 2010–2011
          continuidad:
          - viene: '◂ Arranca de <em>Wolverine</em> vol. 4 #1 (ficha anterior)'
          - sigue: '▸ Los números #8–9 son capítulos de <em>Collision</em>'
          descripcion:
          - 'Laura fuera de X-Force. Serie de personaje muy bien construida: «The Killing Dream» (#1–3) la enfrenta al Lobezno poseído de «Wolverine Goes to Hell», y «Songs of the Orphan Child» (#4–7) la lleva junto a Gambit camino de Madripoor.'
          etiqueta:
            clase: t2
            texto: Recomendado
      - serie:
          id: m1-b4-daken-dark-wolverine-1-7
          titulo: 'Daken: Dark Wolverine <span class="nums">#1–7</span>'
          creditos: Daniel Way &amp; Marjorie Liu · Giuseppe Camuncoli · 2010–2011
          continuidad:
          - viene: '◂ Viene de <em>Dark Wolverine</em> #90 (tramo 4.2)'
          - sigue: '▸ Los números #8–9 son capítulos de <em>Collision</em>'
          descripcion:
          - 'Con el alma de Lobezno en el infierno, Daken levanta su propio imperio («Empire») y se convierte en el rey del hampa de Madripoor. Antesala opcional de esta serie y de <em>X-23</em>: el one-shot <em>Wolverine: Road to Hell</em> #1.'
          etiqueta:
            clase: opcional
            texto: Opcional
      - evento:
          id: m1-b4-collision
          etiqueta: Crossover · 4 partes · 2011
          titulo: Collision
          creditos: Marjorie Liu (<em>X-23</em>) · Daniel Way &amp; Marjorie Liu (<em>Daken</em>) · Ryan Stegman, Marco Checchetto
          descripcion:
          - X-23 llega a Madripoor buscando respuestas sobre su pasado y se encuentra con Daken. Juntos persiguen a Malcolm Colcord, responsable de las sucesivas encarnaciones del programa Arma X, aunque ninguno se fía del otro. <strong>Se lleva dos números de cada serie:</strong> aunque solo sigas <em>X-23</em>, necesitas también los dos de <em>Daken</em> para tener la historia completa.
          apartados:
          - apartado: Antes de empezar
            texto: '<em>X-23</em> y <em>Daken</em> leídas hasta el #7 (fichas anteriores).'
          - apartado: Orden completo
            texto: '<span class="cap">X-23 #8</span> → <span class="cap">Daken: Dark Wolverine #8</span> → <span class="cap">X-23 #9</span> → <span class="cap">Daken: Dark Wolverine #9</span>'
          - apartado: Después
            texto: '<em>X-23</em> sigue en el #10 y <em>Daken</em> en el #9.1, las dos en el tramo 4.6.'
      - evento:
          id: m1-b4-curse-of-the-mutants
          etiqueta: Crossover opcional · 2010
          titulo: Curse of the Mutants
          creditos: Victor Gischler · Paco Medina (serie principal) · tie-ins de Stuart Moore, Duane Swierczynski, Chuck Kim y Simon Spurrier
          descripcion:
          - 'Xarus, hijo de Drácula, quiere unir a todas las sectas de vampiros del mundo bajo su mando, y elige San Francisco, la ciudad de los X-Men, como campo de batalla. Un atentado suicida en Union Square deja a Jubilee infectada, y Cíclope tendrá que buscar aliados muy poco recomendables para defender Utopía. Es la primera historia de la nueva serie <em>X-Men</em> vol. 3. <strong>Opcional</strong>: no pesa en el resto de la línea, salvo por Jubilee, que sale de aquí convertida en vampira.'
          apartados:
          - apartado: Antes de empezar
            texto: '<em>Death of Dracula</em> #1 (2010, Gischler y Camuncoli), el prólogo: Xarus da un golpe de estado contra su padre. La historia sigue directamente en el primer número de la serie. El <em>Curse of the Mutants Saga</em> #1 es un resumen promocional gratuito; no hace falta.'
          - apartado: Orden de lectura
            texto: '<em>Death of Dracula</em> #1 → <span class="cap">X-Men vol. 3 #1</span> → <em>Blade</em> #1 → <span class="cap">X-Men vol. 3 #2</span> → <em>Storm &amp; Gambit</em> #1 → <em>Namor: The First Mutant</em> #1 → <em>X-Men vs. Vampires</em> #1–2 → <span class="cap">X-Men vol. 3 #3</span> → <em>Smoke &amp; Blood</em> #1 → <em>Namor: The First Mutant</em> #2–4 → <span class="cap">X-Men vol. 3 #4–6</span>'
          - apartado: Versión mínima
            texto: '<em>Death of Dracula</em> #1 y los seis números de la serie. Si añades un tie-in, que sea <em>Namor: The First Mutant</em> #1–4 («Royal Blood», Moore y Olivetti), con vampiros atlantes y Namor obligado a elegir entre Atlántida y los X-Men.'
          - apartado: Prescindible
            texto: 'Los one-shots con el sello <em>X-Men: Curse of the Mutants</em>. <em>Blade</em> #1 (Swierczynski y Tim Green): alguien mata cazavampiros por todo el mundo y Blade monta un equipo de emergencia. <em>Storm &amp; Gambit</em> #1 (Chuck Kim y Chris Bachalo): un golpe en territorio vampiro para recuperar algo que podría frenar la invasión. <em>Smoke &amp; Blood</em> #1 (Spurrier y Gabriel Hernández Walta): el X-Club busca una cura y el vampiro de su laboratorio se escapa. <em>X-Men vs. Vampires</em> #1–2: antología de historias cortas de varios autores, con la reedición por entregas del clásico de Claremont y Sienkiewicz con Drácula (1982).'
          - apartado: Después
            texto: La serie sigue en la ficha siguiente con «To Serve and Protect»; la Jubilee vampira, en <em>Wolverine and Jubilee</em>.
      - serie:
          id: m1-b4-wolverine-and-jubilee-1-4
          titulo: X-Men vol. 3 <span class="nums">#7–15</span> · Wolverine and Jubilee <span class="nums">#1–4</span>
          creditos: Victor Gischler / Christopher Yost («First to Last») · Kathryn Immonen &amp; Phil Noto (<em>Wolverine and Jubilee</em>) · 2010–2011
          continuidad:
          - viene: ◂ Viene de «Curse of the Mutants» (recuadro anterior)
          - sigue: ▸ X-Men vol. 3 continúa en el tramo 4.6
          - sigue: '▸ Jubilee reaparece en <em>X-23</em> #10–12 (tramo 4.6)'
          descripcion:
          - '<strong>Orden:</strong> <em>X-Men</em> #7–10 («To Serve and Protect», con Spider-Man) → <em>Wolverine and Jubilee</em> #1–4 («Cursed») → <em>X-Men</em> #11 («Blood Hunt») → <em>X-Men: Giant-Size</em> #1 → <em>X-Men</em> #12–15 («First to Last»).'
          - 'Tras la invasión de San Francisco, Jubilee es una vampira. <em>Wolverine and Jubilee</em> es la secuela directa: Jubilee no encaja entre los X-Men, y Lobezno se la lleva lejos cuando alguien intenta inculparla de un asesinato en masa. <em>X-Men</em> #11 retoma su lucha contra la sed de sangre, y «First to Last» enfrenta a los X-Men con los Evolutionaries en el presente y en los tiempos de los cinco primeros alumnos de Xavier. <em>X-Men: Giant-Size</em> #1 es la primera parte de esta última historia.'
          - 'Fuera de esta guía: la antología <em>X-Men: To Serve and Protect</em> #1–4 (no es el arco #7–10) es prescindible.'
          etiqueta:
            clase: opcional
            texto: Opcional
      - serie:
          id: m1-b4-mas-series-y-especiales-2010-2011
          titulo: Más series y especiales (2010–2011)
          creditos: 'Astonishing X-Men: Xenogenesis #1–5 (Warren Ellis) · Astonishing Spider-Man &amp; Wolverine #1–6 (Jason Aaron y Adam Kubert) · Wolverine: The Best There Is #1–12 (Charlie Huston) · Namor: The First Mutant #5–11 + Annual #1 · Uncanny X-Men Annual #3 · Uncanny X-Men: The Heroic Age #1 (Matt Fraction) · World War Hulks: Captain America vs. Wolverine #1–2 · X-Force: Sex and Violence #1–3 (Kyle &amp; Yost) · Wolverine #900 y #1000 (antologías) · Magneto (2011) #1 (Howard Chaykin) · Cyclops (2011) #1 · Onslaught Unleashed #1–4 · Wolverine/Hercules: Myths, Monsters &amp; Mutants #1–4 · Wolverine &amp; Black Cat: Claws 2 #1–3 · Wolverine: Debt of Death #1 · 2010–2011'
          continuidad:
          - viene: '◂ <em>Namor: The First Mutant</em> sigue tras sus cuatro números de «Curse of the Mutants»'
          descripcion:
          - Lo que se publicó alrededor de las cabeceras en la «Heroic Age». <em>Xenogenesis</em> cierra la etapa de Ellis en <em>Astonishing</em>; <em>Astonishing Spider-Man &amp; Wolverine</em> es una aventura de Aaron por el tiempo; el <em>Annual</em> de <em>Uncanny</em> y el de <em>Namor</em> son dos partes del cruce «Escape from the Negative Zone».
          - 'También salieron en estos años varios <strong>números .1</strong>, pensados como punto de entrada: <em>Uncanny X-Force</em> 5.1, <em>X-Factor</em> 224.1, <em>X-Men</em> vol. 3 15.1, <em>Wolverine</em> vol. 4 5.1, <em>Uncanny X-Men</em> 534.1 y <em>X-Men: Legacy</em> 260.1. Léelos antes del número entero que tienen delante.'
          etiqueta:
            clase: opcional
            texto: Opcional
  - evento:
      id: m1-b4-age-of-x
      etiqueta: Crossover · 2011
      titulo: Age of X
      creditos: Mike Carey · Clay Mann
      descripcion:
      - Realidad alternativa creada sin querer por Legión. Autoconclusiva y saltable, pero se lleva seis números de dos series en marcha.
      apartados:
      - apartado: Orden
        texto: 'Age of X: Alpha #1 → <span class="cap">Legacy #245</span> → <span class="cap">New Mutants #22</span> → <span class="cap">Legacy #246</span> → <span class="cap">New Mutants #23</span> → <span class="cap">Legacy #247</span> → <span class="cap">New Mutants #24</span> → Age of X: Universe #1–2'
  - tramo:
      numero: '4.6'
      titulo: Cuenta atrás para la ruptura
      cuando: '2011'
      entradas:
      - serie:
          id: m1-b4-uncanny-x-men-535-539
          prioridad: p2
          titulo: Uncanny X-Men <span class="nums">#535–539</span>
          creditos: Kieron Gillen · Greg Land, Carlos Pacheco · 2011
          continuidad:
          - sigue: '▸ Los #540–543 son el tie-in de <em>Fear Itself</em> (ficha siguiente)'
          - sigue: '▸ El #544 va después de <em>Schism</em>; la cabecera reinicia como vol. 2 en el tramo 5.1'
          descripcion:
          - 'La recta final de la numeración clásica, que se cierra en el #544 tras 48 años.'
          etiqueta:
            clase: t2
            texto: Recomendado
      - evento:
          id: m1-b4-fear-itself
          linea_marvel: true
          etiqueta: Evento de toda la línea Marvel · Abril – octubre 2011
          titulo: Fear Itself
          creditos: Matt Fraction · Stuart Immonen (serie principal) · tie-in mutante de Kieron Gillen
          descripcion:
          - 'La Serpiente, dios asgardiano del miedo, reparte martillos que convierten a varios personajes en sus heraldos. Uno es Juggernaut, que marcha sobre San Francisco, y cuatro números de <em>Uncanny X-Men</em> cuentan esa batalla. <strong>Son números de la serie principal</strong>: esta parte no es opcional.'
          apartados:
          - apartado: Antes de empezar
            texto: Los números anteriores de <em>Uncanny X-Men</em>, hasta el 539 (ficha anterior).
          - apartado: Orden de lectura
            texto: '<strong>Fear Itself #1</strong> → <strong>#2</strong> → <strong>#3</strong> → <strong>#4</strong> → <strong>#5</strong> → <span class="cap">Uncanny X-Men #540–543</span> → <strong>Fear Itself #6</strong> → <strong>#7</strong>'
          - apartado: Versión mínima
            texto: '<em>Uncanny X-Men</em> #540–543 seguidos: se entienden sin el evento.'
          - apartado: Opcional
            texto: '<em>Fear Itself: Uncanny X-Force</em> #1–3, <em>Fear Itself: Wolverine</em> #1–3 y un arco de <em>New Mutants</em> con Moonstar y Hela, dentro del evento. También <em>Alpha Flight</em> (2011) #0.1 y #1–8 (Pak y Van Lente), la vuelta del equipo canadiense, que nace como tie-in.'
          - apartado: Después
            texto: El último número de <em>Uncanny X-Men</em>, el 544, va después de <em>Schism</em>.
      - serie:
          id: m1-b4-x-men-legacy-248-260-new-mutants-vol-3-25-33-x-23-17-21-x-men-vol-3-16
          prioridad: p2
          titulo: 'X-Men: Legacy <span class="nums">#248–260</span> · New Mutants vol. 3 <span class="nums">#25–33</span> · X-Men vol. 3 <span class="nums">#16–20</span> · Wolverine vol. 4 <span class="nums">#17–20</span>'
          creditos: Mike Carey / Abnett &amp; Lanning / Victor Gischler / Jason Aaron · 2011
          continuidad:
          - viene: ◂ Legacy y New Mutants vienen de <em>Age of X</em>
          - sigue: '▸ Wolverine sigue en 2012 con numeración clásica: #300–317'
          descripcion:
          - Carey cierra aquí cuatro años muy consistentes al frente de <em>Legacy</em>.
          etiqueta:
            clase: t2
            texto: Recomendado
      - serie:
          id: m1-b4-x-23-vol-3-10-16
          prioridad: p2
          titulo: X-23 vol. 3 <span class="nums">#10–16</span>
          creditos: Marjorie Liu · Sana Takeda, Phil Noto · 2011
          continuidad:
          - viene: ◂ Viene de <em>Collision</em>
          - viene: ◂ Jubilee llega ya vampira desde <em>Wolverine and Jubilee</em> (final del tramo 4.5)
          - sigue: '▸ Continúa en el tramo 5.1 desde el #17, ya después de <em>Schism</em>'
          descripcion:
          - 'Laura intenta cerrar su pasado junto a Jubilee («Touching Darkness», #10–12) y acaba colaborando con la Fundación Futuro («Chaos Theory», #13–16).'
          etiqueta:
            clase: t2
            texto: Recomendado
      - serie:
          id: m1-b4-daken-dark-wolverine-9-1-10-15
          titulo: 'Daken: Dark Wolverine <span class="nums">#9.1 → #10–15</span>'
          creditos: Rob Williams · Ron Garney, Matteo Buffagni, Michele Bertilorenzi · 2011
          continuidad:
          - viene: ◂ Viene de <em>Collision</em>
          - sigue: '▸ Continúa en el tramo 5.1 desde el #16'
          descripcion:
          - 'Con Madripoor en sus manos, Daken salta a Los Ángeles para hacerse con el crimen de Hollywood: «Big Break» (#10–12) y «Moonwalk» (#13–15), con Moon Knight. El #9.1 es el puente entre las dos etapas.'
          etiqueta:
            clase: opcional
            texto: Opcional
      - serie:
          id: m1-b4-al-margen-de-la-continuidad-2008-2011
          titulo: Al margen de la continuidad (2008–2011)
          creditos: 'X-Men Forever (Chris Claremont): Alpha #1, #1–24, Annual #1, Giant-Size #1 y X-Men Forever 2 #1–16 (2009–2011) · X-Factor Forever #1–5 y New Mutants Forever #1–5 (2010) · X-Men Noir #1–4 y X-Men Noir: Mark of Cain #1–4 · Wolverine Noir #1–4 · Weapon X Noir #1 · X-Babies #1–4 · X-Men: Misfits · Timestorm 2009/2099: X-Men #1 · Wolverine: Prodigal Son · X-Women #1 (Claremont y Milo Manara) · Gambit: From the Marvel Vault #1 · Free Comic Book Day 2009: Wolverine · Iceman and Angel #1 (2011)'
          descripcion:
          - 'Los <em>Forever</em> son continuaciones de autor: Claremont retoma los X-Men desde 1991 como si no se hubiera ido, y Louise Simonson hace lo mismo con <em>X-Factor</em> y <em>New Mutants</em>. Los <em>Noir</em> trasladan a los personajes a los años 30.'
          - Las demás son versiones para otros públicos (manga, infantil), futuros alternativos o historias inéditas de los noventa (<em>From the Marvel Vault</em>).
          etiqueta:
            clase: t4
            texto: Al margen de la continuidad
  - evento:
      id: m1-b4-x-men-schism
      etiqueta: Evento · 2011 · Cierre del bloque
      titulo: 'X-Men: Schism'
      creditos: Jason Aaron · Carlos Pacheco, Frank Cho, Adam Kubert
      descripcion:
      - Cíclope y Lobezno rompen por el uso de menores en combate. La especie se parte en dos bandos y así seguirá hasta 2016.
      apartados:
      - apartado: Antes de empezar
        texto: '<em>X-Men: Prelude to Schism</em> #1–4 (Paul Jenkins, mayo – junio 2011): Xavier, Magneto, Cíclope y Lobezno recuerdan qué significa liderar justo antes de la ruptura. Opcional.'
      - apartado: Orden
        texto: 'X-Men: Schism #1–5 → X-Men: Regenesis #1 (reparto de bandos)'
      - apartado: Tie-in
        texto: '<span class="cap">Generation Hope #10–11</span>'
      - apartado: Epílogo
        texto: '<span class="cap">Uncanny X-Men #544</span>, el último número de la numeración clásica tras 48 años, se lee después de <em>Schism</em>.'
- id: b5
  fechas: 2011 — 2012
  titulo: Regénesis y Vengadores vs. X-Men
  intro: 'Dos escuelas, dos filosofías: Lobezno reabre el Instituto en Westchester, Cíclope se queda en Utopía con un equipo de ataque. La tensión revienta cuando la Fuerza Fénix vuelve a la Tierra. Aquí está el caso más claro de por qué no conviene leer por cabeceras: las dos series principales entregan diez números cada una al evento, y una de ellas ni siquiera sobrevive.'
  navegacion:
    anio: 2011–2012
    texto: Regénesis y AvX
  contenido:
  - tramo:
      numero: '5.1'
      titulo: Dos escuelas
      cuando: Octubre 2011 – marzo 2012
      nota: 'Los dos bandos, contados desde dentro. Léelas alternando: son el mismo conflicto visto desde los dos lados.'
      entradas:
      - serie:
          id: m1-b5-wolverine-and-the-x-men-1-8
          prioridad: p2
          titulo: Wolverine and the X-Men <span class="nums">#1–8</span>
          creditos: Jason Aaron · Chris Bachalo, Nick Bradshaw · 2011–2012
          continuidad:
          - sigue: '▸ Los números #9–18 son capítulos de <em>Avengers vs. X-Men</em>'
          descripcion:
          - La Escuela Jean Grey. Divertida, gamberra y con el mejor elenco juvenil de la década.
          etiqueta:
            clase: t2
            texto: Recomendado
      - serie:
          id: m1-b5-uncanny-x-men-vol-2-1-10
          prioridad: p2
          titulo: Uncanny X-Men vol. 2 <span class="nums">#1–10</span>
          creditos: Kieron Gillen · Carlos Pacheco, Greg Land · «Everything is Sinister», «Tabula Rasa» · 2011–2012
          continuidad:
          - viene: '◂ Viene del tramo 4.6, reiniciada desde el #1'
          - sigue: '▸ Los números #11–20 son capítulos de <em>AvX</em>, y la serie termina ahí dentro'
          descripcion:
          - 'El «Escuadrón Extinción» de Cíclope: el punto de vista contrario al de Aaron.'
          etiqueta:
            clase: t2
            texto: Recomendado
      - serie:
          id: m1-b5-uncanny-x-force-vol-1-19-1-20-30
          prioridad: p1
          titulo: 'Uncanny X-Force vol. 1 <span class="nums">#19.1 → #20–30</span>'
          creditos: Rick Remender · 2012
          continuidad:
          - viene: ◂ Viene del tramo 4.5
          - sigue: '▸ Continúa en el tramo 5.2 hasta el #35'
          descripcion:
          - 'El #19.1 cuenta qué es de los personajes de la Era de Apocalipsis que ayudaron a X-Force en la Dark Angel Saga, y abre la serie de esa realidad (ficha siguiente). Después la serie sigue su propio camino, al margen del reparto de bandos y de AvX.'
          etiqueta:
            clase: t1
            texto: Esencial
      - serie:
          id: m1-b5-age-of-apocalypse-2012-1-12
          prioridad: p4
          titulo: Age of Apocalypse (2012) <span class="nums">#1–12</span>
          creditos: David Lapham · Roberto De La Torre · marzo 2012 – 2013
          continuidad:
          - viene: '◂ Viene de <em>Uncanny X-Force</em> #19.1'
          - sigue: '▸ Los números #13–14 son capítulos de <em>X-Termination</em> (bloque 6)'
          descripcion:
          - 'Continuación directa de <em>Uncanny X-Force</em> #19.1, ambientada por completo en la realidad de la Era de Apocalipsis. No toca el universo principal hasta su final, así que puedes leerla a tu ritmo entre este tramo y el bloque 6: lo único importante es llegar a su #12 antes de empezar <em>X-Termination</em>.'
          etiqueta:
            clase: t4
            texto: Alterna
      - serie:
