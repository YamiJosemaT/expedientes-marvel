          continuidad:
          - viene: ◂ Viene de <em>Battle of the Atom</em>
          descripcion:
          - 'Aaron cierra su etapa en el #42 y la serie se relanza con otro autor.'
          etiqueta:
            clase: t2
            texto: Recomendado
      - serie:
          id: m1-b6-magneto-1-21
          prioridad: p2
          titulo: Magneto <span class="nums">#1–21</span>
          creditos: Cullen Bunn · Gabriel Hernández Walta · 2014–2015
          descripcion:
          - Magneto solo, sin poderes plenos, cazando a quienes explotan mutantes. Seca, excelente y sin cruces.
          etiqueta:
            clase: t2
            texto: Recomendado
      - serie:
          id: m1-b6-death-of-wolverine-1-4
          prioridad: p2
          titulo: Death of Wolverine <span class="nums">#1–4</span>
          creditos: Charles Soule · Steve McNiven · 2014
          descripcion:
          - 'Logan muere y desaparece de la línea hasta 2018. Secuelas opcionales: <em>The Logan Legacy</em> #1–7, <em>The Weapon X Program</em> #1–5, <em>Wolverines</em> #1–20.'
          etiqueta:
            clase: t2
            texto: Recomendado
      - serie:
          id: m1-b6-x-men-vol-4-7-26-x-men-legacy-vol-2-13-24-amazing-x-men-1-19-cable-and
          titulo: 'X-Men vol. 4 <span class="nums">#7–26</span> · X-Men: Legacy vol. 2 <span class="nums">#13–24</span> · Amazing X-Men <span class="nums">#1–19</span> · Cable and X-Force <span class="nums">#11–19</span> → X-Force vol. 4 <span class="nums">#1–15</span> · Uncanny X-Force vol. 2 <span class="nums">#11–17</span> · Astonishing X-Men <span class="nums">#62–68</span> · Nightcrawler <span class="nums">#1–12</span> · Storm <span class="nums">#1–11</span> · Cyclops <span class="nums">#1–11</span>'
          creditos: Varios · 2013–2015
          continuidad:
          - viene: ◂ Astonishing X-Men viene de <em>X-Termination</em>
          - sigue: '▸ Cyclops #12 es capítulo de <em>The Black Vortex</em>'
          descripcion:
          - 'Todas leíbles, ninguna imprescindible. <em>Amazing X-Men</em> #1–5 devuelve a Rondador Nocturno del más allá.'
          etiqueta:
            clase: opcional
            texto: Opcional
      - evento:
          id: m1-b6-axis
          linea_marvel: true
          etiqueta: Evento de toda la línea Marvel · Octubre – diciembre 2014
          titulo: AXIS
          creditos: Rick Remender · Adam Kubert, Leinil Francis Yu, Jim Cheung
          descripcion:
          - El Cráneo Rojo, con el cerebro robado de Xavier, se convierte en Onslaught Rojo y usa el odio como arma telepática; para pararlo, un hechizo de inversión cambia de bando a héroes y villanos. Magneto y Havok tienen papel protagonista.
          apartados:
          - apartado: Antes de empezar
            texto: El preludio sale de <em>Uncanny Avengers</em>, la serie de Remender con un equipo mixto de Vengadores y X-Men (no incluida en esta guía), y de <em>Magneto</em>. Los dos números de <em>Magneto</em> ya los tienes si sigues su serie en este tramo.
          - apartado: Orden de lectura
            texto: 'Uncanny Avengers #23 → Magneto #9 → Uncanny Avengers #24 → Magneto #10 → Uncanny Avengers #25 → <strong>AXIS #1</strong> → <strong>#2</strong> → <strong>#3</strong> → <strong>#4</strong> → <strong>#5</strong> → <strong>#6</strong> → <strong>#7</strong> → <strong>#8</strong> → <strong>#9</strong>'
          - apartado: Versión mínima
            texto: '<em>AXIS</em> #1–9: la serie de nueve números se sostiene sola.'
          - apartado: Opcional
            texto: '<em>AXIS: Revolutions</em> #1, que se puede leer tras <em>AXIS</em> #1, y los tie-ins de otras series.'
  - evento:
      id: m1-b6-the-black-vortex
      etiqueta: Crossover · 13 partes · 2015
      titulo: The Black Vortex
      creditos: Sam Humphries · varios
      descripcion:
      - Cruce con los Guardianes de la Galaxia por un artefacto que amplifica poderes. Opcional en conjunto, pero se lleva tres números de series que estás leyendo.
      apartados:
      - apartado: Orden completo
        texto: 'Black Vortex Alpha #1 → Guardians of the Galaxy #24 → Legendary Star-Lord #9 → <span class="cap">All-New X-Men #38</span> → <span class="cap">All-New X-Men #39</span> → Guardians Team-Up #3 → Guardians of the Galaxy #25 → Nova #28 → Legendary Star-Lord #10 → <span class="cap">Cyclops #12</span> → Captain Marvel #14 → Legendary Star-Lord #11 → Black Vortex Omega #1'
  - tramo:
      numero: '6.3'
      titulo: El final del universo
      cuando: '2015'
      entradas:
      - serie:
          id: m1-b6-all-new-x-men-40-41-uncanny-x-men-vol-3-31-35-uncanny-x-men-600
          prioridad: p1
          titulo: All-New X-Men <span class="nums">#40–41</span> · Uncanny X-Men vol. 3 <span class="nums">#31–35</span> · Uncanny X-Men <span class="nums">#600</span>
          creditos: Brian Michael Bendis · 2015
          continuidad:
          - viene: ◂ All-New X-Men viene de <em>The Black Vortex</em>
          descripcion:
          - 'Bendis cierra sus tres años. El #600 recupera la numeración clásica para un epílogo coral y es el verdadero punto final de la etapa.'
          etiqueta:
            clase: t1
            texto: Esencial
      - serie:
          id: m1-b6-secret-wars-tie-ins-mutantes
          prioridad: p4
          titulo: Secret Wars — tie-ins mutantes
          creditos: 'E is for Extinction · Years of Future Past · Age of Apocalypse · House of M · X-Tinction Agenda · Inferno · X-Men ''92 · Old Man Logan #1–5 · 2015'
          descripcion:
          - 'El universo Marvel se destruye y se reconstruye. Solo necesitas <em>Secret Wars</em> #1–9 para el contexto; los tie-ins son homenajes a etapas clásicas. <em>Inferno</em> (Coloso y Magik) y <em>Old Man Logan</em> son los únicos con consecuencias posteriores.'
          etiqueta:
            clase: t4
            texto: Alterna
- id: b7
  fechas: 2015 — 2017
  titulo: La niebla Terrígena
  intro: Una nube Terrígena que activa a los Inhumanos resulta ser letal para los mutantes y esteriliza a la especie por segunda vez. El bloque más flojo de la guía en calidad media, pero contiene el conflicto que resetea el statu quo y saca a Cíclope de escena.
  navegacion:
    anio: 2015–2017
    texto: Guerra inhumana
  contenido:
  - tramo:
      numero: '7.1'
      titulo: Ocho meses después
      cuando: Finales de 2015 – principios de 2016
      nota: Tras <em>Secret Wars</em> la línea salta ocho meses en el tiempo. Las tres cabeceras arrancan a la vez y convergen en <em>Apocalypse Wars</em>.
      entradas:
      - serie:
          id: m1-b7-extraordinary-x-men-1-7
          prioridad: p2
          titulo: Extraordinary X-Men <span class="nums">#1–7</span>
          creditos: Jeff Lemire · Humberto Ramos · 2015–2016
          continuidad:
          - sigue: '▸ Los números #8–12 son el arco de <em>Apocalypse Wars</em>'
          descripcion:
          - Tormenta traslada a la especie a Limbo para escapar de la niebla. Cabecera principal del bloque.
          etiqueta:
            clase: t2
            texto: Recomendado
      - serie:
          id: m1-b7-all-new-x-men-vol-2-1-8-uncanny-x-men-vol-4-1-5
          titulo: All-New X-Men vol. 2 <span class="nums">#1–8</span> · Uncanny X-Men vol. 4 <span class="nums">#1–5</span>
          creditos: Dennis Hopeless / Cullen Bunn · 2015–2016
          continuidad:
          - sigue: '▸ All-New #9–11 y Uncanny #6–9 son los arcos de <em>Apocalypse Wars</em>'
          descripcion:
          - Los originales de gira y el escuadrón negro de Magneto.
          etiqueta:
            clase: opcional
            texto: Opcional
      - serie:
          id: m1-b7-all-new-wolverine-1-6
          prioridad: p2
          titulo: All-New Wolverine <span class="nums">#1–6</span>
          creditos: Tom Taylor · David López · 2015–2016
          descripcion:
          - Laura Kinney hereda el manto. La mejor serie de estos dos años con diferencia, y prácticamente independiente del resto.
          etiqueta:
            clase: t2
            texto: Recomendado
  - evento:
      id: m1-b7-apocalypse-wars
      etiqueta: Crossover temático · 2016
      titulo: Apocalypse Wars
      creditos: Jeff Lemire, Dennis Hopeless, Cullen Bunn
      descripcion:
      - No es un crossover de capítulos alternos, sino tres arcos paralelos sobre Apocalipsis publicados a la vez. Puedes leer cada arco entero por separado, en el orden que quieras.
      apartados:
      - apartado: Los tres arcos
        texto: '<span class="cap">Extraordinary X-Men #8–12</span> · <span class="cap">All-New X-Men #9–11</span> · <span class="cap">Uncanny X-Men vol. 4 #6–9</span>'
  - tramo:
      numero: '7.2'
      titulo: Camino a la guerra
      cuando: Mediados – finales de 2016
      entradas:
      - serie:
          id: m1-b7-death-of-x-1-4
          prioridad: p1
          titulo: Death of X <span class="nums">#1–4</span>
          creditos: Jeff Lemire &amp; Charles Soule · Aaron Kuder · 2016
          descripcion:
          - 'Flashback obligatorio: cuenta qué pasó realmente con Cíclope y la niebla ocho meses antes. Sin esto, <em>IvX</em> no se entiende.'
          etiqueta:
            clase: t1
            texto: Esencial
      - serie:
          id: m1-b7-extraordinary-x-men-13-16-all-new-x-men-vol-2-12-16-uncanny-x-men-vol
          prioridad: p2
          titulo: Extraordinary X-Men <span class="nums">#13–16</span> · All-New X-Men vol. 2 <span class="nums">#12–16</span> · Uncanny X-Men vol. 4 <span class="nums">#10–16</span>
          creditos: Lemire / Hopeless / Bunn · 2016
          continuidad:
          - viene: ◂ Vienen de <em>Apocalypse Wars</em>
          - sigue: '▸ Las tres entregan sus últimos números a <em>IvX</em> y terminan ahí: Extraordinary #17–20, All-New y Uncanny #17–19'
          etiqueta:
            clase: t2
            texto: Recomendado
      - serie:
          id: m1-b7-all-new-wolverine-7-15-old-man-logan-vol-2-1-14
          prioridad: p2
          titulo: All-New Wolverine <span class="nums">#7–15</span> · Old Man Logan vol. 2 <span class="nums">#1–14</span>
          creditos: Tom Taylor / Jeff Lemire · 2016
          descripcion:
          - El Logan viejo de la realidad alterna, ya instalado en la continuidad principal.
          etiqueta:
            clase: t2
            texto: Recomendado
      - evento:
          id: m1-b7-civil-war-ii
          linea_marvel: true
          etiqueta: Evento de toda la línea Marvel · Junio – diciembre 2016
          titulo: Civil War II
          creditos: Brian Michael Bendis · David Marquez (serie principal) · tie-in mutante de Cullen Bunn y Andrea Broccardo
          descripcion:
          - 'Un Inhumano capaz de predecir el futuro enfrenta a Captain Marvel con Iron Man. En el tie-in, Magneto sale a por él por lo que su don puede significar para los mutantes: es la antesala de la guerra con los Inhumanos.'
          apartados:
          - apartado: Antes de empezar
            texto: 'Nada imprescindible: el evento arranca en <em>Civil War II</em> #0.'
          - apartado: Orden de lectura
            texto: '<strong>Civil War II #0</strong> → <strong>#1</strong> → Free Comic Book Day 2016: Civil War II #1 → <strong>Civil War II #2</strong> → <span class="cap">Civil War II: X-Men #1–4</span> → <strong>Civil War II #3</strong> → <strong>#4</strong> → <strong>#5</strong> → <strong>#6</strong> → <strong>#7</strong> → <strong>#8</strong>'
          - apartado: Versión mínima
            texto: '<em>Civil War II</em> #0–2 y después <em>Civil War II: X-Men</em> #1–4.'
          - apartado: Después
            texto: <em>Death of X</em> e <em>Inhumans vs. X-Men</em>, en este mismo tramo.
  - evento:
      id: m1-b7-inhumans-vs-x-men
      etiqueta: Evento · Diciembre 2016 – abril 2017
      titulo: Inhumans vs. X-Men
      creditos: Charles Soule &amp; Jeff Lemire · Leinil Francis Yu
      descripcion:
      - Guerra abierta por la nube Terrígena. Cierra el conflicto, devuelve a los mutantes a la Tierra y limpia la mesa para el relanzamiento del bloque 8.
      apartados:
      - apartado: Columna principal
        texto: 'IvX #0 → IvX #1–6'
      - apartado: Capítulos que salen de tus series en marcha
        texto: '<span class="cap">Extraordinary X-Men #17–20</span> · <span class="cap">All-New X-Men #17–19</span> · <span class="cap">Uncanny X-Men vol. 4 #17–19</span> — las tres cabeceras se cancelan aquí'
- id: b8
  fechas: 2017 — 2019
  titulo: ResurrXion y el umbral de Krakoa
  intro: Jean Grey vuelve, los cinco originales se van a casa, el equipo se hunde hasta su punto más bajo —y entonces Jonathan Hickman lo tira todo por la borda. El bloque termina exactamente donde empieza la era que quieres alcanzar.
  navegacion:
    anio: 2017–2019
    texto: Hasta Krakoa
  contenido:
  - tramo:
      numero: '8.1'
      titulo: ResurrXion
      cuando: Abril – julio 2017
      nota: 'Relanzamiento completo desde <em>X-Men: Prime</em> #1. Las dos cabeceras principales entran enseguida en <em>Secret Empire</em>, el evento de toda la línea Marvel de ese verano.'
      entradas:
      - serie:
          id: m1-b8-x-men-blue-1-6
          prioridad: p2
          titulo: X-Men Blue <span class="nums">#1–6</span>
          creditos: Cullen Bunn · Jorge Molina · 2017
          continuidad:
          - sigue: '▸ Los números #7–9 son el tie-in de <em>Secret Empire</em>; sigue en el tramo 8.2 desde el #10'
          descripcion:
          - 'Los cinco originales con Magneto. Es la mitad de ResurrXion que sí importa: conduce directamente a <em>Extermination</em>.'
          etiqueta:
            clase: t2
            texto: Recomendado
      - serie:
          id: m1-b8-x-men-gold-1-6
          titulo: X-Men Gold <span class="nums">#1–6</span>
          creditos: Marc Guggenheim · Ardian Syaf · 2017
          continuidad:
          - sigue: '▸ Los números #7–8 son el tie-in de <em>Secret Empire</em>; sigue en el tramo 8.2 desde el #9'
          descripcion:
          - El equipo clásico con Tormenta al mando, de vuelta en Nueva York.
          etiqueta:
            clase: opcional
            texto: Opcional
      - serie:
          id: m1-b8-all-new-wolverine-16-35
          prioridad: p2
          titulo: All-New Wolverine <span class="nums">#16–35</span>
          creditos: Tom Taylor · 2017–2018
          continuidad:
          - viene: ◂ Viene del tramo 7.2
          descripcion:
          - Cierra los 35 números de Laura sin haberse cruzado con casi nada.
          etiqueta:
            clase: t2
            texto: Recomendado
      - serie:
          id: m1-b8-el-resto-de-resurrxion
          titulo: El resto de ResurrXion
          creditos: 'Weapon X vol. 3 #1–27 · Generation X #1–9 y #85–87 · Iceman #1–11 + vol. 2 #1–5 · Jean Grey #1–11 · Cable vol. 3 #150–159 · Astonishing X-Men vol. 4 #1–17 · Old Man Logan #15–50 · Rogue &amp; Gambit #1–5 → Mr. and Mrs. X #1–12 · New Mutants: Dead Souls #1–6 · Domino #1–10 · Multiple Man #1–5'
          descripcion:
          - Cabeceras de acompañamiento, ninguna cruzada con los eventos. <em>Mr. and Mrs. X</em> y <em>Domino</em> son las más disfrutables.
          etiqueta:
            clase: opcional
            texto: Opcional
  - evento:
      id: m1-b8-secret-empire
      linea_marvel: true
      etiqueta: Evento de toda la línea Marvel · Abril – agosto 2017
      titulo: Secret Empire
      creditos: Nick Spencer · Steve McNiven, Andrea Sorrentino y otros
      descripcion:
      - Un Capitán América reescrito como agente de Hydra toma Estados Unidos y ofrece a los mutantes un territorio propio en California, Nueva Tian, gobernado por Emma Frost. Es la versión más incómoda de la idea de una nación mutante, dos años antes de Krakoa, y las dos cabeceras principales chocan con ella.
      apartados:
      - apartado: Antes de empezar
        texto: 'Contexto recomendado: <em>Captain America: Steve Rogers</em> (2016), la serie donde se revela que Steve trabaja para Hydra. Opcional: el recopilatorio <em>Road to Secret Empire</em>.'
      - apartado: Orden de lectura
        texto: '<strong>Secret Empire #0</strong> → <span class="cap">X-Men Gold #7–8</span> → <strong>Secret Empire #1</strong> → <strong>#2</strong> → <strong>#3</strong> → <strong>#4</strong> → <span class="cap">X-Men Blue #7–9</span> → Secret Empire: United #1 → <strong>Secret Empire #5</strong> → <strong>#6</strong> → <strong>#7</strong> → <strong>#8</strong> → <strong>#9</strong> → <strong>#10</strong> → Secret Empire: Omega #1'
      - apartado: Versión mínima
        texto: '<em>Secret Empire</em> #0 → <em>Gold</em> #7–8 → <em>Blue</em> #7–9 → <em>United</em> #1. Se sigue, pero el régimen de Hydra se entiende mucho mejor con el evento.'
      - apartado: Sobre United
        texto: '<em>Secret Empire: United</em> #1 es un one-shot de Jim Zub y Ario Anindito con el equipo de Emma Frost en Nueva Tian.'
  - tramo:
      numero: '8.2'
      titulo: Después del Imperio Secreto
      cuando: Septiembre 2017 – julio 2018
      nota: Las dos cabeceras retoman tras el evento y Jean Grey vuelve. Tramo largo y disperso, sin cruces salvo uno menor entre <em>Gold</em> y <em>Blue</em>.
      entradas:
      - serie:
          id: m1-b8-x-men-blue-10-28
          prioridad: p2
          titulo: X-Men Blue <span class="nums">#10–28</span>
          creditos: Cullen Bunn · Jorge Molina y otros · 2017–2018
          continuidad:
          - viene: ◂ Viene de <em>Secret Empire</em>
          - sigue: '▸ Los números #29–36 acompañan a <em>Extermination</em>'
          etiqueta:
            clase: t2
            texto: Recomendado
      - serie:
          id: m1-b8-x-men-gold-9-28
          titulo: X-Men Gold <span class="nums">#9–28</span>
          creditos: Marc Guggenheim · Ken Lashley y otros · 2017–2018
          continuidad:
          - viene: ◂ Viene de <em>Secret Empire</em>
          - sigue: '▸ Los números #29–36 acompañan a <em>Extermination</em>'
          descripcion:
          - 'Incluye «Mojo Worldwide», crossover menor con <em>Blue</em>: Gold #13 → Blue #13 → Gold #14 → Blue #14.'
          etiqueta:
            clase: opcional
            texto: Opcional
      - serie:
          id: m1-b8-phoenix-resurrection-the-return-of-jean-grey-1-5
          prioridad: p2
          titulo: 'Phoenix Resurrection: The Return of Jean Grey <span class="nums">#1–5</span>'
          creditos: Matthew Rosenberg · Leinil Francis Yu · 2017–2018
          descripcion:
          - 'Devuelve a la Jean adulta tras veinte años muerta. Requisito previo de <em>X-Men: Red</em>.'
          etiqueta:
            clase: t2
            texto: Recomendado
      - serie:
          id: m1-b8-x-men-red-1-11
          prioridad: p2
          titulo: 'X-Men: Red <span class="nums">#1–11</span>'
          creditos: Tom Taylor · Mahmud Asrar · 2018
          descripcion:
          - Jean funda una nación mutante ante la ONU. Temáticamente es el borrador previo de Krakoa y una de las mejores series del bloque.
          etiqueta:
            clase: t2
            texto: Recomendado
      - serie:
          id: m1-b8-el-regreso-de-lobezno
          titulo: El regreso de Lobezno
          creditos: 'Hunt for Wolverine #1 + 4 miniseries (Adamantium Agenda, Claws of a Killer, Mystery in Madripoor, Weapon Lost) → Return of Wolverine #1–5 · 2018'
          descripcion:
          - Paquete cerrado y autónomo. Solo hace falta si quieres seguir cómo vuelve Logan.
          etiqueta:
            clase: opcional
            texto: Opcional
  - evento:
      id: m1-b8-extermination
      etiqueta: Evento · Agosto – diciembre 2018
      titulo: Extermination
      creditos: Ed Brisson · Pepe Larraz
      descripcion:
      - Cierra por fin la trama de los cinco X-Men originales atrapados en el presente, abierta en 2012. Larraz vuelve un año después para dibujar <em>House of X</em>.
      apartados:
      - apartado: Columna principal
        texto: 'Extermination #1–5'
      - apartado: Cabeceras que acompañan y cierran
        texto: '<span class="cap">X-Men Blue #29–36</span> · <span class="cap">X-Men Gold #29–36</span> · epílogo opcional: <em>X-Men: The Exterminated</em> #1'
  - tramo:
      numero: '8.3'
      titulo: El fondo del pozo
      cuando: Noviembre 2018 – julio 2019
      nota: 'Los diez meses más sombríos de la franquicia. Se lee casi en línea recta: una sola cabecera con dos etapas seguidas.'
      entradas:
      - serie:
          id: m1-b8-uncanny-x-men-vol-5-1-10-x-men-disassembled
          prioridad: p2
          titulo: Uncanny X-Men vol. 5 <span class="nums">#1–10</span> — «X-Men Disassembled»
