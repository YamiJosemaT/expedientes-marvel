          - sigue: ▸ Sigue con «Old Man Logan» (#66–72, tramo 3.2)
          descripcion:
          - 'Lobezno ya con toda la memoria recuperada tras <em>House of M</em>. Arcos: «Origins and Endings» (Way, #36–40), «Vendetta» (Guggenheim, #42–48, tie-in de <em>Civil War</em>), «Evolution» (Loeb y Simone Bianchi, #50–55), «Logan Dies» (Guggenheim, #57–61) y «Get Mystique!» (Aaron, #62–65), el mejor de todos.'
          etiqueta:
            clase: opcional
            texto: Opcional
      - serie:
          id: m1-b2-miniseries-y-especiales-2006
          titulo: Miniseries y especiales (2006)
          creditos: 'X-Men: Phoenix – Warsong #1–5 (Greg Pak) · Uncanny X-Men Annual #1 (Chris Claremont) · Giant-Size Wolverine #1 (David Lapham) · 2006–2007'
          descripcion:
          - '<em>Warsong</em> sigue a <em>Endsong</em>: las Cucos de Stepford y su vínculo con la Fuerza Fénix. El <em>Annual</em> de Claremont va de Tormenta y África, a las puertas de su boda con Pantera Negra.'
          etiqueta:
            clase: opcional
            texto: Opcional
  - tramo:
      numero: '2.4'
      titulo: Vulcan y el Imperio Shi'ar
      cuando: 2006 – 2007
      nota: 'La cabecera principal se marcha al espacio doce números seguidos mientras el resto de la línea sigue en la Tierra. Lee la space opera entera y luego ponte al día con lo terrestre, o alterna: no se tocan.'
      entradas:
      - serie:
          id: m1-b2-uncanny-x-men-475-486
          prioridad: p1
          titulo: Uncanny X-Men <span class="nums">#475–486</span>
          creditos: Ed Brubaker · Billy Tan, Clayton Henry · «The Rise and Fall of the Shi'ar Empire» · 2006–2007
          continuidad:
          - viene: ◂ Viene del tramo 2.2
          descripcion:
          - Space opera de doce números que resuelve <em>Deadly Genesis</em>, arrasa el Imperio Shi'ar y define a Vulcan y a Rachel Summers. De lo mejor de la década.
          etiqueta:
            clase: t1
            texto: Esencial
      - serie:
          id: m1-b2-x-men-endangered-species
          prioridad: p2
          titulo: 'X-Men: Endangered Species'
          creditos: Mike Carey · one-shot + historias de complemento · 2007
          descripcion:
          - Bestia recorre el mundo buscando revertir la Decimación. Los complementos salieron repartidos por Uncanny, X-Men, X-Factor y New X-Men; hay recopilatorio único que los reúne en orden.
          etiqueta:
            clase: t2
            texto: Recomendado
      - serie:
          id: m1-b2-mientras-tanto-en-la-tierra-x-men-vol-2-200-204-new-x-men-33-43
          prioridad: p2
          titulo: 'Mientras tanto, en la Tierra <span class="nums">X-Men vol. 2 #200–204 · New X-Men #33–43</span>'
          creditos: Mike Carey / Kyle &amp; Yost · «Blinded by the Light», «Quest for Magik» · 2007
          continuidad:
          - viene: ◂ Vienen de los tramos 2.2 y 2.3
          - sigue: ▸ Ambas entregan sus tres siguientes números a <em>Messiah Complex</em>
          descripcion:
          - Las dos cabeceras terrestres quedan justo en la puerta del crossover.
          etiqueta:
            clase: t2
            texto: Recomendado
      - serie:
          id: m1-b2-uncanny-x-men-487-491
          titulo: Uncanny X-Men <span class="nums">#487–491</span>
          creditos: Ed Brubaker · 2007
          continuidad:
          - sigue: '▸ Los números #492–494 son capítulos de <em>Messiah Complex</em>'
          descripcion:
          - Vuelta a la Tierra y antesala directa del crossover.
          etiqueta:
            clase: opcional
            texto: Opcional
      - serie:
          id: m1-b2-x-men-emperor-vulcan-1-5
          titulo: 'X-Men: Emperor Vulcan <span class="nums">#1–5</span>'
          creditos: Christopher Yost · Paco Diaz · septiembre 2007 – enero 2008
          continuidad:
          - viene: '◂ Continúa «The Rise and Fall of the Shi''ar Empire» (<em>Uncanny X-Men</em> #475–486)'
          - sigue: '▸ Sigue en <em>X-Men: Kingbreaker</em> y <em>War of Kings</em> (bloque 4)'
          descripcion:
          - Vulcan, ya emperador shi'ar, contra su hermano Havok y los Starjammers. Es el puente entre la space opera de Brubaker y la guerra de 2009.
