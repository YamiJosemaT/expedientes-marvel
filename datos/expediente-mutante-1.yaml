          - Ninguno se cruza con los eventos. <em>Cable &amp; Deadpool</em> es divertidísima y completamente autónoma.
          etiqueta:
            clase: opcional
            texto: Opcional
- id: b3
  fechas: 2007 — 2008
  titulo: El complejo del Mesías
  intro: 'Nace el primer bebé mutante desde la Decimación. Cuatro facciones se lo disputan, los X-Men se disuelven y Cíclope funda un escuadrón de asesinato en secreto. El bloque más corto y más determinante: empieza directamente con el crossover que se lleva los números de las cuatro cabeceras que venías leyendo.'
  navegacion:
    anio: 2007–2008
    texto: Complejo de Mesías
  contenido:
  - evento:
      id: m1-b3-x-men-messiah-complex
      etiqueta: Crossover · 13 partes · Noviembre 2007 – enero 2008
      titulo: 'X-Men: Messiah Complex'
      creditos: Ed Brubaker, Mike Carey, Peter David, Craig Kyle &amp; Christopher Yost
      descripcion:
      - 'Cada capítulo lleva su número de parte impreso en portada. No lo leas por cabeceras: sigue el orden de abajo, que es el de publicación.'
      apartados:
      - apartado: Orden completo
        texto: 'X-Men: Messiah Complex #1 → <span class="cap">Uncanny #492</span> → <span class="cap">X-Factor #25</span> → <span class="cap">New X-Men #44</span> → <span class="cap">X-Men #205</span> → <span class="cap">Uncanny #493</span> → <span class="cap">X-Factor #26</span> → <span class="cap">New X-Men #45</span> → <span class="cap">X-Men #206</span> → <span class="cap">Uncanny #494</span> → <span class="cap">X-Factor #27</span> → <span class="cap">New X-Men #46</span> → <span class="cap">X-Men #207</span>'
      - apartado: Qué pasa con esas cabeceras al terminar
        texto: '<em>New X-Men</em> se cancela en el #46 · <em>X-Men</em> vol. 2 se convierte en <em>X-Men: Legacy</em> desde el #208 · <em>Uncanny</em> y <em>X-Factor</em> siguen con su numeración'
  - tramo:
      numero: '3.1'
      titulo: Divided We Stand
      cuando: '2008'
      nota: Los X-Men se han disuelto. Interludio breve antes de la mudanza a San Francisco.
      entradas:
      - serie:
          id: m1-b3-x-men-legacy-208-216
          prioridad: p2
          titulo: 'X-Men: Legacy <span class="nums">#208–216</span>'
          creditos: Mike Carey · Scot Eaton · 2008
          continuidad:
          - viene: ◂ Viene de <em>Messiah Complex</em>
          - sigue: ▸ Continúa en el tramo 4.1
          descripcion:
          - Xavier reconstruye su memoria repasando su propia historia. La cabecera <em>X-Men</em> vol. 2 renombrada, sin reiniciar numeración.
          etiqueta:
            clase: t2
            texto: Recomendado
      - serie:
          id: m1-b3-x-factor-vol-3-28-38
          prioridad: p2
          titulo: X-Factor vol. 3 <span class="nums">#28–38</span>
          creditos: Peter David · 2008
          continuidad:
          - viene: ◂ Viene de <em>Messiah Complex</em>
          - sigue: ▸ Continúa en el tramo 4.1
          descripcion:
          - Sigue su camino al margen del resto de la línea, como casi siempre.
          etiqueta:
            clase: t2
            texto: Recomendado
      - serie:
          id: m1-b3-uncanny-x-men-495-499-young-x-men-1-12
          titulo: Uncanny X-Men <span class="nums">#495–499</span> · Young X-Men <span class="nums">#1–12</span>
          creditos: Ed Brubaker / Marc Guggenheim · 2008
          continuidad:
          - viene: ◂ Uncanny viene de <em>Messiah Complex</em>
          - sigue: '▸ Uncanny continúa en el tramo 4.1 desde el #500'
          descripcion:
          - El interludio y el epílogo de los alumnos. <em>Young X-Men</em> es floja pero cierra ese hilo.
          etiqueta:
            clase: opcional
            texto: Opcional
  - tramo:
      numero: '3.2'
      titulo: Las dos ramas del bebé
      cuando: 2008 – principios de 2009
      nota: Cable huye al futuro con la niña; Cíclope monta un escuadrón para recuperarla. Las dos series corren en paralelo y convergen en <em>Messiah War</em>, ya en el bloque 4.
      entradas:
      - serie:
          id: m1-b3-x-force-vol-3-1-13
          prioridad: p1
          titulo: X-Force vol. 3 <span class="nums">#1–13</span>
          creditos: Craig Kyle &amp; Christopher Yost · Clayton Crain, Mike Choi · 2008–2009
          continuidad:
          - sigue: '▸ Los números #14–16 son capítulos de <em>Messiah War</em>'
          descripcion:
          - 'El escuadrón negro de Cíclope: Lobezno, X-23, Warpath, Wolfsbane. «Angels and Demons» y «Old Ghosts».'
          etiqueta:
            clase: t1
            texto: Esencial
      - serie:
          id: m1-b3-cable-vol-2-1-12
          prioridad: p2
          titulo: Cable vol. 2 <span class="nums">#1–12</span>
          creditos: Duane Swierczynski · Ariel Olivetti · 2008–2009
          continuidad:
          - sigue: '▸ Los números #13–15 son capítulos de <em>Messiah War</em>'
          descripcion:
          - 'La mitad B de <em>X-Force</em>: la fuga hacia adelante en el tiempo, saltando décadas.'
          etiqueta:
            clase: t2
            texto: Recomendado
      - serie:
          id: m1-b3-wolverine-66-72-old-man-logan
          prioridad: p4
          titulo: Wolverine <span class="nums">#66–72</span> — «Old Man Logan»
          creditos: Mark Millar · Steve McNiven · 2008
          descripcion:
          - Futuro alterno famosísimo, sin ningún impacto en la continuidad… hasta que el personaje cruza a la principal en el bloque 7.
          etiqueta:
            clase: t4
            texto: Alterna
- id: b4
  fechas: 2008 — 2011
  titulo: San Francisco, Utopía y la Segunda Venida
  intro: 'Cíclope traslada a la especie entera a California y luego a una isla artificial frente a la costa. Los X-Men dejan de ser una escuela y se convierten en un estado mutante armado: el ensayo general de lo que Krakoa será una década después. Es el bloque con más crossovers de toda la guía —cinco— y el que peor funciona si vas cabecera por cabecera.'
  navegacion:
    anio: 2008–2011
    texto: Utopía
  contenido:
  - tramo:
      numero: '4.1'
      titulo: Mudanza a San Francisco
      cuando: 2008 – principios de 2009
      entradas:
      - serie:
          id: m1-b4-uncanny-x-men-500-512
          prioridad: p2
          titulo: Uncanny X-Men <span class="nums">#500–512</span>
          creditos: Matt Fraction &amp; Ed Brubaker · Greg Land, Terry Dodson · «Manifest Destiny», «Sisterhood» · 2008–2009
          continuidad:
          - viene: ◂ Viene del tramo 3.1
          - sigue: '▸ Los números #513–514 son capítulos de <em>Utopía</em>'
          descripcion:
          - La cabecera principal del bloque instala a los mutantes en San Francisco.
          etiqueta:
            clase: t2
            texto: Recomendado
      - serie:
          id: m1-b4-x-men-legacy-217-230
          prioridad: p2
          titulo: 'X-Men: Legacy <span class="nums">#217–230</span>'
          creditos: Mike Carey · 2009
          continuidad:
          - viene: ◂ Viene del tramo 3.1
          - sigue: '▸ Los números #231–234 son capítulos de <em>Necrosha</em>'
          descripcion:
          - Xavier busca a Rogue y a Gambit; la serie empieza a girar hacia Rogue como protagonista fija.
          etiqueta:
            clase: t2
            texto: Recomendado
      - evento:
          id: m1-b4-secret-invasion
          linea_marvel: true
          etiqueta: Evento de toda la línea Marvel · Abril 2008 – enero 2009
          titulo: Secret Invasion
          creditos: Brian Michael Bendis · Leinil Francis Yu (serie principal) · tie-in mutante de Mike Carey y Cary Nord
          descripcion:
          - Los Skrull llevan años infiltrados entre los héroes y lanzan la invasión. Una de sus columnas ocupa San Francisco, recién convertida en el hogar de los X-Men, que montan una guerrilla para recuperarla.
          apartados:
          - apartado: Antes de empezar
            texto: 'Opcional: <em>New Avengers: Illuminati</em> #1–4, de donde sale la infiltración, y el one-shot <em>Secret Invasion Prologue</em> #1.'
          - apartado: Orden de lectura
            texto: 'Secret Invasion Prologue #1 → <strong>Secret Invasion #1</strong> → <strong>#2</strong> → <strong>#3</strong> → <strong>#4</strong> → <span class="cap">Secret Invasion: X-Men #1–4</span> → <strong>Secret Invasion #5</strong> → <strong>#6</strong> → <strong>#7</strong> → <strong>#8</strong>'
          - apartado: Versión mínima
            texto: '<em>Secret Invasion: X-Men</em> #1–4 se entiende solo, pero llega mucho mejor después de <em>Secret Invasion</em> #1–4.'
          - apartado: Después
            texto: El final del evento abre <em>Dark Reign</em>, que desemboca en <em>Utopía</em> (tramo 4.3).
      - serie:
          id: m1-b4-x-factor-vol-3-39-50-x-factor-200-227
          prioridad: p2
          titulo: X-Factor vol. 3 <span class="nums">#39–50</span> → X-Factor <span class="nums">#200–227</span>
          creditos: Peter David · Valentine De Landro, Sebastián Fiumara · 2009–2011
          continuidad:
          - viene: ◂ Viene del tramo 3.1
          - sigue: '▸ Continúa en el tramo 5.1 desde el #228'
          descripcion:
          - 'Tres años de la serie que no cruzan con ningún evento: repártelos a tu ritmo a lo largo de todo el bloque. Tras el #50 la cabecera <strong>recupera la numeración del volumen 1 y salta al #200</strong> (diciembre de 2009), sin que falte nada entre medias.'
          etiqueta:
            clase: t2
            texto: Recomendado
      - serie:
          id: m1-b4-x-men-manifest-destiny-1-5-x-infernus-1-4-astonishing-x-men-25-35
          titulo: 'X-Men: Manifest Destiny <span class="nums">#1–5</span> · X-Infernus <span class="nums">#1–4</span> · Astonishing X-Men <span class="nums">#25–35</span>'
          creditos: Varios / C.B. Cebulski / Warren Ellis · 2008–2009
          descripcion:
          - Complementos de la mudanza y el regreso de Magik. La etapa Ellis de <em>Astonishing</em> sigue fuera de todo crossover, igual que la de Whedon.
          etiqueta:
            clase: opcional
            texto: Opcional
  - evento:
      id: m1-b4-messiah-war
      etiqueta: Crossover · 7 partes · 2009
      titulo: Messiah War
      creditos: Craig Kyle, Christopher Yost &amp; Duane Swierczynski · Clayton Crain
      descripcion:
      - X-Force salta al futuro y encuentra a Cable y a la niña. Cierra el paréntesis abierto en el tramo 3.2.
      apartados:
      - apartado: Orden completo
        texto: 'X-Force/Cable: Messiah War #1 → <span class="cap">Cable #13</span> → <span class="cap">X-Force #14</span> → <span class="cap">Cable #14</span> → <span class="cap">X-Force #15</span> → <span class="cap">Cable #15</span> → <span class="cap">X-Force #16</span>'
  - tramo:
      numero: '4.2'
      titulo: Entre guerras
      cuando: Mediados de 2009
      entradas:
      - serie:
          id: m1-b4-x-force-vol-3-17-20-cable-vol-2-16-20-new-mutants-vol-3-1-5
          prioridad: p2
          titulo: X-Force vol. 3 <span class="nums">#17–20</span> · Cable vol. 2 <span class="nums">#16–20</span> · New Mutants vol. 3 <span class="nums">#1–5</span>
          creditos: Kyle &amp; Yost / Swierczynski / Zeb Wells · 2009
          continuidad:
          - viene: ◂ X-Force y Cable vienen de <em>Messiah War</em>
          - sigue: '▸ X-Force #21–25 y New Mutants #6–8 son capítulos de <em>Necrosha</em>'
          descripcion:
          - Arranca <em>New Mutants</em> vol. 3 con el equipo original ya adulto.
          etiqueta:
            clase: t2
            texto: Recomendado
  - evento:
      id: m1-b4-utopia
      etiqueta: Crossover · 2009
      titulo: Utopía
      creditos: Matt Fraction · Marc Silvestri, Terry Dodson, Luke Ross
      descripcion:
      - Norman Osborn monta sus propios X-Men y los mutantes responden declarándose independientes en una isla frente a San Francisco. Cruza con la línea <em>Dark Reign</em> de los Vengadores; los dos números de <em>Dark Avengers</em> hacen falta para no perder el hilo.
      apartados:
      - apartado: Orden completo
        texto: 'Dark Avengers/Uncanny X-Men: Utopia #1 → <span class="cap">Uncanny #513</span> → Dark Avengers #7 → <span class="cap">Uncanny #514</span> → Dark Avengers #8 → Dark Avengers/Uncanny X-Men: Exodus #1'
      - apartado: Epílogos (opcionales)
        texto: 'Dark X-Men: The Beginning #1–3 · Dark X-Men #1–5 · X-Men: Nation X #1–4'
  - tramo:
      numero: '4.3'
      titulo: Nación X
      cuando: Finales de 2009
      entradas:
      - serie:
          id: m1-b4-uncanny-x-men-515-522
          prioridad: p2
          titulo: Uncanny X-Men <span class="nums">#515–522</span>
          creditos: Matt Fraction · Greg Land, Whilce Portacio · «Nation X» · 2009–2010
          continuidad:
          - viene: ◂ Viene de <em>Utopía</em>
          - sigue: '▸ Los números #523–525 son capítulos de <em>Second Coming</em>'
          descripcion:
          - La vida cotidiana en la isla recién fundada.
          etiqueta:
            clase: t2
            texto: Recomendado
  - evento:
      id: m1-b4-necrosha
      etiqueta: Crossover · 2009 – 2010
      titulo: Necrosha
      creditos: Craig Kyle, Christopher Yost, Zeb Wells, Mike Carey · Clayton Crain
      descripcion:
      - Selene resucita a todos los mutantes muertos de Genosha. Prescindible para la trama general, pero se lleva números de tres series que sí estás leyendo, así que conviene colocarlo aquí aunque decidas saltártelo.
      apartados:
      - apartado: Orden
        texto: 'X Necrosha #1 → <span class="cap">X-Force #21</span> → <span class="cap">New Mutants #6</span> → <span class="cap">Legacy #231</span> → <span class="cap">X-Force #22</span> → <span class="cap">New Mutants #7</span> → <span class="cap">Legacy #232</span> → <span class="cap">X-Force #23</span> → <span class="cap">New Mutants #8</span> → <span class="cap">Legacy #233</span> → <span class="cap">X-Force #24</span> → <span class="cap">Legacy #234</span> → <span class="cap">X-Force #25</span>'
  - tramo:
      numero: '4.4'
      titulo: Antes del asalto
      cuando: Principios de 2010
      entradas:
      - serie:
          id: m1-b4-new-mutants-vol-3-9-11-cable-vol-2-21-25
          prioridad: p2
          titulo: New Mutants vol. 3 <span class="nums">#9–11</span> · Cable vol. 2 <span class="nums">#21–25</span>
          creditos: Zeb Wells / Duane Swierczynski · 2010
          continuidad:
          - viene: ◂ New Mutants viene de <em>Necrosha</em>
          - sigue: '▸ New Mutants #12–14 son capítulos de <em>Second Coming</em>'
          descripcion:
          - 'Hope y Cable vuelven al presente. Último respiro antes del gran evento del bloque. <em>Cable</em> #25 es el último número de la serie y se recopila junto al evento: léelo justo antes de <em>Second Coming</em> #1.'
          etiqueta:
            clase: t2
            texto: Recomendado
  - evento:
      id: m1-b4-second-coming
      etiqueta: Evento · 14 partes · 2010
      titulo: Second Coming
      creditos: Craig Kyle, Christopher Yost, Zeb Wells, Matt Fraction, Mike Carey
      descripcion:
      - Hope vuelve adulta y Bastion lanza el asalto final contra Utopía. Cierra la trilogía abierta en <em>Messiah Complex</em>, mata a personajes de peso y da paso a los primeros mutantes nuevos desde la Decimación.
      apartados:
      - apartado: Orden completo
        texto: 'X-Men: Second Coming #1 → <span class="cap">Uncanny #523</span> → <span class="cap">New Mutants #12</span> → <span class="cap">Legacy #235</span> → <span class="cap">X-Force #26</span> → <span class="cap">Uncanny #524</span> → <span class="cap">New Mutants #13</span> → <span class="cap">Legacy #236</span> → <span class="cap">X-Force #27</span> → <span class="cap">Uncanny #525</span> → <span class="cap">New Mutants #14</span> → <span class="cap">Legacy #237</span> → <span class="cap">X-Force #28</span> → X-Men: Second Coming #2'
      - apartado: Qué termina aquí
        texto: '<em>X-Force</em> vol. 3 cierra en el #28 · <em>Cable</em> vol. 2 cierra en el #25 · complementos opcionales: <em>Second Coming: Prepare</em>, <em>Revelations: Hellbound</em> #1–3 y <em>Blind Science</em> #1'
  - tramo:
      numero: '4.5'
      titulo: Después de la Segunda Venida
      cuando: 2010 – principios de 2011
      nota: 'Nacen cinco mutantes nuevos y arranca la mejor serie de todo el periodo. Tramo largo y tranquilo: aprovecha para ponerte al día con las cabeceras satélite.'
      entradas:
      - serie:
          id: m1-b4-uncanny-x-force-vol-1-1-19
          prioridad: p1
          titulo: Uncanny X-Force vol. 1 <span class="nums">#1–19</span>
          creditos: Rick Remender · Jerome Opeña, Esad Ribić · 2010–2011
          continuidad:
          - sigue: '▸ Continúa en el tramo 5.1 con el #19.1, el puente hacia la serie <em>Age of Apocalypse</em> (2012)'
          descripcion:
          - 'Cumbre absoluta del periodo: «The Apocalypse Solution» y «The Dark Angel Saga» (#11–18), que viaja a la realidad de la Era de Apocalipsis. <strong>Ningún crossover la corta en sus 35 números</strong>, así que puedes leerla de un tirón si lo prefieres.'
          etiqueta:
            clase: t1
            texto: Esencial
      - serie:
          id: m1-b4-uncanny-x-men-526-534
          prioridad: p2
          titulo: Uncanny X-Men <span class="nums">#526–534</span>
          creditos: Matt Fraction, Kieron Gillen · «The Five Lights», «Quarantine», «Breaking Point» · 2010–2011
          continuidad:
          - viene: ◂ Viene de <em>Second Coming</em>
          descripcion:
          - 'El #526 es el epílogo de <em>Second Coming</em> y la aparición de los cinco primeros mutantes nuevos desde la Decimación.'
          etiqueta:
            clase: t2
            texto: Recomendado
      - evento:
          id: m1-b4-chaos-war
          linea_marvel: true
          etiqueta: Evento de toda la línea Marvel · Diciembre 2010 – marzo 2011
          titulo: Chaos War
          creditos: Greg Pak &amp; Fred Van Lente · Khoi Pham (serie principal) · tie-in mutante de Chris Claremont y Louise Simonson, con Doug Braithwaite
          descripcion:
          - El Rey del Caos amenaza con borrar toda la existencia y Hércules lidera la resistencia. En el tie-in mutante, varios X-Men muertos vuelven a la Tierra a buscar un diario profético con la clave para derrotarlo, y algunos pagan el precio.
          apartados:
          - apartado: Antes de empezar
            texto: 'Nada imprescindible. El evento continúa la etapa de Pak y Van Lente en <em>Incredible Hercules</em>, que es contexto opcional, y lo abre el one-shot <em>Chaos War: Chaos King</em> #1.'
          - apartado: Orden de lectura
            texto: 'Chaos War: Chaos King #1 → <strong>Chaos War #1</strong> → <strong>#2</strong> → <strong>#3</strong> → <strong>#4</strong> → <span class="cap">Chaos War: X-Men #1</span> → <span class="cap">Chaos War: X-Men #2</span> → <strong>Chaos War #5</strong>'
          - apartado: Versión mínima
            texto: '<em>Chaos War</em> #1–4 y después <em>Chaos War: X-Men</em> #1–2. El tie-in se puede leer suelto, pero sin el evento no sabes quién es el Rey del Caos.'
          - apartado: Prescindible
            texto: 'Los one-shots de otros frentes (<em>Ares</em>, <em>God Squad</em>, <em>Alpha Flight</em>, <em>Thor</em>, <em>Dead Avengers</em>) e <em>Incredible Hulks</em> #618–620.'
          - apartado: Dónde va en tu lectura
            texto: 'Entre los arcos «Quarantine» y «Breaking Point» de <em>Uncanny X-Men</em> (ficha anterior): léelo al terminar «Quarantine».'
      - serie:
          id: m1-b4-x-men-legacy-238-244-new-mutants-vol-3-15-21
          prioridad: p2
          titulo: 'X-Men: Legacy <span class="nums">#238–244</span> · New Mutants vol. 3 <span class="nums">#15–21</span>'
          creditos: Mike Carey / Zeb Wells, Dan Abnett &amp; Andy Lanning · 2010–2011
          continuidad:
          - viene: ◂ Ambas vienen de <em>Second Coming</em>
          - sigue: '▸ Legacy #245–247 y New Mutants #22–24 son capítulos de <em>Age of X</em>'
          etiqueta:
            clase: t2
            texto: Recomendado
      - serie:
          id: m1-b4-x-23-vol-3-1-16
          prioridad: p2
          titulo: X-23 vol. 3 <span class="nums">#1–16</span>
          creditos: Marjorie Liu · Will Conrad · 2010–2011
          descripcion:
          - Laura fuera de X-Force. Serie de personaje muy bien construida y sin cruces con nada.
          etiqueta:
            clase: t2
            texto: Recomendado
      - serie:
          id: m1-b4-generation-hope-1-9-x-men-vol-3-1-15-wolverine-vol-4-1-16-astonishing
          titulo: Generation Hope <span class="nums">#1–9</span> · X-Men vol. 3 <span class="nums">#1–15</span> · Wolverine vol. 4 <span class="nums">#1–16</span> · Astonishing X-Men <span class="nums">#36–47</span>
          creditos: Kieron Gillen / Victor Gischler / Jason Aaron / varios · 2010–2011
          continuidad:
          - sigue: '▸ Generation Hope #10–11 son tie-in de <em>Schism</em>'
          - sigue: ▸ X-Men vol. 3 y Wolverine continúan en el tramo 4.6
          descripcion:
          - <em>Generation Hope</em> sigue a las Cinco Luces; <em>X-Men</em> vol. 3 abre con vampiros («Curse of the Mutants»); <em>Wolverine</em> con «Wolverine Goes to Hell».
          etiqueta:
            clase: opcional
            texto: Opcional
  - evento:
      id: m1-b4-age-of-x
      etiqueta: Crossover · 2011
      titulo: Age of X
      creditos: Mike Carey · Clay Mann
      descripcion:
      - Realidad alternativa creada sin querer por Legión. Autoconclusiva y saltable, pero se lleva seis números de dos series en marcha.
      apartados:
      - apartado: Orden
        texto: 'Age of X: Alpha #1 → <span class="cap">Legacy #245</span> → <span class="cap">New Mutants #22</span> → <span class="cap">Legacy #246</span> → <span class="cap">New Mutants #23</span> → <span class="cap">Legacy #247</span> → <span class="cap">New Mutants #24</span> → Age of X: Universe #1–2'
  - tramo:
      numero: '4.6'
      titulo: Cuenta atrás para la ruptura
      cuando: '2011'
      entradas:
      - serie:
          id: m1-b4-uncanny-x-men-535-539
          prioridad: p2
          titulo: Uncanny X-Men <span class="nums">#535–539</span>
          creditos: Kieron Gillen · Greg Land, Carlos Pacheco · 2011
          continuidad:
          - sigue: '▸ Los #540–543 son el tie-in de <em>Fear Itself</em> (ficha siguiente)'
          - sigue: '▸ El #544 va después de <em>Schism</em>; la cabecera reinicia como vol. 2 en el tramo 5.1'
          descripcion:
          - 'La recta final de la numeración clásica, que se cierra en el #544 tras 48 años.'
          etiqueta:
            clase: t2
            texto: Recomendado
      - evento:
          id: m1-b4-fear-itself
          linea_marvel: true
          etiqueta: Evento de toda la línea Marvel · Abril – octubre 2011
          titulo: Fear Itself
          creditos: Matt Fraction · Stuart Immonen (serie principal) · tie-in mutante de Kieron Gillen
          descripcion:
          - 'La Serpiente, dios asgardiano del miedo, reparte martillos que convierten a varios personajes en sus heraldos. Uno es Juggernaut, que marcha sobre San Francisco, y cuatro números de <em>Uncanny X-Men</em> cuentan esa batalla. <strong>Son números de la serie principal</strong>: esta parte no es opcional.'
          apartados:
          - apartado: Antes de empezar
            texto: Los números anteriores de <em>Uncanny X-Men</em>, hasta el 539 (ficha anterior).
          - apartado: Orden de lectura
            texto: '<strong>Fear Itself #1</strong> → <strong>#2</strong> → <strong>#3</strong> → <strong>#4</strong> → <strong>#5</strong> → <span class="cap">Uncanny X-Men #540–543</span> → <strong>Fear Itself #6</strong> → <strong>#7</strong>'
          - apartado: Versión mínima
            texto: '<em>Uncanny X-Men</em> #540–543 seguidos: se entienden sin el evento.'
          - apartado: Opcional
            texto: '<em>Fear Itself: Uncanny X-Force</em> #1–3, <em>Fear Itself: Wolverine</em> #1–3 y un arco de <em>New Mutants</em> con Moonstar y Hela, dentro del evento.'
          - apartado: Después
            texto: El último número de <em>Uncanny X-Men</em>, el 544, va después de <em>Schism</em>.
      - serie:
          id: m1-b4-x-men-legacy-248-260-new-mutants-vol-3-25-33-x-23-17-21-x-men-vol-3-16
          prioridad: p2
          titulo: 'X-Men: Legacy <span class="nums">#248–260</span> · New Mutants vol. 3 <span class="nums">#25–33</span> · X-23 <span class="nums">#17–21</span> · X-Men vol. 3 <span class="nums">#16–20</span> · Wolverine vol. 4 <span class="nums">#17–20</span>'
          creditos: Mike Carey / Abnett &amp; Lanning / Marjorie Liu / Victor Gischler / Jason Aaron · 2011
          continuidad:
          - viene: ◂ Legacy y New Mutants vienen de <em>Age of X</em>
          - sigue: '▸ Wolverine sigue en 2012 con numeración clásica: #300–317'
          descripcion:
          - Carey cierra aquí cuatro años muy consistentes al frente de <em>Legacy</em>.
          etiqueta:
            clase: t2
            texto: Recomendado
  - evento:
      id: m1-b4-x-men-schism
      etiqueta: Evento · 2011 · Cierre del bloque
      titulo: 'X-Men: Schism'
      creditos: Jason Aaron · Carlos Pacheco, Frank Cho, Adam Kubert
      descripcion:
      - Cíclope y Lobezno rompen por el uso de menores en combate. La especie se parte en dos bandos y así seguirá hasta 2016.
      apartados:
      - apartado: Orden
        texto: 'X-Men: Schism #1–5 → X-Men: Regenesis #1 (reparto de bandos)'
      - apartado: Tie-in
        texto: '<span class="cap">Generation Hope #10–11</span>'
      - apartado: Epílogo
        texto: '<span class="cap">Uncanny X-Men #544</span>, el último número de la numeración clásica tras 48 años, se lee después de <em>Schism</em>.'
- id: b5
  fechas: 2011 — 2012
  titulo: Regénesis y Vengadores vs. X-Men
  intro: 'Dos escuelas, dos filosofías: Lobezno reabre el Instituto en Westchester, Cíclope se queda en Utopía con un equipo de ataque. La tensión revienta cuando la Fuerza Fénix vuelve a la Tierra. Aquí está el caso más claro de por qué no conviene leer por cabeceras: las dos series principales entregan diez números cada una al evento, y una de ellas ni siquiera sobrevive.'
  navegacion:
    anio: 2011–2012
    texto: Regénesis y AvX
  contenido:
  - tramo:
      numero: '5.1'
      titulo: Dos escuelas
      cuando: Octubre 2011 – marzo 2012
      nota: 'Los dos bandos, contados desde dentro. Léelas alternando: son el mismo conflicto visto desde los dos lados.'
      entradas:
      - serie:
          id: m1-b5-wolverine-and-the-x-men-1-8
          prioridad: p2
          titulo: Wolverine and the X-Men <span class="nums">#1–8</span>
          creditos: Jason Aaron · Chris Bachalo, Nick Bradshaw · 2011–2012
          continuidad:
          - sigue: '▸ Los números #9–18 son capítulos de <em>Avengers vs. X-Men</em>'
          descripcion:
          - La Escuela Jean Grey. Divertida, gamberra y con el mejor elenco juvenil de la década.
          etiqueta:
            clase: t2
            texto: Recomendado
      - serie:
          id: m1-b5-uncanny-x-men-vol-2-1-10
          prioridad: p2
          titulo: Uncanny X-Men vol. 2 <span class="nums">#1–10</span>
          creditos: Kieron Gillen · Carlos Pacheco, Greg Land · «Everything is Sinister», «Tabula Rasa» · 2011–2012
          continuidad:
          - viene: '◂ Viene del tramo 4.6, reiniciada desde el #1'
          - sigue: '▸ Los números #11–20 son capítulos de <em>AvX</em>, y la serie termina ahí dentro'
          descripcion:
          - 'El «Escuadrón Extinción» de Cíclope: el punto de vista contrario al de Aaron.'
          etiqueta:
            clase: t2
            texto: Recomendado
      - serie:
          id: m1-b5-uncanny-x-force-vol-1-19-1-20-30
          prioridad: p1
          titulo: 'Uncanny X-Force vol. 1 <span class="nums">#19.1 → #20–30</span>'
          creditos: Rick Remender · 2012
          continuidad:
          - viene: ◂ Viene del tramo 4.5
          - sigue: '▸ Continúa en el tramo 5.2 hasta el #35'
          descripcion:
          - 'El #19.1 cuenta qué es de los personajes de la Era de Apocalipsis que ayudaron a X-Force en la Dark Angel Saga, y abre la serie de esa realidad (ficha siguiente). Después la serie sigue su propio camino, al margen del reparto de bandos y de AvX.'
          etiqueta:
            clase: t1
            texto: Esencial
      - serie:
          id: m1-b5-age-of-apocalypse-2012-1-12
          prioridad: p4
          titulo: Age of Apocalypse (2012) <span class="nums">#1–12</span>
          creditos: David Lapham · Roberto De La Torre · marzo 2012 – 2013
          continuidad:
          - viene: '◂ Viene de <em>Uncanny X-Force</em> #19.1'
          - sigue: '▸ Los números #13–14 son capítulos de <em>X-Termination</em> (bloque 6)'
          descripcion:
          - 'Continuación directa de <em>Uncanny X-Force</em> #19.1, ambientada por completo en la realidad de la Era de Apocalipsis. No toca el universo principal hasta su final, así que puedes leerla a tu ritmo entre este tramo y el bloque 6: lo único importante es llegar a su #12 antes de empezar <em>X-Termination</em>.'
          etiqueta:
            clase: t4
            texto: Alterna
      - serie:
          id: m1-b5-x-men-legacy-261-265-new-mutants-vol-3-34-42-x-men-vol-3-21-30-x-facto
          titulo: 'X-Men: Legacy <span class="nums">#261–265</span> · New Mutants vol. 3 <span class="nums">#34–42</span> · X-Men vol. 3 <span class="nums">#21–30</span> · X-Factor <span class="nums">#228–233</span> · Generation Hope <span class="nums">#12–17</span>'
          creditos: Christos Gage / Abnett &amp; Lanning / varios / Peter David · 2011–2012
          continuidad:
          - sigue: '▸ Legacy #266–270 son capítulos de <em>AvX</em>'
          descripcion:
          - 'Las cabeceras satélite del reparto de bandos. <em>Generation Hope</em> cierra en el #17, justo cuando arranca AvX.'
          etiqueta:
            clase: opcional
            texto: Opcional
  - evento:
      id: m1-b5-avengers-vs-x-men
      etiqueta: Evento · Abril – diciembre 2012
      titulo: Avengers vs. X-Men
      creditos: Bendis, Aaron, Brubaker, Fraction, Hickman · John Romita Jr., Olivier Coipel, Adam Kubert
      descripcion:
      - 'Cinco mutantes reciben el poder del Fénix. El resultado reconfigura la línea entera y deja a Cíclope como criminal. Los tie-ins de las dos cabeceras mutantes son de lectura muy recomendable: cuentan el evento desde la escuela y desde Utopía.'
      apartados:
      - apartado: Columna principal
        texto: 'AvX #0 → AvX #1–12 → AvX: Consequences #1–5'
      - apartado: Capítulos que salen de tus series en marcha
        texto: '<span class="cap">Wolverine and the X-Men #9–18</span> · <span class="cap">Uncanny X-Men vol. 2 #11–20</span> · <span class="cap">X-Men: Legacy #266–270</span>'
      - apartado: Tie-ins ajenos a la línea mutante (opcionales)
        texto: 'New Avengers #24–30 · Avengers #25–30 · Secret Avengers #26–28 · AvX: VS #1–6 (solo peleas, no aporta trama)'
      - apartado: Qué termina aquí
        texto: '<em>Uncanny X-Men</em> vol. 2 cierra en el #20, dentro del evento'
  - tramo:
      numero: '5.2'
      titulo: Las consecuencias
      cuando: Finales de 2012
      nota: 'Cierre en cadena: cuatro cabeceras largas terminan aquí para dejar sitio al relanzamiento de Marvel NOW!.'
      entradas:
      - serie:
          id: m1-b5-wolverine-and-the-x-men-19-24
          prioridad: p2
          titulo: Wolverine and the X-Men <span class="nums">#19–24</span>
          creditos: Jason Aaron · 2012
          continuidad:
          - viene: ◂ Viene de <em>AvX</em>
          - sigue: ▸ Continúa en el tramo 6.1
          etiqueta:
            clase: t2
            texto: Recomendado
      - serie:
          id: m1-b5-uncanny-x-force-31-35
          prioridad: p1
          titulo: Uncanny X-Force <span class="nums">#31–35</span>
          creditos: Rick Remender · 2012
          continuidad:
          - viene: ◂ Viene del tramo 5.1
          descripcion:
          - Cierre de la etapa Remender, la mejor serie mutante de estos años.
          etiqueta:
            clase: t1
            texto: Esencial
      - serie:
          id: m1-b5-x-men-legacy-271-275-new-mutants-vol-3-43-50-x-men-vol-3-31-41-x-facto
          titulo: 'X-Men: Legacy <span class="nums">#271–275</span> · New Mutants vol. 3 <span class="nums">#43–50</span> · X-Men vol. 3 <span class="nums">#31–41</span> · X-Factor <span class="nums">#234–245</span> · Astonishing X-Men <span class="nums">#48–56</span> · X-Treme X-Men vol. 2 <span class="nums">#1–11</span>'
          creditos: Varios · 2012
          continuidad:
          - viene: ◂ Legacy viene de <em>AvX</em>
          - sigue: '▸ X-Treme X-Men #12–13 y Astonishing X-Men #59–61 son capítulos de <em>X-Termination</em> (bloque 6)'
          descripcion:
          - 'Todas cierran salvo <em>X-Factor</em>, que aguanta hasta el #262.'
          etiqueta:
            clase: opcional
            texto: Opcional
- id: b6
  fechas: 2012 — 2015
  titulo: Marvel NOW! y los cinco originales
  intro: 'Bestia trae del pasado a los cinco X-Men adolescentes originales para que vean en qué se ha convertido Cíclope. Se quedan atrapados en el presente y ahí siguen hasta 2018: es la trama que estructura este bloque y el siguiente.'
  navegacion:
    anio: 2012–2015
    texto: Marvel NOW!
  contenido:
  - tramo:
      numero: '6.1'
      titulo: Los cinco originales llegan
      cuando: Noviembre 2012 – agosto 2013
      nota: Cuatro cabeceras que van a converger en <em>Battle of the Atom</em>. Conviene llevarlas más o menos a la par para llegar al crossover con las cuatro al día.
      entradas:
      - serie:
          id: m1-b6-all-new-x-men-1-15
          prioridad: p1
          titulo: All-New X-Men <span class="nums">#1–15</span>
          creditos: Brian Michael Bendis · Stuart Immonen · 2012–2013
          continuidad:
          - sigue: '▸ Los números #16–17 son capítulos de <em>Battle of the Atom</em>'
          descripcion:
          - Columna vertebral del bloque y de la ruta corta.
          etiqueta:
            clase: t1
            texto: Esencial
      - serie:
          id: m1-b6-uncanny-x-men-vol-3-1-11
          prioridad: p2
          titulo: Uncanny X-Men vol. 3 <span class="nums">#1–11</span>
          creditos: Brian Michael Bendis · Chris Bachalo, Frazer Irving · 2013
          continuidad:
          - sigue: '▸ Los números #12–13 son capítulos de <em>Battle of the Atom</em>'
          descripcion:
          - Cíclope como revolucionario fugitivo entrenando mutantes nuevos. Se lee alternando con <em>All-New X-Men</em>.
          etiqueta:
            clase: t2
            texto: Recomendado
      - serie:
          id: m1-b6-wolverine-and-the-x-men-25-35
          prioridad: p2
          titulo: Wolverine and the X-Men <span class="nums">#25–35</span>
          creditos: Jason Aaron · Nick Bradshaw · incluye «Hellfire Saga» (#33–35) · 2013
          continuidad:
          - viene: ◂ Viene del tramo 5.2
          - sigue: '▸ Los números #36–37 son capítulos de <em>Battle of the Atom</em>'
          etiqueta:
            clase: t2
            texto: Recomendado
      - serie:
          id: m1-b6-x-men-vol-4-1-4
          titulo: X-Men vol. 4 <span class="nums">#1–4</span>
          creditos: Brian Wood · Olivier Coipel · equipo íntegramente femenino · 2013
          continuidad:
          - sigue: '▸ Los números #5–6 son capítulos de <em>Battle of the Atom</em>'
          etiqueta:
            clase: opcional
            texto: Opcional
      - serie:
          id: m1-b6-x-men-legacy-vol-2-1-12
          prioridad: p2
          titulo: 'X-Men: Legacy vol. 2 <span class="nums">#1–12</span>'
          creditos: Simon Spurrier · Tan Eng Huat · 2012–2013
          descripcion:
          - 'Legión, el hijo de Xavier, contra su propia mente. Rareza brillante y completamente autoconclusiva: no la corta ningún crossover. La joya escondida de la década.'
          etiqueta:
            clase: t2
            texto: Recomendado
      - serie:
          id: m1-b6-cable-and-x-force-1-10-uncanny-x-force-vol-2-1-10-x-factor-246-262-ast
          titulo: Cable and X-Force <span class="nums">#1–10</span> · Uncanny X-Force vol. 2 <span class="nums">#1–10</span> · X-Factor <span class="nums">#246–262</span> · Astonishing X-Men <span class="nums">#57–58</span> · Wolverine vol. 5 <span class="nums">#1–13</span>
          creditos: Dennis Hopeless / Sam Humphries / Peter David / varios / Paul Cornell · 2012–2013
          continuidad:
          - sigue: '▸ Astonishing X-Men #59–61 son de <em>X-Termination</em>; sigue en el tramo 6.2 desde el #62'
          descripcion:
          - 'Satélites del relanzamiento. <em>X-Factor</em> cierra en el #262 los siete años de Peter David.'
          etiqueta:
            clase: opcional
            texto: Opcional
      - evento:
          id: m1-b6-age-of-ultron
          linea_marvel: true
          etiqueta: Evento de toda la línea Marvel · Marzo – junio 2013
          titulo: Age of Ultron
          creditos: Brian Michael Bendis · Bryan Hitch, Brandon Peterson, Carlos Pacheco
          descripcion:
          - Ultrón ha conquistado la Tierra y Lobezno viaja en el tiempo para impedirlo, con consecuencias para el propio tejido temporal. Lobezno es el protagonista, pero el evento no tiene tie-ins en las series mutantes.
          apartados:
          - apartado: Antes de empezar
            texto: Nada.
          - apartado: Orden de lectura
            texto: '<strong>Age of Ultron #1–10</strong>, de corrido.'
          - apartado: Prescindible
            texto: Los números marcados «AU» de otras series.
          - apartado: Conexión
            texto: 'El #10 trae a Angela al universo Marvel (ver el Expediente Guardianes).'
  - evento:
      id: m1-b6-x-termination
      etiqueta: Crossover · Realidad alterna y línea principal · Preludio + 8 capítulos · Marzo – abril 2013
      titulo: X-Termination
      creditos: David Lapham, Greg Pak &amp; Marjorie Liu · David López, Matteo Buffagni y otros
      descripcion:
      - 'El final del arco que abrió <em>Uncanny X-Force</em> #19.1: la serie de la Era de Apocalipsis se cruza con <em>Astonishing X-Men</em> y <em>X-Treme X-Men</em>, las dos realidades chocan y el arco termina aquí. <strong>Va entrelazado:</strong> las tres series se van alternando entre los dos números de <em>X-Termination</em>, que abren y cierran el cruce.'
      apartados:
      - apartado: Antes de empezar
        texto: 'Llega con <em>Age of Apocalypse</em> leída hasta el #12 (tramo 5.1), <em>X-Treme X-Men</em> vol. 2 hasta el #11 (tramo 5.2) y <em>Astonishing X-Men</em> hasta el #58 (tramo 6.1).'
      - apartado: Orden completo
        texto: '<span class="cap">Astonishing X-Men #59</span> (preludio) → <span class="cap">Age of Apocalypse #13</span> → <span class="cap">X-Treme X-Men #12</span> → <strong>X-Termination #1</strong> → <span class="cap">Astonishing X-Men #60</span> → <span class="cap">Age of Apocalypse #14</span> → <span class="cap">X-Treme X-Men #13</span> → <span class="cap">Astonishing X-Men #61</span> → <strong>X-Termination #2</strong>'
      - apartado: Qué termina aquí
        texto: '<em>Age of Apocalypse</em> (2012) cierra en el #14 y <em>X-Treme X-Men</em> vol. 2 en el #13. <em>Astonishing X-Men</em> sigue hasta el #68 en el tramo 6.2.'
      - apartado: Cuándo leerlo
        texto: 'Es independiente de las cuatro series que convergen en <em>Battle of the Atom</em>: léelo en cualquier momento del tramo 6.1, cuando tengas al día las tres de arriba.'
  - evento:
      id: m1-b6-battle-of-the-atom
      etiqueta: Crossover · 10 partes · Septiembre – octubre 2013
      titulo: Battle of the Atom
      creditos: Brian Michael Bendis, Jason Aaron, Brian Wood · varios
      descripcion:
      - Los X-Men del futuro vienen a obligar a los cinco originales a volver a su época. Cruza las cuatro cabeceras del tramo anterior en capítulos alternos numerados.
      apartados:
      - apartado: Orden completo
        texto: 'X-Men: Battle of the Atom #1 → <span class="cap">All-New X-Men #16</span> → <span class="cap">X-Men vol. 4 #5</span> → <span class="cap">Uncanny X-Men #12</span> → <span class="cap">Wolverine and the X-Men #36</span> → <span class="cap">All-New X-Men #17</span> → <span class="cap">X-Men vol. 4 #6</span> → <span class="cap">Uncanny X-Men #13</span> → <span class="cap">Wolverine and the X-Men #37</span> → X-Men: Battle of the Atom #2'
  - tramo:
      numero: '6.2'
      titulo: Tras la batalla
