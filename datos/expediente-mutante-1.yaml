            clase: t1
            texto: Esencial
      - serie:
          id: m1-b6-uncanny-x-men-vol-3-14-30
          prioridad: p2
          titulo: Uncanny X-Men vol. 3 <span class="nums">#14–30</span>
          creditos: Brian Michael Bendis · Chris Bachalo, Kris Anka · 2013–2015
          continuidad:
          - viene: ◂ Viene de <em>Battle of the Atom</em>
          etiqueta:
            clase: t2
            texto: Recomendado
      - serie:
          id: m1-b6-wolverine-and-the-x-men-38-42-vol-2-1-12
          prioridad: p2
          titulo: Wolverine and the X-Men <span class="nums">#38–42</span> → vol. 2 <span class="nums">#1–12</span>
