- id: b7
  fechas: 2012 — 2015
  titulo: El fin del universo
  intro: 'Matt Fraction se lleva a la familia entera de viaje por el tiempo y el espacio —Reed esconde que sus poderes los están matando— y Mike Allred dibuja al equipo de sustitutos que se queda en casa. James Robinson desmonta después al grupo pieza a pieza: Johnny pierde los poderes, Ben va a la cárcel y los niños pasan a la custodia del gobierno. Todo acaba en <em>Secret Wars</em>, donde el multiverso muere y Franklin con él, hasta que Reed lo trae de vuelta para reconstruirlo todo.'
  navegacion:
    anio: 2012–2015
    texto: El fin del universo
  contenido:
  - tramo:
      numero: '7.1'
      titulo: Cuatro minutos
      cuando: Noviembre 2012 – septiembre 2013
      nota: 'Dos series a la vez: <em>Fantastic Four</em> sigue a la familia en su viaje y <em>FF</em> al equipo que se queda en el Edificio Baxter. Se pueden alternar o leer una tras otra. Las dos son volumen nuevo y empiezan en el #1.'
      entradas:
      - serie:
          id: 4f-b7-fantastic-four-vol-4-1-5
          prioridad: p2
          titulo: Fantastic Four vol. 4 <span class="nums">#1–5</span>
          creditos: Matt Fraction · Mark Bagley · 2012–2013
          continuidad:
          - viene: ◂ Viene del bloque 6
          - sigue: ▸ Continúa en la ficha siguiente
          descripcion:
          - 'Reed descubre que los rayos cósmicos les están degradando las células, y se lleva a toda la familia, con Franklin y Valeria, a un viaje por el tiempo y el espacio con la excusa de que sea educativo. En la Tierra solo pasarán cuatro minutos, así que deja a cuatro sustitutos al cargo de la Fundación. Primeras paradas: un planeta que caza a sus visitantes y la Roma de Julio César.'
          etiqueta:
            clase: t2
            texto: Recomendado
      - serie:
          id: 4f-b7-fantastic-four-vol-4-6-12
          prioridad: p2
          titulo: Fantastic Four vol. 4 <span class="nums">#6–12</span>
          creditos: Matt Fraction · Mark Bagley · 2013
          continuidad:
          - viene: ◂ Viene de la ficha anterior
          - sigue: ▸ Sigue en el tramo 7.2
          descripcion:
          - Franklin teletransporta a Blastaar fuera de la nave en el instante del Big Bang, y el esfuerzo lo deja al límite. Después, Ben viaja a la calle Yancy de los años treinta y a la universidad del joven Victor von Doom, y los Fundadores de Estados Unidos resultan tener un problema skrull. Valeria descubre lo que Reed escondía, y la piel de Ben empieza a desmoronarse.
          etiqueta:
            clase: t2
            texto: Recomendado
