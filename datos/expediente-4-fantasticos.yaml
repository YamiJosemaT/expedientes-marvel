          continuidad:
          - viene: ◂ Viene del tramo 7.1
          descripcion:
          - El Johnny anciano viene de otra realidad, donde Doom, Kang y Annihilus se han fundido en un solo tirano. Los 4 Fantásticos, con trajes de contención porque sus poderes fallan, viajan allí a pararlo mientras mandan a Franklin y Valeria de vuelta a casa. Termina con una barbacoa en la Luna.
          etiqueta:
            clase: t2
            texto: Recomendado
