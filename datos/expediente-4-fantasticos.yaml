          creditos: Victor Gischler / Marjorie Liu · 2011
          descripcion:
          - 'Dos encuentros con los X-Men: una misión conjunta en el Triángulo de las Bermudas y Laura Kinney, X-23, que pasa una temporada con la Fundación Futuro y acaba de canguro de Franklin y Valeria, a los que tiene que rescatar del Coleccionista.'
          etiqueta:
            clase: opcional
            texto: Opcional
  - evento:
      id: 4f-b6-fear-itself
      ancla: ev-fearitself
      linea_marvel: true
      etiqueta: Evento de toda la línea Marvel · Abril – octubre 2011
      titulo: Fear Itself
      creditos: Matt Fraction · Stuart Immonen (serie principal) · tie-in de Cullen Bunn y Tom Grummett
      descripcion:
      - 'La Serpiente, dios asgardiano del miedo, reparte martillos que convierten a varios personajes en sus heraldos, los Dignos. <strong>Uno es Ben</strong>, que se convierte en Angrir, Quebrantador de Almas, y arrasa Nueva York. En el tie-in, su familia intenta frenarlo y solo Alicia llega hasta él. En el #5, Thor lo derrota, y <strong>Franklin usa sus poderes para liberarlo de Angrir</strong> y devolverle su forma de la Cosa, en contra de lo que le había pedido su padre.'
      apartados:
      - apartado: Orden de lectura
        texto: '<strong>Fear Itself #1</strong> → <strong>#2</strong> → <strong>#3</strong> → <span class="cap">Fear Itself: FF #1</span> → <strong>Fear Itself #4</strong> → <strong>#5</strong> → <strong>#6</strong> → <strong>#7</strong>'
      - apartado: Nota
        texto: 'El tie-in va donde se publicó, entre el #3 y el #4, cuando Ben ya es Angrir. Se publicó a la vez que <em>FF</em> #6–8, pero no se cruza con ellos.'
      - apartado: Conexión
        texto: 'Es el mismo evento del bloque 4 del Expediente Mutante I, con su tie-in mutante. Si lo lees allí, aquí solo tienes que añadir <em>Fear Itself: FF</em>.'
  - evento:
      id: 4f-b6-forever
      ancla: ev-forever
      etiqueta: Saga · Diez números entre dos series · Noviembre 2011 – marzo 2012
      titulo: Forever
      creditos: Jonathan Hickman · Steve Epting, Barry Kitson, Juan Bobillo y Nick Dragotta
      descripcion:
      - El clímax de Hickman. Johnny vuelve de la Zona Negativa convertido en su gobernante, con el ejército de Annihilus a sus órdenes. Los kree atacan Manhattan, Galactus llega para frenar a los Celestiales locos y los niños de la Fundación, refugiados cerca de Latveria, piden ayuda al «tío» Doom.
      - <strong>Franklin, en el centro:</strong> el niño se enfrenta a los Celestiales y, cuando parece perdido, llega su yo adulto, con la Valeria adulta, para salvar la Tierra. Al final, Reed le pide a su hijo que salte, que él lo coge, como hizo Nathaniel con él.
      apartados:
      - apartado: Orden de lectura
        texto: '<strong>Fantastic Four #600</strong> → <strong>#601</strong> → <span class="cap">FF #12</span> → <span class="cap">FF #13</span> → <strong>Fantastic Four #602</strong> → <span class="cap">FF #14</span> → <strong>Fantastic Four #603</strong> → <span class="cap">FF #15</span> → <strong>Fantastic Four #604</strong> → <span class="cap">FF #16</span>'
      - apartado: Por qué este orden
        texto: 'Marvel Fandom indica qué números de <em>FF</em> ocurren a la vez que cada <em>Fantastic Four</em>. Leídos por tomos (#600–604 y luego <em>FF</em> #12–16) también se entienden, pero se pierde la alternancia.'
  - tramo:
      numero: '6.2'
      titulo: Después de Forever
      cuando: Abril – octubre 2012
      nota: 'Orden de publicación: Fantastic Four #605 → #605.1 → FF #17 → Fantastic Four #606 → FF #18 → Fantastic Four #607 → FF #19 → Fantastic Four #608 → FF #20 → Fantastic Four #609 → FF #21 → Fantastic Four #610 → FF #22 → Fantastic Four #611 → FF #23. Las fichas los agrupan por historias.'
      entradas:
      - serie:
          id: 4f-b6-fantastic-four-605-605-1
          prioridad: p2
          titulo: Fantastic Four <span class="nums">#605</span> + <span class="nums">#605.1</span>
          creditos: Jonathan Hickman · Ron Garney y Mike Choi · 2012
          continuidad:
          - viene: ◂ Viene de «Forever»
          descripcion:
          - 'Reed y su padre viajan al futuro para saber qué será de Ben, y en el año 3012 encuentran unos 4 Fantásticos liderados por Franklin. El #605.1 cuenta el origen del Consejo de Reeds: un Reed de una Tierra donde ganaron los nazis.'
          etiqueta:
            clase: t2
            texto: Recomendado
      - serie:
          id: 4f-b6-ff-17-18-fantastic-four-606
