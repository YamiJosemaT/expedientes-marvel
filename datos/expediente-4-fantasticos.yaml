          titulo: Fantastic Four vol. 6 <span class="nums">#46</span>
          creditos: Dan Slott · CAFU · 2022
          descripcion:
          - 'Gracias a lo que saben los Vigilantes, encuentran a la hija perdida de Nathaniel Richards: Reed tiene una hermana. La despedida de Slott.'
          etiqueta:
            clase: t2
            texto: Recomendado
      - evento:
          id: 4f-b9-a-x-e-judgment-day
          ancla: ev-axe
          linea_marvel: true
          etiqueta: Evento de toda la línea Marvel · Julio – noviembre 2022
          titulo: 'A.X.E.: Judgment Day'
          creditos: Kieron Gillen · Valerio Schiti (serie principal) · tie-in de David Pepose y Juan Cabal
          descripcion:
          - Un Celestial juzga a la humanidad. En el tie-in de los 4 Fantásticos, mientras Reed busca respuestas encerrado en su laboratorio, la exterminadora Oubliette Midas toma el Edificio Baxter y solo Sue queda libre para recuperarlo planta a planta.
          apartados:
          - apartado: Dónde va
            texto: '<span class="cap">Fantastic Four #47–48</span> se publicaron durante el evento, en septiembre y octubre de 2022, y no se cruzan con la serie principal.'
          - apartado: Conexión
            texto: El evento entero, con su orden entrelazado, está en el bloque 3 del Mutante II y en el bloque 5 de Eternos. Para los 4 Fantásticos basta con este tie-in.
      - serie:
          id: 4f-b9-fantastic-four-full-circle
          titulo: 'Fantastic Four: Full Circle'
          creditos: Alex Ross · 2022
          descripcion:
          - 'Novela gráfica de Alex Ross, guion y dibujo: una invasión de parásitos de energía negativa lleva al grupo a la Zona Negativa, en homenaje a los 4 Fantásticos de Lee y Kirby.'
          etiqueta:
            clase: opcional
            texto: Opcional
- id: b10
  fechas: 2022 — 2025
  titulo: La granja de Arizona
  intro: 'Ryan North empieza con la familia dispersa y odiada: algo pasó en Nueva York y nadie sabe qué. La respuesta es que Reed mandó un año al futuro la manzana entera del Edificio Baxter, con Franklin, Valeria y los hijos de Ben y Alicia dentro, para salvar la Tierra. Mientras vuelven, los 4 Fantásticos se instalan en una granja de Arizona y viven aventuras de ciencia ficción de un número o dos. Franklin, que se creía sin poderes, guarda un secreto que ni él mismo recuerda.'
  navegacion:
    anio: 2022–2025
    texto: La granja de Arizona
  contenido:
  - tramo:
      numero: '10.1'
      titulo: ¿Qué fue de los 4 Fantásticos?
      cuando: Noviembre 2022 – abril 2023
      entradas:
      - serie:
          id: 4f-b10-fantastic-four-vol-7-1-6
          prioridad: p1
          titulo: Fantastic Four vol. 7 <span class="nums">#1–6</span>
          creditos: Ryan North · Iban Coello e Ivan Fiorelli · 2022–2023
          continuidad:
          - viene: ◂ Viene del bloque 9
          - sigue: ▸ Sigue en el tramo 10.2
          descripcion:
          - 'Ben y Alicia cruzan Estados Unidos huyendo de algo, Reed y Sue también, y Johnny vive solo en una Nueva York que lo odia. En el #4 se cuenta qué pasó: para frenar una invasión desde la Zona Negativa, <strong>Reed mandó un año al futuro toda la manzana del Edificio Baxter, con Franklin, Valeria, Jo y Nicki dentro</strong>, y desde fuera pareció que la había hecho desaparecer. Después, Nicholas Scratch y los Siete de Salem en plena carretera.'
          etiqueta:
            clase: t1
            texto: Esencial
  - tramo:
      numero: '10.2'
      titulo: Un número, una idea
      cuando: Mayo – diciembre 2023
      nota: 'El #7 es también el #700 de la numeración histórica. Las historias de este tramo son casi todas de un número o dos, y se leen sueltas.'
      entradas:
      - serie:
          id: 4f-b10-fantastic-four-vol-7-7-13
          prioridad: p2
          titulo: Fantastic Four vol. 7 <span class="nums">#7–13</span>
          creditos: Ryan North · Iban Coello, Ivan Fiorelli y Leandro Fernández · 2023
          continuidad:
          - viene: ◂ Viene del tramo 10.1
          descripcion:
          - La familia se instala en la granja de la tía Petunia, en Arizona. Un alien les borra el lenguaje y la memoria, Ben cae por un agujero hacia el centro de la Tierra con la casa entera, una nave generacional se pierde en el vacío y el grupo intercambia su lugar con los 4 Fantásticos de un universo de dinosaurios mientras Doom hace equipo consigo mismo.
          etiqueta:
            clase: t2
            texto: Recomendado
      - serie:
          id: 4f-b10-fantastic-four-annual-1-2023
          titulo: Fantastic Four Annual <span class="nums">#1</span> (2023)
          creditos: Zac Gorman · Alan Robinson · 2023
          descripcion:
          - Tercera parte de «Contest of Chaos», el torneo de Agatha Harkness entre los anuales de ese verano. Johnny contra el Motorista Fantasma.
          etiqueta:
            clase: opcional
            texto: Opcional
  - tramo:
      numero: '10.3'
      titulo: Los niños vuelven
      cuando: Diciembre 2023 – febrero 2024
      entradas:
      - serie:
          id: 4f-b10-fantastic-four-vol-7-14-16
          prioridad: p1
          titulo: Fantastic Four vol. 7 <span class="nums">#14–16</span>
          creditos: Ryan North · Ivan Fiorelli y Francesco Mortarino · 2023–2024
          continuidad:
          - viene: ◂ Viene del tramo 10.2
          descripcion:
          - 'Pasado el año, la manzana del Edificio Baxter vuelve con los niños, que solo han vivido un instante, y algo se está construyendo en el agujero que dejó. Una mente colmena, el Cerebro Chino, decide que la familia es una amenaza. En el #16, ya en el colegio de Arizona, Franklin y Valeria se ponen a inventar lo imposible con Jo y Nicki para sacar nota, y se les va de las manos.'
          etiqueta:
            clase: t1
            texto: Esencial
      - serie:
          id: 4f-b10-fantastic-four-vol-7-17
          prioridad: p2
          titulo: Fantastic Four vol. 7 <span class="nums">#17</span>
          creditos: Ryan North · Carlos Gómez · 2024
          descripcion:
          - 'Sue, arqueóloga, desentierra unos huesos de hace decenas de miles de años con restos de su propio uniforme: va a morir en la prehistoria.'
          etiqueta:
            clase: t2
            texto: Recomendado
  - tramo:
      numero: '10.4'
      titulo: El secreto de Franklin
      cuando: Marzo 2024 – enero 2025
      nota: 'Los #21–22 son el tie-in de <em>Blood Hunt</em>, el evento de vampiros del bloque 5 del Mutante II, y se entienden solos. Al final del evento, Doom se convierte en Hechicero Supremo, y eso lleva a <em>One World Under Doom</em>.'
      entradas:
      - serie:
          id: 4f-b10-fantastic-four-vol-7-18
          prioridad: p1
          titulo: Fantastic Four vol. 7 <span class="nums">#18</span>
          creditos: Ryan North · Carlos Gómez · 2024
          continuidad:
          - viene: ◂ Viene del tramo 10.3
          descripcion:
          - '<strong>El secreto de Franklin Richards.</strong> Sus poderes no se apagaron: fue él quien se puso nuevos bloqueos mentales para usarlos y recordarlos solo un día al año. Ese día detiene en secreto una lluvia de asteroides invisibles mientras todos duermen, sin saber que Nicholas Scratch lo vigila desde las sombras de su cuarto.'
          etiqueta:
            clase: t1
            texto: Esencial
      - serie:
          id: 4f-b10-fantastic-four-vol-7-19-22
          prioridad: p2
          titulo: Fantastic Four vol. 7 <span class="nums">#19–22</span>
          creditos: Ryan North · Carlos Gómez e Ivan Fiorelli · 2024
          descripcion:
          - 'Un número de cine negro con un detective enamorado de Sue, Ben y Johnny con el mismo trabajo a media jornada, y el tie-in de <em>Blood Hunt</em>: Reed y Alicia, atrapados en una Nueva York tomada por los vampiros, intentan dar con una cura mientras el resto protege a los niños en Arizona.'
          etiqueta:
            clase: t2
            texto: Recomendado
      - serie:
          id: 4f-b10-fantastic-four-vol-7-23-27
          prioridad: p2
          titulo: Fantastic Four vol. 7 <span class="nums">#23–27</span>
          creditos: Ryan North · Carlos Gómez, Ivan Fiorelli y Steven Cummings · 2024
          continuidad:
          - sigue: ▸ Continúa en la ficha siguiente
          descripcion:
          - Johnny y Sue llevan a Jo y a Nicki a Nueva York; partículas de otro rincón del universo invaden la Tierra; un viaje a Latveria acaba en otro planeta; Reed y Johnny abren por accidente algo bajo la granja, y Nicki, la hija skrull de Ben y Alicia, se hace pasar por los padres de todos para sacar a los primos de líos en el colegio, Franklin incluido.
          etiqueta:
            clase: t2
            texto: Recomendado
      - serie:
          id: 4f-b10-fantastic-four-vol-7-28
          prioridad: p2
          titulo: Fantastic Four vol. 7 <span class="nums">#28</span>
          creditos: Ryan North · Steven Cummings · 2025
          continuidad:
          - sigue: ▸ Sigue en el bloque 11 (<em>One World Under Doom</em>)
          descripcion:
          - Doom es Hechicero Supremo desde hace meses y ha desaparecido. Reed, incapaz de entender la magia, pide ayuda al Caballero Negro, que manda las mentes de Reed y Sue al pasado. Es el prólogo de <em>One World Under Doom</em>.
          etiqueta:
            clase: t2
            texto: Recomendado
      - serie:
          id: 4f-b10-power-pack-into-the-storm-1-5
          prioridad: p2
          titulo: 'Power Pack: Into the Storm <span class="nums">#1–5</span>'
          creditos: Louise Simonson · June Brigman · 2024
          descripcion:
          - 'Las creadoras de Power Pack vuelven a sus primeros tiempos: el pequeño Franklin tiene una premonición de una amenaza galáctica, los Power se enfrentan a ella, y el enemigo intenta absorber los poderes de Franklin. Ambientada en el pasado, pero es una historia de Franklin de principio a fin.'
          etiqueta:
            clase: t2
            texto: Recomendado
      - serie:
          id: 4f-b10-giant-size-fantastic-four-1-venom-war-58-fantastic-four-1
          titulo: Giant-Size Fantastic Four <span class="nums">#1</span> · Venom War&#58; Fantastic Four <span class="nums">#1</span>
          creditos: Fabian Nicieza · Creees Lee / Adam Warren · Joey Vazquez · 2024
          descripcion:
          - Una amenaza atlante antigua con Namor en prisión, y un tie-in de <em>Venom War</em> en el que Doom y Kang meten al grupo en la guerra de los simbiontes.
          etiqueta:
            clase: opcional
            texto: Opcional
- id: b11
  fechas: 2025 — hoy
  titulo: Un mundo bajo Doom
  intro: 'Doom, ahora Hechicero Supremo, convence a todos los gobiernos de la Tierra para que se rindan a él. Los 4 Fantásticos pierden sus poderes uno tras otro intentando pararlo, y la guerra acaba con la muerte de Valeria, alcanzada por la magia de su padrino. Doom paga con su vida por devolvérsela, y en su testamento le deja Latveria. Después, la serie vuelve a empezar en el #1 con las mismas manos, Ryan North, y llega hasta <em>DNX</em>, que se está publicando ahora mismo.'
  navegacion:
    anio: 2025–hoy
    texto: Un mundo bajo Doom
  contenido:
  - tramo:
      numero: '11.1'
      titulo: One World Under Doom
      cuando: Febrero – diciembre 2025
      nota: 'Orden de publicación, que es el que conviene seguir: One World Under Doom #1 → Fantastic Four vol. 7 #29 → OWUD #2 → FF #30 → OWUD #3 → FF #31 → OWUD #4 → FF #32 → OWUD #5 → FF #33 → Fantastic Four vol. 8 #1 → OWUD #6 → FF vol. 8 #2 → OWUD #7 → FF vol. 8 #3 → OWUD #8 → #9 → Will of Doom #1. Marvel Fandom no da una cronología interna más precisa.'
      entradas:
      - evento:
          id: 4f-b11-one-world-under-doom
          ancla: ev-owud
          linea_marvel: true
          etiqueta: Evento de toda la línea Marvel · Febrero – noviembre 2025
          titulo: One World Under Doom
          creditos: Ryan North · R.B. Silva
          descripcion:
          - 'Doom se presenta en la ONU: todos los gobiernos le han jurado lealtad y la Tierra es ahora «Latveria Unida». Gobierna con mano blanda hasta que se descubre de dónde saca su poder: la vida de miles de latverianos. En la batalla final, con todos los héroes contra él, Valeria intenta convencerlo de que pare y <strong>muere alcanzada por los fragmentos de su armadura</strong>.'
          - Doom recorre el cosmos hasta el Tribunal Viviente para devolverle la vida, y lo consigue a cambio de la suya. Antes de convertirse en ceniza, visita a Reed para preguntarle cómo está Valeria y le deja su testamento.
          apartados:
          - apartado: Orden de lectura
            texto: '<strong>One World Under Doom #1</strong> → <strong>#2</strong> → <strong>#3</strong> → <strong>#4</strong> → <strong>#5</strong> → <strong>#6</strong> → <strong>#7</strong> → <strong>#8</strong> → <strong>#9</strong>'
          - apartado: Con los 4 Fantásticos
            texto: Las dos fichas siguientes van intercaladas con el evento, como indica la nota del tramo. Para el resto de la línea, el Mutante II (bloque 5) da el orden con sus capítulos mutantes.
          - apartado: Antes de empezar
            texto: '<em>Blood Hunt</em>, que deja a Doom como Hechicero Supremo, y el #28 de la ficha anterior.'
      - serie:
          id: 4f-b11-fantastic-four-vol-7-29-33
          prioridad: p1
          titulo: Fantastic Four vol. 7 <span class="nums">#29–33</span>
          creditos: Ryan North · Cory Smith · 2025
          continuidad:
          - viene: ◂ Viene del bloque 10
          - sigue: ▸ Continúa en la ficha siguiente
          descripcion:
          - Doom le quita los poderes a Ben, que sale a la calle como un hombre normal y acaba en el hospital de un disparo; después el resto del grupo empieza a perder los suyos. Valeria aparece sola en un mundo donde los 4 Fantásticos nunca existieron, y para arreglar lo de Ben la familia viaja hasta el Big Bang. Es el final del volumen 7.
          etiqueta:
            clase: t1
            texto: Esencial
      - serie:
          id: 4f-b11-fantastic-four-vol-8-1-3
          prioridad: p1
          titulo: Fantastic Four vol. 8 <span class="nums">#1–3</span>
          creditos: Ryan North · Humberto Ramos · 2025
          continuidad:
          - viene: ◂ Viene de la ficha anterior
          descripcion:
          - Volumen nuevo. Un enfrentamiento con Doom manda a cada uno a una época distinta de la historia de la Tierra, y Sue acaba en el último día del planeta. De vuelta, descubren el secreto de la invencibilidad de Doom y van a por él a su guarida de la Antártida.
          etiqueta:
            clase: t1
            texto: Esencial
      - serie:
          id: 4f-b11-will-of-doom-1
          prioridad: p1
          aparicion: true
          donde: En otra serie · Latveria
          titulo: Will of Doom <span class="nums">#1</span>
          creditos: Chip Zdarsky · CAFU · 2025
          continuidad:
          - sigue: ▸ Sigue en el tramo 11.2
          descripcion:
          - <strong>Valeria hereda Latveria.</strong> El testamento de Doom le deja su país y todo lo que tenía a su ahijada, que no lo quiere. Cuando los Doombots se alzan por todo el mundo siguiendo un último plan de Doom, Valeria, como su dueña legal, es la única que puede apagarlos, y Sue, que acaba de verla morir, no quiere dejarla ir.
          etiqueta:
            clase: t1
            texto: Esencial
  - tramo:
      numero: '11.2'
      titulo: La Mujer Invencible
      cuando: Octubre 2025 – mayo 2026
      entradas:
      - serie:
          id: 4f-b11-fantastic-four-vol-8-4-5
          prioridad: p2
          titulo: Fantastic Four vol. 8 <span class="nums">#4–5</span>
          creditos: Ryan North · Humberto Ramos · 2025
          continuidad:
          - viene: ◂ Viene del tramo 11.1
          descripcion:
          - Solo Alicia nota que el perro nuevo de la familia no es un perro, sino algo que hace creer a todos que lo es. Y la Gata Negra, acusada de asesinato, le pide a Sue que demuestre su inocencia.
          etiqueta:
            clase: t2
            texto: Recomendado
      - serie:
          id: 4f-b11-fantastic-four-vol-8-6-10
          prioridad: p2
          titulo: Fantastic Four vol. 8 <span class="nums">#6–10</span>
          creditos: Ryan North · Humberto Ramos · 2025–2026
          continuidad:
          - sigue: ▸ Sigue en el tramo 11.3
          descripcion:
          - «La Mujer Invencible». Un mensaje escondido en la estructura de la realidad convierte a Sue en la mujer más buscada del universo, y el grupo sale al espacio en una nave nueva dejando la Tierra sin defensa. Allí se enfrentan a la Mujer Invencible, una amenaza que ha puesto en peligro al propio Galactus y que después llega a la Tierra.
          etiqueta:
            clase: t2
            texto: Recomendado
      - serie:
          id: 4f-b11-avengers-armageddon-1-5
          aparicion: true
          donde: En otra serie · Latveria
          titulo: 'Avengers: Armageddon <span class="nums">#1–5</span>'
          creditos: Chip Zdarsky · Delio Díaz · 2026
          descripcion:
          - Sin Doom, el general Ross toma Latveria —la herencia de Valeria— y la rebautiza «Nueva América» para imponer la democracia por la fuerza con un arma de Doom. Reed se ofrece a ayudar a la ONU. Secuela de <em>Will of Doom</em>.
          etiqueta:
            clase: opcional
            texto: Opcional
      - serie:
          id: 4f-b11-thing-vol-4-1-5-doomquest-1-5
          titulo: Thing vol. 4 <span class="nums">#1–5</span> · Doomquest <span class="nums">#1–5</span>
          creditos: Tony Fleecs · Justin Mason / Ryan North · Francesco Mobili · 2025–2026
          descripcion:
          - 'Ben busca a un niño desaparecido de la calle Yancy y acaba enfrentado a Kingpin. Y <em>Doomquest</em>, una miniserie de Ryan North en curso (siete números, hasta enero de 2027), ambientada cuando Doom aún gobernaba Latveria: Reed atrapa su mente en distintos momentos de la historia, empezando por el Titanic.'
          etiqueta:
            clase: opcional
            texto: Opcional
  - tramo:
      numero: '11.3'
      titulo: Lo más reciente
      cuando: Mayo – octubre 2026
      entradas:
      - serie:
          id: 4f-b11-fantastic-four-vol-8-11-16
          prioridad: p2
          titulo: Fantastic Four vol. 8 <span class="nums">#11–16</span>
          creditos: Ryan North · Patrick Boutin, Andrea Sorrentino, Ramón Rosanas y Humberto Ramos · 2026
          continuidad:
          - viene: ◂ Viene del tramo 11.2
          - sigue: ▸ Sigue en <em>DNX</em>
          descripcion:
          - Vuelve la Fundación Futuro, la tecnología de Doom llega a manos de delincuentes de poca monta y unos alienígenas atacan la Tierra en la antigua Roma. Johnny convence a Sue de que le haga invisible la cara para hacerse pasar por el Motorista Fantasma, Jo y Nicki salvan el mundo solos porque son los únicos inmunes, y el número del 65 aniversario.
          etiqueta:
            clase: t2
            texto: Recomendado
      - serie:
          id: 4f-b11-infernal-hulk-vs-fantastic-four-1
          titulo: Infernal Hulk vs. Fantastic Four <span class="nums">#1</span>
          creditos: Phillip Kennedy Johnson · Cian Tormey · 2026
          descripcion:
          - El Hulk infernal asalta el Edificio Baxter para destruir una máquina sobrenatural de Reed, la única capaz de acabar con su ejército de un golpe.
          etiqueta:
            clase: opcional
            texto: Opcional
      - evento:
          id: 4f-b11-dnx
          ancla: ev-dnx
          etiqueta: Evento en curso · Agosto – noviembre 2026
          titulo: DNX
          creditos: Jed MacKay · Federico Vicentini
          descripcion:
          - 'X-Men y 4 Fantásticos contra 3K y un virus que amenaza con hacer realidad un futuro distópico. Los X-Men acuden a la familia Richards para salvar a uno de los suyos. En los dos capítulos de los 4 Fantásticos, el grupo despierta sin memoria en un lugar extraño, malherido, y con una sola palabra escrita con sangre en el brazo de Reed: «Sobrevive».'
          apartados:
          - apartado: Orden completo
            texto: 'X-Men #35 → #36 (prólogos) → <strong>DNX #1</strong> → X-Men #37 → <strong>DNX #2</strong> → X-Men #38 → <span class="cap">Fantastic Four #17</span> → <strong>DNX #3</strong> → X-Men #39 → X-Men #40 → <span class="cap">Fantastic Four #18</span> → <strong>DNX #4</strong> → X-Men #41 → <strong>DNX #5</strong>'
          - apartado: Dónde está ahora
            texto: 'A 26 de octubre de 2026 van publicados hasta <em>DNX</em> #3 y <em>Fantastic Four</em> #17. El #18 sale el 28 de octubre y el evento cierra con <em>DNX</em> #5 el 18 de noviembre.'
          - apartado: Conexión
            texto: Es el mismo evento del bloque 7 del Mutante II, con el mismo orden.
      - evento:
          etiqueta: Frontera de la guía · 26 de octubre de 2026
          titulo: Dónde están ahora
          descripcion:
          - '<em>Fantastic Four</em> vol. 8 sigue publicándose mensualmente con Ryan North; el #18 cierra el tie-in de <em>DNX</em> y hay números anunciados hasta principios de 2027.'
          apartados:
          - apartado: Qué vigilar
            texto: 'Qué hará Valeria con Latveria tras <em>Avengers: Armageddon</em>, y qué pasa con el secreto de Franklin, que solo recuerda sus poderes un día al año (vol. 7 #18).'
apendice:
  titulo: Cómo recorrerlo
  notas:
  - titulo: Una familia y un grupo
    html: <p>Esta guía sigue a Franklin, pero no deja fuera al grupo. La serie principal de los 4 Fantásticos y sus series hermanas están enteras, aunque Franklin no salga. De las colecciones de otros solo hay ficha si sale él o si el grupo tiene peso en la historia. Lo demás va en las listas de esta sección.</p>
  - titulo: Ojo con la numeración
    html: '<p>La serie principal ha cambiado de volumen seis veces. El volumen 3 (1998) salta del #70 al #500 y llega al #588; entre 2011 y 2012 se publica como <em>FF</em> #1–11 y vuelve como <em>Fantastic Four</em> #600–611. Después vienen el volumen 4 (#1–16), el 5 (#1–14, que salta al #642–645), el 6 (#1–48), el 7 (#1–33, cuyo #7 es también el #700) y el 8 (#1 en adelante). Cada ficha indica el volumen a partir del bloque 7.</p>'
  - titulo: Apariciones menores, 2000–2002
    html: '<p>Cameos y apariciones breves de Franklin o del grupo, sin ficha: <em>X-Man</em> #59 y los one-shots <em>Heroes Reborn: Ashema</em> y <em>Remnants</em> (anteriores al #35); <em>Thunderbolts</em> #43–44 y #57; <em>Inhumans</em> vol. 3 #2; <em>Maximum Security</em> #2–3; <em>Iron Man</em> vol. 3 #35; <em>Marvel Knights</em> #6; <em>Defenders</em> vol. 2 #1, #9–10; <em>Black Panther</em> vol. 3 #30 y #43; <em>Captain America</em> vol. 3 #50; <em>Avengers</em> vol. 3 #51 (<em>The Kang Dynasty</em>); <em>Daredevil</em> vol. 2 #34; <em>Peter Parker: Spider-Man</em> #36.</p>'
  - titulo: Apariciones menores, 2002–2005
    html: '<p><em>Marvel Double Shot</em> #3 (2003); <em>Startling Stories: The Thing</em> #1 (2003); <em>Marvel Universe: The End</em> #4–6; <em>JLA/Avengers</em> #2; <em>Amazing Spider-Man</em> vol. 2 #47 y #57; <em>Spectacular Spider-Man</em> vol. 2 #4 y #21; <em>Venom</em> #11–12 y #17–18; <em>Exiles</em> #46–48; <em>She-Hulk</em> #6 y #12; <em>X-Statix</em> #26; <em>Avengers</em> #501–503 (<em>Avengers Disassembled</em>); <em>Marvel Knights: Spider-Man</em> #6 y #11; <em>Wolverine</em> vol. 3 #21–22 (<em>Enemy of the State</em>: Wolverine, controlado por Hydra, asalta el Edificio Baxter); <em>Marvel Team-Up</em> vol. 3 #3–5; <em>Astonishing X-Men</em> vol. 3 #7; <em>X-Force</em> vol. 2 #5–6; <em>Secret War</em> #4; <em>Spider-Man Unlimited</em> vol. 3 #9, y <em>Marvel Holiday Special 2004</em> #1.</p>'
  - titulo: Apariciones menores, 2005–2008
    html: '<p>Con Franklin: <em>The Pulse</em> #11 (Sue le cuenta a Jessica Jones que sus hijos ya no tienen poderes); <em>Marvel Team-Up</em> vol. 3 #14; <em>Exiles</em> #81–82, en la Contra-Tierra de <em>Heroes Reborn</em>; <em>Black Panther</em> vol. 4 #25; <em>Invincible Iron Man</em> #14, durante <em>Civil War</em>; <em>New Avengers: Illuminati</em> vol. 2 #4; <em>Spider-Man Loves Mary Jane</em> #15; <em>Spider-Man Family</em> vol. 2 #7. Con el grupo: <em>New Avengers</em> #8–10; <em>Sentry</em> vol. 2 #2–3; <em>Son of M</em> #5–6; <em>Black Panther</em> vol. 4 #16–18; <em>Amazing Spider-Man</em> #533–534; <em>Invincible Iron Man</em> #10–12; <em>Silent War</em> #1; <em>Fallen Son</em> #5; <em>World War Hulk: Front Line</em> #2; <em>X-Men</em> #200; <em>Uncanny X-Men</em> #489; <em>Cable &amp; Deadpool</em> #45–46 y #50; <em>Avengers: The Initiative</em> #8, y <em>World War Hulk Aftersmash: Damage Control</em> #1–2.</p>'
  - titulo: Apariciones menores, 2008–2012
    html: '<p>Con Franklin: <em>True Believers</em> #1; <em>Planet Skaar Prologue</em> #1; <em>Dark Avengers/Uncanny X-Men: Utopia</em> #1 (Franklin pregunta a sus padres por qué se odia a los mutantes y si eso significa que lo odian a él); <em>Black Panther</em> vol. 5 #9; <em>Incredible Hulk</em> #606; <em>Girl Comics</em> #1; <em>Uncanny X-Men: The Heroic Age</em> #1, en el que Franklin conoce a Hope; <em>World War Hulks: Captain America vs. Wolverine</em> #2; <em>Young Allies</em> #4; <em>Daken: Dark Wolverine</em> #3–4; <em>I Am an Avenger</em> #4; <em>Silver Surfer</em> vol. 6 #4–5, con la Fundación Futuro devolviéndole el Poder Cósmico a Norrin; <em>Amazing Spider-Man</em> #666; <em>Avenging Spider-Man Annual</em> #1; los especiales digitales <em>Marvel Digital Holiday Special</em> #2 (2009) y #1 (2010) y <em>Women of Marvel</em> #4. Con el grupo: <em>Dark Wolverine</em> #75–77 (Daken contra los 4 Fantásticos); <em>Mighty Avengers</em> #14 y #21; <em>New Avengers</em> #43 y #48; <em>Siege</em> #3–4; <em>Chaos War</em> #1–2, y <em>Fear Itself: Fearsome Four</em> #3–4.</p>'
  - titulo: Apariciones menores, 2012–2018
    html: '<p><em>Free Comic Book Day 2015: Secret Wars</em> #1 (Franklin y la Fundación construyen las naves; está en el orden de <em>Secret Wars</em>); <em>Groot</em> #4; <em>Lockjaw</em> #4; <em>Avengers &amp; X-Men: AXIS</em> #5; <em>Amazing Spider-Man</em> #700; <em>Superior Spider-Man Team-Up</em> #1 y #7; <em>Cataclysm</em> #0.1; <em>Unbeatable Squirrel Girl</em> #4–5; <em>Silk</em> #3–4; <em>Moon Girl and Devil Dinosaur</em> #29–30.</p>'
  - titulo: Apariciones menores, 2018–2026
    html: '<p>Con Franklin: <em>Cosmic Ghost Rider Destroys Marvel History</em> #1; <em>Gwenpool Strikes Back</em> #2; <em>Friendly Neighborhood Spider-Man</em> vol. 2 #13; <em>Annihilation – Scourge: Nova</em> #1; <em>Incoming</em> #1; <em>Spider-Ham</em> #2; <em>Immortal Hulk: Great Power</em> #1; <em>Immortal Hulk</em> #48; <em>Devil’s Reign</em> #1; <em>X-Men: Hellfire Gala</em> 2022 #1 (la gala del bloque 3 del Mutante II); <em>Ultimate Invasion</em> #1; <em>She-Hulk</em> vol. 5 #12; <em>Marvel Meow Infinity Comic</em> #5 y #20; <em>Marvel Holiday Tales to Astonish</em> #1; <em>Spider-Man: Holiday Spectacular</em> #1; <em>H.E.R.B.I.E. Infinity Comic</em> #1 y #4, y <em>Fantastic Four Fanfare</em> #1–4, una antología con una historia de Hickman en el #2. Con el grupo: <em>War of the Realms</em> #3, #5–6; <em>King in Black</em> #1–2, #4–5; <em>New Fantastic Four</em> #1–5 (2022), con Spider-Man, Lobezno, Hulk y el Motorista Fantasma; <em>Free Comic Book Day 2025: Fantastic Four/X-Men</em> #1; <em>Death of the Silver Surfer</em> #1–5, y <em>New Avengers</em> vol. 5 #8.</p>'
  - titulo: Fuera de la línea temporal
    html: '<p>Publicadas en estos años, pero ambientadas en otra época, en otra realidad o imposibles de encajar: <em>Fantastic Four: World’s Greatest Comics Magazine</em> #1–12 (2001), homenaje a Kirby ambientado en los sesenta; <em>Marvels Comics: Fantastic Four</em> #1 (2000), el cómic que leen los niños dentro del universo Marvel; <em>X-Men: The Hidden Years</em> #9; <em>Fantastic 4th Voyage of Sinbad</em> #1 (2001), un epílogo de Claremont que choca con la vuelta de los niños en el #46; <em>Fantastic Four: Unstable Molecules</em> (2003); <em>Fantastic Four: House of M</em> #1–3 (2005), la realidad alterada de <em>House of M</em>; <em>Fantastic Four: First Family</em> #1–6 (2006), los primeros días del grupo; <em>Fantastic Four: The End</em> #1–6 (2007), un futuro posible de Alan Davis; <em>Spider-Man and the Fantastic Four</em> #1–4 (2007), una aventura de la época clásica con un Franklin pequeño en los #1–2; <em>The Age of the Sentry</em> #1–6 (2008–2009), historias del Centinela que Reed le cuenta a Franklin para dormir; <em>Fantastic Four: Season One</em> (2012); <em>Fantastic Four: Grand Design</em> #1–2 (2019); <em>Fantastic Four: Life Story</em> #1–6 (2021), la historia del grupo envejeciendo en tiempo real, y <em>Planet of the Apes vs. Fantastic Four</em> #1–4 (2026).</p>'
  - titulo: Conexiones con el resto de la colección
    html: <p><em>Civil War</em>, <em>World War Hulk</em>, <em>Secret Invasion</em>, <em>Fear Itself</em> y <em>Secret Wars</em> están también en el Expediente Mutante I; <em>X-Men/Fantastic Four</em>, <em>Empyre</em>, la Gala de 2021, <em>A.X.E.</em>, <em>Blood Hunt</em>, <em>One World Under Doom</em> y <em>DNX</em>, en el Mutante II; <em>Secret Invasion</em>, <em>Secret Wars</em> y <em>Empyre</em>, en Guardianes, donde además Ben es miembro del equipo entre 2015 y 2017; <em>Civil War</em>, <em>Secret Invasion</em> y <em>Empyre</em>, en Jóvenes Vengadores, y <em>A.X.E.</em>, en Eternos. Si llevas varios expedientes a la vez, lee cada evento una sola vez.</p>
  - titulo: Hasta dónde llega esta guía
    html: '<p>Cerrada a <strong>26 de octubre de 2026</strong>, con <em>Fantastic Four</em> vol. 8 #17 y <em>DNX</em> #3 publicados. Las apariciones están contrastadas una a una con las listas de Marvel Fandom (categorías de Franklin Richards y de los 4 Fantásticos de la Tierra-616) y con las guías de Comic Book Herald. Los órdenes de los eventos siguen las notas de cronología de Marvel Fandom; donde no las hay (<em>Empyre</em>, <em>Fear Itself: FF</em>, <em>Reckoning War</em> y <em>One World Under Doom</em>), el orden de publicación, y cada recuadro lo indica.</p>'
