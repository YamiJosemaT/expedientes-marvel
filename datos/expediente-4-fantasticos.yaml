          titulo: Fantastic Four vol. 5 <span class="nums">#9–13</span>
          creditos: James Robinson · Marc Laming y Leonard Kirk · 2014
          descripcion:
          - Ben, en la cárcel; Johnny, sin poderes; Reed, desaparecido. Detrás de todo hay alguien que odia a Reed, y que secuestra a Franklin y a los niños de la Fundación del campamento de S.H.I.E.L.D. Sue, Ben y Johnny vuelven a ponerse los uniformes azules.
          etiqueta:
            clase: t1
            texto: Esencial
      - serie:
          id: 4f-b7-fantastic-four-14-642-645
          prioridad: p1
          titulo: Fantastic Four vol. 5 <span class="nums">#14</span>, <span class="nums">#642–645</span>
          creditos: James Robinson y otros · Leonard Kirk y otros · 2014–2015
          continuidad:
          - sigue: ▸ Sigue en <em>Secret Wars</em>
          descripcion:
          - 'El responsable, el Hombre Silencioso, un antiguo compañero de universidad obsesionado con Sue, se ha aliado con el Psico-Hombre en la dimensión de bolsillo de Franklin, la del viejo <em>Heroes Reborn</em>, y lanza su invasión. El grupo gana, Johnny recupera los poderes y Ben queda libre. El #645 cierra la serie antes de <em>Secret Wars</em>, con una última escena de Sue y un Franklin que no puede dormir.'
          etiqueta:
            clase: t1
            texto: Esencial
      - serie:
          id: 4f-b7-new-avengers-vol-3-29
          aparicion: true
          donde: En otra serie · Vengadores
          titulo: New Avengers vol. 3 <span class="nums">#29</span>
          creditos: Jonathan Hickman · Kev Walker · 2015
          descripcion:
          - Con el multiverso a punto de morir por las incursiones, los Illuminati prueban una máquina para aprovechar los poderes dormidos de Franklin y crear un universo de bolsillo donde poner a salvo a la Tierra. No funciona, y Franklin se queda con la sensación de haber decepcionado a su padre.
          etiqueta:
            clase: t2
            texto: Recomendado
  - evento:
      id: 4f-b7-secret-wars
      ancla: ev-secretwars
      linea_marvel: true
      etiqueta: Evento de toda la línea Marvel · Mayo 2015 – enero 2016
      titulo: Secret Wars
      creditos: Jonathan Hickman · Esad Ribić
      descripcion:
      - El universo Marvel y el Ultimate chocan y desaparecen. Franklin y la Fundación Futuro construyen las naves para salvar a unos pocos, pero en el último segundo el módulo en el que van Sue, Franklin y Valeria se rompe. <strong>Mueren los tres.</strong> Ocho años después, en el Mundo de Batalla, Doom gobierna como un dios con Sue por esposa y Valeria por hija, sin que ellas recuerden otra vida. Franklin no está.
      - Al final, Reed le quita a Doom el poder de los Beyonders, devuelve la vida a su familia y a la Fundación, y se marcha con ellos y con el Hombre Molécula a reconstruir el multiverso. Franklin, con sus poderes, crea universos nuevos. Es el final de la etapa de Hickman y lo más parecido a un evento de los 4 Fantásticos.
      apartados:
      - apartado: Antes de empezar
        texto: '<em>New Avengers</em> vol. 3 #29 (ficha anterior). Si quieres todo el camino, la etapa de Hickman en <em>Avengers</em> y <em>New Avengers</em> (2013–2015) termina en <em>Time Runs Out</em>.'
      - apartado: Orden de lectura
        texto: 'Free Comic Book Day 2015: Secret Wars #1 → <strong>Secret Wars #1</strong> → <strong>#2</strong> → <strong>#3</strong> → <strong>#4</strong> → <strong>#5</strong> → <strong>#6</strong> → <strong>#7</strong> → <strong>#8</strong> → <strong>#9</strong>'
      - apartado: Prescindible
        texto: Las decenas de miniseries de Battleworld. Ninguna afecta a la familia Richards.
      - apartado: Conexión
        texto: 'El mismo evento cierra el bloque 6 del Expediente Mutante I y el bloque 4 de Guardianes, allí como realidad alterna. Aquí es la historia central: léelo aquí.'
- id: b8
  fechas: 2015 — 2018
