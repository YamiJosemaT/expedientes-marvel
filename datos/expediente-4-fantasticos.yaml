          titulo: Fantastic Four (Age of Ultron) <span class="nums">#5AU</span>
          creditos: Matt Fraction · André Lima Araújo · 2013
          descripcion:
          - 'Tie-in de <em>Age of Ultron</em> en una línea temporal que acaba borrada: Franklin y Valeria se quedan solos en la nave escuchando el último mensaje de sus padres. Muy triste, y sin consecuencias.'
          etiqueta:
            clase: t4
            texto: Al margen de la continuidad
      - serie:
          id: 4f-b7-ff-vol-2-1-8
          prioridad: p2
          titulo: FF vol. 2 <span class="nums">#1–8</span>
          creditos: Matt Fraction · Mike Allred y Joe Quinones · 2012–2013
          continuidad:
          - sigue: ▸ Continúa en la ficha siguiente
          descripcion:
          - 'Los sustitutos: Ant-Man, Medusa, Hulka y la estrella del pop Darla Deering, que se pone una armadura de la Cosa. Pasan los cuatro minutos y no vuelve nadie; en su lugar llega un Johnny anciano que dice que los 4 Fantásticos han muerto a manos de Doom. Franklin y Valeria solo salen en el #1, presentándole la Fundación a Ant-Man antes de irse.'
          etiqueta:
            clase: t2
            texto: Recomendado
