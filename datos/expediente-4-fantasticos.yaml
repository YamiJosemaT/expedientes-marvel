          descripcion:
          - Excursión a Wakanda. Reed acompaña a T’Challa a la Ciudad de los Muertos, bajo el reino, donde Bast le devuelve el manto de Pantera Negra. Los niños, de safari, conocen a Onome, que se une a la Fundación.
          etiqueta:
