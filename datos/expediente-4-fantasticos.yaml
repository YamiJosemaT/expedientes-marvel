          id: 4f-b7-ff-vol-2-14-16
          prioridad: p2
          titulo: FF vol. 2 <span class="nums">#14–16</span>
          creditos: Matt Fraction, Lee Allred y Karl Kesel · Mike Allred · 2013–2014
          continuidad:
