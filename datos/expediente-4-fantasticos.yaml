          creditos: Jonathan Hickman · Nick Dragotta y Ron Garney · 2012
          descripcion:
          - 'Johnny se instala en el piso de Peter Parker hasta que Peter lo echa, se estrena como profesor de la Fundación y pierde unas elecciones en la Zona Negativa frente a Annihilus. En el #606, el grupo se encoge para salvar al cartero Willie Lumpkin de un tumor.'
          etiqueta:
            clase: t2
            texto: Recomendado
