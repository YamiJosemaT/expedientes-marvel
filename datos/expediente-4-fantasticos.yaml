          etiqueta:
            clase: t2
            texto: Recomendado
  - tramo:
      numero: '7.3'
      titulo: La caída de los 4 Fantásticos
      cuando: Febrero 2014 – abril 2015
      nota: 'Robinson vuelve a la numeración histórica a mitad de etapa: después del #14 viene el #642. Los #6–8 llevan la cabecera de <em>Original Sin</em>, pero se entienden sin el evento.'
      entradas:
      - serie:
          id: 4f-b7-fantastic-four-vol-5-1-5
          prioridad: p1
          titulo: Fantastic Four vol. 5 <span class="nums">#1–5</span>
          creditos: James Robinson · Leonard Kirk · 2014
          continuidad:
          - viene: ◂ Viene del tramo 7.2
          - sigue: ▸ Continúa en la ficha siguiente
          descripcion:
          - Sue lo cuenta en una carta a sus hijos. Unos monstruos salen de la dimensión de bolsillo que Franklin creó de niño, el arma que los detiene le quita los poderes a Johnny y los villanos se ceban con el grupo. El gobierno cierra el Edificio Baxter, juzga a los 4 Fantásticos y <strong>se lleva a los niños de la Fundación, Franklin incluido</strong>, a un campamento de S.H.I.E.L.D.
          etiqueta:
            clase: t1
            texto: Esencial
      - serie:
          id: 4f-b7-fantastic-four-vol-5-6-8-fantastic-four-annual-1
          prioridad: p2
          titulo: Fantastic Four vol. 5 <span class="nums">#6–8</span> · Fantastic Four Annual <span class="nums">#1</span>
          creditos: James Robinson · Leonard Kirk y Tom Grummett · 2014
          descripcion:
          - Ben se somete a una cura que sale mal y acaba acusado de matar al Amo de las Marionetas. Valeria, enfadada con su padre, se ha ido a vivir con su «tío» Doom, y en el anual Sue, poseída por Malicia, va a buscarla a Latveria.
          etiqueta:
            clase: t2
            texto: Recomendado
      - serie:
          id: 4f-b7-fantastic-four-vol-5-9-13
