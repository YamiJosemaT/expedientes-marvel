- id: b6
  fechas: 2011 — 2012
  titulo: La Fundación Futuro
  intro: 'Sin Johnny, la serie cambia de nombre a <em>FF</em> y de uniforme a blanco. Spider-Man ocupa su plaza, Doom se une a la Fundación Futuro y los Reeds malvados del Consejo desatan una guerra entre las cuatro ciudades. En noviembre de 2011 vuelve <em>Fantastic Four</em> con el #600, y las dos series se leen juntas hasta que Hickman cierra su etapa. Es el gran momento de Franklin: su yo adulto, con Galactus de heraldo, se enfrenta a los Celestiales locos.'
  navegacion:
    anio: 2011–2012
    texto: La Fundación Futuro
  contenido:
  - tramo:
      numero: '6.1'
      titulo: El sustituto de Johnny
      cuando: Marzo – octubre 2011
      nota: '<em>FF</em> #1–11 cuentan como los números 589–599 de la serie original; por eso la siguiente <em>Fantastic Four</em> es la #600.'
      entradas:
      - serie:
          id: 4f-b6-ff-1-5
          prioridad: p1
          titulo: FF <span class="nums">#1–5</span>
          creditos: Jonathan Hickman · Steve Epting y Barry Kitson · 2011
          continuidad:
          - viene: ◂ Viene del bloque 5
          - sigue: ▸ Continúa en la ficha siguiente
          descripcion:
          - En su testamento, Johnny le deja su sitio en el grupo a Spider-Man. Valeria cumple su trato y Doom entra en la Fundación Futuro para recuperar su mente, aunque su objetivo sigue siendo derrotar a Reed. Mientras, tres Reeds malvados del Consejo, a los que Valeria ayudó a escapar, empiezan una guerra entre la Atlántida antigua, los moloides y la ciudad del Alto Evolucionador.
          etiqueta:
            clase: t1
            texto: Esencial
      - serie:
          id: 4f-b6-ff-6-11
          prioridad: p2
          titulo: FF <span class="nums">#6–11</span>
          creditos: Jonathan Hickman · Greg Tocchini, Steve Epting y Barry Kitson · 2011
          continuidad:
          - sigue: ▸ Sigue en «Forever» (tramo 6.2)
          descripcion:
          - 'Rayo Negro vuelve de entre los muertos y los Inhumanos regresan a la Tierra con sus nuevas esposas; Reed, su padre y Spider-Man negocian con Rayo Negro, y el Pensador Loco y Diablo traicionan a Doom. En el #11, la Inteligencia Suprema kree lanza su flota contra Nueva York, y Valeria ya ha preparado un plan de huida para los niños.'
          etiqueta:
            clase: t2
            texto: Recomendado
      - serie:
          id: 4f-b6-amazing-spider-man-657-661
          aparicion: true
          donde: En otra serie · Spider-Man
          titulo: Amazing Spider-Man <span class="nums">#657–661</span>
          creditos: Dan Slott y otros · Marcos Martín, Stefano Caselli y otros · 2011
          descripcion:
