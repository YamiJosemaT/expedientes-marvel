# Expediente 4 Fantasticos
# Datos del expediente. Los textos admiten HTML en linea (<em>, <strong>, <span class="nums">...).
# Las claves "id" de cada entrada NO se deben cambiar: son las que guardan las marcas de lectura.

clave: 4f
titulo_pagina: Expediente 4 Fantásticos
descripcion_pagina: Guía de lectura de los 4 Fantásticos desde el año 2000 hasta 2026 siguiendo a Franklin Richards, con todas sus series, sus eventos y las apariciones de Franklin en otras colecciones.
cabecera:
  antetitulo: Guía de lectura · Marvel Comics · Franklin Richards
  titulo: Expediente<br/>4 Fantásticos<span class="thin">2000 — 2026</span>
  entradilla: 'Franklin Richards nació en 1968, pero esta guía lo recoge en el año 2000: un niño escondido en otra dimensión mientras sus padres se quedan sin dinero y sin casa. En los veintiséis años siguientes crea universos, tiene a Galactus de heraldo y llega a perder sus poderes. Aquí está la serie de los 4 Fantásticos completa, con sus series hermanas y sus eventos, y cada aparición de Franklin en las colecciones de otros.'
  cifras:
  - valor: '27'
    texto: Años de continuidad
  - valor: '11'
    texto: Bloques de lectura
  - valor: '8'
    texto: Eventos de toda la línea
  - valor: ~750
    texto: Números en total
leyenda: |-
  <p>Mismo sistema que los otros expedientes: <strong>bloques</strong> por etapas, <strong>tramos</strong> que se leen en orden y <strong>eventos</strong> con su orden capítulo a capítulo. Los capítulos <span class="cap">en color</span> dentro de un evento son los de los 4 Fantásticos.</p>
  <p>La serie principal está entera, número a número, salga Franklin o no: es una guía del grupo. La etiqueta de cada ficha mide lo que importa para la familia Richards; la franja distingue lo que es de los 4 Fantásticos de lo que solo los toma prestados.</p>
  <div class="legend-row">
  <span class="key"><span class="swatch"></span> Serie de los 4 Fantásticos o de uno de sus miembros</span>
  <span class="key"><span class="swatch dashed"></span> Aparición en una serie ajena</span>
  </div>
  <div class="legend-row">
  <span class="tag t1">Esencial</span>
  <span class="tag t2">Recomendado</span>
  <span class="tag">Opcional</span>
  <span class="tag t4">Al margen de la continuidad</span>
  </div>
cajas:
- ruta:
    titulo: La ruta corta
    texto: 'Nueve paradas y unos 120 números, solo con lo que gira alrededor de Franklin: su hermana, el Infierno, el yo adulto que le devuelve los poderes, la muerte y la vuelta de <em>Secret Wars</em>, la pérdida de su identidad mutante, su secreto y lo que le pasa a Valeria al final.'
    pasos:
    - <span>Fantastic Four Annual 2001 + Fantastic Four <em>#46–54</em></span>
    - '<span>Fantastic Four <em>#67–70, #500–502</em></span>'
    - <span>Marvel Knights 4 <em>#15–18</em></span>
    - '<span>Dark Reign: Fantastic Four <em>#1–5</em> + Fantastic Four <em>#570–588</em></span>'
    - <span>FF <em>#1–23</em> + Fantastic Four <em>#600–611</em></span>
    - <span>Secret Wars <em>#1–9</em></span>
    - <span>Fantastic Four vol. 6 <em>#1–4</em> + X-Men/Fantastic Four <em>#1–4</em> + vol. 6 <em>#25–26</em></span>
    - '<span>Fantastic Four vol. 7 <em>#1–4, #14–18</em></span>'
    - <span>One World Under Doom <em>#1–9</em> + Will of Doom <em>#1</em></span>
- html: |-
    <h2>Antes de empezar</h2>
    <p>No hace falta haber leído nada: el primer bloque arranca con equipo creativo nuevo y pone al día lo justo. Esto es lo que conviene saber de Franklin hasta el año 2000.</p>
    <ol>
    <li><span>Nace en Fantastic Four Annual #6 (1968): para salvar a Sue en el parto, Reed, Ben y Johnny tienen que robarle a Annihilus su Vara de Control Cósmico en la Zona Negativa.</span></li>
    <li><span>Es un mutante de nivel Omega capaz de alterar la realidad desde muy pequeño. En el #141 (1973) Reed le «apaga» la mente para frenar sus poderes, y desde entonces la familia vive poniéndole cerrojos mentales que acaban saltando. En la etapa de John Byrne (#244–245, 1982) se convierte a sí mismo en adulto.</span></li>
    <li><span>El segundo embarazo de Sue acaba en un parto en el que la niña nace muerta (#267, 1984). Esa hermana es la Valeria de esta guía.</span></li>
    <li><span>De niño entra en Power Pack con el nombre de Tattletale (Power Pack #17, 1985). En Days of Future Present (anuales de 1990) se cruza con su yo adulto de Days of Future Past, y a mediados de los noventa pasa una temporada sustituido por una versión adolescente, Psi-Lord.</span></li>
    <li><span>En Onslaught (1996) los héroes desaparecen dentro de un universo de bolsillo que ha creado él, la Contra-Tierra de Heroes Reborn, y en Heroes Reborn: The Return (1997) los Celestiales lo examinan como a uno de los suyos.</span></li>
    <li><span>En la etapa de Chris Claremont (Fantastic Four vol. 3, 1998–2000) aparece Valeria von Doom, una adolescente de un futuro en el que Sue se casó con el Doctor Muerte. Al final de esa etapa Franklin y Valeria quedan escondidos en Otromundo, y Galactus está muerto desde Galactus: The Devourer (1999–2000).</span></li>
    </ol>
    <p>Si quieres enlazar sin saltos con Claremont, lee antes <em>Fantastic Four Annual 2000</em>: Reed sale de la armadura de Doom en la que estaba atrapado y Sue y él se reconcilian.</p>
bloques:
- id: b1
  fechas: 2000 — 2002
  titulo: El regreso al Baxter Building
  intro: 'Carlos Pacheco y Rafael Marín, con Jeph Loeb a partir del #38, recogen a unos 4 Fantásticos arruinados, sin cuartel general y con los niños lejos de casa. En dos años recuperan el Edificio Baxter, pasan por la Zona Negativa y salvan el multiverso de Abraxas. Ahí entra Franklin: él es la clave de esa victoria, y al terminar Sue vuelve a estar embarazada de una niña que traerá al mundo el Doctor Muerte. Todas las fichas de <em>Fantastic Four</em> de este bloque son del volumen 3 (1998).'
  navegacion:
    anio: 2000–2002
    texto: El regreso al Baxter Building
  contenido:
  - tramo:
      numero: '1.1'
      titulo: Sin casa
      cuando: Septiembre 2000 – enero 2001
      nota: 'El punto de partida. Franklin está en Otromundo con Valeria hasta el #46, así que aquí solo sale en la historia marco de una miniserie opcional.'
      entradas:
      - serie:
          id: 4f-b1-fantastic-four-35-36
          prioridad: p2
          titulo: Fantastic Four <span class="nums">#35–36</span>
          creditos: Carlos Pacheco y Rafael Marín · Carlos Pacheco · 2000
          continuidad:
          - sigue: ▸ Continúa en la ficha siguiente
          descripcion:
          - El grupo necesita dinero y Reed está a punto de vender sus patentes al Gideon Trust, una empresa con muy mala fama. Mientras tanto, Diablo vuelve del Infierno a través de un espejo y destruye el cuartel general de los 4 Fantásticos en el Pier 4.
          etiqueta:
            clase: t2
            texto: Recomendado
      - serie:
          id: 4f-b1-fantastic-four-37-39
          prioridad: p2
          titulo: Fantastic Four <span class="nums">#37–39</span>
          creditos: Carlos Pacheco, Rafael Marín y Jeph Loeb · Carlos Pacheco · 2000–2001
          continuidad:
          - viene: ◂ Viene de la ficha anterior
          - sigue: ▸ Sigue en el tramo 1.2
          descripcion:
          - 'Realojados en Control de Daños, se enfrentan al Súper-Skrull en el rodaje de un western que protagoniza Johnny, y la Gárgola Gris convierte a Ben en piedra. Noah Baxter, el antiguo profesor de Reed, les tiene preparado un regalo: un Edificio Baxter nuevo, construido en órbita, que aterriza en su solar de siempre en Manhattan.'
          etiqueta:
            clase: t2
            texto: Recomendado
      - serie:
          id: 4f-b1-before-the-fantastic-four-ben-grimm-and-logan-reed-richards-the-storms
          titulo: 'Before the Fantastic Four: Ben Grimm and Logan / Reed Richards / The Storms <span class="nums">#1–3</span>'
          creditos: Larry Hama · Peter David · Terry Kavanagh · 2000
          descripcion:
          - 'Tres miniseries de tres números sobre la vida de los cuatro antes del vuelo espacial: Ben de piloto de pruebas con Logan, Reed de aventurero con su novia Alyssa Moy y Sue y Johnny de adolescentes. En la de Reed, el narrador es él mismo, contándole la historia a Franklin.'
          etiqueta:
            clase: opcional
            texto: Opcional
      - serie:
          id: 4f-b1-sentry-fantastic-four-1
          aparicion: true
          donde: En otra serie · The Sentry
          titulo: Sentry/Fantastic Four <span class="nums">#1</span>
          creditos: Paul Jenkins · Phil Winslade · 2000
          descripcion:
          - Uno de los cinco one-shots de <em>The Sentry</em>, la miniserie de Paul Jenkins y Jae Lee sobre un héroe al que todo el mundo había olvidado. Reed recupera el recuerdo de las aventuras que vivieron juntos. Solo tiene sentido si lees la miniserie, y el Centinela no vuelve a importar hasta <em>New Avengers</em> (2005).
          etiqueta:
            clase: opcional
            texto: Opcional
  - tramo:
      numero: '1.2'
      titulo: La Zona Negativa
      cuando: Febrero – julio 2001
      entradas:
      - serie:
          id: 4f-b1-fantastic-four-40-44
          prioridad: p2
          titulo: Fantastic Four <span class="nums">#40–44</span>
          creditos: Carlos Pacheco, Rafael Marín y Jeph Loeb · Pacheco, Stuart Immonen y Joe Bennett · 2001
          continuidad:
          - viene: ◂ Viene del tramo 1.1
          descripcion:
          - 'El Gideon Trust abre un portal a la Zona Negativa con la tecnología de Reed para saquearla, y Reed, Sue y Ben se quedan atrapados allí: peregrinos del siglo XV, Maximus el Loco entre las ruinas de las Cuatro Libertades y un Annihilus capturado. En la Tierra, Johnny monta un equipo de emergencia con Namor, Namorita, Hulka y Ant-Man.'
          - Detrás del Trust está Richard Janus, el Nega-Hombre, compañero de universidad de Reed y de Doom. Noah Baxter desaparece salvando Nueva York, y Johnny absorbe tanta energía negativa que ya no puede apagar su llama.
          etiqueta:
            clase: t2
            texto: Recomendado
      - serie:
          id: 4f-b1-fantastic-four-45
          prioridad: p2
          titulo: Fantastic Four <span class="nums">#45</span>
          creditos: Carlos Pacheco, Rafael Marín y Jeph Loeb · Jeff Johnson · 2001
          continuidad:
          - sigue: ▸ Sigue en el tramo 1.3
          descripcion:
          - Ben, que ahora puede pasar a voluntad de humano a Cosa, deja el grupo y se va a Florida a buscar a Alicia Masters. Allí le espera el Amo de las Marionetas. Al final, Ben y Alicia deciden quedarse como amigos. Mientras, Reed le fabrica a Johnny un traje que contenga su llama.
          etiqueta:
            clase: t2
            texto: Recomendado
  - tramo:
      numero: '1.3'
      titulo: Abraxas
      cuando: Julio – diciembre 2001
      nota: 'El anual se publicó entre el #45 y el #46, y es el primer capítulo de la saga.'
      entradas:
      - serie:
          id: 4f-b1-fantastic-four-annual-2001
          prioridad: p1
          titulo: Fantastic Four Annual <span class="nums">2001</span>
          creditos: Carlos Pacheco, Rafael Marín y Jeph Loeb · Kevin Maguire y Leinil Francis Yu · 2001
          continuidad:
          - viene: ◂ Viene del tramo 1.2
          - sigue: ▸ Continúa en la ficha siguiente
          descripcion:
          - La cabeza cortada de un Galactus de otra realidad cae en Central Park, y dentro hay una Nova de otro universo. El Vigilante ha perdido la memoria, las realidades empiezan a mezclarse, y lejos de allí una sombra persigue a Franklin y a Valeria y hace desaparecer a la niña.
          - En la historia corta, Ben sale a cazar al Hombre Dragón para regalárselo a Franklin por su cumpleaños.
          etiqueta:
            clase: t1
            texto: Esencial
      - serie:
          id: 4f-b1-fantastic-four-46-49
          prioridad: p1
          titulo: Fantastic Four <span class="nums">#46–49</span>
          creditos: Carlos Pacheco, Rafael Marín y Jeph Loeb · Pacheco y Jeff Johnson · 2001
          continuidad:
          - viene: ◂ Viene de la ficha anterior
          - sigue: '▸ Sigue en el #50'
          descripcion:
          - 'Franklin y Valeria vuelven a casa, y Franklin dice que conoce a Abraxas de sus sueños: un ser que va de universo en universo destruyendo a cada Galactus. Reed, Sue y Ben recorren realidades alternativas buscando las coordenadas del Anulador Supremo, mientras Roma y Saturnyne les enseñan a los niños cómo avanza la búsqueda.'
          - <strong>El momento clave de Franklin en este bloque.</strong> Les revela a su madre y a su hermana que Valeria es la niña que nació muerta, y que fue él quien la salvó sin saberlo y la llevó a un futuro posible. Juntos resucitan a Galactus. Tras derrotar a Abraxas, Valeria ha desaparecido y Sue vuelve a estar embarazada.
          etiqueta:
            clase: t1
            texto: Esencial
      - serie:
          id: 4f-b1-fantastic-four-1-2-3-4-1-4
          titulo: 'Fantastic Four: 1 2 3 4 <span class="nums">#1–4</span>'
          creditos: Grant Morrison · Jae Lee · 2001
          descripcion:
          - 'Doom usa una máquina que altera la realidad para desmontar al grupo de uno en uno: devuelve a Ben a su forma humana, empuja a Sue hacia Namor y va a por Reed con un Doombot gigante. Salió a la vez que la saga de Abraxas, pero se lee aparte: es una miniserie autoconclusiva con un tono muy distinto, y Franklin no sale.'
          etiqueta:
            clase: opcional
            texto: Opcional
      - serie:
          id: 4f-b1-fantastic-four-50
          prioridad: p2
          titulo: Fantastic Four <span class="nums">#50</span>
          creditos: Carlos Pacheco, Rafael Marín y Jeph Loeb · Tom Grummett y otros · 2001
          continuidad:
          - viene: '◂ Viene del #49'
          - sigue: ▸ Sigue en el tramo 1.4
          descripcion:
          - El aniversario del grupo, contado sin una sola palabra (forma parte del mes «’Nuff Said» de Marvel). Cada uno de los cuatro recuerda sus primeros días con poderes, y Sue se hace la primera ecografía del nuevo embarazo. Incluye dos historias cortas, una de ellas de humor.
          etiqueta:
            clase: t2
            texto: Recomendado
  - tramo:
      numero: '1.4'
      titulo: Valeria
      cuando: Noviembre 2001 – abril 2002
      entradas:
      - serie:
          id: 4f-b1-doom-the-emperor-returns-1-3
          aparicion: true
          donde: En otra serie · Doctor Muerte
          titulo: 'Doom: The Emperor Returns <span class="nums">#1–3</span>'
          creditos: Chuck Dixon · Leonardo Manco · 2001–2002
          descripcion:
          - 'Doom sigue siendo emperador de la Contra-Tierra, el mundo que creó Franklin. Absorbe la energía del núcleo del planeta y se aburre de un mundo que ya no le opone resistencia. Franklin solo aparece en una pantalla. Es una aventura de Doom en solitario, y en el #53 vuelve a estar en Nueva York.'
          etiqueta:
            clase: opcional
            texto: Opcional
      - serie:
          id: 4f-b1-thing-she-hulk-the-long-night-1
          titulo: 'Thing &amp; She-Hulk: The Long Night <span class="nums">#1</span>'
          creditos: Todd DeZago · Bryan Hitch e Ivan Reis · 2002
          descripcion:
          - Un derrumbe atrapa en el metro a Ben y a Hulka, cada uno en su vagón, entre una secta de vampiros que intenta salir a la superficie y un Hombre Dragón al que un laboratorio de Roxxon intentaba controlar. Un one-shot suelto, sin consecuencias.
          etiqueta:
            clase: opcional
            texto: Opcional
      - serie:
          id: 4f-b1-fantastic-four-51-54
          prioridad: p1
          titulo: Fantastic Four <span class="nums">#51–54</span>
          creditos: Carlos Pacheco, Rafael Marín y Karl Kesel · Mark Bagley · 2002
          continuidad:
          - viene: ◂ Viene del tramo 1.3
          - sigue: ▸ Sigue en el tramo 1.5
          descripcion:
          - Los Inhumanos llegan a la ONU huyendo de unos cazarrecompensas shi’ar, y el miedo a los alienígenas se dispara. Detrás están los Ocultos, una rama perdida de los Inhumanos infiltrada en los gobiernos desde la Segunda Guerra Mundial. Doom ofrece asilo en Latveria. Franklin empieza el colegio con nombre falso, Richard Franklin, y tiene su primer amigo y su primer matón.
          - 'En el #54, el parto se complica por la energía de la Zona Negativa y Reed está desaparecido. Johnny va a pedirle ayuda al único que puede salvar a su hermana: <strong>el Doctor Muerte trae al mundo a la niña</strong>, cura de paso a Johnny, y a cambio exige elegir el nombre. La llama Valeria y la pone bajo su protección. Johnny será el padrino.'
          etiqueta:
            clase: t1
            texto: Esencial
  - tramo:
      numero: '1.5'
      titulo: Entre etapas
      cuando: Mayo – septiembre 2002
      nota: 'Números sueltos de Karl Kesel y Adam Warren hasta que llegue Mark Waid. <em>Thing: Freakshow</em> va antes de los #57–59, el arco en el que Ben pierde la capacidad de volver a ser humano.'
      entradas:
      - serie:
          id: 4f-b1-fantastic-four-55
          titulo: Fantastic Four <span class="nums">#55</span>
          creditos: Karl Kesel · Stuart Immonen · 2002
          continuidad:
          - viene: ◂ Viene del tramo 1.4
          descripcion:
          - 'Una noche de chicos: Sue sale con Janet van Dyne, Reed se queda en el laboratorio y Ben y Johnny persiguen por media ciudad a un «skrull» que les ha robado el Fantasticoche.'
          etiqueta:
            clase: opcional
            texto: Opcional
      - serie:
          id: 4f-b1-fantastic-four-56
          prioridad: p2
          titulo: Fantastic Four <span class="nums">#56</span>
          creditos: Karl Kesel · Stuart Immonen · 2002
          descripcion:
          - Ben vuelve a la calle Yancy y a la casa de empeños del señor Sheckerberg, a quien le robó una estrella de David de pequeño. Es el número en que se dice por primera vez, sin rodeos, que Ben Grimm es judío. Franklin no sale, pero es una de las historias más recordadas de la Cosa.
          etiqueta:
            clase: t2
            texto: Recomendado
      - serie:
          id: 4f-b1-thing-freakshow-1-4
          titulo: 'Thing: Freakshow <span class="nums">#1–4</span>'
          creditos: Geoff Johns · Scott Kolins · 2002
          descripcion:
          - 'Ben se reencuentra en una feria ambulante con Istvan, el chico albino del que se burló de niño y cuya madre lo maldijo por ello. En el pueblo de la feria pasa algo raro: kree y skrulls se disputan un bebé Vigilante.'
          etiqueta:
            clase: opcional
            texto: Opcional
      - serie:
          id: 4f-b1-fantastic-four-57-59
          prioridad: p2
          titulo: Fantastic Four <span class="nums">#57–59</span>
          creditos: Adam Warren · Keron Grant · 2002
          continuidad:
          - sigue: ▸ Sigue en el bloque 2 (Waid y Wieringo)
          descripcion:
          - A Ben le salen de la piel nódulos que crecen hasta convertirse en copias suyas, cada vez más violentas. Reed las encierra con él en un universo de bolsillo y consulta a un «Congreso de Reeds» de otras realidades. Para pararlas, <strong>Ben pierde la capacidad de volver a su forma humana</strong>, que había recuperado poco antes de este bloque.
          etiqueta:
            clase: t2
            texto: Recomendado
- id: b2
  fechas: 2002 — 2005
  titulo: Imaginautas
  intro: 'Mark Waid y Mike Wieringo entienden a los 4 Fantásticos como una familia de exploradores más que como superhéroes, y escriben una de las etapas más queridas del grupo. Es también la más dura para Franklin: Doom, convertido en hechicero, lo arrastra al Infierno, y el niño vuelve traumatizado. Después el grupo gobierna Latveria, pierde a Ben y va a buscarlo al Cielo. En paralelo, <em>Marvel Knights 4</em> los deja sin dinero y sin casa. Las fichas de <em>Fantastic Four</em> siguen siendo del volumen 3, que en el #70 recupera la numeración histórica y salta al #500.'
  navegacion:
    anio: 2002–2005
    texto: Imaginautas
  contenido:
  - tramo:
      numero: '2.1'
      titulo: Una familia de exploradores
      cuando: Agosto 2002 – febrero 2003
      nota: 'El #60 es el mejor punto de entrada de toda la década, si alguna vez quieres recomendarle la serie a alguien.'
      entradas:
      - serie:
          id: 4f-b2-fantastic-four-60-61
          prioridad: p2
          titulo: Fantastic Four <span class="nums">#60–61</span>
          creditos: Mark Waid · Mike Wieringo · 2002
          continuidad:
          - viene: ◂ Viene del bloque 1
          descripcion:
          - 'Un relaciones públicas contratado para mejorar la imagen del grupo pasa un domingo con ellos y descubre que no son superhéroes, sino una familia que se dedica a explorar. En el #61, Sue nombra a Johnny director financiero de Fantastic Four Inc. para obligarlo a madurar.'
          etiqueta:
            clase: t2
            texto: Recomendado
      - serie:
          id: 4f-b2-fantastic-four-62-64
          prioridad: p2
          titulo: Fantastic Four <span class="nums">#62–64</span>
          creditos: Mark Waid · Mike Wieringo · 2002
          descripcion:
          - 'Un ataque místico contra Franklin y Valeria burla la seguridad del edificio, y es el primer aviso de lo que prepara Doom. Mientras, una expresión matemática viva, Modulus, nace de las ecuaciones de Reed, se enamora de él y quiere eliminar a todo lo que le hace sombra, empezando por su familia. Detrás está Franklin: sin poderes desde que resucitó a su hermana y sintiéndose desplazado por ella, lo provoca sin querer intentando llamar la atención de su padre.'
          etiqueta:
            clase: t2
            texto: Recomendado
      - serie:
          id: 4f-b2-fantastic-four-65-66
          prioridad: p2
          titulo: Fantastic Four <span class="nums">#65–66</span>
          creditos: Mark Waid · Mark Buckingham · 2003
          continuidad:
          - sigue: ▸ Sigue en el tramo 2.2
          descripcion:
          - Johnny estrena su cargo vendiendo licencias de las moléculas inestables de Reed, con su ayudante Jian Feeta y dos ejecutivos que quieren verlo fracasar. Mientras, Reed y Ben se encogen para cazar un bicho de otra dimensión que se ha colado en el edificio.
          etiqueta:
            clase: t2
            texto: Recomendado
  - tramo:
      numero: '2.2'
      titulo: Unthinkable
      cuando: Marzo – agosto 2003
      nota: 'La historia central de este bloque, y una de las más importantes de Franklin. El #67 es el prólogo: no te lo saltes.'
      entradas:
      - serie:
          id: 4f-b2-fantastic-four-67
          prioridad: p1
          titulo: Fantastic Four <span class="nums">#67</span>
          creditos: Mark Waid · Mike Wieringo · 2003
          continuidad:
          - viene: ◂ Viene del tramo 2.1
          descripcion:
          - Doom busca a Valeria, su amor de juventud, para entregarla a unos demonios a cambio de un poder mágico inmenso. Ha decidido abandonar la ciencia por la magia, y su piel se convierte en su nueva armadura.
          etiqueta:
            clase: t1
            texto: Esencial
      - serie:
          id: 4f-b2-fantastic-four-68-70-500
          prioridad: p1
          titulo: Fantastic Four <span class="nums">#68–70</span>, <span class="nums">#500</span>
          creditos: Mark Waid · Mike Wieringo · 2003
          descripcion:
          - 'La primera palabra de la pequeña Valeria es «Doom»: al ayudar en su parto, Doom la convirtió en su familiar. Franklin cae al Infierno a través del teletransportador de Reed, y Johnny se quema con fuego infernal intentando sacarlo. En Latveria, ni los poderes ni los inventos del grupo sirven contra la magia de Doom.'
          - Reed, encerrado en la biblioteca mística de Doom, tiene que aprender magia con la ayuda del Doctor Extraño para rescatar a su hijo. Lo consigue y Doom acaba en el Infierno, pero Reed sale con media cara desfigurada.
          etiqueta:
            clase: t1
            texto: Esencial
      - serie:
          id: 4f-b2-fantastic-four-501-502
          prioridad: p1
          titulo: Fantastic Four <span class="nums">#501–502</span>
          creditos: Mark Waid · Casey Jones · 2003
          continuidad:
          - sigue: ▸ Sigue en el tramo 2.3
          descripcion:
          - '<strong>Las secuelas en Franklin.</strong> Vuelve del Infierno cerrado en sí mismo, dibujando lo que vio allí, y estalla contra los fans en una excursión a Coney Island. Ben le cuenta cómo nació: su familia entró en la Zona Negativa y se jugó la vida contra Annihilus para salvarlo. Así Franklin entiende que puede volver a sentirse a salvo.'
          etiqueta:
            clase: t1
            texto: Esencial
  - tramo:
      numero: '2.3'
      titulo: Latveria y el Cielo
      cuando: Agosto 2003 – marzo 2004
      nota: <em>Human Torch</em>, la serie de Johnny, se publicó a lo largo de todo este tramo y del anterior; léela al final o intercalada.
      entradas:
      - serie:
          id: 4f-b2-fantastic-four-503-508
          prioridad: p2
          titulo: Fantastic Four <span class="nums">#503–508</span>
          creditos: Mark Waid · Howard Porter · 2003
          continuidad:
          - viene: ◂ Viene del tramo 2.2
          - sigue: ▸ Continúa en la ficha siguiente
          descripcion:
          - Con Doom en el Infierno, los 4 Fantásticos ocupan Latveria para desmantelar su arsenal antes de que vuelva, y Reed se proclama su gobernante. La ONU y Nick Fury los tratan como invasores. Doom escapa poseyendo a Sue y después a Ben, y Reed tiene que matar a su mejor amigo para detenerlo. El grupo vuelve a casa odiado por el público.
          etiqueta:
            clase: t2
            texto: Recomendado
      - serie:
          id: 4f-b2-fantastic-four-509-511
          prioridad: p2
          titulo: Fantastic Four <span class="nums">#509–511</span>
          creditos: Mark Waid · Mike Wieringo · 2004
          continuidad:
          - viene: ◂ Viene de la ficha anterior
          - sigue: ▸ Sigue en el tramo 2.4
          descripcion:
          - Reed, Sue y Johnny viajan al Cielo para traer de vuelta el alma de Ben, que no quiere volver. Al final del camino les espera Dios, que tiene el aspecto de Jack Kirby. Ben resucita y a Reed se le cura la cara.
          etiqueta:
            clase: t2
            texto: Recomendado
      - serie:
          id: 4f-b2-human-torch-1-12
          titulo: Human Torch <span class="nums">#1–12</span>
          creditos: Karl Kesel · Skottie Young y otros · 2003–2004
          descripcion:
          - La serie en solitario de Johnny. El primer arco lo enfrenta a un pirómano que mata a los bomberos del equipo de Mike Snow, su rival del instituto, y saca a la luz un secreto de juventud de los dos. Después, una orden de caballeros en los Balcanes con una máquina para encoger a la gente, y dos números sueltos.
          etiqueta:
            clase: opcional
            texto: Opcional
  - tramo:
      numero: '2.4'
      titulo: Sin un dólar
      cuando: Abril – noviembre 2004
      nota: 'Según Marvel Fandom, los #1–12 de <em>Marvel Knights 4</em> ocurren entre el #516 y el #517 de la serie principal, y en ese orden van aquí.'
      entradas:
      - serie:
          id: 4f-b2-fantastic-four-512-513
          prioridad: p2
          titulo: Fantastic Four <span class="nums">#512–513</span>
          creditos: Mark Waid · Mike Wieringo y Paul Smith · 2004
          continuidad:
          - viene: ◂ Viene del tramo 2.3
          descripcion:
          - Johnny no soporta que Spider-Man sea más popular que él, y Franklin le gasta una broma con una gorra de Spider-Man. Lo arreglan peleando juntos contra Hydro-Man. En las historias cortas reaparece Alyssa Moy, la exnovia de Reed, y Sue la acompaña al pasado.
          etiqueta:
            clase: t2
            texto: Recomendado
      - serie:
          id: 4f-b2-fantastic-four-514-516
          prioridad: p2
          titulo: Fantastic Four <span class="nums">#514–516</span>
          creditos: Mark Waid y Karl Kesel · Paco Medina · 2004
          continuidad:
          - sigue: ▸ Sigue en <em>Marvel Knights 4</em>
          descripcion:
          - Los Cuatro Terribles vuelven a la carga, y el Hombre Mago infiltra en el Edificio Baxter a su propia hija, Cole, que empieza a salir con Johnny. Ella acaba cambiando de bando.
          etiqueta:
            clase: t2
            texto: Recomendado
      - serie:
          id: 4f-b2-marvel-knights-4-1-4
          prioridad: p2
          titulo: Marvel Knights 4 <span class="nums">#1–4</span>
          creditos: Roberto Aguirre-Sacasa · Steve McNiven · 2004
          continuidad:
          - viene: '◂ Viene del #516'
          - sigue: ▸ Continúa en la ficha siguiente
          descripcion:
          - Empieza en el octavo cumpleaños de Franklin, y ese mismo día se enteran de que están arruinados. La ciudad les reclama los daños de todos estos años y tienen que dejar el Edificio Baxter. Se mudan a un hotel modesto de Washington Heights y buscan trabajos normales. Es una serie de los 4 Fantásticos del sello Marvel Knights, con tono de drama familiar.
          etiqueta:
            clase: t2
            texto: Recomendado
      - serie:
          id: 4f-b2-marvel-knights-4-5-9
          prioridad: p2
          titulo: Marvel Knights 4 <span class="nums">#5–9</span>
          creditos: Roberto Aguirre-Sacasa · Steve McNiven y Jim Muniz · 2004
          continuidad:
          - viene: ◂ Viene de la ficha anterior
          descripcion:
          - Una acampada con Franklin y sus amigos del colegio en los Pine Barrens de Nueva Jersey termina con una nave alienígena aterrizada al lado. Johnny entra en el cuerpo de bomberos de Nueva York, y Reed y Namor se pegan en la calle porque Namor ha vuelto a tirarle los tejos a Sue.
          etiqueta:
            clase: t2
            texto: Recomendado
      - serie:
          id: 4f-b2-marvel-knights-4-10-12
          prioridad: p2
          titulo: Marvel Knights 4 <span class="nums">#10–12</span>
          creditos: Roberto Aguirre-Sacasa · Jim Muniz · 2004
          continuidad:
          - sigue: '▸ Sigue en el #517 (tramo 2.5)'
          descripcion:
          - El Psico-Hombre vuelve para vengarse de Sue y siembra el pánico en toda la ciudad. Sue teme que la ausencia de Reed esté afectando a Franklin. Al derrotarlo, el grupo recupera el Edificio Baxter y su fortuna.
          etiqueta:
            clase: t2
            texto: Recomendado
      - serie:
          id: 4f-b2-hulk-thing-hard-knocks-1-4
          titulo: 'Hulk &amp; Thing: Hard Knocks <span class="nums">#1–4</span>'
          creditos: Bruce Jones · Jae Lee · 2004
          descripcion:
          - Ben busca a Bruce Banner en un bar perdido del desierto porque quiere hablar con Hulk, y le cuenta cómo fue su primera pelea de verdad. Conversación y puñetazos a partes iguales.
          etiqueta:
            clase: opcional
            texto: Opcional
  - tramo:
      numero: '2.5'
      titulo: Heraldo de Galactus
      cuando: Agosto 2004 – marzo 2005
      nota: 'Los #517–519 llevan la cabecera de <em>Avengers Disassembled</em> solo porque pasan justo después: los Vengadores se acaban de disolver (Expediente Mutante I, bloque 1). No hace falta leerlo.'
      entradas:
      - serie:
          id: 4f-b2-fantastic-four-517-519
          prioridad: p2
          titulo: Fantastic Four <span class="nums">#517–519</span>
          creditos: Mark Waid · Mike Wieringo · 2004
          continuidad:
          - viene: '◂ Viene de <em>Marvel Knights 4</em> #12 (tramo 2.4)'
          - sigue: ▸ Continúa en la ficha siguiente
          descripcion:
          - Empieza con Sue y Ben llevando a Franklin y a Valeria a pedir caramelos en Halloween. Unos supervivientes de un mundo devorado por Galactus levantan Manhattan en el aire, porque los poderes de Sue pueden revelar los planetas que se esconden de él. Para salvarla, Reed le intercambia los poderes con Johnny, y Galactus se lleva a Johnny como heraldo.
          etiqueta:
            clase: t2
            texto: Recomendado
      - serie:
          id: 4f-b2-fantastic-four-520-523
          prioridad: p2
          titulo: Fantastic Four <span class="nums">#520–523</span>
          creditos: Mark Waid · Mike Wieringo · 2004–2005
          continuidad:
          - viene: ◂ Viene de la ficha anterior
          descripcion:
          - Con ayuda de Quasar, el grupo persigue a Galactus por el espacio mientras Johnny, convertido en heraldo, se niega a ayudarlo a matar. Johnny consigue devolver a Galactus a su forma mortal, Galan, y Ben se lo lleva a la calle Yancy a que aprenda lo que es ser humano. Al final, un aparato de Reed reparte sus poderes entre cuatro neoyorquinos al azar.
          etiqueta:
            clase: t2
            texto: Recomendado
      - serie:
          id: 4f-b2-fantastic-four-524
          prioridad: p2
          titulo: Fantastic Four <span class="nums">#524</span>
          creditos: Mark Waid · Mike Wieringo · 2005
          continuidad:
          - sigue: ▸ Sigue en el tramo 2.6
          descripcion:
          - Recuperan sus poderes persiguiéndolos por la ciudad, vuelven a casa con los niños y parten hacia el Microverso. Es la despedida de Waid y Wieringo.
          etiqueta:
            clase: t2
            texto: Recomendado
  - tramo:
      numero: '2.6'
      titulo: Cambio de guardia
      cuando: Diciembre 2004 – junio 2005
      nota: '<em>Marvel Knights 4</em> #13–18 se publicó a la vez que «Rising Storm», pero va mejor después: así no interrumpe la historia de Galactus. Las tres miniseries del final son opcionales y salieron en los mismos meses.'
      entradas:
      - serie:
          id: 4f-b2-marvel-knights-4-13-14
          prioridad: p2
          titulo: Marvel Knights 4 <span class="nums">#13–14</span>
          creditos: Roberto Aguirre-Sacasa · Jim Muniz · 2004–2005
          continuidad:
          - viene: ◂ Viene del tramo 2.5
          descripcion:
          - El Amo de las Marionetas le devuelve la vista a Alicia Masters, su hijastra, con unas operaciones para las que roba los ojos de mujeres asesinadas. Después va a por los de Sue. Con Daredevil.
          etiqueta:
            clase: t2
            texto: Recomendado
      - serie:
          id: 4f-b2-marvel-knights-4-15-18
          prioridad: p1
          titulo: Marvel Knights 4 <span class="nums">#15–18</span>
          creditos: Roberto Aguirre-Sacasa · Jim Muniz · 2005
          descripcion:
          - <strong>Una historia de Franklin.</strong> Concentrado en batear el golpe de la victoria en un partido de béisbol, borra sin querer ocho minutos del tiempo. En plena crisis temporal, un viajero en el tiempo, Ramades, deja a sus padres y a Ben atrapados en el antiguo Egipto, y Franklin y H.E.R.B.I.E. se quedan solos en el presente para arreglarlo.
          - Johnny acaba en un futuro gobernado por Doom, donde lo ayuda una Valeria adulta, y en Egipto aparece Nathaniel Richards, el padre de Reed.
          etiqueta:
            clase: t1
            texto: Esencial
      - serie:
          id: 4f-b2-fantastic-four-525-526
          prioridad: p2
          titulo: Fantastic Four <span class="nums">#525–526</span>
          creditos: Karl Kesel · Tom Grummett · 2005
          continuidad:
          - sigue: ▸ Sigue en el bloque 3
          descripcion:
          - De vuelta del Microverso, la familia entera contrae una enfermedad que les hace soñar los sueños de los demás, justo cuando reaparece Diablo. Dos números de transición antes de que llegue Straczynski.
          etiqueta:
            clase: t2
            texto: Recomendado
      - serie:
          id: 4f-b2-x-men-fantastic-four-1-5
          titulo: X-Men/Fantastic Four <span class="nums">#1–5</span>
          creditos: Akira Yoshida · Pat Lee · 2004–2005
          descripcion:
          - X-Men y 4 Fantásticos contra los Brood, que han tomado una estación espacial. Cuatro X-Men quedan expuestos a rayos cósmicos y Reed y Bestia tienen que curarlos.
          etiqueta:
            clase: opcional
            texto: Opcional
      - serie:
          id: 4f-b2-spider-man-human-torch-1-5
          titulo: Spider-Man/Human Torch <span class="nums">#1–5</span>
          creditos: Dan Slott · Ty Templeton · 2005
          descripcion:
          - La amistad entre Johnny y Peter Parker contada en cinco épocas, de sus primeros piques a la actualidad. En el último número, Peter lleva a la tía May y a Mary Jane a cenar con los 4 Fantásticos por primera vez. Franklin sale en ese número.
          etiqueta:
            clase: opcional
            texto: Opcional
      - serie:
          id: 4f-b2-fantastic-four-foes-1-6
          titulo: 'Fantastic Four: Foes <span class="nums">#1–6</span>'
          creditos: Robert Kirkman · Cliff Rathburn · 2005
          descripcion:
          - 'Los villanos del grupo empiezan a atacar uno tras otro, y Reed calcula que a ese ritmo estarán todos muertos en dos años. La pista lleva a un vecino del propio Edificio Baxter. Franklin sale en los #1–4.'
          etiqueta:
            clase: opcional
            texto: Opcional
- id: b3
  fechas: 2005 — 2008
  titulo: Guerra civil
  intro: 'J. Michael Straczynski devuelve el dinero al grupo y busca el origen de sus poderes, pero la etapa la define <em>Civil War</em>: Reed apoya el registro de superhéroes, Sue se va con la resistencia y la familia se rompe. Dwayne McDuffie la recompone con Pantera Negra y Tormenta cubriendo las plazas de Reed y Sue. Franklin, sin poderes desde que resucitó a su hermana, pasa por una amenaza de los servicios sociales y por la vuelta de Onslaught. <em>Marvel Knights 4</em> termina a mediados de 2006.'
  navegacion:
    anio: 2005–2008
    texto: Guerra civil
  contenido:
  - tramo:
      numero: '3.1'
      titulo: Ricos otra vez
      cuando: Mayo 2005 – febrero 2006
      nota: Las dos series se publicaron a la vez y no se cruzan. <em>Marvel Knights 4</em> puede leerse antes o después de la ficha de Straczynski.
      entradas:
      - serie:
          id: 4f-b3-fantastic-four-527-532
          prioridad: p2
          titulo: Fantastic Four <span class="nums">#527–532</span>
          creditos: J. Michael Straczynski · Mike McKone · 2005
          continuidad:
          - viene: ◂ Viene del bloque 2
          - sigue: ▸ Sigue en el tramo 3.2
          descripcion:
          - Ben descubre que tiene una fortuna ahorrada, y el gobierno ficha a Reed para un proyecto que quiere repetir la tormenta de rayos cósmicos que creó a los 4 Fantásticos y fabricar supersoldados. Reed lo sabotea y el grupo sale al encuentro de la tormenta. Resulta ser el mensaje de una entidad alienígena perseguida por los suyos, que arrastra a Reed hasta el Big Bang.
          etiqueta:
            clase: t2
            texto: Recomendado
      - serie:
          id: 4f-b3-marvel-knights-4-19-24
          prioridad: p2
          titulo: Marvel Knights 4 <span class="nums">#19–24</span>
          creditos: Roberto Aguirre-Sacasa · Valentine De Landro y Mizuki Sakakibara · 2005
          continuidad:
          - viene: ◂ Viene del bloque 2
          descripcion:
          - Una inhumana y un alfa primitivo huyen juntos de la Luna y Franklin los ayuda a escapar de Gorgon. Después, el aniversario de boda de Reed y Sue, un gólem en la calle Yancy y la familia Imposible, que secuestra a Franklin y a Valeria en una historia en la que el propio guionista entra en el Edificio Baxter.
          etiqueta:
            clase: t2
            texto: Recomendado
      - serie:
          id: 4f-b3-thing-1-8
          titulo: Thing <span class="nums">#1–8</span>
          creditos: Dan Slott · Andrea Di Vito y Kieron Dwyer · 2005–2006
          descripcion:
          - 'La serie de Ben como millonario: sale con una actriz, cae en la trampa mortal de Arcade, viaja a la antigua Grecia con Alicia y celebra la partida de póquer de superhéroes más grande de la historia. Franklin y Valeria salen en los #4 y #7. Ligera y muy querida.'
          etiqueta:
            clase: opcional
            texto: Opcional
      - serie:
          id: 4f-b3-fantastic-four-the-wedding-special-1-fantastic-four-special-1
          titulo: 'Fantastic Four: The Wedding Special <span class="nums">#1</span> · Fantastic Four Special <span class="nums">#1</span>'
          creditos: Karl Kesel · Drew Johnson / Dwayne McDuffie · Casey Jones · 2005
          descripcion:
          - 'Dos especiales. En el primero, Kesel recorre la historia de Reed y Sue, desde la víspera del vuelo espacial hasta una vejez juntos. En el segundo, Reed cena con Doom en la embajada latveriana y le devuelve algo que recuperó del accidente que le desfiguró la cara: un medallón con una foto de su madre.'
          etiqueta:
            clase: opcional
            texto: Opcional
      - serie:
          id: 4f-b3-fantastic-four-iron-man-big-in-japan-1-4-captain-universe-invisible-wo
          titulo: 'Fantastic Four/Iron Man: Big in Japan <span class="nums">#1–4</span> · Captain Universe/Invisible Woman <span class="nums">#1</span>'
          creditos: Zeb Wells · Seth Fisher / Jay Faerber · James Raiz · 2005–2006
          descripcion:
          - Monstruos gigantes en Tokio, en homenaje a Godzilla, con Iron Man. Y un one-shot en el que la Uni-Fuerza del Capitán Universo elige a Sue y Gladiador viene a reclamarla para el imperio shi’ar.
          etiqueta:
            clase: opcional
            texto: Opcional
      - serie:
          id: 4f-b3-franklin-richards-son-of-a-genius-y-otros-quince-especiales
          titulo: 'Franklin Richards: Son of a Genius y otros quince especiales'
          creditos: Chris Eliopoulos y Marc Sumerak · Chris Eliopoulos · 2005–2009
          descripcion:
          - 'Dieciséis one-shots de humor para todos los públicos, a lo <em>Calvin y Hobbes</em>: Franklin, con H.E.R.B.I.E. de niñera, usa los inventos de su padre y siempre acaba desastre. Van de <em>Son of a Genius</em> (septiembre de 2005) a <em>School’s Out</em> (julio de 2009), y varios parodian los eventos del momento (<em>World War Hulk</em>, <em>Secret Invasion</em>, <em>Dark Reign</em>). No cuentan para la continuidad.'
          etiqueta:
            clase: t4
            texto: Al margen de la continuidad
  - tramo:
      numero: '3.2'
      titulo: Camino de la guerra
      cuando: Diciembre 2005 – junio 2006
      entradas:
      - serie:
          id: 4f-b3-fantastic-four-533-535
          prioridad: p1
          titulo: Fantastic Four <span class="nums">#533–535</span>
          creditos: J. Michael Straczynski · Mike McKone · 2005–2006
          continuidad:
          - viene: ◂ Viene del tramo 3.1
          - sigue: ▸ Continúa en la ficha siguiente
          descripcion:
          - 'Los servicios sociales de Nueva York deciden que el Edificio Baxter no es lugar para criar niños y se llevan a Franklin y a Valeria a una casa de acogida secreta. Reed no se opone: tiene un plan para demostrar que donde están más seguros es en casa. Mientras, Ben y Johnny intentan frenar a un Hulk gris enloquecido en Las Vegas, la pelea que convence a los Illuminati de exiliarlo al espacio.'
          etiqueta:
            clase: t1
            texto: Esencial
      - serie:
          id: 4f-b3-marvel-knights-4-25-30
          prioridad: p2
          titulo: Marvel Knights 4 <span class="nums">#25–30</span>
          creditos: Roberto Aguirre-Sacasa · Valentine De Landro, Mizuki Sakakibara y Clay Mann · 2005–2006
          continuidad:
          - sigue: ▸ Fin de la serie
          descripcion:
          - Los Siete de Salem quieren resucitar a Nicholas Scratch y poseen a Valeria; el grupo pide ayuda al Doctor Extraño, y se recuerda a Agatha Harkness, la antigua niñera de Franklin. Después, Sue ayuda a una empleada maltratada, Reed borra en secreto las pruebas del exilio de Hulk —Franklin le pregunta a su madre en qué anda su padre— y un último número sobre lo que el grupo es más allá de los trajes.
          etiqueta:
            clase: t2
            texto: Recomendado
      - serie:
          id: 4f-b3-fantastic-four-536-537
          prioridad: p2
          titulo: Fantastic Four <span class="nums">#536–537</span>
          creditos: J. Michael Straczynski · Mike McKone · 2006
          continuidad:
          - viene: '◂ Viene del #535'
          - sigue: ▸ Sigue en <em>Civil War</em>
          descripcion:
          - 'El martillo de Thor cae en Oklahoma, y Doom, escapado del Infierno, intenta hacerse con él. Mientras, Reed vuelve de una reunión de los Illuminati y en la tele se habla de una ley de registro de superhumanos: el preludio de <em>Civil War</em>.'
          etiqueta:
            clase: t2
            texto: Recomendado
  - evento:
      id: 4f-b3-civil-war
      ancla: ev-civilwar
      linea_marvel: true
      etiqueta: Evento de toda la línea Marvel · Mayo 2006 – marzo 2007
      titulo: Civil War
      creditos: 'Mark Millar · Steve McNiven (serie principal) · capítulos de los 4 Fantásticos: J. Michael Straczynski y Dwayne McDuffie · Mike McKone'
      descripcion:
      - La Ley de Registro de superhumanos parte en dos a los héroes, y a la familia Richards con ellos. Reed es uno de los arquitectos del registro; Sue se pasa a la resistencia del Capitán América, y Johnny, que acaba en coma por una paliza de una multitud, también. Ben se niega a elegir bando y se va a Francia.
      - 'Los seis números de <em>Fantastic Four</em> (#538–543) son la mejor parte del evento para esta guía. El #543 cierra la guerra con Ben y Johnny cuidando de Franklin y Valeria, y con Reed y Sue anunciando que dejan el grupo para salvar su matrimonio.'
      apartados:
      - apartado: Antes de empezar
        texto: 'Los #536–537 de la ficha anterior. Si quieres más contexto, <em>New Avengers: Illuminati</em> #1 (2006) cuenta quiénes son los Illuminati y por qué Reed está entre ellos.'
      - apartado: Orden de lectura
        texto: '<strong>Civil War #1</strong> → <strong>#2</strong> → <strong>#3</strong> → <span class="cap">Fantastic Four #538</span> → <strong>Civil War #4</strong> → <span class="cap">Fantastic Four #539</span> → <span class="cap">#540</span> → <strong>Civil War #5</strong> → <span class="cap">Fantastic Four #541</span> → <span class="cap">#542</span> → <strong>Civil War #6</strong> → <strong>#7</strong> → <span class="cap">Fantastic Four #543</span>'
      - apartado: Versión mínima
        texto: '<em>Fantastic Four</em> #538–543 seguidos: se entienden sin el evento, aunque pierdes las peleas grandes.'
      - apartado: Nota
        texto: 'El orden sigue la cronología de Marvel Fandom. Comic Book Herald pone el #538 antes de <em>Civil War</em> #3; los dos encajan.'
      - apartado: Conexión
        texto: Es el mismo evento del bloque 2 del Expediente Mutante I y del bloque 2 de Jóvenes Vengadores. Si lo lees allí, aquí solo tienes que añadir los números de los 4 Fantásticos.
  - tramo:
      numero: '3.3'
      titulo: Los nuevos 4 Fantásticos
      cuando: Marzo 2007 – febrero 2008
      nota: 'Orden según Marvel Fandom: <em>Black Panther</em> #26–30 y <em>World War Hulk</em> pasan entre los #546 y #547; <em>Black Panther</em> #31–34, entre el #550 y el #551.'
      entradas:
      - serie:
          id: 4f-b3-fantastic-four-544-546
          prioridad: p2
          titulo: Fantastic Four <span class="nums">#544–546</span>
          creditos: Dwayne McDuffie · Paul Pelletier · 2007
          continuidad:
          - viene: ◂ Viene de <em>Civil War</em>
          - sigue: '▸ Sigue en <em>Black Panther</em> #26'
          descripcion:
          - 'Con Reed y Sue de segunda luna de miel en Titán, Pantera Negra y Tormenta ocupan sus puestos junto a Ben y Johnny. El primer caso los lleva al espacio: Gravity, el joven héroe muerto en <em>Civil War</em>, ha recibido el poder del guardián del universo, y Galactus lo persigue.'
          etiqueta:
            clase: t2
            texto: Recomendado
      - serie:
          id: 4f-b3-black-panther-26-30
          aparicion: true
          donde: En otra serie · Pantera Negra
          titulo: Black Panther <span class="nums">#26–30</span>
          creditos: Reginald Hudlin · Francis Portela · 2007
          continuidad:
          - sigue: ▸ Sigue en <em>World War Hulk</em>
          descripcion:
          - Los nuevos 4 Fantásticos en la serie de T’Challa. Después de su primera misión juntos, acaban en un planeta skrull invadido por los zombis cósmicos de <em>Marvel Zombies</em> (#28–30).
          etiqueta:
            clase: opcional
            texto: Opcional
      - evento:
          id: 4f-b3-world-war-hulk
          ancla: ev-wwh
          linea_marvel: true
          etiqueta: Evento de toda la línea Marvel · Junio 2007 – enero 2008
          titulo: World War Hulk
          creditos: Greg Pak · John Romita Jr.
          descripcion:
          - 'Hulk vuelve del exilio al que lo mandaron los Illuminati —Reed entre ellos— y declara la guerra a la Tierra. En el #2 derrota a los 4 Fantásticos uno tras otro, con Reed y Sue recién llegados de Titán, y en el #4 obliga a Reed a pelear contra Iron Man en un estadio.'
          apartados:
          - apartado: Orden de lectura
            texto: 'Incredible Hulk #106 → World War Hulk Prologue: World Breaker #1 → <strong>World War Hulk #1</strong> → <strong>#2</strong> → <strong>#3</strong> → <strong>#4</strong> → <strong>#5</strong>'
          - apartado: Conexión
            texto: Es el mismo evento del bloque 2 del Expediente Mutante I, allí con sus capítulos mutantes. Si lo lees allí, no hace falta repetirlo.
      - serie:
          id: 4f-b3-fantastic-four-547-550
          prioridad: p2
          titulo: Fantastic Four <span class="nums">#547–550</span>
          creditos: Dwayne McDuffie · Paul Pelletier · 2007
          continuidad:
          - viene: ◂ Viene de <em>World War Hulk</em>
          descripcion:
          - Los Cuatro Terribles, con Klaw de refuerzo, secuestran a Sue en Titán para tender una trampa a todo el grupo. La pelea abre una grieta en el espacio-tiempo que hay que cerrar. Al final, Reed y Sue han arreglado su matrimonio, vuelven al grupo, y Pantera Negra y Tormenta se despiden.
          etiqueta:
            clase: t2
            texto: Recomendado
      - serie:
          id: 4f-b3-black-panther-31-34
          aparicion: true
          donde: En otra serie · Pantera Negra
          titulo: Black Panther <span class="nums">#31–34</span>
          creditos: Reginald Hudlin · Francis Portela y otros · 2007–2008
          descripcion:
          - Una última aventura del grupo provisional en la serie de Pantera Negra, por otras realidades.
          etiqueta:
            clase: opcional
            texto: Opcional
      - serie:
          id: 4f-b3-fantastic-four-551-553
          prioridad: p2
          titulo: Fantastic Four <span class="nums">#551–553</span>
          creditos: Dwayne McDuffie · Paul Pelletier · 2007–2008
          continuidad:
          - sigue: ▸ Sigue en el bloque 4
          descripcion:
          - Un Doom del futuro viene a avisar de que el Reed de dentro de setenta y cinco años se ha convertido en un tirano. El Reed del presente lo comprueba de la peor manera, hasta que llegan los 4 Fantásticos de ese futuro. Es el cierre de McDuffie.
          etiqueta:
            clase: t2
            texto: Recomendado
      - serie:
          id: 4f-b3-onslaught-reborn-1-5
          titulo: Onslaught Reborn <span class="nums">#1–5</span>
          creditos: Jeph Loeb · Rob Liefeld · 2006–2008
          descripcion:
          - Onslaught vuelve diez años después y va a por Franklin, que usa sus poderes para recrear el universo de <em>Heroes Reborn</em> y esconderse en él. Allí lo protege una Bucky adolescente, Rikki Barnes, que acaba arrastrando a Onslaught a la Zona Negativa. Es la secuela directa de la historia de Franklin en los noventa, pero tiene muy mala fama y salió con muchos retrasos.
          etiqueta:
            clase: opcional
            texto: Opcional
      - serie:
          id: 4f-b3-fantastic-four-isla-de-la-muerte-1
          titulo: 'Fantastic Four: ¡Isla de la Muerte! <span class="nums">#1</span>'
          creditos: Tom Beland · Juan Doe · 2007
          descripcion:
          - El grupo sigue a Ben en sus vacaciones secretas en Puerto Rico y descubre que allí es un héroe local, «El Morrito». Un one-shot amable con el Hombre Topo de villano.
          etiqueta:
            clase: opcional
            texto: Opcional
- id: b4
  fechas: 2008 — 2009
  titulo: El mejor grupo del mundo
  intro: 'Mark Millar y Bryan Hitch escriben dieciséis números a lo grande: una Tierra de repuesto, refugiados de quinientos años en el futuro, la muerte de una Sue anciana y un enemigo capaz de asustar al propio Doom. Ben se promete con una profesora y Johnny forma un grupo de música. En medio, la invasión skrull deja a Franklin y a Valeria atrapados en la Zona Negativa con Ben y Johnny.'
  navegacion:
    anio: 2008–2009
    texto: El mejor grupo del mundo
  contenido:
  - tramo:
      numero: '4.1'
      titulo: Nu-Earth
      cuando: Febrero – mayo 2008
      entradas:
      - serie:
          id: 4f-b4-fantastic-four-554-557
          prioridad: p2
          titulo: Fantastic Four <span class="nums">#554–557</span>
          creditos: Mark Millar · Bryan Hitch · 2008
          continuidad:
          - viene: ◂ Viene del bloque 3
          - sigue: ▸ Sigue en el tramo 4.2
          descripcion:
          - Alyssa Moy, la exnovia de Reed, y su marido han construido en secreto una copia de la Tierra, Nu-Earth, por si la nuestra muere; su robot guardián se escapa y empieza a desarmar el planeta. Ben empieza a salir con Debbie Green, una profesora, y llega una niñera nueva para Franklin y Valeria. Al final, un Doom malherido entra en el Edificio Baxter pidiendo ayuda.
          etiqueta:
            clase: t2
            texto: Recomendado
  - evento:
      id: 4f-b4-secret-invasion
      ancla: ev-si
      linea_marvel: true
      etiqueta: Evento de toda la línea Marvel · Abril – diciembre 2008
      titulo: Secret Invasion
      creditos: Brian Michael Bendis · Leinil Francis Yu (serie principal) · tie-in de Roberto Aguirre-Sacasa y Barry Kitson
      descripcion:
      - Los skrulls, infiltrados desde hace años, invaden la Tierra. Reed es uno de los primeros a los que capturan, porque es el único capaz de descubrirlos. En el tie-in, Ben, Johnny, Franklin y Valeria quedan atrapados en la Zona Negativa, con Lyja, la exmujer skrull de Johnny, de por medio, y tienen que volver pasando por la prisión que construyó Reed.
      apartados:
      - apartado: Orden de lectura
        texto: '<strong>Secret Invasion #1</strong> → <span class="cap">Secret Invasion: Fantastic Four #1–3</span> → <strong>Secret Invasion #2</strong> → <strong>#3</strong> → <strong>#4</strong> → <strong>#5</strong> → <strong>#6</strong> → <strong>#7</strong> → <strong>#8</strong>'
      - apartado: Nota
        texto: 'Según Marvel Fandom, el tie-in empieza durante <em>Secret Invasion</em> #1 y termina antes del #8. Como no se cruza con el resto, se lee seguido.'
      - apartado: Versión mínima
        texto: '<em>Secret Invasion: Fantastic Four</em> #1–3 seguidos: es la parte de los niños.'
      - apartado: Conexión
        texto: El mismo evento está en el bloque 4 del Expediente Mutante I, en el bloque 2 de Guardianes y en el bloque 2 de Jóvenes Vengadores, cada uno con su tie-in.
  - tramo:
      numero: '4.2'
      titulo: La muerte de la Mujer Invisible
      cuando: Junio 2008 – enero 2009
      entradas:
      - serie:
          id: 4f-b4-fantastic-four-558-562
          prioridad: p1
          titulo: Fantastic Four <span class="nums">#558–562</span>
          creditos: Mark Millar · Bryan Hitch · 2008–2009
          continuidad:
          - viene: ◂ Viene del tramo 4.1
          - sigue: ▸ Continúa en la ficha siguiente
          descripcion:
          - 'Unos superhéroes del año 2509, los Nuevos Defensores, vienen a llevarse a Doom: quieren usarlo, con Johnny y con un Galactus capturado, para traer a los últimos humanos de un futuro helado. Su líder resulta ser la nueva niñera de los niños, Tabitha, que en realidad es Sue con quinientos años más; Valeria la reconoce y le suplica que no siga adelante.'
          - Al final Doom mata a la Sue del futuro, y la del presente despide a su yo anciano en un funeral con medio universo Marvel. Ben le pide matrimonio a Debbie.
          etiqueta:
            clase: t1
            texto: Esencial
      - serie:
          id: 4f-b4-fantastic-four-563
          prioridad: p2
          titulo: Fantastic Four <span class="nums">#563</span>
          creditos: Mark Millar · Bryan Hitch · 2009
          continuidad:
          - sigue: ▸ Sigue en el tramo 4.3
          descripcion:
          - 'Toda la familia celebra el compromiso de Ben. En otra realidad, dos figuras encapuchadas, un maestro y su aprendiz, aniquilan a toda la población de la Tierra y se preparan para visitar a su «alumno favorito»: Victor von Doom.'
          etiqueta:
            clase: t2
            texto: Recomendado
      - serie:
          id: 4f-b4-fantastic-four-true-story-1-4
          titulo: 'Fantastic Four: True Story <span class="nums">#1–4</span>'
          creditos: Paul Cornell · Horacio Domingues · 2008
          descripcion:
          - 'Sue no consigue concentrarse en ningún libro, y Reed descubre por qué: Pesadilla está conquistando el mundo de la ficción. El grupo entra en <em>Sentido y sensibilidad</em> y en <em>Alicia en el país de las maravillas</em> para pararlo.'
          etiqueta:
            clase: opcional
            texto: Opcional
      - serie:
          id: 4f-b4-fantastic-four-cosmic-size-special-1
          titulo: Fantastic Four Cosmic-Size Special <span class="nums">#1</span>
          creditos: Cary Bates · Bing Cansino · 2009
          descripcion:
          - Una planta de otra dimensión se alimenta de las mentes de la familia. Valeria repasa lo que se sabe de los poderes de Franklin. Según Marvel Fandom, pasa entre la pelea con el Marqués de la Muerte y la boda de Ben (tramo 4.3).
          etiqueta:
            clase: opcional
            texto: Opcional
  - tramo:
      numero: '4.3'
      titulo: El amo de Doom
      cuando: Febrero – julio 2009
      nota: '<em>Dark Reign: Fantastic Four</em>, el prólogo de Hickman, empezó a publicarse en marzo de 2009, pero va al principio del bloque 5.'
      entradas:
      - serie:
          id: 4f-b4-fantastic-four-564-565
          prioridad: p2
          titulo: Fantastic Four <span class="nums">#564–565</span>
          creditos: Mark Millar · Bryan Hitch · 2009
          continuidad:
          - viene: ◂ Viene del tramo 4.2
          descripcion:
          - 'La familia pasa la Navidad en Escocia con un primo de Reed, y Valeria desaparece en el bosque: el pueblo tiene la costumbre de sacrificar niños a un monstruo, Korgo. Ben y Debbie se apuntan al viaje.'
          etiqueta:
            clase: t2
            texto: Recomendado
      - serie:
          id: 4f-b4-fantastic-four-566-569
          prioridad: p2
          titulo: Fantastic Four <span class="nums">#566–569</span>
          creditos: Mark Millar y Joe Ahearne · Bryan Hitch, Neil Edwards y Stuart Immonen · 2009
          continuidad:
          - sigue: ▸ Sigue en el bloque 5
          descripcion:
          - El Marqués de la Muerte, el antiguo maestro de Doom, mata Vigilantes, destroza a Doom y lanza contra el Edificio Baxter a infinitos 4 Fantásticos de otras realidades. Para vencerlo, Ben viaja al pasado. Muere la tía Petunia de Ben, y en el último número Ben cancela la boda con Debbie para no ponerla en peligro.
          etiqueta:
            clase: t2
            texto: Recomendado
      - serie:
          id: 4f-b4-fantastic-force-1-4
          titulo: Fantastic Force <span class="nums">#1–4</span>
          creditos: Joe Ahearne · Steve Kurth y Neil Edwards · 2009
          descripcion:
          - Los Nuevos Defensores del futuro, que se quedan en el presente tras «La muerte de la Mujer Invisible», actúan como grupo con un nombre nuevo.
          etiqueta:
            clase: opcional
            texto: Opcional
      - serie:
          id: 4f-b4-mighty-avengers-25-26
          aparicion: true
          donde: En otra serie · Vengadores
          titulo: Mighty Avengers <span class="nums">#25–26</span>
          creditos: Dan Slott · Stephen Segovia · 2009
          descripcion:
          - Los Vengadores de Hank Pym asaltan el Edificio Baxter disfrazados de villanos para robar un invento que necesitan. Sue saca a los niños de allí.
          etiqueta:
            clase: opcional
            texto: Opcional
      - serie:
          id: 4f-b4-amazing-spider-man-590-591
          aparicion: true
          donde: En otra serie · Spider-Man
          titulo: Amazing Spider-Man <span class="nums">#590–591</span>
          creditos: Dan Slott · Barry Kitson · 2009
          descripcion:
          - Spider-Man y los 4 Fantásticos vuelven a un mundo que visitaron años atrás, el Macroverso. Johnny descubre que ya no recuerda quién es Peter Parker (la consecuencia de <em>One More Day</em>), y Peter se lo vuelve a contar.
          etiqueta:
            clase: opcional
            texto: Opcional
      - serie:
          id: 4f-b4-spider-man-the-human-torch-in-bahia-de-los-muertos-1
          titulo: Spider-Man &amp; the Human Torch in… ¡Bahía de los Muertos! <span class="nums">#1</span>
          creditos: Tom Beland · Juan Doe · 2009
          descripcion:
          - Johnny y Spider-Man vuelven a Puerto Rico, donde algo que sale de una bahía bioluminiscente devora a los bañistas. Del mismo equipo que <em>¡Isla de la Muerte!</em>.
          etiqueta:
            clase: opcional
            texto: Opcional
- id: b5
  fechas: 2009 — 2011
  titulo: Resolverlo todo
  intro: Jonathan Hickman empieza una etapa larga y muy planificada, la más importante para Franklin desde los noventa. Reed descubre un consejo de versiones suyas de otras realidades que quiere «resolverlo todo». Franklin cumple años y recibe la visita de su yo adulto, que le devuelve los poderes, y Reed funda la Fundación Futuro con los niños más listos del mundo. Cuatro civilizaciones ocultas despiertan a la vez y el bloque termina con la muerte de Johnny.
  navegacion:
    anio: 2009–2011
    texto: Resolverlo todo
  contenido:
  - tramo:
      numero: '5.1'
      titulo: El puente
      cuando: Marzo – julio 2009
      nota: El prólogo de Hickman. Se publicó en paralelo al final de Millar, pero va después.
      entradas:
      - serie:
          id: 4f-b5-dark-reign-fantastic-four-1-5
          prioridad: p1
          titulo: 'Dark Reign: Fantastic Four <span class="nums">#1–5</span>'
          creditos: Jonathan Hickman · Sean Chen · 2009
          continuidad:
          - viene: ◂ Viene del bloque 4
          descripcion:
          - 'Reed construye un puente a otras realidades para averiguar en qué se equivocó en <em>Civil War</em>, y un apagón lanza a Sue, Ben y Johnny por el tiempo. <strong>Franklin y Valeria se quedan solos en el Edificio Baxter</strong> cuando Norman Osborn, ahora jefe de la seguridad del país, viene a por sus padres. Los dos le plantan cara a su manera, y al final Franklin le dispara con una pistola de juguete… que funciona: la primera señal de que sus poderes vuelven.'
          etiqueta:
            clase: t1
            texto: Esencial
  - tramo:
      numero: '5.2'
      titulo: El Consejo de Reeds
      cuando: Agosto – diciembre 2009
      entradas:
      - serie:
          id: 4f-b5-fantastic-four-570-572
          prioridad: p2
          titulo: Fantastic Four <span class="nums">#570–572</span>
          creditos: Jonathan Hickman · Dale Eaglesham · 2009
          continuidad:
          - viene: ◂ Viene del tramo 5.1
          descripcion:
          - El puente lleva a Reed ante el Consejo Interdimensional de Reeds, versiones suyas de otras realidades que se han propuesto arreglar el multiverso. Reed se une a ellos hasta que aparecen los Celestiales locos de otra Tierra. Al final elige a su familia, y recuerda lo que le enseñó su padre.
          etiqueta:
            clase: t2
            texto: Recomendado
      - serie:
          id: 4f-b5-fantastic-four-573
          prioridad: p2
          titulo: Fantastic Four <span class="nums">#573</span>
          creditos: Jonathan Hickman · Neil Edwards · 2009
          descripcion:
          - 'Ben, Johnny, Franklin y Valeria visitan Nu-World, la Tierra de repuesto de Millar, que se está deshaciendo. Al volver es medianoche: el día del cumpleaños de Franklin.'
          etiqueta:
            clase: t2
            texto: Recomendado
      - serie:
          id: 4f-b5-fantastic-four-574
          prioridad: p1
          titulo: Fantastic Four <span class="nums">#574</span>
          creditos: Jonathan Hickman · Neil Edwards · 2009
          continuidad:
          - sigue: ▸ Sigue en el tramo 5.3
          descripcion:
          - <strong>El cumpleaños de Franklin.</strong> Vienen Power Pack, Leech, Artie, el Hombre Dragón y Bentley, un clon del Hombre Mago. Un desconocido con capucha se cuela en la fiesta, le dice a Franklin «recuerda lo que eres», y esa noche, bajo las sábanas, Franklin crea un universo diminuto. Es su yo adulto.
          etiqueta:
            clase: t1
            texto: Esencial
  - tramo:
      numero: '5.3'
      titulo: Cuatro ciudades
      cuando: Diciembre 2009 – abril 2010
      entradas:
      - serie:
          id: 4f-b5-fantastic-four-575-578
          prioridad: p2
          titulo: Fantastic Four <span class="nums">#575–578</span>
          creditos: Jonathan Hickman · Dale Eaglesham · 2010
          continuidad:
          - viene: '◂ Viene del #574'
          descripcion:
          - 'Cuatro civilizaciones despiertan a la vez: la ciudad abandonada del Alto Evolucionador, bajo tierra, los viejos reyes de una Atlántida anterior a Namor, una armada de Inhumanos venidos del espacio y una secta de la Zona Negativa. Hickman las presenta de una en una; volverán todas en «Three».'
          etiqueta:
            clase: t2
            texto: Recomendado
      - serie:
          id: 4f-b5-x-factor-200-202
          aparicion: true
          donde: En otra serie · X-Factor
          titulo: X-Factor <span class="nums">#200–202</span>
          creditos: Peter David · Bing Cansino y otros · 2009–2010
          descripcion:
          - Sue ha desaparecido, y X-Factor Investigations, la agencia de detectives de Madrox, se encarga de buscarla. Franklin y Valeria están en el caso.
          etiqueta:
            clase: opcional
            texto: Opcional
      - serie:
          id: 4f-b5-doomwar-1-6
          aparicion: true
          donde: En otra serie · Pantera Negra
          titulo: Doomwar <span class="nums">#1–6</span>
          creditos: Jonathan Maberry · Scot Eaton · 2010
          descripcion:
          - Doom invade Wakanda para quedarse con su vibranio, y Shuri, ahora Pantera Negra, pide ayuda a los 4 Fantásticos. Al final todo el vibranio de la Tierra queda inerte, algo que se nota en «Three».
          etiqueta:
            clase: opcional
            texto: Opcional
  - tramo:
      numero: '5.4'
      titulo: La Fundación Futuro
      cuando: Mayo – agosto 2010
      entradas:
      - serie:
          id: 4f-b5-fantastic-four-579-580
          prioridad: p1
          titulo: Fantastic Four <span class="nums">#579–580</span>
          creditos: Jonathan Hickman · Neil Edwards · 2010
          continuidad:
          - viene: ◂ Viene del tramo 5.3
          descripcion:
          - 'Harto de los congresos de genios, Reed funda la Fundación Futuro: una escuela para los niños más listos del mundo, con Valeria, Franklin, sus amigos Leech y Artie, los moloides que rescataron y Bentley, el clon del Hombre Mago. En el #580, Franklin y Leech salen de aventura con Johnny, y los alumnos le regalan a Ben una fórmula para ser humano una semana al año.'
          etiqueta:
            clase: t1
            texto: Esencial
      - serie:
          id: 4f-b5-fantastic-four-annual-32
          prioridad: p2
          titulo: Fantastic Four Annual <span class="nums">#32</span>
          creditos: Joe Ahearne · Bryan Hitch · 2010
          descripcion:
          - 'Una joven, Amy Brys, se presenta buscando a Johnny: está embarazada de él, y el embarazo tiene una energía que Reed solo ha visto en los partos de Sue. Al final desaparece por la plataforma temporal con el bebé por nacer. Escrito por el coguionista del final de Millar.'
          etiqueta:
            clase: t2
            texto: Recomendado
      - serie:
          id: 4f-b5-fantastic-four-581-582
          prioridad: p1
          titulo: Fantastic Four <span class="nums">#581–582</span>
          creditos: Jonathan Hickman · Neil Edwards · 2010
          continuidad:
          - sigue: ▸ Sigue en el tramo 5.5
          descripcion:
          - <strong>Franklin y Valeria, adultos.</strong> Después de visitar su propio cumpleaños, el Franklin del futuro recupera sus poderes de alterar la realidad y crea un refugio para los dos. Mientras, Nathaniel Richards, el abuelo, termina la «Gran Cacería» contra sus versiones alternativas, con un Reed, un Ben y un Victor universitarios de su lado.
          etiqueta:
            clase: t1
            texto: Esencial
      - serie:
          id: 4f-b5-spider-man-fantastic-four-1-4-fantastic-four-in-ataque-del-m-o-d-o-k-1
          titulo: Spider-Man/Fantastic Four <span class="nums">#1–4</span> · Fantastic Four in… ¡Ataque del M.O.D.O.K.! <span class="nums">#1</span>
          creditos: Christos Gage · Mario Alberti / Tom Beland · Juan Doe · 2010
          descripcion:
          - Cuatro historias de Spider-Man con el grupo, de distintas épocas; la última es en el presente, con Franklin. Y el tercer one-shot de Tom Beland y Juan Doe, con M.O.D.O.K.
          etiqueta:
            clase: opcional
            texto: Opcional
  - tramo:
      numero: '5.5'
      titulo: Three
      cuando: Septiembre 2010 – febrero 2011
      nota: 'La serie se cerró en el #588 y en marzo de 2011 la sustituyó <em>FF</em>, con el bloque 6.'
      entradas:
      - serie:
          id: 4f-b5-fantastic-four-583-587
          prioridad: p1
          titulo: Fantastic Four <span class="nums">#583–587</span>
          creditos: Jonathan Hickman · Steve Epting · 2010–2011
          continuidad:
          - viene: ◂ Viene del tramo 5.4
          - sigue: ▸ Continúa en la ficha siguiente
          descripcion:
          - Valeria descubre que su padre no destruyó el puente y hace un trato con Doom. Galactus viene a pedir cuentas por el cadáver de su yo futuro, la guerra entre las dos Atlántidas estalla con Sue de mediadora y una oleada de Annihilus atraviesa el portal de la Zona Negativa.
          - '<strong>Muere Johnny</strong>: cierra la puerta para salvar a Ben y a los niños y se queda solo frente a la oleada. Franklin y Ben lo ven todo desde el otro lado.'
          etiqueta:
            clase: t1
            texto: Esencial
      - serie:
          id: 4f-b5-fantastic-four-588
          prioridad: p1
          titulo: Fantastic Four <span class="nums">#588</span>
          creditos: Jonathan Hickman · Nick Dragotta y Mark Brooks · 2011
          continuidad:
          - sigue: ▸ Sigue en el bloque 6
