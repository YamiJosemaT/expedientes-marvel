      titulo: DNX
      creditos: Jed MacKay · Federico Vicentini
      descripcion:
      - 'X-Men y los Cuatro Fantásticos contra 3K y un virus que amenaza con hacer realidad un futuro distópico. Es el crossover que se está publicando ahora mismo: la miniserie central es el eje y solo dos cabeceras más entran en él.'
