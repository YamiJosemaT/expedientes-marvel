# Expediente Mutante II: Krakoa
# Datos del expediente. Los textos admiten HTML en linea (<em>, <strong>, <span class="nums">...).
# Las claves "id" de cada entrada NO se deben cambiar: son las que guardan las marcas de lectura.

clave: m2
titulo_pagina: 'Expediente Mutante II: Krakoa'
descripcion_pagina: Guía de lectura de la línea mutante de Marvel desde House of X hasta octubre de 2026.
cabecera:
  antetitulo: Guía de lectura · Volumen II · Línea mutante Marvel
  titulo: Expediente<br/>Mutante II<span class="thin">Krakoa — 2019 a hoy</span>
  entradilla: 'Donde lo dejó el primer expediente: de la fundación de Krakoa en <em>House of X</em> al cómic que está en la tienda esta semana. Mismo sistema de tramos y eventos, siete bloques, y las cuatro reinvenciones completas que ha tenido la franquicia en estos siete años.'
  cifras:
  - valor: '7'
    texto: Años de continuidad
  - valor: '16'
    texto: Tramos de lectura
  - valor: '22'
    texto: Eventos y crossovers
  - valor: ~1.200
    texto: Números en total
leyenda: |-
  <p>Mismo sistema que el volumen I. Cada bloque se divide en <strong>tramos</strong>: fragmentos de continuidad que se leen en paralelo, alternando las cabeceras que hay dentro. Entre tramo y tramo se intercala el <strong>evento</strong> que los separa, con su orden capítulo a capítulo.</p>
  <p>Cuando un crossover se lleva números de una serie en marcha, esa serie aparece <strong>partida</strong>: verás dónde se corta y en qué tramo se retoma. Dentro del orden de un evento, los capítulos <span class="cap">en naranja</span> son los que salen de cabeceras que ya venías leyendo.</p>
  <div class="legend-row">
  <span class="key"><span class="fwd">▸</span> Continúa después del evento</span>
  <span class="key"><span class="back">◂</span> Viene de un tramo anterior</span>
  </div>
  <div class="legend-row">
  <span class="key"><span class="swatch dashed"></span> Recuadro con borde discontinuo: evento de toda la línea Marvel en el que participan los X-Men</span>
  </div>
  <div class="legend-row">
  <span class="tag t1">Esencial</span>
  <span class="tag t2">Recomendado</span>
  <span class="tag">Opcional</span>
  <span class="tag t4">Realidad alterna</span>
  </div>
cajas:
- ruta:
    titulo: La ruta corta
    texto: 'Catorce paradas que cuentan la historia completa de estos siete años. La era de Krakoa está mucho más cosida que la anterior: casi todo se cruza con casi todo, así que aquí la ruta corta se apoya más en los eventos que en las series.'
    pasos:
    - <span>House of X / Powers of X <em>#1–6</em></span>
    - <span>X-Men vol. 5 <em>#1–21</em></span>
    - <span>X of Swords <em>crossover</em></span>
    - <span>Hellfire Gala <em>2021</em></span>
    - <span>Inferno <em>#1–4</em></span>
    - <span>Immortal X-Men <em>#1–18</em></span>
    - <span>X-Men Red vol. 2 <em>#1–18</em></span>
    - '<span>A.X.E.: Judgment Day <em>#1–6</em></span>'
    - <span>Sins of Sinister <em>crossover</em></span>
    - <span>Hellfire Gala <em>2023</em></span>
    - <span>Fall of the House of X / Rise of the Powers of X</span>
    - <span>X-Men vol. 7 <em>#1–22</em></span>
    - <span>Uncanny X-Men vol. 6 <em>#1–21</em></span>
    - <span>Age of Revelation → Shadows of Tomorrow</span>
bloques:
- id: b1
  fechas: Julio 2019 — noviembre 2020
  titulo: Dawn of X
  intro: 'Empieza con <em>House of X</em> / <em>Powers of X</em>, y no es negociable. Jonathan Hickman convierte a los mutantes en una nación soberana sobre una isla viva, con su propio idioma, su economía de medicamentos y —la pieza que lo cambia todo— un protocolo de resurrección que vuelve la muerte un trámite administrativo. Seis cabeceras simultáneas que comparten un mismo diseño editorial: cada número lleva páginas de datos, organigramas y actas del Consejo Silencioso.'
  navegacion:
    anio: 2019–2020
    texto: Dawn of X
  contenido:
  - evento:
      id: m1-b8-house-of-x-powers-of-x
      ancla: hoxpox
      etiqueta: Punto de partida · Julio – octubre 2019
      titulo: House of X / Powers of X
      creditos: Jonathan Hickman · Pepe Larraz &amp; R.B. Silva
      descripcion:
      - Doce números que refundan la especie mutante como nación en la isla viva de Krakoa. <strong>Léelos antes que nada:</strong> aquí se presenta todo lo que el resto del volumen da por sabido (el Consejo Silencioso, las leyes de Krakoa, la resurrección de los Cinco y el secreto de Moira MacTaggert sobre el que gira toda la era). Sin ellos, <em>Dawn of X</em> se lee a ciegas.
      - <strong>Van intercalados, no seguidos:</strong> leerlos por separado destroza la estructura, que está montada para que cada número de <em>Powers</em> reencuadre el anterior de <em>House</em>.
      apartados:
      - apartado: Orden completo
        texto: 'HoX #1 → PoX #1 → HoX #2 → PoX #2 → HoX #3 → PoX #3 → HoX #4 → PoX #4 → HoX #5 → PoX #5 → HoX #6 → PoX #6'
  - tramo:
      numero: '1.1'
      titulo: La primera oleada
      cuando: Octubre 2019 – julio 2020
      nota: Las seis series salieron semanalmente y rotando, pensadas para leerse a la par. No hace falta orden exacto entre ellas dentro del tramo.
      entradas:
      - serie:
          id: m2-b1-x-men-vol-5-1-9
          prioridad: p1
          titulo: X-Men vol. 5 <span class="nums">#1–9</span>
          creditos: Jonathan Hickman · Leinil Francis Yu, Mahmud Asrar · 2019–2020
          continuidad:
          - sigue: '▸ Los #10–11 son tie-ins de <em>Empyre</em> (final del tramo 1.2)'
          - sigue: '▸ Los #12–15 son capítulos de <em>X of Swords</em>'
          descripcion:
          - 'La cabecera matriz: números casi autoconclusivos que van montando la arquitectura del estado mutante. Es la voz de Hickman y el eje del bloque.'
          etiqueta:
            clase: t1
            texto: Esencial
      - serie:
          id: m2-b1-marauders-1-12
          prioridad: p2
          titulo: Marauders <span class="nums">#1–12</span>
          creditos: Gerry Duggan · Matteo Lolli · 2019–2020
          continuidad:
          - sigue: '▸ Los números #13–15 son capítulos de <em>X of Swords</em>'
          descripcion:
          - Kitty Pryde y Emma Frost contrabandeando mutantes por mar. La más divertida de la oleada y la que mejor explica cómo funciona la resurrección en la práctica.
          etiqueta:
            clase: t2
            texto: Recomendado
      - serie:
          id: m2-b1-x-force-vol-6-1-12
          prioridad: p2
          titulo: X-Force vol. 6 <span class="nums">#1–12</span>
          creditos: Benjamin Percy · Joshua Cassara · 2019–2020
          continuidad:
          - sigue: '▸ Los números #13–14 son capítulos de <em>X of Swords</em>'
          descripcion:
          - La CIA de Krakoa. Beast al mando de un servicio de inteligencia sin ninguna supervisión, que es exactamente tan mala idea como suena.
          etiqueta:
            clase: t2
            texto: Recomendado
      - serie:
          id: m2-b1-excalibur-vol-4-1-12
          prioridad: p2
          titulo: Excalibur vol. 4 <span class="nums">#1–12</span>
          creditos: Tini Howard · Marcus To · 2019–2020
          continuidad:
          - sigue: '▸ Los números #13–15 son capítulos de <em>X of Swords</em>'
          descripcion:
          - 'La rama mágica: Betsy Braddock como Capitana Britania, Apocalipsis y los portales a Otherworld. Imprescindible como preparación de <em>X of Swords</em>, que sale casi entero de aquí.'
          etiqueta:
            clase: t2
            texto: Recomendado
      - serie:
          id: m2-b1-new-mutants-vol-4-1-12
          titulo: New Mutants vol. 4 <span class="nums">#1–12</span>
          creditos: Jonathan Hickman, Ed Brisson · Rod Reis · 2019–2020
          continuidad:
          - sigue: '▸ El número #13 es capítulo de <em>X of Swords</em>'
          descripcion:
          - Los números impares (Hickman) son un viaje espacial con los Starjammers; los pares (Brisson), una trama terrestre. Se alternaban número a número, lo que descoloca bastante.
          etiqueta:
            clase: opcional
            texto: Opcional
      - serie:
          id: m2-b1-fallen-angels-1-6
          titulo: Fallen Angels <span class="nums">#1–6</span>
          creditos: Bryan Hill · Szymon Kudranski · 2019–2020
          descripcion:
          - La única de la oleada que se canceló pronto y la única prescindible por completo.
          etiqueta:
            clase: opcional
            texto: Opcional
      - serie:
          id: m2-b1-complementos-del-arranque
          titulo: Complementos del arranque
          creditos: 'X-Men/Fantastic Four #1–4 · Giant-Size X-Men: Jean Grey &amp; Emma Frost / Nightcrawler / Fantomex / Magneto / Storm · 2020'
          descripcion:
          - Los cinco <em>Giant-Size</em> de Hickman y Ramos son números sueltos sobre la resurrección de Storm y compañía. <em>X-Men/Fantastic Four</em> va de la custodia de Franklin Richards y sí tiene consecuencias.
          etiqueta:
            clase: opcional
            texto: Opcional
  - tramo:
      numero: '1.2'
      titulo: La segunda oleada
      cuando: Febrero – septiembre 2020
      nota: Tres cabeceras nuevas que se incorporan a mitad de camino y llegan justas al crossover.
      entradas:
      - serie:
          id: m2-b1-hellions-1-4
          prioridad: p2
          titulo: Hellions <span class="nums">#1–4</span>
          creditos: Zeb Wells · Stephen Segovia · 2020
          continuidad:
          - sigue: '▸ Los números #5–6 son capítulos de <em>X of Swords</em>'
          descripcion:
          - Sinister recibe a los mutantes que Krakoa no sabe dónde meter. Comedia negrísima y la mejor sorpresa del bloque.
          etiqueta:
            clase: t2
            texto: Recomendado
      - serie:
          id: m2-b1-x-factor-vol-4-1-4
          prioridad: p2
          titulo: X-Factor vol. 4 <span class="nums">#1–3</span>
          creditos: Leah Williams · David Baldeón · 2020
          continuidad:
          - sigue: '▸ El #4 es el capítulo 2 de <em>X of Swords</em>'
          descripcion:
          - 'La oficina forense de la resurrección: hay que certificar cómo murió cada mutante antes de devolverlo. Es la serie que convierte el protocolo en algo incómodo.'
          etiqueta:
            clase: t2
            texto: Recomendado
      - serie:
          id: m2-b1-cable-vol-4-1-4
          titulo: Cable vol. 4 <span class="nums">#1–4</span>
          creditos: Gerry Duggan · Phil Noto · 2020
          continuidad:
          - sigue: '▸ Los números #5–6 son capítulos de <em>X of Swords</em>'
          descripcion:
          - El Cable adolescente, rejuvenecido. Ligera y menor, pero enlaza con <em>X of Swords</em>.
          etiqueta:
            clase: opcional
            texto: Opcional
      - serie:
          id: m2-b1-wolverine-vol-7-1-5
          titulo: Wolverine vol. 7 <span class="nums">#1–5</span>
          creditos: Benjamin Percy · Adam Kubert · 2020
          continuidad:
          - sigue: '▸ Los números #6–7 son capítulos de <em>X of Swords</em>'
          descripcion:
          - Logan como agente de X-Force. Se solapa con esa serie, de los mismos guionistas.
          etiqueta:
            clase: opcional
            texto: Opcional
      - evento:
          id: m2-b1-empyre
          linea_marvel: true
          etiqueta: Evento de toda la línea Marvel · Julio – septiembre 2020
          titulo: Empyre
          creditos: 'Al Ewing &amp; Dan Slott · Valerio Schiti (serie principal) · <em>X-Men</em> #10–11 de Jonathan Hickman y Leinil Francis Yu'
          descripcion:
          - 'La alianza Kree-Skrull de Hulkling llega a la Tierra para enfrentarse a los Cotati, y la guerra alcanza a los mutantes: la familia Summers se cruza con el conflicto en su casa de la Luna y los Cotati atacan Krakoa. <strong>Dos números de la serie de Hickman son tie-ins</strong>, así que esta parte no es opcional.'
          apartados:
          - apartado: Antes de empezar
            texto: 'Nada imprescindible: el evento arranca con sus dos números cero.'
          - apartado: Orden de lectura
            texto: 'Empyre: Avengers #0 → Empyre: Fantastic Four #0 → <strong>Empyre #1</strong> → <strong>#2</strong> → <strong>#3</strong> → <span class="cap">X-Men #10</span> → <span class="cap">Empyre: X-Men #1–4</span> → <strong>Empyre #4</strong> → <strong>#5</strong> → <strong>#6</strong> → <span class="cap">X-Men #11</span> → Empyre: Aftermath Avengers #1'
          - apartado: Versión mínima
            texto: '<em>X-Men</em> #10 y #11, que son de la serie principal, y <em>Empyre: X-Men</em> #1–4 si quieres todo el lado de Krakoa. Se siguen sin el evento, aunque no sabrás quiénes son los Cotati.'
          - apartado: Prescindible
            texto: <em>Lords of Empyre</em> y los tie-ins de otras series.
          - apartado: Después
            texto: '<em>X of Swords</em>, que arranca en <em>X-Men</em> #12.'
  - evento:
      id: m2-b1-x-of-swords
      etiqueta: Crossover · 22 capítulos · Septiembre – noviembre 2020
      titulo: X of Swords
      creditos: Jonathan Hickman &amp; Tini Howard · Pepe Larraz, Mahmud Asrar
      descripcion:
      - 'Diez campeones mutantes y diez espadas contra el reino de Arakko, la mitad gemela de Krakoa. El crossover más coral de la era: se lleva números de las siete cabeceras a la vez. <strong>Cada portada lleva impreso su número de capítulo del 1 al 22</strong>, así que no hace falta memorizar la secuencia: basta ordenarlos por ese número.'
      apartados:
      - apartado: Preludio
        texto: 'La historia de los X-Men del <em>Free Comic Book Day 2020</em> (Hickman y Larraz, julio de 2020) lo anticipa. El número 12 de <em>X-Men</em> y el de <em>Excalibur</em> (el último de su ficha) preparan el evento sin ser capítulos numerados: léelos justo antes de <em>Creation</em>.'
      - apartado: Apertura y cierre
        texto: 'X of Swords: Creation #1 (capítulo 1) → … → X of Swords: Stasis #1 (capítulo intermedio) → … → X of Swords: Destruction #1 (capítulo 22)'
      - apartado: Capítulos que salen de tus series en marcha
        texto: '<span class="cap">X-Men #12–15</span> (el 12 es el preludio) · <span class="cap">X-Factor #4</span> · <span class="cap">Excalibur #13–15</span> · <span class="cap">Marauders #13–15</span> · <span class="cap">X-Force #13–14</span> · <span class="cap">Hellions #5–6</span> · <span class="cap">Cable #5–6</span> · <span class="cap">Wolverine #6–7</span> · <span class="cap">New Mutants #13</span>'
      - apartado: Qué cambia al terminar
        texto: Arakko se instala en la Tierra y pasa a ser un segundo estado mutante. Es la premisa de la que vive el resto de la era.
- id: b2
  fechas: Diciembre 2020 — febrero 2022
  titulo: Reign of X
  intro: 'Krakoa consolidada: embajadas, una farmacéutica propia, un servicio secreto y una agencia espacial. El bloque donde la nación funciona —y donde empieza a verse que el Consejo Silencioso es, en el fondo, una oligarquía de supervillanos con buena prensa. Termina con la salida de Hickman, tres años antes de lo que tenía planeado.'
  navegacion:
    anio: 2020–2022
    texto: Reign of X
  contenido:
  - tramo:
      numero: '2.1'
      titulo: La nación en marcha
      cuando: Diciembre 2020 – mayo 2021
      nota: 'Todas las cabeceras del bloque 1 continúan, y se suman cuatro nuevas. Tramo largo y sin cruces: avanza por donde quieras hasta la Gala.'
      entradas:
      - serie:
          id: m2-b2-x-men-vol-5-16-20
          prioridad: p1
          titulo: X-Men vol. 5 <span class="nums">#16–20</span>
          creditos: Jonathan Hickman · Mahmud Asrar, Francesco Mobili · 2021
          continuidad:
          - viene: ◂ Viene de <em>X of Swords</em>
          - sigue: '▸ El número #21 es capítulo de la <em>Hellfire Gala</em>'
          descripcion:
          - El equipo de ataque y los primeros roces diplomáticos con Arakko.
          etiqueta:
            clase: t1
            texto: Esencial
      - serie:
          id: m2-b2-s-w-o-r-d-vol-2-1-5
          prioridad: p2
          titulo: S.W.O.R.D. vol. 2 <span class="nums">#1–5</span>
          creditos: Al Ewing · Valerio Schiti · 2020–2021
          continuidad:
          - sigue: '▸ El número #6 es capítulo de la <em>Hellfire Gala</em>'
          descripcion:
          - La agencia espacial mutante, con Abigail Brand maniobrando. Ewing planta aquí casi todo lo que después explotará en <em>X-Men Red</em>. La mejor incorporación del bloque.
          etiqueta:
            clase: t2
            texto: Recomendado
      - serie:
          id: m2-b2-way-of-x-1-4
          prioridad: p2
          titulo: Way of X <span class="nums">#1–2</span>
          creditos: Simon Spurrier · Bob Quinn · 2021
          continuidad:
          - sigue: '▸ El #3 es un capítulo de la <em>Hellfire Gala</em>; la serie termina en el tramo 2.2 y continúa como <em>Legion of X</em> en el 3.1'
          descripcion:
          - Rondador Nocturno se pregunta qué religión le corresponde a una especie que ya no muere de verdad. La reflexión más interesante que ha producido la era.
          etiqueta:
            clase: t2
            texto: Recomendado
      - serie:
          id: m2-b2-las-cabeceras-que-continuan
          prioridad: p2
          titulo: Las cabeceras que continúan
          creditos: 'Marauders #16–20 · Excalibur #16–20 · X-Force #15–19 · Hellions #7–11 · X-Factor #5–9 · New Mutants #14–18 · Cable #7–11 · Wolverine #8–12 · 2021'
          continuidad:
          - viene: ◂ La mayoría vienen de <em>X of Swords</em>
          - sigue: ▸ Todas menos <em>Cable</em> entregan su número siguiente a la <em>Hellfire Gala</em>
          descripcion:
          - 'Todas retoman tras el crossover y casi todas entregan un número a la Gala. <em>Cable</em> no: su #11 salió el mismo mes, pero no forma parte del evento.'
          etiqueta:
            clase: t2
            texto: Recomendado
      - serie:
          id: m2-b2-children-of-the-atom-1-6-x-corp-1-5
          titulo: 'Children of the Atom <span class="nums">#1–6</span> · X-Corp <span class="nums">#1, #3–5</span>'
          creditos: Vita Ayala / Tini Howard · 2021
          continuidad:
          - sigue: '▸ X-Corp #2 es un capítulo de la <em>Hellfire Gala</em>; Children of the Atom #6 transcurre durante la fiesta'
          descripcion:
          - Unos adolescentes que fingen ser mutantes, y la multinacional de Krakoa. Ambas periféricas; <em>X-Corp</em> solo si te interesa el andamiaje económico.
          etiqueta:
            clase: opcional
            texto: Opcional
      - serie:
          id: m2-b2-juggernaut-1-5
          titulo: Juggernaut <span class="nums">#1–5</span>
          creditos: Fabian Nicieza · Ron Garney · septiembre 2020 – enero 2021
          descripcion:
          - Cain Marko, que no es mutante y vive fuera de Krakoa, intenta dejar de destruir cosas y empezar a repararlas. Independiente del resto de la línea.
          etiqueta:
            clase: opcional
            texto: Opcional
      - serie:
          id: m2-b2-x-men-curse-of-the-man-thing-1
          titulo: 'X-Men: Curse of the Man-Thing <span class="nums">#1</span>'
          creditos: Steve Orlando · Andrea Broccardo · mayo 2021
          descripcion:
          - 'Cierre de la trilogía de one-shots de Orlando que empieza en <em>Avengers</em> y <em>Spider-Man: Curse of the Man-Thing</em>: incendios provocados por el miedo que llegan hasta Krakoa.'
          etiqueta:
            clase: opcional
            texto: Opcional
      - evento:
          id: m2-b2-king-in-black
          linea_marvel: true
          etiqueta: Evento de toda la línea Marvel · Diciembre 2020 – abril 2021
          titulo: King in Black
          creditos: Donny Cates · Ryan Stegman (serie principal) · tie-in mutante de Gerry Duggan y Luke Ross
          descripcion:
          - Knull, el dios de los simbiontes, envuelve la Tierra en oscuridad. En el one-shot mutante, la Reina Roja Kate Pryde y sus Merodeadores zarpan contra sus fuerzas.
          apartados:
          - apartado: Antes de empezar
            texto: 'Contexto opcional: la etapa de Donny Cates en <em>Venom</em>, que prepara la llegada de Knull.'
          - apartado: Orden de lectura
            texto: '<strong>King in Black #1</strong> → <strong>#2</strong> → <strong>#3</strong> → <span class="cap">King in Black: Marauders #1</span> → <strong>King in Black #4</strong> → <strong>#5</strong>'
          - apartado: Versión mínima
            texto: '<em>King in Black: Marauders</em> #1 se lee suelto, como un episodio más de <em>Marauders</em>.'
  - evento:
      id: m2-b2-hellfire-gala-2021
      etiqueta: Evento · 12 capítulos · Junio 2021
      titulo: Hellfire Gala (2021)
      creditos: Gerry Duggan, Jonathan Hickman, Al Ewing y el resto de la línea
      descripcion:
      - 'La primera gala: Krakoa invita al mundo a una fiesta, presenta un equipo de X-Men elegido por votación popular y, de postre, terraforma Marte. Formato peculiar —cada cabecera aporta un número ambientado en la misma noche— y uno de los puntos altos de la era.'
      apartados:
      - apartado: Orden
        texto: '<span class="cap">Marauders #21</span> → <span class="cap">X-Force #20</span> → <span class="cap">Hellions #12</span> → <span class="cap">Excalibur #21</span> → <span class="cap">X-Men #21</span> → Planet-Size X-Men #1 → <span class="cap">New Mutants #19</span> → <span class="cap">X-Corp #2</span> → <span class="cap">Wolverine #13</span> → <span class="cap">S.W.O.R.D. #6</span> → <span class="cap">Way of X #3</span> → <span class="cap">X-Factor #10</span>'
      - apartado: De dónde sale el orden
        texto: 'Es el de publicación, del 2 al 30 de junio de 2021 (lista oficial de las doce partes en Wikipedia; coincide con la mayoría de guías). <em>Children of the Atom</em> #6, de agosto, también transcurre durante la fiesta, pero no es parte del evento.'
      - apartado: El imprescindible
        texto: '<em>Planet-Size X-Men</em> #1 es el número donde pasa lo que importa. Si solo lees uno, es ese.'
  - tramo:
      numero: '2.2'
      titulo: Después de la Gala
      cuando: Julio – diciembre 2021
      nota: 'Relevo en la cabecera principal: <em>X-Men</em> vol. 5 cierra en el #21 y arranca <em>X-Men</em> vol. 6 con Duggan. Varias series de la primera oleada terminan aquí.'
      entradas:
      - serie:
          id: m2-b2-x-men-vol-6-1-6
          prioridad: p2
          titulo: X-Men vol. 6 <span class="nums">#1–6</span>
          creditos: Gerry Duggan · Pepe Larraz · 2021
          descripcion:
          - El equipo recién votado, con base en Nueva York y vocación de superhéroes clásicos. Cambio de tono deliberado respecto a Hickman.
          etiqueta:
            clase: t2
            texto: Recomendado
      - serie:
          id: m2-b2-x-men-the-trial-of-magneto-1-5
          prioridad: p2
          titulo: 'X-Men: The Trial of Magneto <span class="nums">#1–5</span>'
          creditos: Leah Williams · Lucas Werneck · agosto – diciembre 2021
          continuidad:
          - viene: ◂ Arranca con lo que se descubre al final de la <em>Hellfire Gala</em> (el número de <em>X-Factor</em>)
          descripcion:
          - La Bruja Escarlata aparece asesinada tras la Gala y Magneto, su padre, es el principal sospechoso. Krakoa tiene que juzgar a uno de los suyos, y la resurrección no sirve de excusa.
          etiqueta:
            clase: t2
            texto: Recomendado
      - evento:
          id: m2-b2-the-last-annihilation
          etiqueta: Crossover · Cruce con los Guardianes de la Galaxia y Wakanda · 7 capítulos · 2021
          titulo: The Last Annihilation
          creditos: Al Ewing · varios
          descripcion:
          - Dormammu se ha fundido con Ego, el planeta viviente, y quiere conquistar el espacio. S.W.O.R.D., la agencia espacial de Krakoa, se alía con los Guardianes de la Galaxia para pararlo. Es el cierre de la etapa de Ewing en los Guardianes y <strong>se lleva dos números de la línea mutante</strong>, intercalados con los demás.
          apartados:
          - apartado: Antes de empezar
            texto: 'Los seis primeros números de <em>S.W.O.R.D.</em> (tramo 2.1 y la Gala). Por el lado cósmico, <em>Guardians of the Galaxy</em> vol. 6 #1–15 de Al Ewing (bloque 7 del Expediente Guardianes) es contexto opcional.'
          - apartado: Orden de lectura
            texto: 'Guardians of the Galaxy #16 → <span class="cap">S.W.O.R.D. #7</span> → Guardians of the Galaxy #17 → <span class="cap">Cable: Reloaded #1</span> → The Last Annihilation: Wiccan &amp; Hulkling #1 → The Last Annihilation: Wakanda #1 → Guardians of the Galaxy #18'
          - apartado: Versión mínima
            texto: '<em>S.W.O.R.D.</em> #7 y <em>Cable: Reloaded</em> #1 son los capítulos mutantes, pero sueltos no se entienden bien: la historia se cuenta sobre todo en los Guardianes. Lo recomendable es leer los siete.'
          - apartado: Conexión
            texto: 'Es el mismo crossover que aparece en el Expediente Guardianes (bloque 7), con el mismo orden: léelo una sola vez.'
      - serie:
          id: m2-b2-cierres-de-la-primera-oleada
          titulo: Cierres de la primera oleada
          creditos: 'Marauders #22–27 · Excalibur #22–26 · Hellions #13–18 · S.W.O.R.D. #8–11 · X-Force #21–25 · New Mutants #20–24 · Wolverine #14–19 · Cable #12 · 2021'
          continuidad:
          - viene: ◂ Todas vienen de la <em>Hellfire Gala</em>
          - viene: '◂ S.W.O.R.D. sigue desde el #8, después de <em>The Last Annihilation</em> (ficha anterior)'
          descripcion:
          - 'Casi todas cierran para dejar sitio al relanzamiento del bloque 3. <em>Hellions</em> #18 tiene uno de los finales más celebrados de la era.'
          etiqueta:
            clase: t2
            texto: Recomendado
      - serie:
          id: m2-b2-way-of-x-4-5-x-men-the-onslaught-revelation-1
          prioridad: p2
          titulo: 'Way of X <span class="nums">#4–5</span> · X-Men: The Onslaught Revelation <span class="nums">#1</span>'
          creditos: Simon Spurrier · Bob Quinn · julio – septiembre 2021
          continuidad:
          - viene: '◂ Viene de <em>Way of X</em> #3, capítulo de la <em>Hellfire Gala</em>'
          - sigue: ▸ Continúa como <em>Legion of X</em> en el tramo 3.1
          descripcion:
          - 'Final de la serie: Rondador y su pequeño grupo contra Onslaught, que se ha colado en la mente de los líderes de Krakoa. El one-shot es el último capítulo, no un extra.'
          etiqueta:
            clase: t2
            texto: Recomendado
      - evento:
          id: m2-b2-death-of-doctor-strange
          linea_marvel: true
          etiqueta: Evento de toda la línea Marvel · Septiembre 2021 – enero 2022
          titulo: Death of Doctor Strange
          creditos: Jed MacKay · Lee Garbett (serie principal) · tie-in mutante de Si Spurrier y Bob Quinn
          descripcion:
          - 'Stephen Strange aparece asesinado y, con él, caen las defensas mágicas de la Tierra: llegan invasiones de otras dimensiones y las Tres Madres, mientras un Strange joven, llegado del pasado, investiga quién lo mató. Magik, profesora de la Academia Strange, está en los números #1, #4 y #5, y los X-Men (Cíclope, Jean Grey, Pícara y Laura Kinney) luchan en la batalla de la Antártida del #5. El peso mutante es secundario: la serie principal es de Strange.'
          - 'El one-shot <em>X-Men/Black Knight</em> es el capítulo propio de la línea: el equipo de <em>X-Men</em> vol. 6 aparece transformado y atacando Londres, y el Caballero Negro, Jacks Chopra y Faiza Hussain tienen que salvarlo.'
          apartados:
          - apartado: Antes de empezar
            texto: 'Nada imprescindible. Para el one-shot mutante, <em>Black Knight: Curse of the Ebony Blade</em> (2021, de Spurrier) es contexto opcional: el one-shot continúa esa historia.'
          - apartado: Orden de lectura
            texto: '<strong>Death of Doctor Strange #1</strong> → <strong>#2</strong> → Death of Doctor Strange: Avengers #1 → Strange Academy Presents: Death of Doctor Strange #1 → <strong>Death of Doctor Strange #3</strong> → Death of Doctor Strange: Spider-Man #1 → Death of Doctor Strange: White Fox #1 → Death of Doctor Strange: Blade #1 → <span class="cap">Death of Doctor Strange: X-Men/Black Knight #1</span> → <strong>Death of Doctor Strange #4</strong> → Death of Doctor Strange: Bloodstone #1 → <strong>#5</strong>'
          - apartado: Versión mínima
            texto: Los cinco números de la serie principal, y el one-shot de los X-Men si quieres su parte. Ninguna serie mutante depende del evento, así que también se puede saltar entero.
          - apartado: Prescindible
            texto: Los one-shots de los Vengadores, Spider-Man, White Fox, Blade, Bloodstone y la Academia Strange.
          - apartado: Después
            texto: '<em>Strange</em> vol. 3 (2022, de MacKay), fuera de la línea mutante: Clea pasa a ser la Hechicera Suprema.'
      - serie:
          id: m2-b2-al-margen-de-krakoa-2020-2022
          titulo: Al margen de Krakoa (2020–2022)
          creditos: 'X-Men: Marvels Snapshots #1 (2020) · Wolverine: Black, White &amp; Blood #1–4 (2020–2021) · X-Men Legends #1–12 (2021–2022) · X-Force: Killshot Anniversary Special #1 (2021) · Demon Days: X-Men #1 y Demon Days: Rising Storm #1 (2021) · Heroes Reborn: Magneto &amp; the Mutant Force #1 (2021) · Wastelanders: Wolverine #1 (2021)'
          descripcion:
          - Publicadas en estos años, pero fuera de la historia de Krakoa. <em>Marvels Snapshots</em> cuenta la adolescencia de Cíclope en el orfanato; <em>X-Men Legends</em> son historias nuevas metidas en etapas clásicas; <em>Black, White &amp; Blood</em> es una antología; el especial de <em>Killshot</em> celebra los 30 años de X-Force.
          - 'Realidades alternativas: <em>Demon Days</em> (el Japón mitológico de Peach Momoko), <em>Heroes Reborn</em> (el mundo cambiado del evento de 2021) y <em>Wastelanders</em> (el futuro de <em>Old Man Logan</em>).'
          etiqueta:
            clase: t4
            texto: Al margen de la continuidad
  - evento:
      id: m2-b2-inferno
      etiqueta: Evento · Septiembre 2021 – enero 2022 · Cierre del bloque
      titulo: Inferno
      creditos: Jonathan Hickman · Valerio Schiti &amp; Stefano Caselli
      descripcion:
      - 'Cuatro números en los que Hickman cierra de golpe —y a destiempo— la trama que había plantado en <em>House of X</em>: quién es Moira MacTaggert, qué sabe Mística y por qué el Consejo Silencioso lleva dos años mintiendo. Es su despedida de la franquicia y el verdadero final de su proyecto.'
      apartados:
      - apartado: Orden
        texto: 'Inferno #1–4, seguidos. No tiene tie-ins.'
      - apartado: Importante
        texto: 'Léelo después de las series del tramo 2.2, no antes: parte de dónde queda el Consejo tras la Gala.'
- id: b3
  fechas: Marzo 2022 — julio 2023
  titulo: Destiny of X
  intro: 'Sin Hickman, la línea se reparte entre Kieron Gillen, Al Ewing y Gerry Duggan, y da su mejor tramo sostenido: la política interna del Consejo por un lado, Arakko y el espacio por otro. Aquí están los dos mejores títulos de toda la era y el evento que mejor funciona.'
  navegacion:
    anio: 2022–2023
    texto: Destiny of X
  contenido:
  - tramo:
      numero: '3.1'
      titulo: El relanzamiento
      cuando: Marzo – junio 2022
      nota: Nueve cabeceras a la vez. Las dos primeras son el núcleo; el resto, satélites de calidad desigual.
      entradas:
      - serie:
          id: m2-b3-marauders-annual-1-secret-x-men-1
          titulo: Marauders Annual <span class="nums">#1</span> · Secret X-Men <span class="nums">#1</span>
          creditos: Steve Orlando / Tini Howard · enero – febrero 2022
          descripcion:
          - 'Dos especiales puente entre bloques. En el <em>Annual</em>, Kate Pryde reúne una tripulación nueva para rescatar a Daken: es el arranque de <em>Marauders</em> vol. 2. <em>Secret X-Men</em> manda a los que perdieron la votación de 2021 (Sunspot, Cannonball, Forge y compañía) a una misión secreta para la emperatriz shi''ar Xandra.'
          etiqueta:
            clase: opcional
            texto: Opcional
      - evento:
          id: m2-b3-devil-s-reign
          linea_marvel: true
          etiqueta: Evento de toda la línea Marvel · Diciembre 2021 – mayo 2022
          titulo: Devil's Reign
          creditos: Chip Zdarsky · Marco Checchetto (serie principal) · tie-in mutante de Gerry Duggan y Phil Noto
          descripcion:
          - 'Wilson Fisk, alcalde de Nueva York, prohíbe la actividad de los superhéroes en la ciudad, y el tie-in cuenta cómo afecta a los X-Men. El evento se solapa con el cambio de etapa: empieza antes del relanzamiento y termina ya dentro de él.'
          apartados:
          - apartado: Antes de empezar
            texto: 'Contexto opcional: la etapa de Chip Zdarsky en <em>Daredevil</em>, de la que sale el evento.'
          - apartado: Orden de lectura
            texto: '<strong>Devil''s Reign #1</strong> → <span class="cap">Devil''s Reign: X-Men #1–3</span> → <strong>Devil''s Reign #2</strong> → <strong>#3</strong> → <strong>#4</strong> → <strong>#5</strong> → <strong>#6</strong> → Devil''s Reign: Omega #1'
          - apartado: Versión mínima
            texto: '<em>Devil''s Reign</em> #1 y después <em>Devil''s Reign: X-Men</em> #1–3.'
      - serie:
          id: m2-b3-immortal-x-men-1-4
          prioridad: p1
          titulo: Immortal X-Men <span class="nums">#1–4</span>
          creditos: Kieron Gillen · Lucas Werneck · 2022
          continuidad:
          - sigue: '▸ Los números #5–7 son capítulos de <em>Judgment Day</em>'
          descripcion:
          - El Consejo Silencioso por dentro, un número por consejero. Intriga política pura, con Sinister y Destino moviendo los hilos. Lo mejor de la era de Krakoa.
          etiqueta:
            clase: t1
            texto: Esencial
      - serie:
          id: m2-b3-x-men-red-vol-2-1-4
          prioridad: p1
          titulo: X-Men Red vol. 2 <span class="nums">#1–4</span>
          creditos: Al Ewing · Stefano Caselli · 2022
          continuidad:
          - sigue: '▸ Los números #5–7 son capítulos de <em>Judgment Day</em>'
          descripcion:
          - 'Arakko en Marte: una sociedad mutante construida sobre el combate ritual, contada como tragedia. Continúa lo de <em>S.W.O.R.D.</em> y es el otro gran título del bloque.'
          etiqueta:
            clase: t1
            texto: Esencial
      - serie:
          id: m2-b3-x-men-vol-6-7-12
          prioridad: p2
          titulo: X-Men vol. 6 <span class="nums">#7–12</span>
          creditos: Gerry Duggan · Pepe Larraz · 2022
          continuidad:
          - viene: ◂ Viene del tramo 2.2
          - sigue: '▸ Los números #13–14 son capítulos de <em>Judgment Day</em>'
          etiqueta:
            clase: t2
            texto: Recomendado
      - serie:
          id: m2-b3-legion-of-x-1-5
          prioridad: p2
          titulo: Legion of X <span class="nums">#1–5</span>
          creditos: Simon Spurrier · Jan Bazaldua · 2022
          continuidad:
          - viene: ◂ Viene de <em>Way of X</em> y <em>The Onslaught Revelation</em> (tramo 2.2)
          descripcion:
          - 'Continuación directa de <em>Way of X</em>: Legión y Rondador montan la policía espiritual de Krakoa.'
          etiqueta:
            clase: t2
            texto: Recomendado
      - serie:
          id: m2-b3-los-satelites-del-relanzamiento
          titulo: Los satélites del relanzamiento
          creditos: 'Marauders vol. 2 #1–5 · Knights of X #1–5 · New Mutants #25–29 · X-Force #26–29 · Wolverine #20–23 · Sabretooth #1–5 · X-Force Annual #1 · Giant-Size X-Men: Thunderbird #1 · 2022'
          continuidad:
          - sigue: '▸ X-Force #30–33, Wolverine #24–25 y Marauders vol. 2 #6 son satélites de <em>Judgment Day</em>'
          - sigue: ▸ <em>Sabretooth</em> continúa en <em>Sabretooth &amp; the Exiles</em> (tramo 3.2)
          descripcion:
          - '<em>Sabretooth</em> (Victor LaValle) es la joya escondida: el castigo de Krakoa a sus criminales es enterrarlos vivos para siempre, y va de eso.'
          - 'Los dos especiales: en el <em>Annual</em> de X-Force, Orchis le tiende una trampa a Lobezno, Domino y Kid Omega; el <em>Giant-Size</em> de Thunderbird trata su vuelta tras la resurrección.'
          etiqueta:
            clase: opcional
            texto: Opcional
      - serie:
          id: m2-b3-x-lives-of-wolverine-1-5-x-deaths-of-wolverine-1-5
          titulo: X Lives of Wolverine <span class="nums">#1–5</span> · X Deaths of Wolverine <span class="nums">#1–5</span>
          creditos: Benjamin Percy · Joshua Cassara &amp; Federico Vicentini · enero – mayo 2022
          descripcion:
          - 'Dos miniseries semanales que se publicaron <strong>alternándose</strong>: Lives #1 → Deaths #1 → Lives #2 → Deaths #2, y así. Una va al pasado y otra al futuro.'
          etiqueta:
            clase: opcional
            texto: Opcional
  - evento:
      id: m2-b3-hellfire-gala-2022
      etiqueta: Evento · Julio 2022
      titulo: Hellfire Gala (2022)
      creditos: Gerry Duggan · Kris Anka y otros
      descripcion:
      - Segunda gala, esta vez en un solo número extenso en lugar de repartida. Se vota el equipo nuevo y se dejan caer las semillas de <em>Sins of Sinister</em>.
      apartados:
      - apartado: Orden
        texto: 'Hellfire Gala 2022 #1, número único'
  - evento:
      id: m2-b3-a-x-e-judgment-day
      linea_marvel: true
      etiqueta: Evento de toda la línea Marvel · Julio – noviembre 2022
      titulo: 'A.X.E.: Judgment Day'
      creditos: Kieron Gillen · Valerio Schiti
      descripcion:
      - 'Vengadores, X-Men y Eternos: un Celestial se despierta, se declara juez de la humanidad y empieza a evaluar si la especie merece existir. Uno de los mejores crossovers de Marvel en años, y toca de lleno la cuestión de la resurrección.'
      - '<strong>Este evento no se lee por bloques.</strong> Gillen escribió a la vez la serie principal, <em>Death to the Mutants</em> e <em>Immortal X-Men</em>, y los tres hilos se van respondiendo número a número. Si lees primero los seis centrales y luego los tie-ins, te destripas el evento dos veces: buena parte de los giros de la serie principal se explican en las otras dos.'
      apartados:
      - apartado: Antes de empezar
        texto: 'Preludio directo: <em>Eternals</em> (2021) #10–12, la guerra contada desde el lado de los Eternos (está en el Expediente Eternos), y <em>Free Comic Book Day 2022: Avengers/X-Men</em> #1.'
      - apartado: Columna vertebral — va entrelazada, en este orden exacto
        texto: 'A.X.E.: Eve of Judgment #1 → <strong>Judgment Day #1</strong> → <span class="cap">Immortal X-Men #5</span> → <span class="cap">X-Men Red #5</span> → <strong>Judgment Day #2</strong> → Death to the Mutants #1 → <span class="cap">X-Men vol. 6 #13</span> → <strong>Judgment Day #3</strong> → Death to the Mutants #2 → <span class="cap">X-Men vol. 6 #14</span> → <span class="cap">Immortal X-Men #6</span> → <span class="cap">X-Men Red #6</span> → <strong>Judgment Day #4</strong> → <span class="cap">X-Men Red #7</span> → <strong>Judgment Day #5</strong> → <span class="cap">Immortal X-Men #7</span> → Death to the Mutants #3 → <strong>Judgment Day #6</strong> → A.X.E.: Judgment Day Omega #1'
      - apartado: Satélites mutantes — dentro de la ventana de los capítulos 3 y 4
        texto: '<span class="cap">X-Force #30–33</span> · <span class="cap">Wolverine #24–25</span> · <span class="cap">Marauders vol. 2 #6</span> · <span class="cap">Legion of X #6</span> — aportan el punto de vista de sus equipos, no trama del evento. Su orden entre sí es indiferente.'
      - apartado: Fuera de la línea mutante (prescindibles)
        texto: 'Avengers #60 · Fantastic Four #47–48 · Amazing Spider-Man #10 · Captain Marvel #42 · A.X.E.: Iron Fist #1 — y los epílogos de personaje <em>A.X.E.: X-Men</em> #1, <em>Avengers</em> #1, <em>Eternals</em> #1 y <em>Starfox</em> #1, que van entre el #6 y el Omega'
      - apartado: La versión corta
        texto: 'Los seis de <em>Judgment Day</em> + <em>Death to the Mutants</em> #1–3 + <em>Immortal X-Men</em> #5–7 + <em>X-Men Red</em> #5–7, entrelazados como arriba. Dieciocho números y tienes el evento completo.'
  - tramo:
      numero: '3.2'
      titulo: Entre el juicio y el pecado
      cuando: Finales de 2022
      entradas:
      - serie:
          id: m2-b3-immortal-x-men-8-10-x-men-red-8-10
          prioridad: p1
          titulo: Immortal X-Men <span class="nums">#8–10</span> · X-Men Red <span class="nums">#8–10</span>
          creditos: Kieron Gillen / Al Ewing · 2022–2023
          continuidad:
          - viene: ◂ Ambas vienen de <em>Judgment Day</em>
          - sigue: '▸ Las dos se suspenden durante <em>Sins of Sinister</em>: las sustituyen <em>Immoral X-Men</em> y <em>Storm &amp; the Brotherhood of Mutants</em>'
          descripcion:
          - 'Los dos núcleos retoman y preparan el terreno: Sinister maniobrando en Krakoa, Arakko entrando en crisis sucesoria.'
          etiqueta:
            clase: t1
            texto: Esencial
      - serie:
          id: m2-b3-x-men-vol-6-15-19-marauders-vol-2-7-10-legion-of-x-7-10-new-mutants-30
          titulo: 'X-Men vol. 6 <span class="nums">#15–19</span> · Marauders vol. 2 <span class="nums">#7–10</span> · Legion of X <span class="nums">#7–10</span> · New Mutants <span class="nums">#30–33</span> · X-Force <span class="nums">#34–42</span> · Wolverine <span class="nums">#26–35</span> · X-Terminators <span class="nums">#1–5</span> · Bishop: War College <span class="nums">#1–5</span> · X-Men Annual <span class="nums">#1</span>'
          creditos: Varios · 2022–2023 · el <em>Annual</em> (Steve Foxe, diciembre de 2022) es de Firestar, elegida para los X-Men en la Gala
          continuidad:
          - viene: ◂ X-Men, X-Force, Wolverine, Marauders y Legion of X vienen de <em>Judgment Day</em>
          - sigue: '▸ <em>New Mutants</em> termina en el #33 y continúa en <em>New Mutants: Lethal Legion</em> (tramo 3.3)'
          etiqueta:
            clase: opcional
            texto: Opcional
      - serie:
          id: m2-b3-sabretooth-the-exiles-1-5
          titulo: Sabretooth &amp; the Exiles <span class="nums">#1–5</span>
          creditos: Victor LaValle · Leonard Kirk · noviembre 2022 – marzo 2023
          continuidad:
          - viene: ◂ Continuación de <em>Sabretooth</em> (2022), en «Los satélites del relanzamiento» del tramo 3.1
          descripcion:
          - 'Los mismos autores y el mismo tono de terror: Dientes de Sable, ya fuera del Foso, con los desterrados de Krakoa detrás. Acaba enfrentando a Victor con Graydon Creed, su hijo. Solo tiene sentido si leíste la primera serie.'
          etiqueta:
            clase: opcional
            texto: Opcional
      - serie:
          id: m2-b3-cruces-con-otras-series-2022-2023
          titulo: Cruces con otras series (2022–2023)
          creditos: 'Ms. Marvel &amp; Wolverine #1 (Jody Houser, agosto 2022) · X-Men and Moon Girl #1 (Mohale Mashigo, septiembre 2022) · Murderworld: Wolverine #1 (Jim Zub, enero 2023)'
          descripcion:
          - One-shots de otras líneas con mutantes de invitados. Kamala Khan y Lobezno, ante una amenaza que compromete la tecnología de Krakoa; Moon Girl y los X-Men, en la historia del secuestro de Devil Dinosaur por el Alto Evolucionador; Lobezno, como cazador en el juego mortal de Arcade.
          etiqueta:
            clase: opcional
            texto: Opcional
      - evento:
          id: m2-b3-dark-web
          linea_marvel: true
          etiqueta: Evento de toda la línea Marvel · Diciembre 2022 – marzo 2023
          titulo: Dark Web
          creditos: Zeb Wells y otros
          descripcion:
          - Madelyne Pryor, la Reina Duende, y Chasm, el clon de Spider-Man, desatan el Limbo sobre Nueva York. Es un cruce entre la línea de Spider-Man y la mutante, y <strong>el tie-in mutante va repartido</strong> entre los números de Spider-Man.
          apartados:
          - apartado: Antes de empezar
            texto: 'Contexto opcional: <em>Amazing Spider-Man</em> (2022) de Zeb Wells, donde Ben Reilly se convierte en Chasm.'
          - apartado: Orden de lectura
            texto: '<strong>Dark Web #1</strong> → <span class="cap">Dark Web: X-Men #1</span> → Amazing Spider-Man #15 → Gold Goblin #2 → Amazing Spider-Man #16 → #17 → <span class="cap">Dark Web: X-Men #2</span> → Gold Goblin #3 → <span class="cap">Dark Web: X-Men #3</span> → Amazing Spider-Man #18 → <strong>Dark Web Finale #1</strong>'
          - apartado: Versión mínima
            texto: '<em>Dark Web</em> #1 → <em>Dark Web: X-Men</em> #1–3 → <em>Dark Web Finale</em> #1.'
          - apartado: Ojo
            texto: 'Es saltable para la trama de Krakoa: no deja consecuencias en las series X.'
  - evento:
      id: m2-b3-sins-of-sinister
      etiqueta: Crossover · 11 capítulos · Enero – abril 2023
      titulo: Sins of Sinister
      creditos: Kieron Gillen, Al Ewing &amp; Simon Spurrier · varios
      descripcion:
      - 'Sinister toma el control y la historia salta mil años hacia adelante para enseñar lo que sale de ahí. Tres miniseries de tres números que se leen <strong>rotando</strong>, y cada ronda salta más lejos: los tres #1 transcurren diez años después, los #2 cien años y los #3 mil. Formalmente lo más atrevido de la era.'
      apartados:
      - apartado: Orden completo
        texto: 'Sins of Sinister #1 → Storm &amp; the Brotherhood of Mutants #1 → Nightcrawlers #1 → Immoral X-Men #1 → Nightcrawlers #2 → Immoral X-Men #2 → Storm &amp; the Brotherhood #2 → Immoral X-Men #3 → Storm &amp; the Brotherhood #3 → Nightcrawlers #3 → Sins of Sinister: Dominion #1'
      - apartado: Tres series se suspenden durante el evento
        texto: 'Las tres miniseries <strong>ocupan el hueco</strong> de tres cabeceras en marcha, que dejan de publicarse de febrero a abril: <em>Immortal X-Men</em> → <em>Immoral X-Men</em> · <em>X-Men Red</em> → <em>Storm &amp; the Brotherhood of Mutants</em> · <em>Legion of X</em> → <em>Nightcrawlers</em>. Las dos primeras se retoman después en su #11; <em>Legion of X</em> ya no vuelve.'
      - apartado: Prólogo
        texto: '<em>Immortal X-Men</em> #9–10 preparan directamente el evento. Ya están en el tramo 3.2: léelos justo antes de empezar.'
  - tramo:
      numero: '3.3'
      titulo: La calma antes de la trampa
      cuando: Primavera – junio 2023
      entradas:
      - serie:
          id: m2-b3-immortal-x-men-11-13-x-men-red-11-13-x-men-vol-6-20-24
          prioridad: p1
          titulo: Immortal X-Men <span class="nums">#11–13</span> · X-Men Red <span class="nums">#11–13</span> · X-Men vol. 6 <span class="nums">#20–24</span>
          creditos: Gillen / Ewing / Duggan · 2023
          continuidad:
          - viene: ◂ Immortal X-Men y X-Men Red se retoman aquí tras su pausa durante <em>Sins of Sinister</em>
          - sigue: '▸ Ninguna entra en la Gala: se detienen antes y siguen en el tramo 4.1 (Immortal X-Men y X-Men Red desde el #14, X-Men desde el #25)'
          descripcion:
          - Tres cabeceras avanzando hacia la gala. Arakko ya está en guerra abierta y Krakoa no se da cuenta de lo que se le viene encima.
          etiqueta:
            clase: t1
            texto: Esencial
      - serie:
          id: m2-b3-marauders-vol-2-11-12
          titulo: Marauders vol. 2 <span class="nums">#11–12</span>
          creditos: Steve Orlando · 2023
          continuidad:
          - viene: ◂ Viene del tramo 3.2
          descripcion:
          - Orlando cierra la serie justo antes de la Gala.
          etiqueta:
            clase: opcional
            texto: Opcional
      - serie:
          id: m2-b3-new-mutants-lethal-legion-1-5
          titulo: 'New Mutants: Lethal Legion <span class="nums">#1–5</span>'
          creditos: Charlie Jane Anders · Enid Balam · marzo – julio 2023
          continuidad:
          - viene: '◂ Sigue a <em>New Mutants</em> #33 (tramo 3.2), con la misma guionista'
          descripcion:
          - Escapade, Wolfsbane, Karma y compañía intentan dar un golpe contra el conde Nefaria y su nueva Legión Letal. Aventura ligera y cerrada, sin peso en la trama de Krakoa; el último número salió una semana antes de la Gala.
          etiqueta:
            clase: opcional
            texto: Opcional
      - serie:
          id: m2-b3-betsy-braddock-captain-britain-1-5
          titulo: 'Betsy Braddock: Captain Britain <span class="nums">#1–5</span>'
          creditos: Tini Howard · Vasco Georgiev · febrero – junio 2023
          continuidad:
          - viene: ◂ Sigue a <em>Knights of X</em> (satélites del tramo 3.1), de la misma guionista
          descripcion:
          - Con Otherworld en calma, Betsy vuelve a casa y descubre que Gran Bretaña no quiere a una mutante con el escudo de Capitán Britania.
          etiqueta:
            clase: opcional
            texto: Opcional
      - serie:
          id: m2-b3-rogue-gambit-1-5
          titulo: Rogue &amp; Gambit <span class="nums">#1–5</span>
          creditos: Stephanie Phillips · Carlos Gómez · marzo – julio 2023
          descripcion:
          - Destino, que ve lo que se le viene encima a Krakoa pero no puede actuar, manda a su hija adoptiva Rogue a una misión, y Gambito se apunta. Termina justo antes de la Gala.
          etiqueta:
            clase: opcional
            texto: Opcional
      - serie:
          id: m2-b3-x-men-unforgiven-1
          titulo: 'X-Men: Unforgiven <span class="nums">#1</span>'
          creditos: Tim Seeley · Sid Kotian · marzo 2023
          descripcion:
          - 'Secuela del cruce <em>Spider-Man: Unforgiven</em>: los Forgiven, maltrechos tras él, se encuentran con los X-Men cuando empiezan a aparecer restos humanos en la costa de Maine.'
          etiqueta:
            clase: opcional
            texto: Opcional
      - serie:
          id: m2-b3-x-men-before-the-fall
          titulo: 'X-Men: Before the Fall'
          creditos: 'Free Comic Book Day 2023: Avengers/X-Men #1 (mayo) · Sons of X #1 · Mutants'' First Strike #1 · Heralds of Apocalypse #1 · Sinister Four #1 · mayo – julio 2023'
          descripcion:
          - 'One-shots que colocan las piezas justo antes de la Gala: Xavier, Bishop, Apocalipsis y Sinister. El del Free Comic Book Day, de Duggan, abre la cuenta atrás. Prólogos de la emboscada, no capítulos de ella.'
          etiqueta:
            clase: opcional
            texto: Opcional
      - serie:
          id: m2-b3-al-margen-de-krakoa-2022-2023
          titulo: Al margen de Krakoa (2022–2023)
          creditos: 'X-Cellent #1–5 (2022) y vol. 2 #1–5 (2023) · Gambit #1–5 (2022) · Wolverine: Patch #1–5 (2022) · X-Men Legends vol. 2 #1–6 (2022–2023) · X-Treme X-Men #1–5 (2022–2023) · X-Men ''92: House of XCII #1–5 (2022)'
          descripcion:
          - '<em>X-Cellent</em> es la vuelta de Milligan y Allred a X-Statix, los mutantes famosos. Las demás son historias nuevas ambientadas en etapas pasadas: Gambito antes de unirse a los X-Men, Lobezno en Madripoor, los X-Men de Roy Thomas antes de <em>Giant-Size</em> y el equipo de <em>X-Treme X-Men</em> justo después de la serie original de Claremont.'
          - '<em>X-Men ''92</em> es una realidad alternativa: la versión de la serie animada de los 90 fundando su propia Krakoa.'
          etiqueta:
            clase: t4
            texto: Al margen de la continuidad
  - evento:
      id: m2-b3-hellfire-gala-2023
      etiqueta: Evento · Julio 2023 · Cierre del bloque
      titulo: Hellfire Gala (2023)
      creditos: Gerry Duggan, Kieron Gillen, Al Ewing · varios
      descripcion:
      - 'La tercera gala es una emboscada: Orchis ataca durante la fiesta, mata a buena parte de la población mutante y desmantela la nación en una sola noche. El número más importante de toda la era después de <em>House of X</em>.'
      apartados:
      - apartado: Orden
        texto: 'Hellfire Gala 2023 #1, número único y extenso. <strong>No tiene capítulos en las series mutantes:</strong> todas las cabeceras se detienen justo antes y retoman después, ya con Krakoa caída. La única serie que la acompaña es <em>Invincible Iron Man</em>, cuyo número 8 vive esa noche desde Nueva York (ficha en el tramo 4.1).'
      - apartado: Advertencia
        texto: No lo leas suelto. Pierde casi todo su efecto si no vienes de <em>Immortal X-Men</em> y <em>X-Men Red</em>.
- id: b4
  fechas: Agosto 2023 — julio 2024
  titulo: Fall of X
  intro: Krakoa ha caído. Orchis controla la narrativa, los mutantes están dispersos, cazados o atrapados, y la resurrección —el gran seguro de vida de cinco años— ya no funciona. Diez meses de derrota antes del contraataque.
  navegacion:
    anio: 2023–2024
    texto: Fall of X
  contenido:
  - tramo:
      numero: '4.1'
      titulo: La dispersión
      cuando: Agosto 2023 – enero 2024
      nota: 'Cada cabecera sigue a un grupo distinto de supervivientes, sin contacto entre ellos. Es el tramo más disperso de la era: puedes leerlos en cualquier orden.'
      entradas:
      - serie:
          id: m2-b4-immortal-x-men-14-18
          prioridad: p1
          titulo: Immortal X-Men <span class="nums">#14–18</span>
          creditos: Kieron Gillen · Lucas Werneck · 2023
          continuidad:
          - viene: ◂ Viene de la <em>Hellfire Gala 2023</em>
          descripcion:
          - Gillen cierra su serie con el Consejo deshecho y Destino como única que sabía lo que iba a pasar.
          etiqueta:
            clase: t1
            texto: Esencial
      - serie:
          id: m2-b4-x-men-red-vol-2-14-16
          prioridad: p1
          titulo: X-Men Red vol. 2 <span class="nums">#14–16</span>
          creditos: Al Ewing · Jacopo Camagni · 2023
          continuidad:
          - viene: ◂ Viene de la <em>Hellfire Gala 2023</em>
          - sigue: '▸ Los números #17–18 acompañan al final de la era'
          descripcion:
          - La guerra civil de Arakko, que es la única parte de la especie que sigue en pie.
          etiqueta:
            clase: t1
            texto: Esencial
      - serie:
          id: m2-b4-x-men-vol-6-25-29
          prioridad: p2
          titulo: X-Men vol. 6 <span class="nums">#25–29</span>
          creditos: Gerry Duggan · Joshua Cassara · 2023
          continuidad:
          - viene: ◂ Viene de la <em>Hellfire Gala 2023</em>
          - sigue: '▸ Los números #30–35 acompañan al final de la era'
          descripcion:
          - La resistencia de Cíclope desde un búnker. Es la cabecera que conduce al evento final.
          etiqueta:
            clase: t2
            texto: Recomendado
      - serie:
          id: m2-b4-uncanny-avengers-vol-4-1-5
          prioridad: p2
          titulo: Uncanny Avengers vol. 4 <span class="nums">#1–5</span>
          creditos: Gerry Duggan · Javier Garrón · 2023–2024
          descripcion:
          - Rondador Nocturno monta un equipo mixto para pelear la guerra de propaganda. La más disfrutable del bloque.
          etiqueta:
            clase: t2
            texto: Recomendado
      - serie:
          id: m2-b4-las-cabeceras-de-la-resistencia
          titulo: Las cabeceras de la resistencia
          creditos: 'X-Force #43–46 · Wolverine #36–50 · Dark X-Men vol. 2 #1–5 · Astonishing Iceman #1–5 · Jean Grey #1–4 · Children of the Vault #1–4 · Realm of X #1–4 · Alpha Flight vol. 5 #1–5 · Fallen Friend: The Death of Ms. Marvel #1 + Ms. Marvel: The New Mutant #1–4 · 2023–2024'
          descripcion:
          - 'Dos cabeceras veteranas y siete miniseries paralelas, de calidad desigual. Ninguna imprescindible; <em>Dark X-Men</em> y <em>Children of the Vault</em> son las que mejor aguantan. <em>Wolverine</em> cierra en el #50 a la vez que el evento final: sus últimos números puedes dejarlos para leerlos junto a él.'
          - 'Dos añadidos que van con estas series: <em>Fallen Friend</em> (julio de 2023) es el homenaje a Kamala Khan tras su muerte en <em>Amazing Spider-Man</em>, y se lee antes de <em>The New Mutant</em>. El primer número de <em>Wolverine</em> de esta lista (el 36) es la tercera parte de <em>Ghost Rider/Wolverine: Weapons of Vengeance</em>: Alpha #1 → Ghost Rider #17 → ese número → Omega #1 (agosto – septiembre de 2023).'
          etiqueta:
            clase: opcional
            texto: Opcional
      - serie:
          id: m2-b4-x-men-days-of-future-past-doomsday-1-4
          prioridad: p4
          titulo: 'X-Men: Days of Future Past — Doomsday <span class="nums">#1–4</span>'
          creditos: Marc Guggenheim · Manuel Garcia · 2023
          descripcion:
          - Secuela del clásico de 1981, en su propia línea temporal. Nada que ver con la trama principal.
          etiqueta:
            clase: t4
            texto: Alterna
      - serie:
          id: m2-b4-uncanny-spider-man-1-5-x-men-blue-origins-1
          prioridad: p2
          titulo: 'Uncanny Spider-Man <span class="nums">#1–5</span> · X-Men Blue: Origins <span class="nums">#1</span>'
          creditos: Simon Spurrier · Lee Garbett / Wilton Santos · septiembre – diciembre 2023
          continuidad:
          - viene: '◂ Cierra la línea de Rondador de Spurrier: <em>Way of X</em> → <em>Legion of X</em> → <em>Nightcrawlers</em>'
          descripcion:
          - 'Tras la Gala, Rondador huye disfrazado de Spider-Man por Nueva York y, por primera vez en años, se lo pasa bien siendo un héroe. El one-shot <em>Blue: Origins</em> es su origen definitivo, con Mística.'
          etiqueta:
            clase: t2
            texto: Recomendado
      - serie:
          id: m2-b4-invincible-iron-man-vol-5-1-13
          titulo: Invincible Iron Man vol. 5 <span class="nums">#1–13</span>
          creditos: Gerry Duggan · Juan Frigeri · diciembre 2022 – diciembre 2023
          continuidad:
          - sigue: '▸ Los números #14–18 son capítulos del evento final, y los #19–20 cierran la serie después'
          descripcion:
          - 'No es de la línea mutante, pero se cose a ella: Tony Stark, arruinado, se enfrenta a los Centinelas de Orchis, vive la Gala de 2023 en su número 8, se casa con Emma Frost y se hace con el Club Fuego Infernal. Los #1–7 salen antes de la caída de Krakoa.'
          etiqueta:
            clase: opcional
            texto: Opcional
      - serie:
          id: m2-b4-original-x-men-1-weapon-x-men-1-4
          titulo: Original X-Men <span class="nums">#1</span> · Weapon X-Men <span class="nums">#1–4</span>
          creditos: Christos N. Gage · Greg Land / Yıldıray Çınar · diciembre 2023 – mayo 2024
          descripcion:
          - 'Aventura multiversal de Gage en dos partes: primero los cinco X-Men originales y, después, un equipo de Lobeznos de distintos universos. Independiente de la caída de Krakoa.'
          etiqueta:
            clase: opcional
            texto: Opcional
      - serie:
          id: m2-b4-al-margen-de-krakoa-2023-2024
          titulo: Al margen de Krakoa (2023–2024)
          creditos: 'X-23: Deadly Regenesis #1–5 (2023) · Storm #1–5 (2023) · Magneto #1–4 (2023) · Predator vs. Wolverine #1–4 (2023) · Wolverine: Madripoor Knights #1–5 (2024)'
          descripcion:
          - 'Historias nuevas ambientadas en el pasado: Laura en la época de Utopía, Tormenta en una etapa clásica (Ann Nocenti), Magneto al frente de los Nuevos Mutantes en los ochenta (J.M. DeMatteis), el duelo de Lobezno con un depredador a lo largo de su vida y Claremont de vuelta a Madripoor con el Capitán América y la Viuda Negra.'
          etiqueta:
            clase: t4
            texto: Al margen de la continuidad
  - evento:
      id: m2-b4-fall-of-the-house-of-x-rise-of-the-powers-of-x
      etiqueta: Evento final · 10 números centrales y 33 de acompañamiento · Enero – junio 2024
      titulo: Fall of the House of X / Rise of the Powers of X
      creditos: Gerry Duggan &amp; Kieron Gillen · Lucas Werneck &amp; R.B. Silva
      descripcion:
      - 'El cierre de la era, construido como espejo deliberado de <em>House of X</em> / <em>Powers of X</em>: una serie cuenta el contraataque en el presente, la otra la partida cósmica que se juega por detrás. <strong>Van intercalados</strong>, igual que el arranque de 2019.'
      - 'Alrededor van <em>X-Men</em> vol. 6 hasta su final y siete series más con el sello del evento: <em>Invincible Iron Man</em>, <em>Cable</em> (2024), <em>Resurrection of Magneto</em> (Ewing, que cierra lo de <em>X-Men Red</em>), <em>Dead X-Men</em>, <em>Ms. Marvel: Mutant Menace</em>, <em>X-Men: Forever</em> (Gillen, que remata <em>Immortal X-Men</em>) y dos números de <em>Avengers</em>.'
      apartados:
      - apartado: Columna vertebral
        texto: 'FoHoX #1 → RoPoX #1 → FoHoX #2 → RoPoX #2 → FoHoX #3 → RoPoX #3 → FoHoX #4 → RoPoX #4 → FoHoX #5 → RoPoX #5'
      - apartado: Orden completo (por fecha de publicación)
        texto: '<strong>FoHoX #1</strong> → <strong>RoPoX #1</strong> → <span class="cap">X-Men #30</span> → Invincible Iron Man #14 → Cable #1 → Resurrection of Magneto #1 → Dead X-Men #1 → <span class="cap">X-Men #31</span> → <strong>FoHoX #2</strong> → <strong>RoPoX #2</strong> → Cable #2 → Dead X-Men #2 → Invincible Iron Man #15 → Resurrection of Magneto #2 → Ms. Marvel: Mutant Menace #1 → <span class="cap">X-Men #32</span> → Dead X-Men #3 → <strong>FoHoX #3</strong> → Invincible Iron Man #16 → Resurrection of Magneto #3 → X-Men: Forever #1 → <strong>RoPoX #3</strong> → Cable #3 → Avengers #12 → <span class="cap">X-Men #33</span> → Invincible Iron Man #17 → Ms. Marvel: Mutant Menace #2 → Resurrection of Magneto #4 → Dead X-Men #4 → <strong>FoHoX #4</strong> → Avengers #13 → <strong>RoPoX #4</strong> → X-Men: Forever #2 → Cable #4 → Invincible Iron Man #18 → <span class="cap">X-Men #34</span> → X-Men: Forever #3 → Ms. Marvel: Mutant Menace #3 → X-Men: Forever #4 → <strong>FoHoX #5</strong> → <strong>RoPoX #5</strong> → Ms. Marvel: Mutant Menace #4 → <span class="cap">X-Men #35</span>'
      - apartado: De dónde sale el orden
        texto: 'Las 43 entregas que Marvel Fandom asigna al evento, ordenadas por su fecha de salida (enero – junio de 2024). Cuando varias salieron el mismo día, va primero la serie central. Las miniseries se pueden leer también seguidas sin perder nada: lo que importa es no adelantar <em>FoHoX</em> y <em>RoPoX</em>.'
      - apartado: Versión mínima
        texto: Los diez números centrales intercalados, con los seis últimos de <em>X-Men</em> en su sitio.
      - apartado: Acompañan al evento
        texto: '<span class="cap">X-Men Red #17–18</span> · <span class="cap">X-Force #47–50</span> y los últimos números de <em>Wolverine</em> (ficha de la resistencia) llevan aún el sello <em>Fall of X</em>, pero salen en las mismas semanas y desembocan aquí: léelos antes o a la par del principio del evento.'
      - apartado: El último número
        texto: '<em>X-Men</em> vol. 6 <strong>#35</strong> (junio 2024) es el epílogo real: un salto de quince años que cierra la era en sus propios términos en lugar de restaurar el statu quo anterior. Léelo al final de todo.'
      - apartado: Coda
        texto: '<em>Invincible Iron Man</em> #19–20 (junio y julio de 2024) cierran la serie de Duggan: Tony y Emma Frost después de la guerra con Orchis.'
  - tramo:
      numero: '4.2'
      titulo: Entre dos eras
      cuando: Mayo – julio 2024
      nota: Tres especiales publicados entre el final de Krakoa y el arranque de <em>From the Ashes</em>. Ninguno es imprescindible.
      entradas:
      - serie:
          id: m2-b4-x-men-the-wedding-special-1
          titulo: 'X-Men: The Wedding Special <span class="nums">#1</span>'
          creditos: Kieron Gillen · Rachael Stott · mayo 2024
          descripcion:
          - La boda de Mística y Destino, pareja desde hace más de un siglo, que nunca se había contado en viñetas. Salió dentro de la línea del Orgullo de Marvel.
          etiqueta:
            clase: opcional
            texto: Opcional
      - serie:
          id: m2-b4-giant-size-x-men-1-2024
          titulo: Giant-Size X-Men <span class="nums">#1</span> (2024)
          creditos: Ann Nocenti · Lee Ferguson · mayo 2024
          descripcion:
          - 'Ángel atrapado en un laberinto mental por un villano nuevo. Número suelto; incluye una reedición de <em>Marvel Two-in-One</em> #68.'
          etiqueta:
            clase: opcional
            texto: Opcional
      - serie:
          id: m2-b4-x-men-heir-of-apocalypse-1-4
          titulo: 'X-Men: Heir of Apocalypse <span class="nums">#1–4</span>'
          creditos: Steve Foxe · Netho Diaz · junio – julio 2024
          descripcion:
          - Apocalipsis ocupa su trono en Arakko y doce mutantes, héroes y villanos, compiten por ser su heredero en la Tierra. Hace de puente con la etapa siguiente.
          etiqueta:
            clase: opcional
            texto: Opcional
- id: b5
  fechas: Julio 2024 — septiembre 2025
  titulo: From the Ashes
  intro: 'Vuelta al principio: sin nación, sin resurrección y sin isla. Los mutantes se reparten en comunidades pequeñas y la línea vuelve al formato de equipos separados que no se cruzan casi nunca. Después de cinco años de arquitectura compartida, es un reinicio deliberado hacia lo clásico.'
  navegacion:
    anio: 2024–2025
    texto: From the Ashes
  contenido:
  - tramo:
      numero: '5.1'
      titulo: Las dos casas
      cuando: Julio – noviembre 2024
      nota: 'Dos cabeceras principales con dos equipos que ni se hablan: Cíclope en Alaska, Rogue en Luisiana. Alterna entre las dos; el resto son solitarios independientes.'
      entradas:
      - evento:
          id: m2-b5-blood-hunt
          linea_marvel: true
          etiqueta: Evento de toda la línea Marvel · Mayo – julio 2024
          titulo: Blood Hunt
          creditos: Jed MacKay · Pepe Larraz (serie principal) · one-shots mutantes de varios autores
          descripcion:
          - 'Los vampiros tapan el sol y cazan a la humanidad. Llega justo cuando cae Krakoa, con los mutantes dispersos, y <strong>los one-shots van repartidos</strong> a lo largo del evento: cada uno sigue a una heroína que luego tendrá serie propia en esta etapa.'
          apartados:
          - apartado: Antes de empezar
            texto: Nada del evento. Por la parte mutante, llégalo con el bloque 4 terminado.
