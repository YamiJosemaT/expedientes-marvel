            texto: '<em>Dark Web</em> #1 → <em>Dark Web: X-Men</em> #1–3 → <em>Dark Web Finale</em> #1.'
          - apartado: Ojo
            texto: 'Es saltable para la trama de Krakoa: no deja consecuencias en las series X.'
  - evento:
      id: m2-b3-sins-of-sinister
      etiqueta: Crossover · 11 capítulos · Enero – abril 2023
      titulo: Sins of Sinister
      creditos: Kieron Gillen, Al Ewing &amp; Simon Spurrier · varios
      descripcion:
      - 'Sinister toma el control y la historia salta mil años hacia adelante para enseñar lo que sale de ahí. Tres miniseries de tres números que se leen <strong>rotando</strong>, y cada ronda salta más lejos: los tres #1 transcurren diez años después, los #2 cien años y los #3 mil. Formalmente lo más atrevido de la era.'
      apartados:
      - apartado: Orden completo
        texto: 'Sins of Sinister #1 → Storm &amp; the Brotherhood of Mutants #1 → Nightcrawlers #1 → Immoral X-Men #1 → Nightcrawlers #2 → Immoral X-Men #2 → Storm &amp; the Brotherhood #2 → Immoral X-Men #3 → Storm &amp; the Brotherhood #3 → Nightcrawlers #3 → Sins of Sinister: Dominion #1'
      - apartado: Tres series se suspenden durante el evento
        texto: 'Las tres miniseries <strong>ocupan el hueco</strong> de tres cabeceras en marcha, que dejan de publicarse de febrero a abril: <em>Immortal X-Men</em> → <em>Immoral X-Men</em> · <em>X-Men Red</em> → <em>Storm &amp; the Brotherhood of Mutants</em> · <em>Legion of X</em> → <em>Nightcrawlers</em>. Las dos primeras se retoman después en su #11; <em>Legion of X</em> ya no vuelve.'
      - apartado: Prólogo
        texto: '<em>Immortal X-Men</em> #9–10 preparan directamente el evento. Ya están en el tramo 3.2: léelos justo antes de empezar.'
  - tramo:
      numero: '3.3'
