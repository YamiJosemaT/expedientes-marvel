          descripcion:
          - 'Wilson Fisk, alcalde de Nueva York, prohíbe la actividad de los superhéroes en la ciudad, y el tie-in cuenta cómo afecta a los X-Men. El evento se solapa con el cambio de etapa: empieza antes del relanzamiento y termina ya dentro de él.'
          apartados:
          - apartado: Antes de empezar
            texto: 'Contexto opcional: la etapa de Chip Zdarsky en <em>Daredevil</em>, de la que sale el evento.'
          - apartado: Orden de lectura
            texto: '<strong>Devil''s Reign #1</strong> → <span class="cap">Devil''s Reign: X-Men #1–3</span> → <strong>Devil''s Reign #2</strong> → <strong>#3</strong> → <strong>#4</strong> → <strong>#5</strong> → <strong>#6</strong> → Devil''s Reign: Omega #1'
          - apartado: Versión mínima
            texto: '<em>Devil''s Reign</em> #1 y después <em>Devil''s Reign: X-Men</em> #1–3.'
