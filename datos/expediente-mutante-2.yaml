          creditos: 'Psylocke: Ninja #1–5 (Tim Seeley) · X-Men: Outback #1–5 (Steve Orlando) · X-Men: Elsewhen (John Byrne, novela gráfica) · Gambit: Wanted #1–5 (Chris Claremont) · Captain Britain 50th Anniversary Special #1 · X-Men: Incursions #1 (Alex Paknadel)'
          descripcion:
