      apartados:
      - apartado: Orden
        texto: 'Hellfire Gala 2022 #1, número único'
  - evento:
      id: m2-b3-a-x-e-judgment-day
      linea_marvel: true
      etiqueta: Evento de toda la línea Marvel · Julio – noviembre 2022
      titulo: 'A.X.E.: Judgment Day'
      creditos: Kieron Gillen · Valerio Schiti
      descripcion:
      - 'Vengadores, X-Men y Eternos: un Celestial se despierta, se declara juez de la humanidad y empieza a evaluar si la especie merece existir. Uno de los mejores crossovers de Marvel en años, y toca de lleno la cuestión de la resurrección.'
      - '<strong>Este evento no se lee por bloques.</strong> Gillen escribió a la vez la serie principal, <em>Death to the Mutants</em> e <em>Immortal X-Men</em>, y los tres hilos se van respondiendo número a número. Si lees primero los seis centrales y luego los tie-ins, te destripas el evento dos veces: buena parte de los giros de la serie principal se explican en las otras dos.'
      apartados:
      - apartado: Antes de empezar
        texto: 'Preludio directo: <em>Eternals</em> (2021) #10–12, la guerra contada desde el lado de los Eternos (está en el Expediente Eterno), y <em>Free Comic Book Day 2022: Avengers/X-Men</em> #1.'
      - apartado: Columna vertebral — va entrelazada, en este orden exacto
        texto: 'A.X.E.: Eve of Judgment #1 → <strong>Judgment Day #1</strong> → <span class="cap">Immortal X-Men #5</span> → <span class="cap">X-Men Red #5</span> → <strong>Judgment Day #2</strong> → Death to the Mutants #1 → <span class="cap">X-Men vol. 6 #13</span> → <strong>Judgment Day #3</strong> → Death to the Mutants #2 → <span class="cap">X-Men vol. 6 #14</span> → <span class="cap">Immortal X-Men #6</span> → <span class="cap">X-Men Red #6</span> → <strong>Judgment Day #4</strong> → <span class="cap">X-Men Red #7</span> → <strong>Judgment Day #5</strong> → <span class="cap">Immortal X-Men #7</span> → Death to the Mutants #3 → <strong>Judgment Day #6</strong> → A.X.E.: Judgment Day Omega #1'
      - apartado: Satélites mutantes — dentro de la ventana de los capítulos 3 y 4
        texto: '<span class="cap">X-Force #30–33</span> · <span class="cap">Wolverine #24–25</span> · <span class="cap">Marauders vol. 2 #6</span> · <span class="cap">Legion of X #6</span> — aportan el punto de vista de sus equipos, no trama del evento. Su orden entre sí es indiferente.'
      - apartado: Fuera de la línea mutante (prescindibles)
        texto: 'Avengers #60 · Fantastic Four #47–48 · Amazing Spider-Man #10 · Captain Marvel #42 · A.X.E.: Iron Fist #1 — y los epílogos de personaje <em>A.X.E.: X-Men</em> #1, <em>Avengers</em> #1, <em>Eternals</em> #1 y <em>Starfox</em> #1, que van entre el #6 y el Omega'
      - apartado: La versión corta
        texto: 'Los seis de <em>Judgment Day</em> + <em>Death to the Mutants</em> #1–3 + <em>Immortal X-Men</em> #5–7 + <em>X-Men Red</em> #5–7, entrelazados como arriba. Dieciocho números y tienes el evento completo.'
  - tramo:
      numero: '3.2'
      titulo: Entre el juicio y el pecado
      cuando: Finales de 2022
      entradas:
      - serie:
          id: m2-b3-immortal-x-men-8-10-x-men-red-8-10
