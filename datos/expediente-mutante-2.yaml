          - '<em>Weapons of Armageddon</em> es la parte de Lobezno del evento <em>Armageddon</em> de 2026: alguien ha resucitado los métodos del programa Arma X. El Comics Giveaway Day de mayo (<em>Armageddon/X-Men</em>) prepara el evento.'
          etiqueta:
            clase: opcional
            texto: Opcional
      - serie:
          id: m2-b7-numeros-especiales
          titulo: Números especiales
          creditos: 'X-Men Annual #1 (marzo) · Uncanny X-Men Annual #1 (abril) · Comics Giveaway Day 2026: Armageddon/X-Men #1 (mayo) · Jubilee: Deadly Reunion #1 (mayo) · Infernal Hulk vs. Wolverine #1 (septiembre) · Punisher Showdowns: Wolverine #1 (noviembre) · 2026'
