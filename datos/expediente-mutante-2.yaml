          creditos: 'X-Force #43–46 · Wolverine #36–50 · Dark X-Men vol. 2 #1–4 · Astonishing Iceman #1–5 · Jean Grey #1–4 · Children of the Vault #1–4 · Realm of X #1–4 · Alpha Flight vol. 5 #1–5 · Ms. Marvel: The New Mutant #1–4 · 2023–2024'
