        texto: '<em>X-Men</em> vol. 6 <strong>#35</strong> (junio 2024) es el epílogo real: un salto de quince años que cierra la era en sus propios términos en lugar de restaurar el statu quo anterior. Léelo al final de todo.'
      - apartado: Coda
        texto: '<em>X-Men: Forever</em> #1–6 (Gillen, 2024) remata los hilos de <em>Immortal X-Men</em>. Muy recomendable si has seguido esa serie.'
- id: b5
  fechas: Julio 2024 — septiembre 2025
  titulo: From the Ashes
  intro: 'Vuelta al principio: sin nación, sin resurrección y sin isla. Los mutantes se reparten en comunidades pequeñas y la línea vuelve al formato de equipos separados que no se cruzan casi nunca. Después de cinco años de arquitectura compartida, es un reinicio deliberado hacia lo clásico.'
  navegacion:
    anio: 2024–2025
    texto: From the Ashes
  contenido:
  - tramo:
      numero: '5.1'
      titulo: Las dos casas
      cuando: Julio – noviembre 2024
      nota: 'Dos cabeceras principales con dos equipos que ni se hablan: Cíclope en Alaska, Rogue en Luisiana. Alterna entre las dos; el resto son solitarios independientes.'
      entradas:
      - evento:
          id: m2-b5-blood-hunt
          linea_marvel: true
          etiqueta: Evento de toda la línea Marvel · Mayo – julio 2024
          titulo: Blood Hunt
          creditos: Jed MacKay · Pepe Larraz (serie principal) · one-shots mutantes de varios autores
          descripcion:
          - 'Los vampiros tapan el sol y cazan a la humanidad. Llega justo cuando cae Krakoa, con los mutantes dispersos, y <strong>los one-shots van repartidos</strong> a lo largo del evento: cada uno sigue a una heroína que luego tendrá serie propia en esta etapa.'
          apartados:
          - apartado: Antes de empezar
            texto: Nada del evento. Por la parte mutante, llégalo con el bloque 4 terminado.
          - apartado: Orden de lectura
            texto: 'Free Comic Book Day 2024: Blood Hunt/X-Men #1 → <strong>Blood Hunt #1</strong> → <span class="cap">X-Men: Blood Hunt – Psylocke #1</span> → <strong>Blood Hunt #2</strong> → <span class="cap">X-Men: Blood Hunt – Jubilee #1</span> → <span class="cap">X-Men: Blood Hunt – Laura Kinney the Wolverine #1</span> → <strong>Blood Hunt #3</strong> → <strong>#4</strong> → <span class="cap">Wolverine: Blood Hunt #1–3</span> → <span class="cap">X-Men: Blood Hunt – Magik #1</span> → <strong>Blood Hunt #5</strong> → <span class="cap">Wolverine: Blood Hunt #4</span>'
          - apartado: Versión mínima
            texto: 'Los cuatro one-shots <em>X-Men: Blood Hunt</em> en el orden de arriba: funcionan como presentación de las heroínas de la etapa.'
          - apartado: Prescindible
            texto: Los tie-ins de otras líneas.
          - apartado: Después
            texto: El evento acaba con Doom como Hechicero Supremo, que es el arranque de <em>One World Under Doom</em> (tramo 5.2).
      - serie:
          id: m2-b5-x-men-vol-7-1-7
          prioridad: p1
          titulo: X-Men vol. 7 <span class="nums">#1–7</span>
          creditos: Jed MacKay · Ryan Stegman · 2024
          continuidad:
          - sigue: '▸ Los números #8–10 son capítulos de <em>Raid on Graymalkin</em>'
          descripcion:
          - Cíclope monta La Fábrica en Alaska. Es la cabecera central de la etapa y la que sigue viva hoy.
          etiqueta:
            clase: t1
            texto: Esencial
      - serie:
          id: m2-b5-uncanny-x-men-vol-6-1-6
          prioridad: p1
          titulo: Uncanny X-Men vol. 6 <span class="nums">#1–6</span>
          creditos: Gail Simone · David Marquez · 2024
          continuidad:
          - sigue: '▸ Los números #7–8 son capítulos de <em>Raid on Graymalkin</em>'
          descripcion:
          - Rogue, Gambito, Lobezno y Nightcrawler con un grupo de adolescentes nuevos en Luisiana. De las dos, es la mejor escrita.
          etiqueta:
            clase: t1
            texto: Esencial
      - serie:
          id: m2-b5-exceptional-x-men-1-7
          prioridad: p2
          titulo: Exceptional X-Men <span class="nums">#1–7</span>
          creditos: Eve L. Ewing · Carmen Carnero · 2024–2025
          descripcion:
          - Kitty Pryde, que ya no quiere saber nada, acaba entrenando a tres chicas en Chicago. Pequeña, íntima y la mejor sorpresa del bloque.
          etiqueta:
            clase: t2
            texto: Recomendado
      - serie:
          id: m2-b5-storm-1-4
          prioridad: p2
          titulo: Storm <span class="nums">#1–4</span>
          creditos: Murewa Ayodele · Lucas Werneck · 2024
          continuidad:
          - sigue: '▸ El #5 es tie-in de <em>One World Under Doom</em> y el #6, capítulo de <em>X-Manhunt</em> (tramo 5.2)'
          descripcion:
          - Tormenta tratada como la mutante más poderosa del planeta y con el peso político que eso tiene.
          etiqueta:
            clase: t2
            texto: Recomendado
      - serie:
          id: m2-b5-las-cabeceras-de-equipo
          titulo: Las cabeceras de equipo
          creditos: 'NYX #1–8 (Collin Kelly &amp; Jackson Lanzing) · X-Factor vol. 5 #1–6 (Mark Russell) · X-Force vol. 7 #1–8 (Geoffrey Thorne) · Phoenix #1–8 (Stephanie Phillips) · 2024–2025'
          continuidad:
          - sigue: '▸ X-Factor #7 es tie-in de <em>One World Under Doom</em>'
          - sigue: '▸ NYX #9, X-Factor #8 y X-Force #9 son capítulos de <em>X-Manhunt</em>'
          descripcion:
          - <em>NYX</em> (mutantes jóvenes sin red en Nueva York) y <em>X-Factor</em> (un equipo corporativo de relaciones públicas) son las dos más interesantes.
          etiqueta:
            clase: opcional
            texto: Opcional
      - serie:
          id: m2-b5-los-solitarios
          titulo: Los solitarios
          creditos: 'Wolverine vol. 8 #1–5 (Saladin Ahmed) · Laura Kinney: Wolverine #1–5 (Erica Schultz) · Magik #1–5 · Mystique #1–5 (Declan Shalvey) · Dazzler #1–4 · Weapon X-Men #1–4 · Deadpool/Wolverine · 2024–2025'
          descripcion:
          - Todos independientes del resto. <em>Mystique</em> es el más sólido.
          etiqueta:
            clase: opcional
            texto: Opcional
  - evento:
      id: m2-b5-raid-on-graymalkin
      etiqueta: Crossover · 5 capítulos · Noviembre 2024 – enero 2025
      titulo: Raid on Graymalkin
      creditos: Jed MacKay &amp; Gail Simone · varios
      descripcion:
      - 'Primer cruce entre los dos equipos: hay que asaltar una prisión orbital para mutantes. Corto y contenido.'
      apartados:
      - apartado: Orden completo
        texto: '<span class="cap">X-Men #8</span> → <span class="cap">Uncanny X-Men #7</span> → <span class="cap">X-Men #9</span> → <span class="cap">Uncanny X-Men #8</span> → <span class="cap">X-Men #10</span> (epílogo)'
  - tramo:
      numero: '5.2'
      titulo: Entre los dos cruces
      cuando: Enero – febrero 2025
      entradas:
      - serie:
          id: m2-b5-x-men-vol-7-11-12-uncanny-x-men-vol-6-9-10
          prioridad: p2
          titulo: X-Men vol. 7 <span class="nums">#11–12</span> · Uncanny X-Men vol. 6 <span class="nums">#9–10</span>
          creditos: Jed MacKay / Gail Simone · 2025
          continuidad:
          - viene: ◂ Ambas vienen de <em>Raid on Graymalkin</em>
          - sigue: '▸ X-Men #13 y Uncanny #11 son capítulos de <em>X-Manhunt</em>'
          etiqueta:
            clase: t2
            texto: Recomendado
      - evento:
          id: m2-b5-one-world-under-doom
          linea_marvel: true
          etiqueta: Evento de toda la línea Marvel · Febrero – octubre 2025
          titulo: One World Under Doom
          creditos: Ryan North · R.B. Silva (serie principal)
          descripcion:
          - Doctor Doom, Hechicero Supremo, se proclama gobernante del mundo. Persigue a Tormenta, y X-Factor tiene una misión en los días entre el aviso a las naciones y el anuncio público. <strong>Tres series mutantes le ceden un número</strong>, publicados el mismo día, justo antes de <em>X-Manhunt</em>.
          apartados:
          - apartado: Antes de empezar
            texto: '<em>Blood Hunt</em> (tramo 5.1), que deja a Doom como Hechicero Supremo, y <em>Fantastic Four</em> #28.'
          - apartado: Orden de lectura
            texto: 'Fantastic Four #28 → <strong>One World Under Doom #1</strong> → <span class="cap">Storm #5</span> → <span class="cap">X-Factor #7</span> → <span class="cap">Weapon X-Men #1</span> → resto de <strong>One World Under Doom</strong>'
          - apartado: Nota
            texto: Las guías no coinciden en el orden de los tres tie-ins entre sí, porque salieron el mismo día (19 de febrero de 2025); el de arriba es el de Comic Book Herald. Alguna guía incluye también números posteriores de <em>Storm</em>.
          - apartado: Versión mínima
            texto: '<em>One World Under Doom</em> #1 y después los tres tie-ins. <em>Storm</em> #5 y <em>X-Factor</em> #7 son de series que estás leyendo: no te los saltes.'
          - apartado: Después
            texto: <em>X-Manhunt</em>, en marzo.
  - evento:
      id: m2-b5-x-manhunt
      etiqueta: Crossover · 8 capítulos · Marzo 2025
      titulo: X-Manhunt
      creditos: Varios autores de la línea
      descripcion:
      - Xavier se escapa de prisión y toda la línea se pone a buscarlo, cada equipo por sus motivos. Es el cruce que por fin pone a hablar a las siete cabeceras entre sí.
      apartados:
      - apartado: Orden completo
        texto: 'X-Manhunt Alpha #1 → <span class="cap">Uncanny X-Men #11</span> → <span class="cap">NYX #9</span> → <span class="cap">Storm #6</span> → <span class="cap">X-Men #13</span> → <span class="cap">X-Factor #8</span> → <span class="cap">X-Force #9</span> → X-Manhunt Omega #1'
  - tramo:
      numero: '5.3'
      titulo: Hasta el final de la etapa
      cuando: Abril – septiembre 2025
      nota: Último tramo antes de que la línea entera se suspenda tres meses para el evento del bloque 6.
      entradas:
      - serie:
          id: m2-b5-x-men-vol-7-14-22-the-hellfire-vigil-1
          prioridad: p1
          titulo: X-Men vol. 7 <span class="nums">#14–22</span> + The Hellfire Vigil <span class="nums">#1</span>
          creditos: Jed MacKay · Netho Diaz, Ryan Stegman · 2025
          continuidad:
          - viene: ◂ Viene de <em>X-Manhunt</em>
          - sigue: ▸ Continúa en el tramo 7.1, ya con diez años de salto
          descripcion:
          - «Hostile Takeover» y la vuelta de la gala en formato reducido (<em>The Hellfire Vigil</em>).
          etiqueta:
            clase: t1
            texto: Esencial
      - serie:
          id: m2-b5-uncanny-x-men-vol-6-12-21
          prioridad: p1
          titulo: Uncanny X-Men vol. 6 <span class="nums">#12–21</span>
          creditos: Gail Simone · Javier Garrón, David Marquez · 2025
          continuidad:
          - viene: ◂ Viene de <em>X-Manhunt</em>
          - sigue: ▸ Continúa en el tramo 7.1
          etiqueta:
            clase: t1
            texto: Esencial
      - serie:
          id: m2-b5-el-resto-de-la-etapa
          titulo: El resto de la etapa
          creditos: 'Exceptional X-Men #8–13 · NYX #10–12 · X-Factor #9–10 · X-Force #10–12 · Phoenix #9–14 · Wolverine vol. 8 #6–13 · 2025'
          continuidad:
          - viene: ◂ Varias vienen de <em>X-Manhunt</em>
          descripcion:
          - Varias cierran aquí para dejar hueco al relanzamiento.
          etiqueta:
            clase: opcional
            texto: Opcional
      - serie:
          id: m2-b5-imperial-1-4
          titulo: Imperial <span class="nums">#1–4</span>
          creditos: Jonathan Hickman · Federico Vicentini, Marco Checchetto · junio – octubre 2025
          descripcion:
          - Evento cósmico que refunda los imperios galácticos como la Unión Galáctica. Toca a los mutantes solo de refilón; donde de verdad pesa es en los Guardianes de la Galaxia.
          etiqueta:
            clase: opcional
            texto: Opcional
- id: b6
  fechas: Octubre — diciembre 2025
  titulo: Age of Revelation
  intro: 'Marvel suspende la línea entera durante tres meses y la sustituye por dieciséis miniseries ambientadas diez años en el futuro, bajo el dominio de Revelation. Es el homenaje al trigésimo aniversario de <em>La Era de Apocalipsis</em> y funciona igual que aquella: no es un universo alterno, es <strong>el</strong> presente durante tres meses, y lo que pasa aquí se queda.'
  navegacion:
    anio: '2025'
    texto: Age of Revelation
  contenido:
  - tramo:
      numero: '6.1'
      titulo: La puerta
      cuando: Octubre 2025
      nota: Dos números para entender la premisa. Con esto y el <em>Finale</em> tienes el esqueleto del evento sin leer las dieciséis miniseries.
      entradas:
      - serie:
          id: m2-b6-x-men-age-of-revelation-0-overture-1
          prioridad: p1
          titulo: 'X-Men: Age of Revelation <span class="nums">#0</span> + Overture <span class="nums">#1</span>'
          creditos: Jed MacKay · varios · octubre 2025
          descripcion:
          - El salto temporal y la caída. Empieza aquí obligatoriamente.
          etiqueta:
            clase: t1
            texto: Esencial
  - tramo:
      numero: '6.2'
      titulo: Las dieciséis miniseries
      cuando: Octubre – diciembre 2025
      nota: Tres números cada una, todas simultáneas. La columna real es <em>Book of Revelation</em>; las otras quince son postales de ese mundo y se pueden leer suelta o ninguna.
      entradas:
      - serie:
          id: m2-b6-x-men-book-of-revelation-1-3
          prioridad: p1
          titulo: 'X-Men: Book of Revelation <span class="nums">#1–3</span>'
          creditos: Jed MacKay · 2025
          descripcion:
          - La trama central del evento. Si solo lees una miniserie, esta.
          etiqueta:
            clase: t1
            texto: Esencial
      - serie:
          id: m2-b6-las-mas-recomendadas
          prioridad: p2
          titulo: Las más recomendadas
          creditos: 'Unbreakable X-Men #1–3 · The Last Wolverine #1–3 · Expatriate X-Men #1–3 · Amazing X-Men vol. 3 #1–3 · Rogue Storm #1–3 · 2025'
          descripcion:
          - Las cinco que mejor funcionan por sí solas y las que más peso tienen en el <em>Finale</em>.
          etiqueta:
            clase: t2
            texto: Recomendado
      - serie:
          id: m2-b6-el-resto-del-evento
          titulo: El resto del evento
          creditos: 'Binary #1–3 · Cloak or Dagger #1–3 · Iron &amp; Frost #1–3 · Laura Kinney: Sabretooth #1–3 · Longshots #1–3 · Sinister''s Six #1–3 · Omega Kids #1–3 · Radioactive Spider-Man #1–3 · Undeadpool #1–3 · X-Vengers #1–3 · 2025'
          descripcion:
          - 'Diez miniseries más, de tono muy variable: algunas son terror, otras comedia. Prescindibles para seguir la trama.'
          etiqueta:
            clase: opcional
            texto: Opcional
  - evento:
      id: m2-b6-x-men-age-of-revelation-finale
      etiqueta: Cierre del evento · Diciembre 2025
      titulo: 'X-Men: Age of Revelation Finale'
      creditos: Jed MacKay · diciembre 2025
      descripcion:
      - 'Resuelve el evento y deja a la franquicia en el punto de partida del bloque siguiente. <strong>El salto de diez años no se deshace</strong>: la línea continúa en ese futuro, que es lo que distingue este evento de un universo alterno al uso.'
      apartados:
      - apartado: Ruta mínima del bloque 6
        texto: 'Age of Revelation #0 → Overture #1 → Book of Revelation #1–3 → Finale #1. Cinco números para enterarte de todo.'
- id: b7
  fechas: Enero 2026 — hoy
  titulo: Shadows of Tomorrow
  intro: 'La etapa actual. Las cabeceras recuperan su numeración donde la dejaron, pero diez años más adelante en el tiempo, con las consecuencias de <em>Age of Revelation</em> encima. Aquí es donde te pones al día de verdad: todo lo de abajo está en curso o acaba de salir.'
