          creditos: 'Rogue #1–5 (enero) · Magik and Colossus #1–5 (febrero) · Cyclops #1–5 (febrero) · Wolverine: Weapons of Armageddon #1–4 (febrero, Chip Zdarsky) · Moonstar #1–5 (marzo) · Storm: Earth''s Mightiest Mutant #1–5 (junio) · Bishop #1–5 (junio) · Tomb of Apocalypse (agosto) · 2026'
          descripcion:
