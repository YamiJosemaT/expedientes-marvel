            clase: t1
            texto: Esencial
      - serie:
          id: m2-b5-uncanny-x-men-vol-6-12-21
          prioridad: p1
          titulo: Uncanny X-Men vol. 6 <span class="nums">#12–21</span>
          creditos: Gail Simone · Javier Garrón, David Marquez · 2025
          continuidad:
          - viene: ◂ Viene de <em>X-Manhunt</em>
          - sigue: ▸ Continúa en el tramo 7.1
          etiqueta:
            clase: t1
            texto: Esencial
      - serie:
          id: m2-b5-el-resto-de-la-etapa
          titulo: El resto de la etapa
          creditos: 'Exceptional X-Men #8–13 · NYX #10 · X-Factor #9–10 · X-Force #10 · Storm #7–12 · Phoenix #9–15 · Wolverine vol. 8 #6–13 · Laura Kinney: Wolverine #6–10 · Magik #6–10 · Psylocke #6–10 · 2025'
          continuidad:
          - viene: ◂ Varias vienen de <em>X-Manhunt</em>
          descripcion:
          - 'Todas menos <em>Wolverine</em> terminan aquí para dejar hueco al relanzamiento: <em>NYX</em>, <em>X-Factor</em> y <em>X-Force</em> cierran en su número 10, <em>Storm</em> en el 12, <em>Exceptional</em> en el 13 y <em>Phoenix</em> en el 15.'
          etiqueta:
            clase: opcional
            texto: Opcional
      - serie:
          id: m2-b5-mas-series-de-la-etapa
          titulo: Más series de la etapa
          creditos: 'Sabretooth: The Dead Don''t Talk #1–5 (Frank Tieri) · Cable: Love and Chrome #1–5 (David Pepose) · Deadpool/Wolverine #1–10 (Benjamin Percy) · Weapon X-Men vol. 2 #2–5 (Joe Casey) · Spider-Man &amp; Wolverine #1–10 (Marc Guggenheim) · Wolverines &amp; Deadpools #1–3 (Cody Ziglar) · Storm: Lifedream #1 · diciembre 2024 – febrero 2026'
          continuidad:
          - viene: ◂ El primer número de <em>Weapon X-Men</em> vol. 2 es tie-in de <em>One World Under Doom</em> (tramo 5.2)
          descripcion:
          - Independientes entre sí y de las cabeceras. Lobezno investiga el pasado de Dientes de Sable, muerto, como gánster del Nueva York de principios del siglo XX; Cable queda atrapado en una ciudad futura en plena guerra civil; Lobezno forma pareja con Deadpool y con Spider-Man; <em>Weapon X-Men</em> junta a Lobezno, Deadpool, Cable, Chamber y Thunderbird; <em>Wolverines &amp; Deadpools</em> suma a sus hijas, Laura y Ellie.
          - '<em>Storm: Lifedream</em> es una antología por los 50 años del personaje, toda ella de autores negros.'
          etiqueta:
            clase: opcional
            texto: Opcional
      - evento:
          id: m2-b5-giant-size-x-men-2025
          etiqueta: Crossover · 6 números · Mayo – agosto 2025
          titulo: Giant-Size X-Men (2025)
          creditos: Jackson Lanzing &amp; Collin Kelly · Adam Kubert, Rod Reis, C.F. Villa, Francesco Manna
          descripcion:
          - 'Por los 50 años de <em>Giant-Size X-Men</em> #1, Kamala Khan persigue a un Legión desatado por los grandes momentos de la historia mutante: la llegada del equipo de 1975, la Saga de Fénix Oscura, la Era de Apocalipsis y <em>House of M</em>. Viaje en el tiempo dentro de la continuidad, no una realidad alternativa.'
          apartados:
          - apartado: Orden de lectura
            texto: 'Free Comic Book Day 2025: Fantastic Four/X-Men #1 (la historia de los X-Men) → <strong>Giant-Size X-Men #1</strong> → Giant-Size Dark Phoenix Saga #1 → Giant-Size Age of Apocalypse #1 → Giant-Size House of M #1 → <strong>Giant-Size X-Men #2</strong>'
          - apartado: De dónde sale el orden
            texto: 'Es el de publicación (del 3 de mayo al 13 de agosto de 2025), y cada número da por leídos los anteriores. El #1 trae además una historia corta de Al Ewing que presenta al «X-Man que nunca existió».'
      - serie:
          id: m2-b5-imperial-1-4
          titulo: Imperial <span class="nums">#1–4</span>
          creditos: Jonathan Hickman · Federico Vicentini, Marco Checchetto · junio – octubre 2025
          descripcion:
          - Evento cósmico que refunda los imperios galácticos como la Unión Galáctica. Toca a los mutantes solo de refilón; donde de verdad pesa es en los Guardianes de la Galaxia.
          - 'El tie-in mutante es <em>Imperial War: Exiles</em> #1 (Steve Foxe, septiembre de 2025): un golpe de estado deja a la majestrix shi''ar Xandra sin trono, y la rescatan sus padres, Xavier y Lilandra, resucitada.'
          etiqueta:
            clase: opcional
            texto: Opcional
      - serie:
          id: m2-b5-al-margen-de-la-continuidad-2024-2025
          titulo: Al margen de la continuidad (2024–2025)
          creditos: 'Wolverine: Deep Cut #1–4 (2024) · Wolverine: Revenge #1–5 (2024–2025) · Rogue: The Savage Land #1–5 (2025) · Wolverine and Kitty Pryde #1–5 (2025) · Emma Frost: The White Queen #1–5 (2025) · Godzilla vs. X-Men #1 (2025)'
          descripcion:
          - 'Historias nuevas ambientadas en etapas pasadas: la misión secreta de Lobezno tras <em>Uncanny X-Men</em> #246 y su viaje a Japón con Kitty Pryde (las dos de Claremont), Rogue en la Tierra Salvaje cuando no tenía poderes y Emma Frost como Reina Blanca del Club Fuego Infernal.'
          - '<em>Wolverine: Revenge</em> es la miniserie de prestigio de Hickman y Capullo, independiente de la línea (hay también una edición <em>Red Band</em>, más violenta). <em>Godzilla vs. X-Men</em> es parte de la serie de one-shots de Godzilla contra Marvel.'
          etiqueta:
            clase: t4
            texto: Al margen de la continuidad
- id: b6
  fechas: Octubre — diciembre 2025
  titulo: Age of Revelation
  intro: 'Marvel suspende la línea entera durante tres meses y la sustituye por dieciséis miniseries ambientadas diez años en el futuro, bajo el dominio de Revelation. Es el homenaje al trigésimo aniversario de <em>La Era de Apocalipsis</em> y funciona igual que aquella: no es un universo alterno, es <strong>el</strong> presente durante tres meses, y lo que pasa aquí se queda.'
  navegacion:
    anio: '2025'
    texto: Age of Revelation
  contenido:
  - tramo:
      numero: '6.1'
      titulo: La puerta
      cuando: Octubre 2025
      nota: Dos números para entender la premisa. Con esto y el <em>Finale</em> tienes el esqueleto del evento sin leer las dieciséis miniseries.
      entradas:
      - serie:
          id: m2-b6-x-men-age-of-revelation-0-overture-1
          prioridad: p1
          titulo: 'X-Men: Age of Revelation <span class="nums">#0</span> + Overture <span class="nums">#1</span>'
          creditos: 'Jed MacKay · varios · el #0 en julio y Overture en octubre de 2025'
          descripcion:
          - El salto temporal y la caída. Empieza aquí obligatoriamente.
          etiqueta:
            clase: t1
            texto: Esencial
      - serie:
          id: m2-b6-world-of-revelation-1
          titulo: World of Revelation <span class="nums">#1</span>
          creditos: Al Ewing · octubre 2025
          descripcion:
          - 'El resto del mundo diez años después: qué ha sido de los Cuatro Fantásticos, qué horrores hay en la costa este y qué piensa Apocalipsis, desde Arakko, del imperio de su heredero.'
          etiqueta:
            clase: opcional
            texto: Opcional
  - tramo:
      numero: '6.2'
      titulo: Las dieciséis miniseries
      cuando: Octubre – diciembre 2025
      nota: Tres números cada una, todas simultáneas. La columna real es <em>Book of Revelation</em>; las otras quince son postales de ese mundo y se pueden leer suelta o ninguna.
      entradas:
      - serie:
          id: m2-b6-x-men-book-of-revelation-1-3
          prioridad: p1
          titulo: 'X-Men: Book of Revelation <span class="nums">#1–3</span>'
          creditos: Jed MacKay · 2025
          descripcion:
          - La trama central del evento. Si solo lees una miniserie, esta.
          etiqueta:
            clase: t1
            texto: Esencial
      - serie:
          id: m2-b6-las-mas-recomendadas
          prioridad: p2
          titulo: Las más recomendadas
          creditos: 'Unbreakable X-Men #1–3 · The Last Wolverine #1–3 · Expatriate X-Men #1–3 · Amazing X-Men vol. 3 #1–3 · Rogue Storm #1–3 · 2025'
          descripcion:
          - Las cinco que mejor funcionan por sí solas y las que más peso tienen en el <em>Finale</em>.
          etiqueta:
            clase: t2
            texto: Recomendado
      - serie:
          id: m2-b6-el-resto-del-evento
          titulo: El resto del evento
          creditos: 'Binary #1–3 · Cloak or Dagger #1–3 · Iron &amp; Frost #1–3 · Laura Kinney: Sabretooth #1–3 · Longshots #1–3 · Sinister''s Six #1–3 · Omega Kids #1–3 · Radioactive Spider-Man #1–3 · Undeadpool #1–3 · X-Vengers #1–3 · 2025'
          descripcion:
          - 'Diez miniseries más, de tono muy variable: algunas son terror, otras comedia. Prescindibles para seguir la trama.'
          etiqueta:
            clase: opcional
            texto: Opcional
  - evento:
      id: m2-b6-x-men-age-of-revelation-finale
      etiqueta: Cierre del evento · Diciembre 2025
      titulo: 'X-Men: Age of Revelation Finale'
      creditos: Jed MacKay · diciembre 2025
      descripcion:
      - 'Resuelve el evento y deja a la franquicia en el punto de partida del bloque siguiente. <strong>El salto de diez años no se deshace</strong>: la línea continúa en ese futuro, que es lo que distingue este evento de un universo alterno al uso.'
      apartados:
      - apartado: Ruta mínima del bloque 6
        texto: 'Age of Revelation #0 → Overture #1 → Book of Revelation #1–3 → Finale #1. Cinco números para enterarte de todo.'
