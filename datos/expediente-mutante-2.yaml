apendice:
  titulo: Cómo recorrerlo
  notas:
  - titulo: Esta era está mucho más cosida
    html: '<p>En el volumen I podías leer cabeceras enteras durante años sin tropezar con nada. Aquí no: entre 2019 y 2024 casi todas las series comparten calendario y se cruzan cada pocos meses. Ve tramo a tramo y resiste la tentación de adelantar una sola serie.</p>'
  - titulo: Los dos eventos intercalados
    html: '<p>La era abre y cierra con pares de series que se leen alternando número a número: <em>House of X</em> / <em>Powers of X</em> al principio (abre el bloque 1) y <em>Fall of the House of X</em> / <em>Rise of the Powers of X</em> al final. Leerlos seguidos por separado arruina el efecto en los dos casos.</p>'
  - titulo: Los eventos de toda la línea
    html: <p>Los recuadros con borde discontinuo son los grandes eventos de Marvel en los que participan los mutantes. Cada uno indica qué leer antes, el orden exacto con los números mutantes intercalados en la serie principal y una versión mínima. Varios se llevan números de series X —<em>Empyre</em>, <em>Judgment Day</em>, <em>One World Under Doom</em>— y esos no son opcionales; el resto son contexto.</p>
  - titulo: Dos clases de tie-in
    html: '<p>Casi todos los eventos de esta era <strong>van entrelazados</strong>: <em>X of Swords</em>, <em>Judgment Day</em>, <em>Sins of Sinister</em>, el final de la era, <em>Raid on Graymalkin</em>, <em>X-Manhunt</em> y <em>DNX</em>. Ahí los números de tus series son capítulos del evento y hay que leerlos en su sitio. Lo que sí puede quedarse para después son los <strong>satélites</strong> que cada ficha separa aparte: <em>X-Force</em> y <em>Wolverine</em> en <em>Judgment Day</em>, <em>Dead X-Men</em> e <em>Invincible Iron Man</em> en el final, o las quince miniseries secundarias de <em>Age of Revelation</em>.</p>'
  - titulo: Las galas son el calendario
    html: '<p>Las tres Hellfire Gala de Krakoa (2021, 2022 y 2023) funcionan como marcas de año dentro de la era: si te pierdes, localiza la gala más cercana, porque cada una reparte equipos nuevos y marca el inicio de una fase. Después de la caída la fiesta vuelve en formato reducido: <em>The Hellfire Vigil</em> (2025) y <em>The Hellfire Murder</em> (2026).</p>'
  - titulo: Si vienes con prisa
    html: '<p>La ruta mínima absoluta de los años de Krakoa son cuatro cosas: <em>X-Men</em> vol. 5 de Hickman, <em>Immortal X-Men</em> entera, <em>X-Men Red</em> entera y el par final intercalado. Con eso tienes el arco completo de la nación mutante, de la fundación a la caída, en unos 70 números.</p>'
  - titulo: El salto de diez años
    html: '<p>Ojo con esto al comprar: las cabeceras de 2024 (<em>X-Men</em> vol. 7, <em>Uncanny</em> vol. 6, <em>Wolverine</em> vol. 8) <strong>no reiniciaron</strong> su numeración en 2026. Siguen donde estaban, pero la historia ha saltado una década por medio de <em>Age of Revelation</em>. Un <em>X-Men</em> #34 y un <em>X-Men</em> #22 están separados por diez años de ficción.</p>'
  - titulo: Hasta dónde llega esta guía
    html: '<p>Revisada a <strong>17 de noviembre de 2026</strong>, con las solicitudes publicadas hasta diciembre. El bloque 7 está vivo: las series en curso seguirán sumando números. Todo lo anterior al bloque 7 está completo.</p>'
  - titulo: Qué recoge y qué no
    html: '<p>La guía quiere recoger <strong>todos los cómics mutantes publicados desde 2019</strong>: las cabeceras, las miniseries de personaje, los especiales y los cruces con otras líneas. Se ha cotejado con las listas de Marvel Fandom por etapa (<em>Dawn of X</em>, <em>Reign of X</em>, <em>Destiny of X</em>, <em>Fall of X</em>, <em>Fall of the House of X</em>, <em>From the Ashes</em>…) y con todo lo publicado mes a mes. Lo que se publicó en estos años pero no forma parte de la historia (ambientado en el pasado o en otra realidad) está en las fichas «Al margen de la continuidad» de cada bloque.</p><p>Quedan fuera, a propósito: los <strong>Infinity Comics</strong> (cómics digitales en formato vertical, como <em>X-Men Unlimited</em>, <em>X-Men: From the Ashes Infinity Comic</em> o <em>X-Men: Age of Revelation Infinity Comic</em>) y sus ediciones en papel (<em>X-Men: Xavier''s Secret</em>, <em>Demons and Death</em>, <em>Tooth and Claw</em>, <em>The Undertow</em>, <em>Iceman: Omega</em>, <em>Savage Wolverine</em>, <em>Omega Red Dawn</em>, <em>X-Men Green</em>…); las reediciones y recopilatorios; las guías (<em>Hellfire Gala Guide</em>, <em>X of Swords Handbook</em>, las tiras de la votación de los X-Men); los cómics infantiles o promocionales (<em>X-Men: X-Verse</em>, <em>Uncanny X-Men: Days of Future Fun</em>, <em>Marvel Rivals: Hellfire Gala</em>); el homenaje <em>Giant-Size X-Men: Tribute to Wein &amp; Cockrum</em>, que vuelve a dibujar el número de 1975; las series propias de Deadpool, salvo cuando se cruza con los X-Men, y las de otros universos con línea propia, como <em>Ultimate X-Men</em> (2024).</p>'
