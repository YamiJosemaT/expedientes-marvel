# Expediente Mutante II: Krakoa
# Datos del expediente. Los textos admiten HTML en linea (<em>, <strong>, <span class="nums">...).
# Las claves "id" de cada entrada NO se deben cambiar: son las que guardan las marcas de lectura.

clave: m2
titulo_pagina: 'Expediente Mutante II: Krakoa'
descripcion_pagina: Guía de lectura de la línea mutante de Marvel desde House of X hasta octubre de 2026.
cabecera:
  antetitulo: Guía de lectura · Volumen II · Línea mutante Marvel
  titulo: Expediente<br/>Mutante II<span class="thin">Krakoa — 2019 a hoy</span>
  entradilla: 'Donde lo dejó el primer expediente: de la fundación de Krakoa en <em>House of X</em> al cómic que está en la tienda esta semana. Mismo sistema de tramos y eventos, siete bloques, y las cuatro reinvenciones completas que ha tenido la franquicia en estos siete años.'
  cifras:
  - valor: '7'
    texto: Años de continuidad
  - valor: '15'
    texto: Tramos de lectura
  - valor: '19'
    texto: Eventos y crossovers
  - valor: ~900
    texto: Números en total
leyenda: |-
  <p>Mismo sistema que el volumen I. Cada bloque se divide en <strong>tramos</strong>: fragmentos de continuidad que se leen en paralelo, alternando las cabeceras que hay dentro. Entre tramo y tramo se intercala el <strong>evento</strong> que los separa, con su orden capítulo a capítulo.</p>
  <p>Cuando un crossover se lleva números de una serie en marcha, esa serie aparece <strong>partida</strong>: verás dónde se corta y en qué tramo se retoma. Dentro del orden de un evento, los capítulos <span class="cap">en naranja</span> son los que salen de cabeceras que ya venías leyendo.</p>
  <div class="legend-row">
  <span class="key"><span class="fwd">▸</span> Continúa después del evento</span>
  <span class="key"><span class="back">◂</span> Viene de un tramo anterior</span>
  </div>
  <div class="legend-row">
  <span class="key"><span class="swatch dashed"></span> Recuadro con borde discontinuo: evento de toda la línea Marvel en el que participan los X-Men</span>
  </div>
  <div class="legend-row">
  <span class="tag t1">Esencial</span>
  <span class="tag t2">Recomendado</span>
  <span class="tag">Opcional</span>
  <span class="tag t4">Realidad alterna</span>
  </div>
cajas:
- html: |-
    <h2>Antes de empezar</h2>
    <p>Este volumen da por leídos los doce números de <em>House of X</em> / <em>Powers of X</em> (Hickman, Larraz y Silva, 2019). Ahí se funda la nación de Krakoa y se presenta todo lo que la era da por sabido: el Consejo Silencioso, las leyes de Krakoa, la resurrección de los Cinco y el secreto de Moira MacTaggert sobre el que gira todo lo demás. Sin ellos, <em>Dawn of X</em> se lee a ciegas.</p>
    <p>Están al final del <a href="Expediente-Mutante-2001-2019.html#hoxpox">Expediente Mutante I</a>, con su orden de lectura intercalado.</p>
- ruta:
    titulo: La ruta corta
    texto: 'Trece paradas que cuentan la historia completa de estos siete años, después de <em>House of X</em> / <em>Powers of X</em>. La era de Krakoa está mucho más cosida que la anterior: casi todo se cruza con casi todo, así que aquí la ruta corta se apoya más en los eventos que en las series.'
    pasos:
    - <span>X-Men vol. 5 <em>#1–21</em></span>
    - <span>X of Swords <em>crossover</em></span>
    - <span>Hellfire Gala <em>2021</em></span>
    - <span>Inferno <em>#1–4</em></span>
    - <span>Immortal X-Men <em>#1–18</em></span>
    - <span>X-Men Red vol. 2 <em>#1–18</em></span>
    - '<span>A.X.E.: Judgment Day <em>#1–6</em></span>'
    - <span>Sins of Sinister <em>crossover</em></span>
    - <span>Hellfire Gala <em>2023</em></span>
    - <span>Fall of the House of X / Rise of the Powers of X</span>
    - <span>X-Men vol. 7 <em>#1–22</em></span>
    - <span>Uncanny X-Men vol. 6 <em>#1–21</em></span>
    - <span>Age of Revelation → Shadows of Tomorrow</span>
bloques:
- id: b1
  fechas: Octubre 2019 — noviembre 2020
  titulo: Dawn of X
  intro: 'Jonathan Hickman convierte a los mutantes en una nación soberana sobre una isla viva, con su propio idioma, su economía de medicamentos y —la pieza que lo cambia todo— un protocolo de resurrección que vuelve la muerte un trámite administrativo. Seis cabeceras simultáneas que comparten un mismo diseño editorial: cada número lleva páginas de datos, organigramas y actas del Consejo Silencioso.'
  navegacion:
    anio: 2019–2020
    texto: Dawn of X
  contenido:
  - tramo:
      numero: '1.1'
      titulo: La primera oleada
      cuando: Octubre 2019 – julio 2020
      nota: Las seis series salieron semanalmente y rotando, pensadas para leerse a la par. No hace falta orden exacto entre ellas dentro del tramo.
      entradas:
      - serie:
          id: m2-b1-x-men-vol-5-1-9
          prioridad: p1
          titulo: X-Men vol. 5 <span class="nums">#1–9</span>
          creditos: Jonathan Hickman · Leinil Francis Yu, Mahmud Asrar · 2019–2020
          continuidad:
          - sigue: '▸ Los #10–11 son tie-ins de <em>Empyre</em> (final del tramo 1.2)'
          - sigue: '▸ Los #12–15 son capítulos de <em>X of Swords</em>'
          descripcion:
          - 'La cabecera matriz: números casi autoconclusivos que van montando la arquitectura del estado mutante. Es la voz de Hickman y el eje del bloque.'
          etiqueta:
            clase: t1
            texto: Esencial
      - serie:
          id: m2-b1-marauders-1-12
          prioridad: p2
          titulo: Marauders <span class="nums">#1–12</span>
          creditos: Gerry Duggan · Matteo Lolli · 2019–2020
          continuidad:
          - sigue: '▸ Los números #13–15 son capítulos de <em>X of Swords</em>'
          descripcion:
          - Kitty Pryde y Emma Frost contrabandeando mutantes por mar. La más divertida de la oleada y la que mejor explica cómo funciona la resurrección en la práctica.
          etiqueta:
            clase: t2
            texto: Recomendado
      - serie:
          id: m2-b1-x-force-vol-6-1-12
          prioridad: p2
          titulo: X-Force vol. 6 <span class="nums">#1–12</span>
          creditos: Benjamin Percy · Joshua Cassara · 2019–2020
          continuidad:
          - sigue: '▸ Los números #13–14 son capítulos de <em>X of Swords</em>'
          descripcion:
          - La CIA de Krakoa. Beast al mando de un servicio de inteligencia sin ninguna supervisión, que es exactamente tan mala idea como suena.
          etiqueta:
            clase: t2
            texto: Recomendado
      - serie:
          id: m2-b1-excalibur-vol-4-1-12
          prioridad: p2
          titulo: Excalibur vol. 4 <span class="nums">#1–12</span>
          creditos: Tini Howard · Marcus To · 2019–2020
          continuidad:
          - sigue: '▸ Los números #13–15 son capítulos de <em>X of Swords</em>'
          descripcion:
          - 'La rama mágica: Betsy Braddock como Capitana Britania, Apocalipsis y los portales a Otherworld. Imprescindible como preparación de <em>X of Swords</em>, que sale casi entero de aquí.'
          etiqueta:
            clase: t2
            texto: Recomendado
      - serie:
          id: m2-b1-new-mutants-vol-4-1-12
          titulo: New Mutants vol. 4 <span class="nums">#1–12</span>
          creditos: Jonathan Hickman, Ed Brisson · Rod Reis · 2019–2020
          continuidad:
          - sigue: '▸ El número #13 es capítulo de <em>X of Swords</em>'
          descripcion:
          - Los números impares (Hickman) son un viaje espacial con los Starjammers; los pares (Brisson), una trama terrestre. Se alternaban número a número, lo que descoloca bastante.
          etiqueta:
            clase: opcional
            texto: Opcional
      - serie:
          id: m2-b1-fallen-angels-1-6
          titulo: Fallen Angels <span class="nums">#1–6</span>
          creditos: Bryan Hill · Szymon Kudranski · 2019–2020
          descripcion:
          - La única de la oleada que se canceló pronto y la única prescindible por completo.
          etiqueta:
            clase: opcional
            texto: Opcional
      - serie:
          id: m2-b1-complementos-del-arranque
          titulo: Complementos del arranque
          creditos: 'X-Men/Fantastic Four #1–4 · Giant-Size X-Men: Jean Grey &amp; Emma Frost / Nightcrawler / Fantomex / Magneto / Storm · 2020'
          descripcion:
          - Los cinco <em>Giant-Size</em> de Hickman y Ramos son números sueltos sobre la resurrección de Storm y compañía. <em>X-Men/Fantastic Four</em> va de la custodia de Franklin Richards y sí tiene consecuencias.
          etiqueta:
            clase: opcional
            texto: Opcional
  - tramo:
      numero: '1.2'
      titulo: La segunda oleada
      cuando: Febrero – septiembre 2020
      nota: Tres cabeceras nuevas que se incorporan a mitad de camino y llegan justas al crossover.
      entradas:
      - serie:
          id: m2-b1-hellions-1-4
          prioridad: p2
          titulo: Hellions <span class="nums">#1–4</span>
          creditos: Zeb Wells · Stephen Segovia · 2020
          continuidad:
          - sigue: '▸ Los números #5–6 son capítulos de <em>X of Swords</em>'
          descripcion:
          - Sinister recibe a los mutantes que Krakoa no sabe dónde meter. Comedia negrísima y la mejor sorpresa del bloque.
          etiqueta:
            clase: t2
            texto: Recomendado
      - serie:
          id: m2-b1-x-factor-vol-4-1-4
          prioridad: p2
          titulo: X-Factor vol. 4 <span class="nums">#1–4</span>
          creditos: Leah Williams · David Baldeón · 2020
          descripcion:
          - 'La oficina forense de la resurrección: hay que certificar cómo murió cada mutante antes de devolverlo. Es la serie que convierte el protocolo en algo incómodo.'
          etiqueta:
            clase: t2
            texto: Recomendado
      - serie:
          id: m2-b1-cable-vol-4-1-4
          titulo: Cable vol. 4 <span class="nums">#1–4</span>
          creditos: Gerry Duggan · Phil Noto · 2020
          continuidad:
          - sigue: '▸ Los números #5–6 son capítulos de <em>X of Swords</em>'
          descripcion:
          - El Cable adolescente, rejuvenecido. Ligera y menor, pero enlaza con <em>X of Swords</em>.
          etiqueta:
            clase: opcional
            texto: Opcional
      - serie:
          id: m2-b1-wolverine-vol-7-1-5
          titulo: Wolverine vol. 7 <span class="nums">#1–5</span>
          creditos: Benjamin Percy · Adam Kubert · 2020
          continuidad:
          - sigue: '▸ Los números #6–7 son capítulos de <em>X of Swords</em>'
          descripcion:
          - Logan como agente de X-Force. Se solapa con esa serie, de los mismos guionistas.
          etiqueta:
            clase: opcional
            texto: Opcional
      - evento:
          id: m2-b1-empyre
          linea_marvel: true
          etiqueta: Evento de toda la línea Marvel · Julio – septiembre 2020
          titulo: Empyre
          creditos: 'Al Ewing &amp; Dan Slott · Valerio Schiti (serie principal) · <em>X-Men</em> #10–11 de Jonathan Hickman y Leinil Francis Yu'
          descripcion:
          - 'La alianza Kree-Skrull de Hulkling llega a la Tierra para enfrentarse a los Cotati, y la guerra alcanza a los mutantes: la familia Summers se cruza con el conflicto en su casa de la Luna y los Cotati atacan Krakoa. <strong>Dos números de la serie de Hickman son tie-ins</strong>, así que esta parte no es opcional.'
          apartados:
          - apartado: Antes de empezar
            texto: 'Nada imprescindible: el evento arranca con sus dos números cero.'
          - apartado: Orden de lectura
            texto: 'Empyre: Avengers #0 → Empyre: Fantastic Four #0 → <strong>Empyre #1</strong> → <strong>#2</strong> → <strong>#3</strong> → <span class="cap">X-Men #10</span> → <span class="cap">Empyre: X-Men #1–4</span> → <strong>Empyre #4</strong> → <strong>#5</strong> → <strong>#6</strong> → <span class="cap">X-Men #11</span> → Empyre: Aftermath Avengers #1'
          - apartado: Versión mínima
            texto: '<em>X-Men</em> #10 y #11, que son de la serie principal, y <em>Empyre: X-Men</em> #1–4 si quieres todo el lado de Krakoa. Se siguen sin el evento, aunque no sabrás quiénes son los Cotati.'
          - apartado: Prescindible
            texto: <em>Lords of Empyre</em> y los tie-ins de otras series.
          - apartado: Después
            texto: '<em>X of Swords</em>, que arranca en <em>X-Men</em> #12.'
  - evento:
      id: m2-b1-x-of-swords
      etiqueta: Crossover · 22 capítulos · Septiembre – noviembre 2020
      titulo: X of Swords
      creditos: Jonathan Hickman &amp; Tini Howard · Pepe Larraz, Mahmud Asrar
      descripcion:
      - 'Diez campeones mutantes y diez espadas contra el reino de Arakko, la mitad gemela de Krakoa. El crossover más coral de la era: se lleva números de las siete cabeceras a la vez. <strong>Cada portada lleva impreso su número de capítulo del 1 al 22</strong>, así que no hace falta memorizar la secuencia: basta ordenarlos por ese número.'
      apartados:
      - apartado: Apertura y cierre
        texto: 'X of Swords: Creation #1 (capítulo 1) → … → X of Swords: Stasis #1 (capítulo intermedio) → … → X of Swords: Destruction #1 (capítulo 22)'
      - apartado: Capítulos que salen de tus series en marcha
        texto: '<span class="cap">X-Men #12–15</span> · <span class="cap">Excalibur #13–15</span> · <span class="cap">Marauders #13–15</span> · <span class="cap">X-Force #13–14</span> · <span class="cap">Hellions #5–6</span> · <span class="cap">Cable #5–6</span> · <span class="cap">Wolverine #6–7</span> · <span class="cap">New Mutants #13</span>'
      - apartado: Qué cambia al terminar
        texto: Arakko se instala en la Tierra y pasa a ser un segundo estado mutante. Es la premisa de la que vive el resto de la era.
- id: b2
  fechas: Diciembre 2020 — febrero 2022
  titulo: Reign of X
  intro: 'Krakoa consolidada: embajadas, una farmacéutica propia, un servicio secreto y una agencia espacial. El bloque donde la nación funciona —y donde empieza a verse que el Consejo Silencioso es, en el fondo, una oligarquía de supervillanos con buena prensa. Termina con la salida de Hickman, tres años antes de lo que tenía planeado.'
  navegacion:
    anio: 2020–2022
    texto: Reign of X
  contenido:
  - tramo:
      numero: '2.1'
      titulo: La nación en marcha
      cuando: Diciembre 2020 – mayo 2021
      nota: 'Todas las cabeceras del bloque 1 continúan, y se suman cuatro nuevas. Tramo largo y sin cruces: avanza por donde quieras hasta la Gala.'
      entradas:
      - serie:
          id: m2-b2-x-men-vol-5-16-20
          prioridad: p1
          titulo: X-Men vol. 5 <span class="nums">#16–20</span>
          creditos: Jonathan Hickman · Mahmud Asrar, Francesco Mobili · 2021
          continuidad:
          - viene: ◂ Viene de <em>X of Swords</em>
          - sigue: '▸ El número #21 es capítulo de la <em>Hellfire Gala</em>'
          descripcion:
          - El equipo de ataque y los primeros roces diplomáticos con Arakko.
          etiqueta:
            clase: t1
            texto: Esencial
      - serie:
          id: m2-b2-s-w-o-r-d-vol-2-1-5
          prioridad: p2
          titulo: S.W.O.R.D. vol. 2 <span class="nums">#1–5</span>
          creditos: Al Ewing · Valerio Schiti · 2020–2021
          continuidad:
          - sigue: '▸ El número #6 es capítulo de la <em>Hellfire Gala</em>'
          descripcion:
          - La agencia espacial mutante, con Abigail Brand maniobrando. Ewing planta aquí casi todo lo que después explotará en <em>X-Men Red</em>. La mejor incorporación del bloque.
          etiqueta:
            clase: t2
            texto: Recomendado
      - serie:
          id: m2-b2-way-of-x-1-4
          prioridad: p2
          titulo: Way of X <span class="nums">#1–4</span>
          creditos: Simon Spurrier · Bob Quinn · 2021
          continuidad:
          - sigue: ▸ Continúa como <em>Legion of X</em> en el tramo 3.1
          descripcion:
          - Rondador Nocturno se pregunta qué religión le corresponde a una especie que ya no muere de verdad. Cuatro números y la reflexión más interesante que ha producido la era.
          etiqueta:
            clase: t2
            texto: Recomendado
      - serie:
          id: m2-b2-las-cabeceras-que-continuan
          prioridad: p2
          titulo: Las cabeceras que continúan
          creditos: 'Marauders #16–20 · Excalibur #16–20 · X-Force #15–19 · Hellions #7–11 · X-Factor #5–9 · New Mutants #14–18 · Cable #7–10 · Wolverine #8–12 · 2021'
          continuidad:
          - viene: ◂ La mayoría vienen de <em>X of Swords</em>
          - sigue: ▸ Cada una entrega su número siguiente a la <em>Hellfire Gala</em>
          descripcion:
          - Todas retoman tras el crossover y todas entregan un número a la Gala.
          etiqueta:
            clase: t2
            texto: Recomendado
      - serie:
          id: m2-b2-children-of-the-atom-1-6-x-corp-1-5
          titulo: Children of the Atom <span class="nums">#1–6</span> · X-Corp <span class="nums">#1–5</span>
          creditos: Vita Ayala / Tini Howard · 2021
          descripcion:
          - Unos adolescentes que fingen ser mutantes, y la multinacional de Krakoa. Ambas periféricas; <em>X-Corp</em> solo si te interesa el andamiaje económico.
          etiqueta:
            clase: opcional
            texto: Opcional
      - evento:
          id: m2-b2-king-in-black
          linea_marvel: true
          etiqueta: Evento de toda la línea Marvel · Diciembre 2020 – abril 2021
          titulo: King in Black
          creditos: Donny Cates · Ryan Stegman (serie principal) · tie-in mutante de Gerry Duggan y Luke Ross
          descripcion:
          - Knull, el dios de los simbiontes, envuelve la Tierra en oscuridad. En el one-shot mutante, la Reina Roja Kate Pryde y sus Merodeadores zarpan contra sus fuerzas.
          apartados:
          - apartado: Antes de empezar
            texto: 'Contexto opcional: la etapa de Donny Cates en <em>Venom</em>, que prepara la llegada de Knull.'
          - apartado: Orden de lectura
            texto: '<strong>King in Black #1</strong> → <strong>#2</strong> → <strong>#3</strong> → <span class="cap">King in Black: Marauders #1</span> → <strong>King in Black #4</strong> → <strong>#5</strong>'
          - apartado: Versión mínima
            texto: '<em>King in Black: Marauders</em> #1 se lee suelto, como un episodio más de <em>Marauders</em>.'
  - evento:
      id: m2-b2-hellfire-gala-2021
      etiqueta: Evento · 11 capítulos · Junio 2021
      titulo: Hellfire Gala (2021)
      creditos: Gerry Duggan, Jonathan Hickman, Al Ewing y el resto de la línea
      descripcion:
      - 'La primera gala: Krakoa invita al mundo a una fiesta, presenta un equipo de X-Men elegido por votación popular y, de postre, terraforma Marte. Formato peculiar —cada cabecera aporta un número ambientado en la misma noche— y uno de los puntos altos de la era.'
      apartados:
      - apartado: Orden
        texto: '<span class="cap">X-Men #21</span> → <span class="cap">Marauders #21</span> → <span class="cap">Hellions #12</span> → <span class="cap">X-Force #20</span> → <span class="cap">Cable #11</span> → <span class="cap">Excalibur #21</span> → <span class="cap">New Mutants #19</span> → <span class="cap">X-Factor #10</span> → <span class="cap">S.W.O.R.D. #6</span> → Planet-Size X-Men #1 → <span class="cap">Wolverine #13</span>'
      - apartado: El imprescindible
        texto: '<em>Planet-Size X-Men</em> #1 es el número donde pasa lo que importa. Si solo lees uno, es ese.'
  - tramo:
      numero: '2.2'
      titulo: Después de la Gala
      cuando: Julio – diciembre 2021
      nota: 'Relevo en la cabecera principal: <em>X-Men</em> vol. 5 cierra en el #21 y arranca <em>X-Men</em> vol. 6 con Duggan. Varias series de la primera oleada terminan aquí.'
      entradas:
      - serie:
          id: m2-b2-x-men-vol-6-1-6
          prioridad: p2
          titulo: X-Men vol. 6 <span class="nums">#1–6</span>
          creditos: Gerry Duggan · Pepe Larraz · 2021
          descripcion:
          - El equipo recién votado, con base en Nueva York y vocación de superhéroes clásicos. Cambio de tono deliberado respecto a Hickman.
          etiqueta:
            clase: t2
            texto: Recomendado
      - evento:
          id: m2-b2-the-last-annihilation
          etiqueta: Crossover · Cruce con los Guardianes de la Galaxia y Wakanda · 7 capítulos · 2021
          titulo: The Last Annihilation
          creditos: Al Ewing · varios
          descripcion:
          - Dormammu se ha fundido con Ego, el planeta viviente, y quiere conquistar el espacio. S.W.O.R.D., la agencia espacial de Krakoa, se alía con los Guardianes de la Galaxia para pararlo. Es el cierre de la etapa de Ewing en los Guardianes y <strong>se lleva dos números de la línea mutante</strong>, intercalados con los demás.
          apartados:
          - apartado: Antes de empezar
            texto: 'Los seis primeros números de <em>S.W.O.R.D.</em> (tramo 2.1 y la Gala). Por el lado cósmico, <em>Guardians of the Galaxy</em> vol. 6 #1–15 de Al Ewing (bloque 7 del Expediente Guardianes) es contexto opcional.'
          - apartado: Orden de lectura
            texto: 'Guardians of the Galaxy #16 → <span class="cap">S.W.O.R.D. #7</span> → Guardians of the Galaxy #17 → <span class="cap">Cable: Reloaded #1</span> → The Last Annihilation: Wiccan &amp; Hulkling #1 → The Last Annihilation: Wakanda #1 → Guardians of the Galaxy #18'
          - apartado: Versión mínima
            texto: '<em>S.W.O.R.D.</em> #7 y <em>Cable: Reloaded</em> #1 son los capítulos mutantes, pero sueltos no se entienden bien: la historia se cuenta sobre todo en los Guardianes. Lo recomendable es leer los siete.'
          - apartado: Conexión
            texto: 'Es el mismo crossover que aparece en el Expediente Guardianes (bloque 7), con el mismo orden: léelo una sola vez.'
      - serie:
          id: m2-b2-cierres-de-la-primera-oleada
          titulo: Cierres de la primera oleada
          creditos: 'Marauders #22–27 · Excalibur #22–26 · Hellions #13–18 · S.W.O.R.D. #8–11 · X-Force #21–25 · New Mutants #20–24 · Wolverine #14–19 · Cable #12 · 2021'
          continuidad:
          - viene: ◂ Todas vienen de la <em>Hellfire Gala</em>
          - viene: '◂ S.W.O.R.D. sigue desde el #8, después de <em>The Last Annihilation</em> (ficha anterior)'
          descripcion:
          - 'Casi todas cierran para dejar sitio al relanzamiento del bloque 3. <em>Hellions</em> #18 tiene uno de los finales más celebrados de la era.'
          etiqueta:
            clase: t2
            texto: Recomendado
  - evento:
      id: m2-b2-inferno
      etiqueta: Evento · Septiembre 2021 – enero 2022 · Cierre del bloque
      titulo: Inferno
      creditos: Jonathan Hickman · Valerio Schiti &amp; Stefano Caselli
      descripcion:
      - 'Cuatro números en los que Hickman cierra de golpe —y a destiempo— la trama que había plantado en <em>House of X</em>: quién es Moira MacTaggert, qué sabe Mística y por qué el Consejo Silencioso lleva dos años mintiendo. Es su despedida de la franquicia y el verdadero final de su proyecto.'
      apartados:
      - apartado: Orden
        texto: 'Inferno #1–4, seguidos. No tiene tie-ins.'
      - apartado: Importante
        texto: 'Léelo después de las series del tramo 2.2, no antes: parte de dónde queda el Consejo tras la Gala.'
- id: b3
  fechas: Marzo 2022 — julio 2023
  titulo: Destiny of X
  intro: 'Sin Hickman, la línea se reparte entre Kieron Gillen, Al Ewing y Gerry Duggan, y da su mejor tramo sostenido: la política interna del Consejo por un lado, Arakko y el espacio por otro. Aquí están los dos mejores títulos de toda la era y el evento que mejor funciona.'
  navegacion:
    anio: 2022–2023
    texto: Destiny of X
  contenido:
  - tramo:
      numero: '3.1'
      titulo: El relanzamiento
      cuando: Marzo – junio 2022
      nota: Nueve cabeceras a la vez. Las dos primeras son el núcleo; el resto, satélites de calidad desigual.
      entradas:
      - evento:
          id: m2-b3-devil-s-reign
          linea_marvel: true
          etiqueta: Evento de toda la línea Marvel · Diciembre 2021 – mayo 2022
