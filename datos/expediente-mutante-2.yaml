            texto: '<strong>Dark Web #1</strong> → <span class="cap">Dark Web: X-Men #1</span> → Amazing Spider-Man #15 → Gold Goblin #2 → Amazing Spider-Man #16 → #17 → <span class="cap">Dark Web: X-Men #2</span> → Gold Goblin #3 → <span class="cap">Dark Web: X-Men #3</span> → Amazing Spider-Man #18 → <strong>Dark Web Finale #1</strong>'
