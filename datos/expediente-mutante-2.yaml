      descripcion:
      - 'El cierre de la era, construido como espejo deliberado de <em>House of X</em> / <em>Powers of X</em>: una serie cuenta el contraataque en el presente, la otra la partida cósmica que se juega por detrás. <strong>Van intercalados</strong>, igual que el arranque de 2019.'
