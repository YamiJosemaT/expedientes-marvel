          etiqueta: Evento de toda la línea Marvel · Diciembre 2022 – marzo 2023
          titulo: Dark Web
          creditos: Zeb Wells y otros
          descripcion:
          - Madelyne Pryor, la Reina Duende, y Chasm, el clon de Spider-Man, desatan el Limbo sobre Nueva York. Es un cruce entre la línea de Spider-Man y la mutante, y <strong>el tie-in mutante va repartido</strong> entre los números de Spider-Man.
