  - evento:
      id: m2-b3-hellfire-gala-2023
      etiqueta: Evento · Julio 2023 · Cierre del bloque
      titulo: Hellfire Gala (2023)
      creditos: Gerry Duggan, Kieron Gillen, Al Ewing · varios
      descripcion:
      - 'La tercera gala es una emboscada: Orchis ataca durante la fiesta, mata a buena parte de la población mutante y desmantela la nación en una sola noche. El número más importante de toda la era después de <em>House of X</em>.'
      apartados:
      - apartado: Orden
        texto: 'Hellfire Gala 2023 #1, número único y extenso. <strong>No tiene capítulos en otras series:</strong> todas las cabeceras se detienen justo antes y retoman después, ya con Krakoa caída.'
      - apartado: Advertencia
        texto: No lo leas suelto. Pierde casi todo su efecto si no vienes de <em>Immortal X-Men</em> y <em>X-Men Red</em>.
- id: b4
  fechas: Agosto 2023 — junio 2024
  titulo: Fall of X
  intro: Krakoa ha caído. Orchis controla la narrativa, los mutantes están dispersos, cazados o atrapados, y la resurrección —el gran seguro de vida de cinco años— ya no funciona. Diez meses de derrota antes del contraataque.
  navegacion:
    anio: 2023–2024
    texto: Fall of X
  contenido:
  - tramo:
      numero: '4.1'
      titulo: La dispersión
      cuando: Agosto 2023 – enero 2024
      nota: 'Cada cabecera sigue a un grupo distinto de supervivientes, sin contacto entre ellos. Es el tramo más disperso de la era: puedes leerlos en cualquier orden.'
      entradas:
      - serie:
          id: m2-b4-immortal-x-men-14-18
          prioridad: p1
          titulo: Immortal X-Men <span class="nums">#14–18</span>
          creditos: Kieron Gillen · Lucas Werneck · 2023
          continuidad:
          - viene: ◂ Viene de la <em>Hellfire Gala 2023</em>
          descripcion:
