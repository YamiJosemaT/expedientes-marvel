            clase: opcional
            texto: Opcional
apendice:
  titulo: Cómo recorrerlo
  notas:
  - titulo: Esta era está mucho más cosida
    html: '<p>En el volumen I podías leer cabeceras enteras durante años sin tropezar con nada. Aquí no: entre 2019 y 2024 casi todas las series comparten calendario y se cruzan cada pocos meses. Ve tramo a tramo y resiste la tentación de adelantar una sola serie.</p>'
  - titulo: Los dos eventos intercalados
    html: '<p>La era abre y cierra con pares de series que se leen alternando número a número: <em>House of X</em> / <em>Powers of X</em> al principio (está al final del volumen I) y <em>Fall of the House of X</em> / <em>Rise of the Powers of X</em> al final. Leerlos seguidos por separado arruina el efecto en los dos casos.</p>'
  - titulo: Los eventos de toda la línea
    html: <p>Los recuadros con borde discontinuo son los grandes eventos de Marvel en los que participan los mutantes. Cada uno indica qué leer antes, el orden exacto con los números mutantes intercalados en la serie principal y una versión mínima. Varios se llevan números de series X —<em>Empyre</em>, <em>Judgment Day</em>, <em>One World Under Doom</em>— y esos no son opcionales; el resto son contexto.</p>
  - titulo: Dos clases de tie-in
    html: '<p>Casi todos los eventos de esta era <strong>van entrelazados</strong>: <em>X of Swords</em>, <em>Judgment Day</em>, <em>Sins of Sinister</em>, el final de la era, <em>Raid on Graymalkin</em>, <em>X-Manhunt</em> y <em>DNX</em>. Ahí los números de tus series son capítulos del evento y hay que leerlos en su sitio. Lo que sí puede quedarse para después son los <strong>satélites</strong> que cada ficha separa aparte: <em>X-Force</em> y <em>Wolverine</em> en <em>Judgment Day</em>, <em>Dead X-Men</em> e <em>Invincible Iron Man</em> en el final, o las quince miniseries secundarias de <em>Age of Revelation</em>.</p>'
  - titulo: Las galas son el calendario
    html: '<p>Las cuatro Hellfire Gala (2021, 2022, 2023 y 2026) funcionan como marcas de año dentro de la era. Si te pierdes, localiza la gala más cercana: cada una reparte equipos nuevos y marca el inicio de una fase.</p>'
  - titulo: Si vienes con prisa
    html: '<p>La ruta mínima absoluta de los años de Krakoa son cuatro cosas: <em>X-Men</em> vol. 5 de Hickman, <em>Immortal X-Men</em> entera, <em>X-Men Red</em> entera y el par final intercalado. Con eso tienes el arco completo de la nación mutante, de la fundación a la caída, en unos 70 números.</p>'
  - titulo: El salto de diez años
    html: '<p>Ojo con esto al comprar: las cabeceras de 2024 (<em>X-Men</em> vol. 7, <em>Uncanny</em> vol. 6, <em>Wolverine</em> vol. 8) <strong>no reiniciaron</strong> su numeración en 2026. Siguen donde estaban, pero la historia ha saltado una década por medio de <em>Age of Revelation</em>. Un <em>X-Men</em> #34 y un <em>X-Men</em> #22 están separados por diez años de ficción.</p>'
  - titulo: Hasta dónde llega esta guía
    html: '<p>Cerrada a <strong>8 de octubre de 2026</strong>, con las solicitudes publicadas hasta diciembre. El bloque 7 está vivo: <em>DNX</em> no termina hasta el 18 de noviembre y las series en curso seguirán sumando números. Todo lo anterior al bloque 7 está ya completo y no va a cambiar.</p>'
