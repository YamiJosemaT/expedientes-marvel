          titulo: Las series nuevas
          creditos: 'Inglorious X-Force #1–10 (Tim Seeley · enero) · Wade Wilson: Deadpool #1– (Benjamin Percy · febrero) · Generation X-23 #1–10 (Jody Houser · febrero) · 2026'
