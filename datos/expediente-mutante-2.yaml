          titulo: 'X-Men vol. 6 <span class="nums">#15–19</span> · Marauders vol. 2 <span class="nums">#7–10</span> · Legion of X <span class="nums">#7–10</span> · New Mutants <span class="nums">#30–33</span> · X-Force <span class="nums">#34–42</span> · Wolverine <span class="nums">#26–35</span> · X-Terminators <span class="nums">#1–5</span> · Bishop: War College <span class="nums">#1–5</span>'
