          id: m2-b4-x-men-red-vol-2-14-16
          prioridad: p1
          titulo: X-Men Red vol. 2 <span class="nums">#14–16</span>
          creditos: Al Ewing · Jacopo Camagni · 2023
          continuidad:
          - viene: ◂ Viene de la <em>Hellfire Gala 2023</em>
          - sigue: '▸ Los números #17–18 acompañan al final de la era'
          descripcion:
          - La guerra civil de Arakko, que es la única parte de la especie que sigue en pie.
          etiqueta:
            clase: t1
            texto: Esencial
      - serie:
          id: m2-b4-x-men-vol-6-25-29
          prioridad: p2
          titulo: X-Men vol. 6 <span class="nums">#25–29</span>
          creditos: Gerry Duggan · Joshua Cassara · 2023
