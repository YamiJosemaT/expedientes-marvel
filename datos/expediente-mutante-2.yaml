          titulo: Immortal X-Men <span class="nums">#1–4</span>
          creditos: Kieron Gillen · Lucas Werneck · 2022
          continuidad:
          - sigue: '▸ Los números #5–7 son capítulos de <em>Judgment Day</em>'
          descripcion:
          - El Consejo Silencioso por dentro, un número por consejero. Intriga política pura, con Sinister y Destino moviendo los hilos. Lo mejor de la era de Krakoa.
          etiqueta:
            clase: t1
            texto: Esencial
      - serie:
          id: m2-b3-x-men-red-vol-2-1-4
          prioridad: p1
          titulo: X-Men Red vol. 2 <span class="nums">#1–4</span>
          creditos: Al Ewing · Stefano Caselli · 2022
          continuidad:
          - sigue: '▸ Los números #5–7 son capítulos de <em>Judgment Day</em>'
          descripcion:
          - 'Arakko en Marte: una sociedad mutante construida sobre el combate ritual, contada como tragedia. Continúa lo de <em>S.W.O.R.D.</em> y es el otro gran título del bloque.'
          etiqueta:
            clase: t1
            texto: Esencial
      - serie:
          id: m2-b3-x-men-vol-6-7-12
          prioridad: p2
          titulo: X-Men vol. 6 <span class="nums">#7–12</span>
          creditos: Gerry Duggan · Pepe Larraz · 2022
          continuidad:
          - viene: ◂ Viene del tramo 2.2
          - sigue: '▸ Los números #13–14 son capítulos de <em>Judgment Day</em>'
          etiqueta:
            clase: t2
            texto: Recomendado
      - serie:
          id: m2-b3-legion-of-x-1-5
          prioridad: p2
          titulo: Legion of X <span class="nums">#1–5</span>
          creditos: Simon Spurrier · Jan Bazaldua · 2022
