          creditos: Steve Orlando · 2023
          continuidad:
          - viene: ◂ Viene del tramo 3.2
          descripcion:
          - Orlando cierra la serie justo antes de la Gala.
          etiqueta:
            clase: opcional
            texto: Opcional
      - serie:
          id: m2-b3-x-men-before-the-fall
          titulo: 'X-Men: Before the Fall'
          creditos: 'Son of X #1 · Heralds of Apocalypse #1 · Sinister Four #1 · 2023'
