- id: b9
  fechas: Junio 2025 — hoy
  titulo: Imperial
  intro: 'Jonathan Hickman derriba el orden del cosmos Marvel y lo refunda como la Unión Galáctica. Star-Lord acaba al frente de ella, y los Guardianes de 2026 son un equipo de operaciones encubiertas al servicio de esa misma Unión: la versión más distinta del grupo en toda la guía.'
  navegacion:
    anio: 2025–2026
    texto: Imperial
  contenido:
  - evento:
      id: gg-b9-imperial
      ancla: ev-imperial
      etiqueta: Evento cósmico · Cruce con Hulk, Black Panther y Nova · Junio – octubre 2025
      titulo: Imperial
      creditos: Jonathan Hickman · Federico Vicentini, Marco Checchetto, Iban Coello
      descripcion:
      - Cuatro números que reparten el poder de todos los imperios galácticos. Participan Star-Lord, Nova, Hulk, She-Hulk, Brawn y Black Panther, y cada uno tiene un one-shot <em>Imperial War</em> con su frente de la guerra.
      apartados:
      - apartado: Columna principal
        texto: '<strong>Imperial #1–4</strong> (4 de junio – 29 de octubre de 2025)'
      - apartado: Los one-shots Imperial War
        texto: 'Imperial Guardians #1 · Nova – Centurion #1 · Planet She-Hulk #1 · Exiles #1 · Panther Rex #1 — frentes paralelos de la guerra. Para seguir a los Guardianes, el que importa es <span class="cap">Imperial War: Imperial Guardians #1</span>, que presenta al equipo de 2026.'
      - apartado: Cómo queda todo
        texto: Nace la Unión Galáctica y Star-Lord queda a su frente, en un papel mucho más cercano al de antagonista que al de héroe.
  - tramo:
      numero: '9.1'
      titulo: Los Guardianes imperiales
      cuando: Marzo – julio 2026
      entradas:
      - serie:
          id: gg-b9-imperial-guardians-1-5
          prioridad: p1
          titulo: Imperial Guardians <span class="nums">#1–5</span>
          creditos: Dan Abnett · Marcelo Ferreira · 11 de marzo – 22 de julio de 2026
          continuidad:
          - viene: '◂ Viene de <em>Imperial</em> e <em>Imperial War: Imperial Guardians</em> #1'
          descripcion:
          - Gamora, Captain Marvel, Amadeus Cho, Darkhawk y el Cosmic Ghost Rider, como unidad encubierta dirigida por Maximus de los Inhumanos para proteger la Unión Galáctica. Abnett, coguionista de la primera etapa del bloque 2, vuelve al equipo dieciocho años después. Se anunció como serie regular y Marvel la recortó a cinco números antes de su salida.
          etiqueta:
            clase: t1
            texto: Esencial
      - serie:
          id: gg-b9-rocket-raccoon-rocket-rewind-1
          titulo: 'Rocket Raccoon: Rocket Rewind <span class="nums">#1</span>'
          creditos: J.M. DeMatteis, Christos Gage, MacKenzie Cadenhead · Shawn McManus, Todd Nauck, Enid Balám · 29 de julio de 2026
          descripcion:
          - Especial antológico sobre el pasado de Rocket, con una historia clásica de Bill Mantlo y Keith Giffen como complemento. Al margen de la trama principal.
          etiqueta:
            clase: opcional
            texto: Opcional
  - evento:
      etiqueta: Frontera de la guía · 8 de octubre de 2026
      titulo: Dónde están ahora
      descripcion:
      - 'Con <em>Imperial Guardians</em> terminada en julio, <strong>no hay ninguna serie de los Guardianes en publicación ni anunciada</strong> que haya podido encontrar. El equipo queda repartido: Star-Lord al frente de la Unión Galáctica, Gamora con los Guardianes imperiales y Rocket por su cuenta.'
      apartados:
      - apartado: Qué vigilar
        texto: El siguiente paso de Star-Lord como líder de la Unión. Es el cabo suelto más grande que deja <em>Imperial</em>.
apendice:
  titulo: Cómo recorrerlo
  notas:
  - titulo: Siete volúmenes y una numeración histórica
    html: '<p>Ojo al comprar: la serie principal ha tenido siete cabeceras distintas desde 2008 y una de ellas recuperó la numeración histórica (<em>All-New Guardians</em> #12 salta a <em>Guardians of the Galaxy</em> #146). Cada ficha indica el volumen para que no se confundan.</p>'
  - titulo: Dónde están los cruces de verdad
    html: <p>Los cruces que van entrelazados —<em>War of Kings</em>, <em>Trial of Jean Grey</em>, <em>Black Vortex</em>, <em>The Last Annihilation</em>— hay que leerlos en su orden exacto. Los de los Vengadores (<em>Secret Invasion</em>, <em>Original Sin</em>, <em>Civil War II</em>) son tie-ins que se entienden sin leer el evento.</p>
  - titulo: Conexiones con el resto de la colección
    html: <p><em>War of Kings</em> continúa la etapa espacial de los X-Men del volumen I del Expediente Mutante; <em>Trial of Jean Grey</em> y <em>Black Vortex</em> también están allí. <em>The Last Annihilation</em> cruza con la era de Krakoa del volumen II. Si llevas los tres expedientes a la vez, lee cada cruce una sola vez.</p>
  - titulo: Los años sin serie
    html: '<p>Hay tres huecos largos: 2011–2012 (tras <em>Thanos Imperative</em>), finales de 2021–mediados de 2023 y principios de 2024–mediados de 2025. En el primero los Guardianes sobreviven en otras series; en los otros dos, sencillamente no aparecen como grupo.</p>'
  - titulo: Si vienes con prisa
    html: '<p>La ruta corta del principio son unos 170 números. Si quieres menos todavía: <em>Starlord</em> #1–4, la serie de Abnett y Lanning entera con <em>Thanos Imperative</em>, y el volumen 3 de Bendis. Con eso tienes el núcleo del equipo moderno.</p>'
  - titulo: Hasta dónde llega esta guía
    html: <p>Cerrada a <strong>8 de octubre de 2026</strong>. Los órdenes de <em>War of Kings</em>, <em>Thanos Imperative</em>, <em>Trial of Jean Grey</em>, <em>Black Vortex</em> y <em>The Last Annihilation</em> están contrastados con guías de lectura. El orden interno de los one-shots de <em>Imperial War</em> no lo he podido verificar, y por eso no lo doy.</p>
