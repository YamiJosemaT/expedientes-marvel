# Expediente Guardianes
# Datos del expediente. Los textos admiten HTML en linea (<em>, <strong>, <span class="nums">...).
# Las claves "id" de cada entrada NO se deben cambiar: son las que guardan las marcas de lectura.

clave: gg
titulo_pagina: Expediente Guardianes
descripcion_pagina: 'Guía de lectura de los Guardianes de la Galaxia desde Annihilation: Conquest (2007) hasta 2026, con todos sus cruces con X-Men, Vengadores y el resto del cosmos Marvel.'
cabecera:
  antetitulo: Guía de lectura · Marvel Comics · El cosmos Marvel
  titulo: Expediente<br/>Guardianes<span class="thin">2007 — 2026</span>
  entradilla: 'De la misión suicida de <em>Annihilation: Conquest – Starlord</em> al equipo imperial de 2026. Diecinueve años de Guardianes de la Galaxia en orden de lectura, con cada cruce con los X-Men, los Vengadores y el resto del cosmos colocado en su sitio y con su orden capítulo a capítulo.'
  cifras:
  - valor: '19'
    texto: Años de continuidad
  - valor: '9'
    texto: Bloques de lectura
  - valor: '15'
    texto: Cruces con otras líneas
  - valor: ~350
    texto: Números en total
leyenda: |-
  <p>Mismo sistema que los otros expedientes: <strong>bloques</strong> por etapas, <strong>tramos</strong> que se leen en orden y <strong>eventos</strong> con su orden capítulo a capítulo. Cuando un crossover se lleva números de una serie de los Guardianes, la serie aparece <strong>partida</strong> en el punto exacto, y dentro del evento esos capítulos van <span class="cap">en color</span>.</p>
  <div class="legend-row">
  <span class="key"><span class="swatch"></span> Serie de los Guardianes o de sus miembros</span>
  <span class="key"><span class="swatch dashed"></span> Número de otra línea donde aparecen</span>
  </div>
  <div class="legend-row">
  <span class="key"><span class="fwd" style="color:var(--red)">▸</span> Continúa después del evento</span>
  <span class="key"><span class="back">◂</span> Viene de un tramo anterior</span>
  </div>
  <div class="legend-row">
  <span class="tag t1">Esencial</span>
  <span class="tag t2">Recomendado</span>
  <span class="tag">Opcional</span>
  <span class="tag t4">Realidad alterna</span>
  </div>
cajas:
