            texto: Recomendado
- id: b6
  fechas: Julio 2017 — 2018
  titulo: Las Gemas del Infinito
  intro: 'Gerry Duggan pone al equipo detrás de las Gemas del Infinito durante año y medio, y la búsqueda desemboca en los dos eventos cósmicos de 2018, que también escribe él. Es un único arco largo: se lee seguido.'
  navegacion:
    anio: 2017–2018
    texto: Las Gemas del Infinito
  contenido:
  - tramo:
      numero: '6.1'
      titulo: La búsqueda
      cuando: Julio 2017 – principios de 2018
      entradas:
      - serie:
          id: gg-b6-all-new-guardians-of-the-galaxy-1-12-guardians-of-the-galaxy-146-150
          prioridad: p1
          titulo: All-New Guardians of the Galaxy <span class="nums">#1–12</span> → Guardians of the Galaxy <span class="nums">#146–150</span>
          creditos: Gerry Duggan · Aaron Kuder, Marcus To · 2017–2018
          descripcion:
          - 'Tras el #12 la cabecera <strong>recupera la numeración histórica y salta al #146</strong> sin que falte nada. Los #146–150 llevan directamente a <em>Infinity Countdown</em>.'
          etiqueta:
            clase: t1
            texto: Esencial
  - evento:
      id: gg-b6-infinity-countdown-infinity-wars
      ancla: ev-infinity
      etiqueta: Eventos cósmicos · Cruce con toda la línea · 2018
      titulo: Infinity Countdown / Infinity Wars
      creditos: Gerry Duggan · Aaron Kuder, Mike Deodato Jr.
      descripcion:
      - 'Dos eventos seguidos que funcionan como el final de la serie de Duggan: las Gemas reaparecen, todo el mundo las quiere, y Gamora llega más lejos que nadie. Los Guardianes son el centro de los dos.'
      apartados:
      - apartado: Orden
        texto: 'Infinity Countdown: Prime #1 → <strong>Infinity Countdown #1–5</strong> → Infinity Wars: Prime #1 → <strong>Infinity Wars #1–6</strong> → Infinity Wars: Infinity #1 (epílogo)'
      - apartado: Prescindible
        texto: Los one-shots de <em>Infinity Countdown</em> dedicados a otros personajes y toda la línea <em>Infinity Warps</em>, que fusiona héroes de dos en dos en una realidad paralela.
- id: b7
  fechas: 2019 — 2021
  titulo: Cates y Ewing
  intro: Dos etapas seguidas de dos guionistas muy distintos. Donny Cates arranca con la muerte de Thanos y reúne un equipo enorme; Al Ewing convierte a los Guardianes en una pieza política del cosmos tras <em>Empyre</em> y termina con el cruce más reciente con la línea X-Men.
  navegacion:
    anio: 2019–2021
    texto: Cates y Ewing
  contenido:
  - tramo:
      numero: '7.1'
      titulo: Tras la muerte de Thanos
      cuando: Marzo 2019 – febrero 2020
      entradas:
      - serie:
          id: gg-b7-guardians-of-the-galaxy-vol-5-1-12-annual-1
          prioridad: p1
          titulo: Guardians of the Galaxy vol. 5 <span class="nums">#1–12</span> + Annual <span class="nums">#1</span>
          creditos: Donny Cates · Geoff Shaw · 2019–2020
          continuidad:
          - viene: ◂ Viene de <em>Infinity Wars</em>
          etiqueta:
            clase: t1
            texto: Esencial
  - tramo:
      numero: '7.2'
      titulo: La galaxia reordenada
      cuando: Marzo 2020 – mediados de 2021
      entradas:
      - serie:
          id: gg-b7-guardians-of-the-galaxy-vol-6-1-15
          prioridad: p1
          titulo: Guardians of the Galaxy vol. 6 <span class="nums">#1–15</span>
          creditos: Al Ewing · Juann Cabal · 2020–2021
          continuidad:
          - sigue: '▸ Los números #16–18 son capítulos de <em>The Last Annihilation</em>'
          descripcion:
          - 'El #6 prepara <em>Empyre</em> y los #7–8 se ambientan en sus consecuencias, pero ninguno es tie-in: la serie se entiende sin el evento.'
          etiqueta:
            clase: t1
            texto: Esencial
      - serie:
          id: gg-b7-empyre-0-6
          ancla: ev-empyre
          aparicion: true
          donde: Cruce con los Vengadores y los 4 Fantásticos · Empyre
          titulo: Empyre <span class="nums">#0–6</span>
          creditos: Al Ewing &amp; Dan Slott · Valerio Schiti · 2020
          descripcion:
          - 'La alianza Kree-Skrull de Hulkling llega a la Tierra para enfrentarse a los Cotati. Reordena el mapa político de la galaxia en el que se mueve el resto de la etapa de Ewing. Contexto útil, no imprescindible: léelo entre el #6 y el #7 de los Guardianes.'
          etiqueta:
            clase: opcional
            texto: Opcional
  - evento:
      id: gg-b7-the-last-annihilation
      ancla: ev-last
      etiqueta: Cruce con los X-Men y Wakanda · 7 capítulos · 2021
      titulo: The Last Annihilation
      creditos: Al Ewing · varios
      descripcion:
      - Dormammu se ha fundido con Ego, el planeta viviente, y quiere conquistar el espacio. Los Guardianes lo paran junto a S.W.O.R.D., la agencia espacial de Krakoa. Es el cierre de la etapa de Ewing.
      apartados:
      - apartado: Orden completo
        texto: '<span class="cap">GotG #16</span> → S.W.O.R.D. #7 → <span class="cap">GotG #17</span> → Cable: Reloaded #1 → The Last Annihilation: Wiccan &amp; Hulkling #1 → The Last Annihilation: Wakanda #1 → <span class="cap">GotG #18</span>'
      - apartado: Conexión
        texto: '<em>S.W.O.R.D.</em> #7 y <em>Cable: Reloaded</em> #1 son de la línea mutante de la era de Krakoa (bloque 2 del volumen II del Expediente Mutante). <em>Guardians of the Galaxy</em> vol. 6 cierra en el #18.'
- id: b8
  fechas: Junio 2023 — enero 2024
