          - sigue: ▸ Karolina vuelve en el volumen 6 (bloque 9)
          descripcion:
          - Arco «Runaways». Karolina, en el espacio con la Brigada de la Luz, descubre que la manda <strong>Xavin</strong>, ahora general majesdaniano, que consiguió que la absolvieran. Una misión en una base lunar le cuesta usar sus poderes, y un acto generoso le devuelve la luz. El Bastón del Uno se queda con Xavin.
