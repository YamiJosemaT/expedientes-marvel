  - tramo:
      numero: '8.3'
      titulo: Infinity Comics
      cuando: Mayo 2023 – marzo 2024
      nota: Las Infinity Comics se publican en Marvel Unlimited, en formato vertical para leer en el móvil, y no se han reeditado en papel.
      entradas:
      - serie:
          id: rw-b8-doctor-strange-2023-3
          aparicion: true
          donde: En otra serie · Doctor Strange
          titulo: Doctor Strange (2023) <span class="nums">#3</span>
          creditos: Amy Chu · Tokitokoro (historia corta) · 2023
          descripcion:
          - 'Historia de complemento, «Close Encounters of a Strange Kind»: Doctor Strange y Nico, juntos en una aventura corta.'
          etiqueta:
