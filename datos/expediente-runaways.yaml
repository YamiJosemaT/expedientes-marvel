- id: b9
  fechas: 2025 — hoy
  titulo: Bajo el imperio de Doom
  intro: Doom es emperador de la Tierra y reclama a todos sus Doombots, también el de los Runaways. Rowell vuelve para una miniserie que reúne otra vez a casi todos, con Chase de vuelta del futuro y Karolina del espacio, y Nico recupera la magia. Después, una aventura de Halloween con Wiccan y Hulkling y un <em>What If…?</em>.
  navegacion:
    anio: 2025–2026
    texto: Bajo el imperio de Doom
  contenido:
  - tramo:
      numero: '9.1'
      titulo: Think of the Children
      cuando: Junio – octubre 2025
      nota: 'La miniserie salió mientras se publicaba la segunda mitad de <em>One World Under Doom</em>, y Marvel Fandom no da una cronología más precisa. Se entiende sola: basta con saber que Doom gobierna el mundo.'
      entradas:
      - evento:
          id: rw-b9-one-world-under-doom
          ancla: ev-owud
          linea_marvel: true
          etiqueta: Evento de toda la línea Marvel · Febrero – noviembre 2025
          titulo: One World Under Doom
          creditos: Ryan North · R.B. Silva
          descripcion:
          - Doom se presenta en la ONU como emperador de la Tierra, ahora «Latveria Unida», y empieza a recoger lo que considera suyo. Para los Runaways eso significa que sus Doombots vienen a por el que vive con ellos.
          apartados:
          - apartado: Orden de lectura
            texto: '<strong>One World Under Doom #1</strong> → <strong>#2</strong> → <strong>#3</strong> → <strong>#4</strong> → <strong>#5</strong> → <strong>#6</strong> → <strong>#7</strong> → <strong>#8</strong> → <strong>#9</strong>'
          - apartado: Versión mínima
            texto: Solo la miniserie de la ficha siguiente.
          - apartado: Conexión
            texto: El evento está entero en el Expediente 4 Fantásticos (bloque 11), con la muerte y vuelta de Valeria, y en el Mutante II (bloque 5), con sus capítulos mutantes. Léelo una sola vez.
      - serie:
          id: rw-b9-runaways-vol-6-1-5
          prioridad: p1
          titulo: Runaways vol. 6 <span class="nums">#1–5</span>
          creditos: Rainbow Rowell · Elena Casagrande · 2025
          continuidad:
          - viene: ◂ Viene del volumen 5 (bloque 7) y de las Infinity Comics (bloque 8)
          descripcion:
          - 'Meses después del #100, Nico mantiene sola a Gert, Molly, Victor, Gib y Doombot, y casi no puede hacer magia. Cuando los Doombots del emperador vienen a reclamar al suyo, el grupo vuelve a huir. Chase regresa del futuro desconfiando de Gert (#2), Karolina vuelve del espacio y se reúne con ellos (#4), y Gert descubre que Nico puede hacer hechizos si ella la toca. Para el final, el grupo tiene que entenderse con Alex, que lleva el traje de Doc Justice, y Karolina, decidir qué hace con el Bastón del Uno.'
          etiqueta:
            clase: t1
            texto: Esencial
  - tramo:
      numero: '9.2'
      titulo: Strange Tales
      cuando: Octubre 2025 – enero 2026
      entradas:
      - serie:
          id: rw-b9-strange-tales-2025-1-4
          aparicion: true
          donde: En otra serie · Strange Tales
          titulo: Strange Tales (2025) <span class="nums">#1–4</span>
          creditos: Jeremy Whitley · Bayleigh Underwood · 2025–2026
          descripcion:
          - 'Halloween: Nico, Karolina, Billy y Teddy juegan a rol y los monstruos de la partida se vuelven reales. Sus amigos desaparecen y Nico recorre Nueva York con la Bruja Escarlata, Doctor Strange y Ghost-Spider, y de Wakanda al enfrentamiento con Hela, hasta rescatarlos en el #4.'
          - 'La misma ficha está en el bloque 9 del Expediente Jóvenes Vengadores.'
          etiqueta:
            clase: opcional
            texto: Opcional
  - tramo:
      numero: '9.3'
      titulo: What If…?
      cuando: Agosto 2026
      entradas:
      - serie:
          id: rw-b9-what-if-runaways-1
          prioridad: p4
          titulo: What If…? Runaways <span class="nums">#1</span>
          creditos: Rainbow Rowell · Zulema Lavina · 19 de agosto de 2026
          descripcion:
          - ¿Y si no se hubieran escapado? Los seis chicos descubren lo que es el Orgullo y, en vez de huir, les intriga. Una realidad alternativa escrita por la autora de la etapa más larga del grupo.
          etiqueta:
            clase: t4
            texto: Al margen de la continuidad
  - evento:
      etiqueta: Frontera de la guía · 2 de noviembre de 2026
      titulo: Dónde están ahora
      descripcion:
      - Tras el volumen 6 y el <em>What If…?</em> de agosto de 2026, <strong>no hay ninguna serie de los Runaways en publicación ni anunciada</strong> que haya podido encontrar.
      apartados:
      - apartado: Qué vigilar
        texto: Qué hace el grupo reunido después de Doom, qué queda de Alex como Doc Justice y qué pasa con el Bastón del Uno.
apendice:
  titulo: Cómo recorrerlo
  notas:
  - titulo: Un grupo, muchas vidas
    html: '<p>Esta guía sigue a cada miembro, no solo al grupo: por eso están enteras las series de los equipos por los que han pasado (<em>Avengers Arena</em>, <em>Avengers Undercover</em>, <em>Avengers A.I.</em>, <em>A-Force</em> y <em>Midnight Suns</em>), aunque en algún número no salga el Runaway. El recuadro «Quién es quién», al principio, dice en qué bloques está cada uno.</p>'
  - titulo: Conexiones con el resto de la colección
    html: <p>Los tie-ins de <em>Civil War</em> y <em>Secret Invasion</em> son los mismos del Expediente Jóvenes Vengadores. La serie de Daken está también en el Mutante I (bloque 5), y X-23, de ese mismo expediente, es una de las chicas de <em>Avengers Arena</em>. <em>One World Under Doom</em> está entero en el Expediente 4 Fantásticos y en el Mutante II. Si llevas varios expedientes a la vez, lee cada evento una sola vez.</p>
  - titulo: Las Infinity Comics
    html: <p>Los dos arcos de <em>Marvel’s Voices Infinity Comic</em> del bloque 8 se publicaron solo en Marvel Unlimited, en formato vertical. El de Karolina y Xavin, que explica dónde está el Bastón del Uno al empezar el volumen 6, es el único que importa para la serie.</p>
  - titulo: Cameos, 2007–2014
    html: '<p><em>Eternals</em> vol. 4 #1 (2008): Nico y Alex, en un recuerdo. <em>New Avengers</em> #53 (2009): Nico entre los candidatos a Hechicero Supremo que ve el Ojo de Agamotto. <em>Strange</em> vol. 2 #4 (2010): Nico. <em>Iron Man: Legacy</em> #7–11 (2010–2011): Alex, de secundario. <em>New Avengers</em> vol. 2 #7 (2010): Molly. <em>Avengers Academy</em> #39 (2012): Karolina y Julie Power. <em>Infinity: The Hunt</em> #1 (2013) y <em>X-Men: Legacy</em> vol. 2 #23 (2014): Molly.</p>'
  - titulo: Cameos, 2015–2019
    html: '<p><em>Ant-Man</em> #1 (2015): Victor se presenta a jefe de seguridad de Stark. <em>Uncanny Avengers: Ultron Forever</em> #1 (2015) y <em>Vision</em> #12 (2016): Victor, en recuerdos. <em>Spider-Woman</em> vol. 6 #1 (2015) y <em>Civil War II</em> #1 (2016): Nico, con la A-Force. <em>Secret Warriors</em> vol. 2 #8 (2017) y <em>Doctor Strange: Damnation</em> #4 (2018): Nico, en un resumen y en una foto. <em>Jessica Jones – Marvel Digital Original</em> #1 (2018): Nico y Karolina. <em>Uncanny X-Men</em> vol. 5 #8 (2019): una Molly creada por un telépata. <em>Avengers: No Road Home</em> #10 (2019): copias del grupo. <em>Fantastic Four</em> vol. 6 #12 (2019): Nico y Karolina en una foto. <em>History of the Marvel Universe</em> vol. 2 #5 (2019): resumen de su historia.</p>'
  - titulo: Cameos, 2020–2026
    html: '<p><em>Dr. Strange</em> #2 (2020), <em>Strange Academy</em> #1, #2 y #18 (2020–2022) y <em>Strange Academy: Finals</em> #3, #5 y #6 (2022–2023): Nico, como profesora. <em>Marvel’s Voices</em> #1 (2020): Nico y Karolina. <em>Captain Marvel</em> vol. 11 #28 (2021): Nico. <em>Death of Doctor Strange</em> #5 (2022): Nico. <em>Rise of the Powers of X</em> #5 (2024): Molly, en forma astral. Y Old Lace en historias de humor: <em>Marvel Meow</em>, <em>It’s Jeff</em> y <em>Ziggy Pig and Silly Seal</em> (Infinity Comics, 2022) y <em>Women of Marvel</em> #1 (2024).</p>'
  - titulo: Hasta dónde llega esta guía
    html: '<p>Cerrada a <strong>2 de noviembre de 2026</strong>. Las apariciones están contrastadas con las listas de cada miembro en Marvel Fandom (incluidas las apariciones menores), y las fechas, con sus fichas. El sitio de los crossovers sigue la cronología de Marvel Fandom: <em>Civil War: Young Avengers &amp; Runaways</em> va entre los números 21 y 22 del volumen 2, <em>S.W.O.R.D.</em> y <em>Breaking Into Comics</em> después del volumen 3, y Daken antes de <em>Avengers Academy</em>.</p>'
